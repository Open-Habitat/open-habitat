# Open Habitat: list its services as needing a restart after a library
# update, but never restart them automatically. Installed and replaced by
# `open-habitat host apply` and `host upgrade`; local edits do not survive.
#
# open-habitat-daemon@<user>.service holds each person's running agents, so
# restarting it ends their turns. The daemon stops a Pi that has been idle
# for ten minutes and starts the next one from the updated libraries, so an
# update reaches agents without cutting a turn. The other open-habitat-*
# services run the statically linked product binary or are oneshot checks:
# a library update gives them nothing to restart, and they are restarted only
# by `host upgrade`, which holds the maintenance lock that the broker and the
# gateway expect.
$nrconf{override_rc}{qr(^open-habitat-.+\.service$)} = 0;
