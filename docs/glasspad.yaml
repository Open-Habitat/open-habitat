title: Open Habitat — dokumentaatio
template: prose

groups:
  - label: Tuote
    members:
      - slug: index
        title: Aloita tästä
        desc: Projektin dokumentaatio ja lukupolut.
      - slug: product
        title: Tavoite ja käyttökulut
        desc: Tuotteen tavoite, toiminnot ja käyttäjän käyttökulut.

  - label: Operations
    members:
      - slug: operations
        title: Install and operate
        desc: Prerequisites, site policy, first use, upgrades and recovery.

  - label: Decisions
    members:
      - slug: decisions/index
        title: Decision records
        desc: Decisions still waiting for their code or for Jari's review.
      - slug: decisions/adr-0007-bound-user-deprovision
        title: ADR 0007 — Bound user deprovision
        desc: A later need; implementation open.
      - slug: decisions/adr-0024-clone-jobs
        title: ADR 0024 — Clone jobs
        desc: A clone is a job of the user's daemon that outlives the request; an interrupted clone is found again from the filesystem.
      - slug: decisions/adr-0025-worktree-as-a-place
        title: ADR 0025 — Worktree as a place
        desc: A worktree is a plain Git place for browser conversations; agents settle it and the daemon cleans worktrees up with the Trash's safety rules.
      - slug: decisions/adr-0026-integrations-catalog
        title: ADR 0026 — Integrations catalog
        desc: Accepted — integrations are native tools run by the person's daemon, connected per account, with one personal-data skill and continuous sync under ~/cloud as the person.
      - slug: decisions/adr-0027-agent-cli-route
        title: ADR 0027 — Agent CLI route
        desc: Proposed — a separate own-UID listener for personal operations, native quota reads and explicit conversation context, without gateway or broker authority.
      - slug: decisions/adr-0029-installation-baseline
        title: ADR 0029 — Installation baseline
        desc: Accepted baseline and pinned release profiles; product host CLI primary is for Jari's review.
      - slug: decisions/adr-0030-site-onboarding-authority
        title: ADR 0030 — Site onboarding authority
        desc: Accepted — onboarding configuration in the gateway, two broker-owned admission sources, the site AI key seeded once at account creation, defaults imported once after a gateway access check, and a sign-in receipt for the admin.
      - slug: decisions/adr-0031-native-gitea-connections
        title: ADR 0031 — Native Gitea connections
        desc: Proposed — tea-owned per-user PAT connections with a bounded native-format and Git adapter; approval and implementation pending.
      - slug: decisions/adr-0032-agent-html-views
        title: ADR 0032 — Agent HTML views
        desc: Accepted — agents offer HTML views the person opens in a side panel or own tab, on an isolated per-view origin from frozen exports; owner only first.
      - slug: decisions/adr-0033-view-capability-links
        title: ADR 0033 — View capability links
        desc: Proposed — anyone with the link opens a shared view; the person creates links in the browser, the gateway serves the owner's frozen export on one operator-enabled public host inside a script-free frame page; the agent gets no link operation.
      - slug: decisions/adr-0035-view-stable-address
        title: ADR 0035 — Stable view addresses
        desc: Proposed — one stable entry address per frozen view; publication revives old copies; implementation awaits Jari's approval.
