<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keskustelun otsake, kierros 2 — prototyyppi</title>
<style>
/*TOKENS*/
/*PICKER_CSS*/

/* ---- Prototype chrome (not a contestant) ---- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0c0d0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.pc-bar {
  position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 50;
  display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: #16181b; color: #c9cdd2; font-size: 12px; border-bottom: 1px solid #262a2f;
  overflow-x: auto; white-space: nowrap;
}
.pc-group { display: inline-flex; align-items: center; gap: 2px; }
.pc-group > span { margin-right: 4px; color: #8a9097; }
.pc-group button {
  height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent;
  color: #aeb4ba; font: inherit; cursor: pointer;
}
.pc-group button:hover { background: rgba(255,255,255,.06); }
.pc-group button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: #fff; }
.pc-read { margin-left: auto; color: #8a9097; font-variant-numeric: tabular-nums; }
.pc-read b { color: #e6e9ec; font-weight: 500; }
#viewport { position: fixed; inset: 44px 0 64px 0; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
body.bare .pc-bar { display: none; }
body.bare #viewport { inset: 0; padding: 0; }
body.bare .proto-picker { display: none; }
#sizer { position: relative; flex: none; }
#frame {
  position: absolute; top: 0; left: 0; transform-origin: top left; overflow: hidden;
  background: var(--ah-bg); color: var(--ah-ink); font-family: var(--ah-font);
  font-size: var(--ah-size-body); line-height: var(--ah-lh-ui);
  box-shadow: 0 0 0 1px #2a2e33;
}
body.bare #frame { box-shadow: none; }

/* ---- App shell (production context, simplified) ---- */
.app { display: flex; height: 100%; }
.rail {
  flex: none; width: var(--ah-rail-width); background: var(--ah-rail); border-right: 1px solid var(--ah-line);
  display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; font-size: var(--ah-size-ui); overflow: hidden;
}
.rail.collapsed { width: var(--ah-rail-compact-width); align-items: center; padding-inline: 0; }
.rail-head { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px; font-weight: 600; margin-bottom: 8px; }
.rail-ws { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; margin-top: 8px; color: var(--ah-muted); font-family: var(--ah-mono); font-size: var(--ah-size-meta); }
.rail-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 22px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-item span { overflow: hidden; text-overflow: ellipsis; }
.rail-item.cur { background: var(--ah-current); box-shadow: inset 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); }
.rail-item .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ah-accent); flex: none; animation: ah-pulse var(--ah-pulse); }
.rail-icon { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ah-muted); border-radius: var(--ah-r-nav); }
.rail-icon.cur { background: var(--ah-current); color: var(--ah-ink); }
.main { flex: 1; min-width: 0; display: flex; }
.editor { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ah-surface); }
.editor-head { height: 41px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--ah-line); font-family: var(--ah-mono); font-size: var(--ah-size-meta); color: var(--ah-ink-2); }
.editor pre { margin: 0; padding: 12px 16px; font-family: var(--ah-mono); font-size: var(--ah-size-code); line-height: 1.7; color: var(--ah-ink-2); white-space: pre; overflow: hidden; }
.editor pre .k { color: var(--ah-syntax-keyword); } .editor pre .s { color: var(--ah-syntax-string); } .editor pre .c { color: var(--ah-syntax-comment); }
.conv { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ah-bg); }
.editor + .conv { flex: none; border-left: 1px solid var(--ah-line); }
.stream { flex: 1; min-height: 0; overflow: hidden; padding: var(--ah-column-pad-block) var(--ah-column-pad-inline); }
.col { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto; display: grid; gap: 14px; }
.msg-user { justify-self: end; max-width: 80%; background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-xl); padding: 8px 12px; }
.msg-agent p { margin: 0 0 8px; line-height: var(--ah-lh-body); }
.msg-agent .work { font-size: var(--ah-size-meta); color: var(--ah-muted); margin-bottom: 6px; }
.composer { flex: none; padding: var(--ah-composer-pad-block) var(--ah-column-pad-inline); }
.field {
  max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto;
  min-height: var(--ah-composer-rest-height); display: flex; align-items: center; gap: 8px;
  padding: 0 6px 0 14px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl);
  background: var(--ah-surface); color: var(--ah-faint); font-size: var(--ah-size-ui);
}
.field .ph { flex: 1; }
.send { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--ah-accent); color: var(--ah-on-accent); }
.send svg { width: 16px; height: 16px; }
.phone .stream { padding: var(--ah-column-pad-block) var(--ah-column-pad-inline); }
.conv { position: relative; }

/* Phone token overrides (the frame is not the window, so no media query). */
.phone {
  --ah-topbar-pad-block: 6px; --ah-topbar-pad-inline: 14px; --ah-column-pad-block: 12px;
  --ah-column-pad-inline: 14px; --ah-control-row: 40px; --ah-control-inline: 32px;
}

/* ---- Header (round 1, direction 1 Lyhenee, with the shared quiet look) ---- */
svg.i { width: var(--ah-control-inline-icon); height: var(--ah-control-inline-icon); flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hdr {
  position: relative; z-index: 5; flex: none; padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline);
  border-bottom: 1px solid var(--ah-line); background: var(--ah-surface);
}
.top { display: flex; align-items: center; gap: var(--ah-s3); min-width: 0; }
.h-title { flex: 1 1 0; min-width: 0; margin: 0; font-size: var(--ah-size-title); font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-ws { flex: none; font-family: var(--ah-mono); font-size: var(--ah-size-meta); color: var(--ah-muted); text-decoration: none; white-space: nowrap; }
.h-chip {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: var(--ah-control-inline);
  padding: 0 var(--ah-control-inline-pad); border: 0; border-radius: var(--ah-r-pill);
  background: transparent; color: var(--ah-ink-2); font: inherit; font-size: var(--ah-size-meta);
  white-space: nowrap; min-width: 0; cursor: pointer; font-variant-numeric: tabular-nums;
}
.h-chip:hover, .h-chip[aria-expanded="true"] { background: var(--ah-hover); }
.h-chip:focus-visible, .h-icon:focus-visible, .h-status:focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: var(--ah-focus-offset); }
.h-git .br { font-family: var(--ah-mono); font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.h-git .n { display: inline-flex; align-items: center; gap: 1px; }
.h-git .n.z { display: none; }
.h-git .ab { display: inline-flex; gap: 6px; }
.h-git .ab:empty { display: none; }
.h-ctx .ring { width: 14px; height: 14px; border-radius: 50%; flex: none; background: conic-gradient(var(--ah-accent) 0 8%, var(--ah-line-strong) 8% 100%); -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px); mask: radial-gradient(circle, transparent 4px, #000 4.5px); }
.h-model .m, .h-model .th { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.h-model .m { font-weight: 500; color: var(--ah-ink); }
/* The thinking meter: four bars, as many lit as the level; the exact level is in the name and the layer. */
.meter { flex: none; display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; margin-left: 1px; }
.meter i { width: 2.5px; border-radius: 1px; background: var(--ah-line-strong); }
.meter i:nth-child(1) { height: 4px; } .meter i:nth-child(2) { height: 6.5px; } .meter i:nth-child(3) { height: 9px; } .meter i:nth-child(4) { height: 11px; }
.meter i.on { background: currentColor; }
.h-model .meter { color: var(--ah-ink-2); }
.h-icon {
  flex: none; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: var(--ah-control-row); height: var(--ah-control-row); padding: 0 6px; border: 0; border-radius: var(--ah-r-md);
  background: transparent; color: var(--ah-muted); font: inherit; font-size: var(--ah-size-meta); cursor: pointer;
}
.h-icon:hover { background: var(--ah-hover); color: var(--ah-ink); }
.h-icon svg.i { width: var(--ah-control-row-icon); height: var(--ah-control-row-icon); }
.h-files .cnt { font-weight: 600; color: var(--ah-accent-ink); }
.h-retitle svg { width: 17px; height: 17px; }
.h-more, .h-burger { display: none; }
.h-sep { flex: none; width: 1px; height: 18px; background: var(--ah-line); }

/* Activity: a dot; hover, keyboard focus or a tap shows the state as text. */
.h-status {
  flex: none; position: relative; display: inline-grid; place-items: center; width: 20px; height: 24px; padding: 0;
  border: 0; border-radius: 50%; background: transparent; cursor: default; color: var(--ah-accent-ink); font: inherit;
}
.h-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-accent); animation: ah-pulse var(--ah-pulse); }
.h-status .lbl { display: none; }
.tip {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  padding: 5px 9px; border-radius: var(--ah-r-md); background: var(--ah-ink); color: var(--ah-bg);
  font-size: var(--ah-size-meta); font-weight: 500; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 120ms ease-out;
}
.h-status:hover .tip, .h-status:focus-visible .tip, .h-status[aria-expanded="true"] .tip { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

/* Round 1 comparison: the label beside the dot, chips with the branch and thinking text. */
.r1 .h-status { width: auto; height: auto; display: inline-flex; gap: 6px; padding: 0 2px; font-size: var(--ah-size-meta); font-weight: 500; border-radius: 0; }
.r1 .h-status .lbl { display: inline; }
.r1 .h-status .tip { display: none; }

/* Phone: production's two rows (title, panels and menu; then state). */
.ph .top { flex-wrap: wrap; gap: var(--ah-s2) var(--ah-control-gap); }
.ph .top::after { content: ""; order: 2; flex-basis: 100%; }
.ph .top > * { order: 3; }
.ph .top > :is(.h-burger, .h-title, .h-files, .h-editor, .h-terminal, .h-more) { order: 1; }
.ph .top > :is(.h-ws, .h-retitle, .h-archive, .h-info, .h-sep) { display: none; }
.ph .h-burger, .ph .h-more { display: inline-flex; }
.ph .h-status { width: 32px; height: 32px; }
.ph .h-title { line-height: var(--ah-control-row); }
.ph .top > .h-model { flex: 0 1 auto; min-width: 0; overflow: hidden; }
.r1.ph .h-model :is(.th, .bulb) { display: none; }
.r1.ph .h-git .br { max-width: 12ch; }

/* Shortening in place, in order, until the title keeps its share (round 2). */
.v .top.l1 .h-ws { display: none; }
.v .top.l2 .h-ctx .pct { display: none; }
.v .top.l3 :is(.h-retitle, .h-archive, .h-info) { display: none; }
.v .top.l3 .h-more { display: inline-flex; }
.v .top.l4 .h-files .cnt { display: none; }
.v .top.l5 { gap: var(--ah-s1); }
.v .top.l5 .h-sep { display: none; }
.v .top.l5 .h-chip { padding-inline: 6px; }
.v .top.l6 .h-git .ab { display: none; }
.v .top.l7 .h-model .meter { display: none; }
.v .top.l8 .h-model { display: none; }

/* Round 1's levels, unchanged. */
.r1 .top.l1 .h-ws { display: none; }
.r1 .top.l2 .h-model :is(.th, .bulb) { display: none; }
.r1 .top.l3 .h-status .lbl { display: none; }
.r1 .top.l4 .h-ctx .pct { display: none; }
.r1 .top.l5 .h-git .br { max-width: 12ch; }
.r1 .top.l6 .h-git .br { display: none; }
.r1 .top.l7 .h-model .m { max-width: 8ch; }
.r1 .top.l8 :is(.h-retitle, .h-archive, .h-info) { display: none; }
.r1 .top.l8 .h-more { display: inline-flex; }
.r1 .top.l9 .h-files .cnt { display: none; }
.r1 .top.l10 { gap: var(--ah-s1); }
.r1 .top.l10 .h-sep { display: none; }
.r1 .top.l11 .h-git .ab { display: none; }
.r1 .top.l12 .h-model { display: none; }

/* ---- Layers: ⋯ menu, model and Git (anchored under the chip; a bottom sheet on the phone) ---- */
.layer {
  position: absolute; z-index: 20; top: 0; left: 0; width: min(380px, calc(100% - 16px));
  max-height: calc(100% - 24px); overflow: auto;
  padding: 12px 14px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface);
  box-shadow: var(--ah-shadow-menu); font-size: 13px; display: none;
}
.layer.open { display: block; animation: ah-appear var(--ah-appear) both; }
.phone .layer { top: auto !important; left: 8px !important; right: 8px; bottom: 8px; width: auto; border-radius: var(--ah-r-xl); }
.phone .scrim { position: absolute; inset: 0; z-index: 19; background: rgba(0,0,0,.35); display: none; }
.phone .scrim.open { display: block; }
.layer h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ah-muted); }
.layer h2 + * { margin-top: 0; }
.l-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.l-head .ttl { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; min-width: 0; font-weight: 500; }
.l-head .ttl svg { margin-top: 2px; width: 15px; height: 15px; color: var(--ah-ink-2); }
.l-head .ttl .path { grid-column: 2; }
.l-close { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-muted); cursor: pointer; }
.l-close:hover { background: var(--ah-hover); color: var(--ah-ink); }
.l-close svg.i { width: 14px; height: 14px; }
.mono { font-family: var(--ah-mono); }
.branch-full { font-family: var(--ah-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.path { font-family: var(--ah-mono); font-size: 11.5px; color: var(--ah-muted); overflow-wrap: anywhere; }
.sec { padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--ah-line-soft); }
.cmp { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.cmp-name { display: flex; flex-direction: column; min-width: 0; }
.cmp-name .mono { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-name .sub { font-size: 11.5px; color: var(--ah-muted); }
.cmp-n { display: flex; gap: 12px; flex: none; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cmp-n .w { margin-left: 3px; color: var(--ah-muted); }
.cmp-n .zero { color: var(--ah-faint); }
.fold { margin: 2px 0; }
.fold > summary { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 6px; border-radius: 6px; cursor: pointer; list-style: none; color: var(--ah-ink-2); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ""; width: 6px; height: 6px; margin: 0 4px 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); }
.fold[open] > summary::before { transform: rotate(45deg); }
.fold > summary:hover { background: var(--ah-hover); }
.fold.empty { display: flex; justify-content: space-between; min-height: 28px; align-items: center; padding: 0 6px 0 20px; color: var(--ah-muted); }
.count { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.commits, .files { list-style: none; margin: 2px 0 4px; padding: 0 0 0 20px; display: grid; gap: 2px; font-size: 12.5px; }
.commits li { display: flex; gap: 8px; min-width: 0; }
.commits code { color: var(--ah-muted); font-family: var(--ah-mono); font-size: 11.5px; }
.commits .s { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commits time { color: var(--ah-muted); }
.sec h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 12px; font-weight: 600; }
.files { padding-left: 0; }
.files li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.files .st { width: 14px; flex: none; font-family: var(--ah-mono); font-weight: 600; color: var(--ah-warning-ink, var(--ah-accent-ink)); }
.files .p { flex: 1; min-width: 0; font-family: var(--ah-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.files .d { color: var(--ah-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.note { margin: 6px 0 0; font-size: var(--ah-size-meta); line-height: 1.45; color: var(--ah-muted); }
.ribbon { display: flex; flex-wrap: wrap; list-style: none; padding: 0; margin: 0 0 4px; gap: var(--ah-s1); }
.ribbon.col { flex-direction: column; }
.ribbon > li { border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); padding: var(--ah-s1) var(--ah-s2); }
.ribbon > li[aria-current="true"] { background: var(--ah-accent-soft); color: var(--ah-accent-ink); font-weight: 600; border-color: currentColor; }
.ribbon > li .meter { margin-left: 6px; vertical-align: -1px; }
.layer.menu { width: min(320px, calc(100% - 16px)); padding: 6px; font-size: var(--ah-size-ui); }
.layer.menu .full-title { margin: 4px 8px 6px; font-weight: 600; }
.layer.menu .mi { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 8px; border-radius: 6px; color: var(--ah-ink-2); }
.layer.menu .mi:hover { background: var(--ah-hover); }
.layer.menu .mi .k { width: 5.5rem; flex: none; color: var(--ah-muted); font-size: var(--ah-size-meta); }
.layer.menu .mi .v { min-width: 0; overflow-wrap: anywhere; }
.layer.menu hr { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 4px 0; }
</style>
</head>
<body>
<div class="pc-bar" role="toolbar" aria-label="Prototyypin asetukset">
  <div class="pc-group" data-k="w"><span>Ikkuna</span>
    <button data-v="oma">Oma</button><button data-v="1024">1024</button><button data-v="1280">1280</button><button data-v="1600">1600</button><button data-v="1920">1920</button><button data-v="390">Puhelin</button>
  </div>
  <div class="pc-group" data-k="sb"><span>Sivupalkki</span><button data-v="1">Auki</button><button data-v="0">Kiinni</button></div>
  <div class="pc-group" data-k="ed"><span>Editori</span><button data-v="0">Kiinni</button><button data-v="1">Auki</button></div>
  <div class="pc-group" data-k="n"><span>Mallin nimi</span><button data-v="versio">Opus 5.5</button><button data-v="perhe">Opus</button></div>
  <div class="pc-group" data-k="th"><span>Ajattelu</span><button data-v="off">off</button><button data-v="low">low</button><button data-v="medium">medium</button><button data-v="high">high</button><button data-v="max">max</button></div>
  <div class="pc-group" data-k="c"><span>Sisältö</span><button data-v="pitka">Pitkä</button><button data-v="lyhyt">Jarin kuva</button><button data-v="puhdas">Puhdas Git</button></div>
  <div class="pc-group" data-k="o"><span>Avaa</span><button data-v="">–</button><button data-v="model">Malli</button><button data-v="git">Git</button><button data-v="status">Tila</button></div>
  <div class="pc-group" data-k="t"><span>Teema</span><button data-v="dark">Tumma</button><button data-v="light">Vaalea</button></div>
  <div class="pc-read" id="readout"></div>
</div>
<div id="viewport"><div id="sizer"><div id="frame"></div></div></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">1 Taso avattaessa</button>
  <button class="proto-picker-item">2 Tasomittari sirussa</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item">Kierros 1 Lyhenee</button>
</nav>

<script>
// ---- State (URL-backed so screenshots are reproducible) ----
const q = new URLSearchParams(location.search);
const S = {
  w: q.get('w') || 'oma',
  sb: q.get('sb') ?? '1',
  ed: q.get('ed') ?? '0',
  n: q.get('n') || 'versio',
  th: q.get('th') || 'medium',
  c: q.get('c') || 'pitka',
  o: q.get('o') ?? '',

// ---- Prototype controls ----
function syncControls() {
  document.querySelectorAll('.pc-group').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
}
function rerender() {
  const url = new URL(location);
  for (const [k, v] of Object.entries(S)) url.searchParams.set(k, v);
  history.replaceState(null, '', url);
  syncControls();
  stage.innerHTML = variants[current]();
}
document.querySelectorAll('.pc-group').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.k] = b.dataset.v; rerender();
}));
let rz;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(rerender); });
syncControls();
</script>
</body>
</html>
