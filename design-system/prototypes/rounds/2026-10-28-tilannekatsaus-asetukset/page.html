<style>

/*PICKER_CSS*/

/* ---- Prototype chrome (not a contestant) ---- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0c0d0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.pc-bar {

  display: flex; align-items: center; gap: 14px; padding: 0 12px;

}

.pc-group > span { margin-right: 4px; color: #8a9097; }

  color: #aeb4ba; font: inherit; cursor: pointer;
}

body.bare .pc-bar { display: none; }

  box-shadow: 0 0 0 1px #2a2e33;
}

/* ---- App shell (production context, simplified) ---- */
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app { display: flex; height: 100%; position: relative; }
.rail {

}

.rail-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); white-space: nowrap; overflow: hidden; cursor: pointer; }

.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ah-accent-soft); color: var(--ah-accent-ink); font-size: 11px; font-weight: 600; flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ah-bg); }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; height: 49px; padding: 0 var(--ah-topbar-pad-inline); border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.topbar h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.burger { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--ah-r-md); color: var(--ah-muted); cursor: pointer; }
.burger svg.i { width: 20px; height: 20px; }
.scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---- Buttons (ControlButton look) ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ah-control-row); padding: 0 var(--ah-control-row-pad);
  border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-control); color: var(--ah-ink);
  font: inherit; font-size: var(--ah-control-row-font); font-weight: 500; white-space: nowrap; cursor: pointer;
}
.btn:hover { background: var(--ah-control-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ah-ink-2); }
.btn.quiet:hover { background: var(--ah-hover); }
.btn.link { border: 0; background: transparent; padding: 0 2px; height: auto; color: var(--ah-accent-ink); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
.btn svg.i { width: 15px; height: 15px; }
button:focus-visible, [tabindex]:focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: var(--ah-focus-offset); }

/* ---- Segmented (production Segmented look) ---- */
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ah-ink-2); font: 500 12.5px var(--ah-font); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: var(--ah-hover); }
.seg button[aria-checked="true"] { background: var(--ah-surface); box-shadow: 0 0 0 1px var(--ah-line-strong); color: var(--ah-ink); font-weight: 600; }
.seg[aria-disabled="true"] { opacity: .45; pointer-events: none; }

/* ---- Settings (Asetukset; Settings.css, simplified) ---- */
.settings { display: flex; gap: var(--ah-s8); height: 100%; padding: var(--ah-s5) 28px 40px; overflow: auto; }
.s-nav { flex: none; width: 190px; display: flex; flex-direction: column; gap: 2px; font-size: var(--ah-size-ui); }
.s-nav .s-h { margin: var(--ah-s4) 10px; font-size: var(--ah-size-h1); font-weight: 600; }
.s-nav-i { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font-weight: 500; cursor: pointer; }
.s-nav-i:hover { background: var(--ah-hover); }
.s-nav-i.cur { background: var(--ah-current); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-current-line); }
.s-nav-i.new::after { content: "uusi"; margin-left: auto; font-size: 10.5px; color: var(--ah-accent-ink); font-weight: 600; }
.s-main { flex: 1; min-width: 0; max-width: 720px; }
.s-main > h2 { font-size: var(--ah-size-h2); margin: var(--ah-s4) 0 var(--ah-s4); }
.s-back { display: none; }
.s-intro { margin: 0 0 14px; color: var(--ah-muted); font-size: var(--ah-size-ui); line-height: 1.5; }
.s-h3 { margin: var(--ah-s6) 0 6px; font-size: var(--ah-size-ui); font-weight: 600; }
.s-h3 + .s-intro { margin-bottom: 10px; }
.s-card { border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); overflow: hidden; }
.s-card > * + * { border-top: 1px solid var(--ah-line-soft); }
.s-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(0, auto); gap: var(--ah-s3) var(--ah-s6); align-items: center; padding: var(--ah-s4) var(--ah-s5); font-size: var(--ah-size-ui); }
.s-row.icon { grid-template-columns: auto minmax(160px, 1fr) minmax(0, auto); }
.s-lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.s-lbl strong { font-weight: 600; }
.s-desc { color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; }
.s-val { display: flex; align-items: center; justify-content: flex-end; gap: var(--ah-s3); flex-wrap: wrap; min-width: 0; }
.s-row[data-landed] { animation: landed 2.4s ease-out both; }
@keyframes landed { 0%, 40% { background: var(--ah-accent-soft); } 100% { background: transparent; } }
.letter { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--ah-sunken); color: var(--ah-source-1); font: 600 11px var(--ah-mono); flex: none; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.model-chip .prov { color: var(--ah-muted); font-weight: 400; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ah-ok); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-ok); }
/* Model radio list (direction 2) */
.radios { list-style: none; margin: 0; padding: 0; }
.radios li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px var(--ah-s5); font-size: var(--ah-size-ui); cursor: pointer; }
.radios li + li { border-top: 1px solid var(--ah-line-soft); }
.radios li:hover { background: var(--ah-hover); }
.radios li[aria-disabled="true"] { cursor: default; color: var(--ah-muted); }
.radios li[aria-disabled="true"]:hover { background: transparent; }
.radios .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ah-line-strong); display: grid; place-items: center; }
.radios li[aria-checked="true"] .dot { border-color: var(--ah-accent); }
.radios li[aria-checked="true"] .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-accent); }
.radios li[aria-disabled="true"] .dot { border-style: dashed; }
.radios .nm { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.radios .nm small { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.radios .tag { font-size: 11.5px; color: var(--ah-muted); white-space: nowrap; }
.s-foot { padding: 10px var(--ah-s5); color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; background: var(--ah-surface-2); }
.preview { padding: 14px var(--ah-s5) 16px; background: var(--ah-bg); }
.preview .lbl { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); margin-bottom: 6px; }
.preview .ah-recap { margin: 0; width: 100%; }

/* Phone settings: the section alone, with a back row (production at <= 760px). */
.ph .settings { display: block; padding: 10px 14px 32px; }
.ph .s-nav { display: none; }
.ph .s-back { display: inline-flex; margin: 0 0 4px -8px; }
.ph .s-main > h2 { margin-top: 4px; }
.ph .s-row, .ph .s-row.icon { grid-template-columns: 1fr; }
.ph .s-row.icon .letter { display: none; }
.ph .s-val { justify-content: flex-start; }
.ph .seg { width: 100%; }
.ph .seg button { flex: 1; padding: 0 6px; }

/* ---- Conversation ---- */
.conv { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.conv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline); min-height: 49px; border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.conv-head h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-head .ws { font-family: var(--ah-mono); font-size: var(--ah-size-meta); color: var(--ah-muted); }
.conv-head .grow { flex: 1; }
.conv-head .idle { font-size: var(--ah-size-meta); color: var(--ah-muted); display: inline-flex; align-items: center; gap: 6px; }
.conv-head .idle i { width: 7px; height: 7px; border-radius: 50%; background: var(--ah-muted); }
.stream { flex: 1; min-height: 0; overflow: hidden; padding: var(--ah-column-pad-block) var(--ah-column-pad-inline); display: flex; flex-direction: column; justify-content: flex-end; }
.col { width: 100%; max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto; display: grid; gap: 14px; }
.msg-user { justify-self: end; max-width: 80%; background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-xl); padding: 8px 12px; line-height: var(--ah-lh-body); }
.msg-agent p { margin: 0 0 8px; line-height: var(--ah-lh-body); }
.msg-agent .work { font-size: var(--ah-size-meta); color: var(--ah-muted); margin-bottom: 6px; }
.msg-agent code { font: var(--ah-size-code) var(--ah-mono); background: var(--ah-sunken); padding: 1px 4px; border-radius: 4px; }
.msg-agent pre { margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-sunken); font: var(--ah-size-code)/1.55 var(--ah-mono); color: var(--ah-ink-2); white-space: pre-wrap; }
.composer { flex: none; padding: var(--ah-composer-pad-block) var(--ah-column-pad-inline); }
.field { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto; min-height: var(--ah-composer-rest-height); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); color: var(--ah-faint); font-size: var(--ah-size-ui); }
.field .ph-t { flex: 1; }
.send { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--ah-accent); color: var(--ah-on-accent); }

/* ---- Recap card (RecapCard.tsx + components.css, verbatim geometry) ---- */
.rc-slot { flex: none; position: relative; width: min(calc(100% - 2 * var(--ah-column-pad-inline)), calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline))); margin: var(--ah-s2) auto 0; }
.ah-recap {
  max-height: min(38vh, 280px); overflow: auto; padding: var(--ah-s2) var(--ah-s3) var(--ah-s3);
  background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); color: var(--ah-ink);
  animation: ah-appear var(--ah-appear) both;
}
.ph .ah-recap { max-height: 20vh; }
.rc-slot.still > *, .preview .ah-recap { animation: none; }
.ah-recap p { margin: var(--ah-s2) 0; line-height: 1.5; }
.ah-recap-heading { display: flex; align-items: center; gap: var(--ah-s2); min-height: 28px; flex-wrap: wrap; }
.ah-recap-heading strong { font-size: var(--ah-size-meta); }
.ah-recap-heading time, .ah-recap-heading .meta { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.ah-recap-grow { flex: 1; }
.ah-recap-next { color: var(--ah-ink-2); }
.ah-recap .ah-recap-next strong { margin-right: var(--ah-s2); color: var(--ah-muted); font-size: var(--ah-size-meta); text-transform: uppercase; letter-spacing: .04em; }
.ah-recap-icon { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-muted); cursor: pointer; }
.ah-recap-icon:hover { background: var(--ah-hover); color: var(--ah-ink); }
.ah-recap-icon[aria-expanded="true"] { background: var(--ah-hover); color: var(--ah-ink); }
.ah-recap-skeleton { display: grid; gap: var(--ah-s2); padding: var(--ah-s2) 0; }
.ah-recap-skeleton span { height: 10px; border-radius: var(--ah-r-pill); background: var(--ah-sunken); animation: ah-recap-loading 1.2s ease-in-out infinite; }
.ah-recap-skeleton span:last-child { width: 55%; }
@keyframes ah-recap-loading { 50% { opacity: .45; } }

/* "Kun pyydän": one quiet row in the card's place, no model call until pressed. */
.rc-offer {
  display: flex; align-items: center; gap: var(--ah-s2); min-height: 38px; padding: 4px 6px 4px var(--ah-s3);
  border: 1px dashed var(--ah-line-strong); border-radius: var(--ah-r-lg); background: transparent; font-size: var(--ah-size-meta); color: var(--ah-ink-2);
  animation: ah-appear var(--ah-appear) both;
}
.rc-offer strong { color: var(--ah-ink); font-weight: 600; }
.rc-offer .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-offer .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
/* A changed setting, said once where it was changed. */
.rc-note {
  display: flex; align-items: center; gap: var(--ah-s2); flex-wrap: wrap; padding: 6px 6px 6px var(--ah-s3); border-radius: var(--ah-r-lg);
  background: var(--ah-surface-2); border: 1px solid var(--ah-line); font-size: var(--ah-size-meta); color: var(--ah-ink-2);
  animation: ah-appear var(--ah-appear) both;
}
.rc-note .grow { flex: 1 1 200px; }

/* Direction 3: the card's own menu. Opens upwards; the card sits on the composer. */
.rc-menu {
  position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 4; width: 290px; padding: 6px;
  border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu);
  font-size: var(--ah-size-ui); transform-origin: bottom right; animation: menu-in .14s ease-out both;
}
@keyframes menu-in { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.rc-menu .h { padding: 6px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); }
.rc-menu button.mi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px; border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-ink); font: inherit; text-align: left; cursor: pointer; }
.rc-menu button.mi:hover { background: var(--ah-hover); }
.rc-menu button.mi .ck { width: 16px; display: grid; place-items: center; color: var(--ah-accent-ink); }
.rc-menu hr { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 6px 0; }
.rc-menu .info { padding: 4px 8px 6px 32px; color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; }
.rc-menu .info b { color: var(--ah-ink-2); font-weight: 600; }
.ph .rc-menu { width: auto; left: 0; }

.phone {
  --ah-topbar-pad-block: 6px; --ah-topbar-pad-inline: 14px; --ah-column-pad-block: 12px;
  --ah-column-pad-inline: 14px; --ah-control-row: 40px;
}
@media (prefers-reduced-motion: reduce) { .ah-recap, .rc-offer, .rc-note, .rc-menu, .s-row[data-landed] { animation: none; } .ah-recap-skeleton span { animation: none; } }
</style>

<body>
<div class="pc-bar" role="toolbar" aria-label="Prototyypin asetukset">
  <div class="pc-group" data-k="n"><span>Näkymä</span><button data-v="keskustelu">Keskustelu</button><button data-v="asetukset">Asetukset</button></div>
  <div class="pc-group" data-k="s"><span>Hiljaisuus</span><button data-v="0">0 min</button><button data-v="1">1 min</button><button data-v="3">3 min</button><button data-v="5">5 min</button></div>
  <div class="pc-group" data-k="w"><span>Ikkuna</span><button data-v="oma">Oma</button><button data-v="1280">1280</button><button data-v="390">Puhelin</button></div>
  <div class="pc-group" data-k="t"><span>Teema</span><button data-v="dark">Tumma</button><button data-v="light">Vaalea</button></div>
  <div class="pc-read" id="readout"></div>
</div>
<div id="viewport"><div id="sizer"><div id="frame"></div></div></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">1 Tekoälyn alla</button>
  <button class="proto-picker-item">2 Oma osio</button>
  <button class="proto-picker-item">3 Kortista</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item">Nykyinen</button>
</nav>

<script>
// ---- State (URL-backed so screenshots are reproducible) ----
const q = new URLSearchParams(location.search);
// n: view, s: simulated silence in minutes, w: window, t: theme.
const S = { n: q.get('n') || 'keskustelu', s: q.get('s') || '3', w: q.get('w') || 'oma', t: q.get('t') || 'dark' };
if (q.get('bare') === '1') document.body.classList.add('bare');
const VARIANTS = ['d1', 'd2', 'd3', 'now'];
let V = null;
// The person's setting. In production it is one per person, read by the daemon and the
// recap extension; here it lives for the visit. m: auto | ask | off, d: minutes, model: id or 'auto'.
const SET = { m: q.get('m') || 'auto', d: +(q.get('d') || 3), model: q.get('model') || 'auto' };
// One visit's runtime: what the card shows and which overlays are open.
const R = { card: null, dismissed: false, menu: q.get('menu') === '1', note: '', land: '', sec: q.get('sec') || '' };
function resetRuntime() { lastSlot = ''; R.card = null; R.dismissed = false; R.menu = false; R.note = ''; R.land = ''; R.sec = ''; }

// ---- Synthetic catalog: what Pi's registry would offer this person ----
// Policy (background-model.mjs): the provider's middle tier, newest first; the conversation's own
// model as the fallback; never a Fable or Opus class model, not even as the fallback.
const MODELS = [
  { id: 'anthropic/claude-sonnet-5-5', name: 'Claude Sonnet 5.5', prov: 'Claude-tilaus', tier: 'mid' },
  { id: 'anthropic/claude-haiku-5-5', name: 'Claude Haiku 5.5', prov: 'Claude-tilaus', tier: 'small' },

let lastSlot = '';
function recapSlot() {
  let inner = '';

  else if (!R.dismissed) {
    const m = mode();
    if (R.card) inner = recapCard();
    else if (due() && m === 'auto') inner = recapCard();
    else if (due() && m === 'ask') inner = offerRow();
  }
  // Only a newly appearing card, row or note animates in; a repaint for a menu or a click must not flicker it.
  const kind = !inner ? '' : R.note ? 'note' : inner.includes('recap-offer') ? 'offer' : 'card';
  const still = kind === lastSlot;
  lastSlot = kind;

  return `<div class="rc-slot${still ? ' still' : ''}">${inner}${V === 'd3' && R.menu && !R.note ? menu() : ''}</div>`;

// ---- Frame geometry ----
const HEIGHTS = { 1280: 800, 390: 844 };
const viewport = document.getElementById('viewport');
const sizer = document.getElementById('sizer');
const stage = document.getElementById('frame');
function frameSize() {
  if (S.w === 'oma') return { W: viewport.clientWidth, H: viewport.clientHeight };
  return { W: +S.w, H: HEIGHTS[S.w] };
}
function layoutFrame() {
  const { W, H } = frameSize();
  const bare = document.body.classList.contains('bare');
  const s = S.w === 'oma' || bare ? 1 : Math.min(1, (viewport.clientWidth - 24) / W, (viewport.clientHeight - 84) / H);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.transform = s < 1 ? `scale(${s})` : '';
  sizer.style.width = Math.round(W * s) + 'px'; sizer.style.height = Math.round(H * s) + 'px';
  stage.dataset.theme = S.t;
}
function readout() {
  const set = V === 'now' ? 'ei asetusta' : `${MODE_LABEL[SET.m]}${SET.m === 'off' ? '' : `, ${SET.d} min`}${V === 'd2' ? `, malli ${SET.model === 'auto' ? 'automaattinen' : modelOf(SET.model).name}` : ''}`;
  const card = R.card === 'pending' ? 'katsausta luodaan' : due() || R.card ? (mode() === 'auto' || R.card ? 'kortti' : mode() === 'ask' ? 'tarjous' : 'ei mitään') : 'ei vielä';
  document.getElementById('readout').innerHTML = `Asetus: <b>${esc(set)}</b> · Hiljaa ${quiet()} min → <b>${card}</b> · Host nyt: <b>kiinteä 3 min, ei asetusta</b>`;
}

// ---- Picker wiring (picker.js expects `stage` and `variants`) ----
const variants = VARIANTS.map(v => () => {
  if (V !== null && V !== v) resetRuntime();
  V = v; stage.dataset.variant = v; layoutFrame(); readout();
  return appHTML();
});
function paint() { stage.innerHTML = appHTML(); readout(); }

// A request shows the card's skeleton for a moment, as the daemon's model call does.
let pendingTimer;
function generate() {
  R.card = 'pending'; R.menu = false; R.dismissed = false; paint();
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { R.card = 'done'; paint(); }, 700);
}
function noteChanged(prev) {
  const what = SET.m === 'off' ? 'Tilannekatsaukset pois kaikista keskusteluistasi.' : SET.m === 'ask' ? 'Tilannekatsaus vain kun pyydät, kaikissa keskusteluissasi.' : `Automaattinen katsaus ${SET.d} min hiljaisuuden jälkeen.`;
  R.prev = prev;
  R.note = `<div class="rc-note" role="status" data-testid="recap-note"><span class="grow">${esc(what)}</span><button class="btn quiet" data-act="undo">Kumoa</button><button class="btn quiet" data-act="goto" data-sec="tekoaly" data-row="tilannekatsaus">Asetukset</button><button class="ah-recap-icon" data-act="note-close" aria-label="Sulje">${ic('cross')}</button></div>`;
}
function goto(sec, row) {
  S.n = 'asetukset'; R.sec = sec; R.land = row; R.menu = false; rerender();
  const el = stage.querySelector(`[data-settings-row="${row}"]`);
  if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); }
  setTimeout(() => { R.land = ''; }, 2400);
}

stage.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (R.menu && !e.target.closest('.rc-menu')) { R.menu = false; paint(); } return; }
  const act = t.dataset.act;
  if (act === 'nav') { S.n = t.dataset.to; R.sec = ''; R.menu = false; rerender(); }
  else if (act === 'sec') { R.sec = t.dataset.sec; R.land = ''; paint(); }
  else if (act === 'set') {
    if (t.dataset.k === 'mode') SET.m = t.dataset.v;
    else if (t.dataset.k === 'delay') SET.d = +t.dataset.v;
    else return;
    paint(); syncUrl();
  }
  else if (act === 'model') { SET.model = t.dataset.v; paint(); syncUrl(); }
  else if (act === 'refresh' || act === 'request') generate();
  else if (act === 'dismiss') { R.dismissed = true; R.card = null; R.menu = false; paint(); }
  else if (act === 'menu') { R.menu = !R.menu; paint(); if (R.menu) stage.querySelector('.rc-menu [role^="menuitem"]')?.focus(); }
  else if (act === 'menu-set') {
    const prev = { ...SET };
    if (t.dataset.k === 'd') { SET.m = 'auto'; SET.d = +t.dataset.v; R.menu = false; paint(); syncUrl(); return; }
    SET.m = t.dataset.v; R.card = null; R.menu = false; noteChanged(prev); paint(); syncUrl();
  }
  else if (act === 'undo') { Object.assign(SET, R.prev); R.note = ''; R.dismissed = false; R.card = 'done'; paint(); syncUrl(); }
  else if (act === 'note-close') { R.note = ''; R.dismissed = true; paint(); }
  else if (act === 'goto') goto(t.dataset.sec, t.dataset.row);
});
// The repaint replaces the focused element, so Escape is heard on the document.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && R.menu) { R.menu = false; paint(); stage.querySelector('[data-act="menu"]')?.focus(); }
});
stage.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('li[data-act]')) { e.preventDefault(); e.target.click(); }
});
</script>

<script>
// ---- Prototype controls ----
function syncUrl() {
  const url = new URL(location);
  for (const [k, v] of Object.entries(S)) url.searchParams.set(k, v);
  url.searchParams.set('m', SET.m); url.searchParams.set('d', SET.d); url.searchParams.set('model', SET.model);
  history.replaceState(null, '', url);
}
function syncControls() {
  document.querySelectorAll('.pc-group').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
}
function rerender() {
  syncUrl(); syncControls();
  stage.innerHTML = variants[current]();
}
document.querySelectorAll('.pc-group').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  // A new silence is a new visit to the conversation: the card is read again.
  if (g.dataset.k === 's') { R.card = null; R.dismissed = false; R.menu = false; R.note = ''; }
  if (g.dataset.k === 'n') { R.sec = ''; R.menu = false; }
  S[g.dataset.k] = b.dataset.v; rerender();
}));
let rz;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(rerender); });
syncControls();
</script>
