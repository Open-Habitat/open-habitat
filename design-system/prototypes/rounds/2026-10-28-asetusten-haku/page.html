/* ---- Prototype chrome (not a contestant) ---- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0c0d0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

}
.pc-group { display: inline-flex; align-items: center; gap: 2px; }
.pc-group > span { margin-right: 4px; color: #8a9097; }
.pc-group button {
  height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent;
  color: #aeb4ba; font: inherit; cursor: pointer;
}
.pc-group button:hover { background: rgba(255,255,255,.06); }
.pc-group button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: #fff; }
.pc-read { margin-left: auto; color: #8a9097; }

#viewport { position: fixed; inset: 44px 0 64px 0; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
body.bare .pc-bar { display: none; }
body.bare #viewport { inset: 0; padding: 0; }
body.bare .proto-picker { display: none; }
#sizer { position: relative; flex: none; }
#frame {
  position: absolute; top: 0; left: 0; transform-origin: top left; overflow: hidden;
  background: var(--ah-bg); color: var(--ah-ink); font-family: var(--ah-font);
  font-size: var(--ah-size-body); line-height: var(--ah-lh-ui);
  box-shadow: 0 0 0 1px #2a2e33;
}
body.bare #frame { box-shadow: none; }

/* ---- App shell (production context, simplified) ---- */
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app { display: flex; height: 100%; position: relative; }

.rail-account.cur { background: var(--ah-current); }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ah-accent-soft); color: var(--ah-accent-ink); font-size: 11px; font-weight: 600; flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ah-bg); position: relative; }

.topbar h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.icon-btn:hover { background: var(--ah-hover); color: var(--ah-ink); }
.icon-btn svg.i { width: 20px; height: 20px; }
.scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: var(--ah-focus-offset); }

/* The conversation that Settings covered (what the close X returns to). */

.convo-col { max-width: var(--ah-conversation-width); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; font-size: var(--ah-size-body); line-height: var(--ah-lh-body); }
.msg-user { align-self: flex-end; max-width: 80%; padding: 10px 14px; border-radius: 14px; background: var(--ah-surface-2); border: 1px solid var(--ah-line-soft); }
.msg-agent p { margin: 0 0 8px; }
.composer { flex: none; padding: 10px 32px 18px; }
.composer .field { max-width: var(--ah-conversation-width); margin: 0 auto; height: 48px; border: 1px solid var(--ah-line); border-radius: 14px; background: var(--ah-surface); display: flex; align-items: center; padding: 0 14px; color: var(--ah-muted); }

/* ---- Buttons and controls (ControlButton, Segmented looks) ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ah-control-row); padding: 0 var(--ah-control-row-pad);
  border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-control); color: var(--ah-ink);

}

.seg button:hover { background: var(--ah-hover); }
.seg button[aria-checked="true"] { background: var(--ah-surface); box-shadow: 0 0 0 1px var(--ah-line-strong); color: var(--ah-ink); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-md); background: var(--ah-surface); font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.chip .sub { color: var(--ah-muted); font-weight: 400; }
.num { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ah-muted); }
.num input, .txt input { height: 30px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink); font: inherit; font-size: 13px; padding: 0 8px; }
.num input { width: 64px; text-align: right; }
.txt input { width: 14em; max-width: 100%; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ah-ok); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-ok); }
.status.off { color: var(--ah-muted); }

.bar { width: 180px; height: 6px; border-radius: 3px; background: var(--ah-sunken); overflow: hidden; box-shadow: inset 0 0 0 1px var(--ah-line-soft); }
.bar span { display: block; height: 100%; background: var(--ah-accent); }
.letter { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--ah-sunken); color: var(--ah-source-1); font: 600 11px var(--ah-mono); flex: none; }

/* ---- Settings (Settings.css, simplified) ---- */
.settings { display: flex; gap: var(--ah-s8); min-height: 100%; padding: var(--ah-s5) 28px 48px; }
.s-nav { flex: none; width: 190px; display: flex; flex-direction: column; gap: 2px; font-size: var(--ah-size-ui); position: sticky; top: var(--ah-s5); align-self: flex-start; }

.s-nav-i { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--ah-r-nav); background: transparent; color: var(--ah-ink-2); font: 500 var(--ah-size-ui) var(--ah-font); text-align: left; cursor: pointer; width: 100%; }
.s-nav-i svg.i { color: var(--ah-muted); }
.s-nav-i:hover { background: var(--ah-hover); }

.s-nav-i .nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-nav-i.new .nl::after { content: " uusi"; font-size: 10.5px; color: var(--ah-accent-ink); font-weight: 600; }
.s-nav-h { margin: var(--ah-s5) 10px 4px; font: 600 var(--ah-size-label) var(--ah-font); color: var(--ah-muted); text-transform: uppercase; letter-spacing: .05em; }
.s-main { flex: 1; min-width: 0; max-width: 720px; }
.s-main > h2 { font-size: var(--ah-size-h2); margin: var(--ah-s4) 0 var(--ah-s4); outline: none; }
.s-back { display: none; }
.s-intro { margin: 0 0 14px; color: var(--ah-muted); font-size: var(--ah-size-ui); line-height: 1.5; }
.s-h3 { margin: var(--ah-s6) 0 6px; font-size: var(--ah-size-ui); font-weight: 600; }
.s-card { border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); overflow: hidden; }
.s-card > * + * { border-top: 1px solid var(--ah-line-soft); }
.s-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(0, auto); gap: var(--ah-s3) var(--ah-s6); align-items: center; padding: var(--ah-s4) var(--ah-s5); font-size: var(--ah-size-ui); scroll-margin-block: var(--ah-s8); }
.s-row.icon { grid-template-columns: auto minmax(160px, 1fr) minmax(0, auto); }
.s-row:focus { outline: none; }
.s-lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.s-lbl strong { font-weight: 600; }
.s-desc { color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; }
.s-val { display: flex; align-items: center; justify-content: flex-end; gap: var(--ah-s3); flex-wrap: wrap; min-width: 0; }
.s-version { margin-top: var(--ah-s5); padding-top: var(--ah-s3); border-top: 1px solid var(--ah-line); color: var(--ah-ink-2); font-size: var(--ah-size-meta); }
.s-version code { font-family: var(--ah-mono); color: var(--ah-ink); }
/* Production's landing mark (Settings.css [data-settings-row][data-landed]). */
.s-row[data-landed] { animation: s-landed 2.4s ease-out; }
@keyframes s-landed { 0%, 40% { background: var(--ah-accent-soft); box-shadow: inset 3px 0 0 var(--ah-accent); } 100% { background: transparent; box-shadow: inset 3px 0 0 transparent; } }
/* While a search is active, every matching row in the open section keeps a quiet mark. */
.s-row[data-hit] { box-shadow: inset 3px 0 0 var(--ah-accent-line); }
.s-row[data-hit][data-landed] { animation-name: s-landed-hit; }
@keyframes s-landed-hit { 0%, 40% { background: var(--ah-accent-soft); box-shadow: inset 3px 0 0 var(--ah-accent); } 100% { background: transparent; box-shadow: inset 3px 0 0 var(--ah-accent-line); } }
mark { background: color-mix(in srgb, var(--ah-accent) 26%, transparent); color: inherit; border-radius: 3px; }
[data-theme="dark"] mark { background: color-mix(in srgb, var(--ah-accent) 38%, transparent); }

/* ---- Close X (settings-close-returns, implemented separately) ---- */
.s-close { position: absolute; top: 14px; right: 16px; z-index: 6; }

/* ---- Search field (top of the settings sidebar; SearchField / .ah-rail-search look) ---- */
.ss { position: relative; margin: 0 0 8px; }
.ss-field { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 9px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-muted); }
.ss-field:focus-within { border-color: var(--ah-focus); box-shadow: 0 0 0 1px var(--ah-focus); }

.ss-field input::placeholder { color: var(--ah-muted); }
.ss-field input::-webkit-search-cancel-button { display: none; }

.ss-clear { width: 22px; height: 22px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--ah-sunken); color: var(--ah-muted); cursor: pointer; padding: 0; }
.ss-clear svg.i { width: 12px; height: 12px; stroke-width: 2.2; }
.ss-clear:hover { color: var(--ah-ink); }
.ss-sum { display: block; margin: 6px 10px 2px; font-size: var(--ah-size-meta); color: var(--ah-muted); min-height: 1em; }

/* ---- Direction 1: results in the sidebar ---- */
.r1 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }

.r1 li svg.i { margin-top: 2px; color: var(--ah-muted); }
.r1 .rt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.r1 .rl { font-weight: 500; overflow-wrap: anywhere; }
.r1 .rp { font-size: 11.5px; color: var(--ah-muted); line-height: 1.35; }
.r1 .rw { font-size: 11.5px; color: var(--ah-muted); font-style: italic; }
.r-none { padding: 10px; color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.5; }

/* ---- Direction 2: a filtered results page ---- */
.s-nav-i.dim { opacity: .45; }
.s-nav-i .cnt { font: 600 11px var(--ah-font); color: var(--ah-accent-ink); background: var(--ah-accent-soft); border-radius: 999px; padding: 1px 7px; }
.rs-head { display: flex; align-items: baseline; gap: 10px; margin: var(--ah-s4) 0 var(--ah-s2); }
.rs-head h2 { font-size: var(--ah-size-h2); margin: 0; }
.rs-head span { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.rs-group { margin-top: var(--ah-s5); scroll-margin-top: var(--ah-s4); }
.rs-gh { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: var(--ah-size-ui); font-weight: 600; }
.rs-gh svg.i { color: var(--ah-muted); }
.rs-gh .sp { flex: 1; }
.rs-gh .crumb { color: var(--ah-muted); font-weight: 400; }
.rs-open { border: 0; background: transparent; color: var(--ah-accent-ink); font: 500 var(--ah-size-meta) var(--ah-font); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.rs-open:hover { text-decoration: underline; }
.rs-whole { padding: 8px var(--ah-s5); font-size: var(--ah-size-meta); color: var(--ah-muted); background: var(--ah-surface-2); }

/* ---- Direction 3: a quick-search popover ---- */
.pop {
  position: absolute; left: 0; top: 38px; z-index: 20; width: 460px; max-height: 520px; display: flex; flex-direction: column;
  border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu), 0 20px 48px rgba(0,0,0,.18);

.pop-i { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 10px; border-radius: var(--ah-r-md); cursor: pointer; }
.pop-i:hover { background: var(--ah-hover); }
.pop-i[aria-selected="true"] { background: var(--ah-accent-soft); }
.pop-i svg.i { color: var(--ah-muted); }

.pop-i[aria-selected="true"] .pk { visibility: visible; }
.pop-foot { flex: none; display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--ah-line-soft); font-size: 11.5px; color: var(--ah-muted); background: var(--ah-surface-2); border-radius: 0 0 var(--ah-r-lg) var(--ah-r-lg); }
.pop-foot kbd { font: 500 11px var(--ah-mono); }

/* ---- Phone (production at <= 760px: the list, or the section alone) ---- */
.phone { --ah-topbar-pad-inline: 14px; --ah-control-row: 40px; }
.ph .settings { display: block; padding: 6px 14px 40px; }

<body>
<div class="pc-bar" role="toolbar" aria-label="Prototyypin asetukset">
  <div class="pc-group" data-k="w"><span>Ikkuna</span><button data-v="oma">Oma</button><button data-v="1280">1280</button><button data-v="390">Puhelin</button></div>
  <div class="pc-group" data-k="t"><span>Teema</span><button data-v="dark">Tumma</button><button data-v="light">Vaalea</button></div>
  <div class="pc-group" data-k="role"><span>Rooli</span><button data-v="admin">Ylläpitäjä</button><button data-v="person">Henkilö</button></div>
  <div class="pc-group" data-k="q"><span>Kokeile</span><button data-v="tumma">tumma</button><button data-v="avain">avain</button><button data-v="gmail">gmail</button><button data-v="malli">malli</button><button data-v="puhelin">puhelin</button><button data-v="recap">recap</button><button data-v="kiintiö">kiintiö</button><button data-v="lomake">lomake</button></div>
  <div class="pc-read" id="readout"></div>
</div>
<div id="viewport"><div id="sizer"><div id="frame"></div></div></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">1 Sivupalkissa</button>
  <button class="proto-picker-item">2 Tulossivu</button>
  <button class="proto-picker-item">3 Pikahaku</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item">Nykyinen</button>
</nav>

<script>
// ---- State (URL-backed so screenshots are reproducible) ----
const q = new URLSearchParams(location.search);
// w: window, t: theme, role: admin | person, sec: open section ('' is the phone list),
// q: the search text, view: settings | closed.
const S = {
  w: q.get('w') || 'oma', t: q.get('t') || 'dark', role: q.get('role') || 'admin',
  sec: q.get('sec') ?? 'tekoaly', q: q.get('q') || '', view: q.get('view') || 'settings',
};
if (q.get('bare') === '1') document.body.classList.add('bare');
const VARIANTS = ['d1', 'd2', 'd3', 'now'];
let V = null;
// One visit: the selected result, the row a jump marks, whether d3's popover or sheet is open,
// and where the phone's back row returns.

const sectionsShown = () => SECTIONS.filter(s => !s.admin || admin());
const secOf = id => SECTIONS.find(s => s.id === id);

// ---- Matching: case- and accent-insensitive word prefixes (so "aani" finds "ääni"). Every
// word typed must match the setting's name, a synonym, the description or the section. ----
const fold = s => [...String(s)].map(c => c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')[0] || ' ').join('');
function wordHits(text, term) {
  // Start indices of `term` in `text` (both folded); length is term.length. A short term must
  // begin a word; from four letters it may sit inside one, because Finnish compounds
  // ("Oletusmalli", "Saneluavain") hide the word a person types.
  const f = fold(text), out = [];
  let i = f.indexOf(term);
  while (i >= 0) { if (term.length >= 4 || i === 0 || /[^a-z0-9]/.test(f[i - 1])) out.push(i); i = f.indexOf(term, i + 1); }
  return out;
}
const terms = s => fold(s).split(/\s+/).filter(Boolean);
function entries() {
  const out = [];
  for (const s of sectionsShown()) {
    out.push({ kind: 'section', sec: s, label: s.label, path: s.admin ? 'Palvelimen ylläpito' : 'Asetukset', kw: s.kw, desc: s.intro || '' });
    for (const r of s.rows) out.push({ kind: 'row', sec: s, row: r, label: r.term || r.label, path: [s.admin ? 'Ylläpito' : '', s.label, r.group].filter(Boolean).join(' › '), kw: r.kw || [], desc: r.desc || '' });
  }
  return out;
}
function search(query) {
  const ts = terms(query);
  if (!ts.length) return [];
  const res = [];
  for (const e of entries()) {
    let score = 0, via = null, kwHit = null, ok = true;
    for (const t of ts) {
      if (wordHits(e.label, t).length) { score += fold(e.label).startsWith(t) ? 120 : 100; continue; }
      const k = e.kw.find(k => wordHits(k, t).length);
      if (k) { score += 60; via = via || 'kw'; kwHit = kwHit || k; continue; }
      // A section's name alone finds the section, not every row in it; with more words it narrows.
      if (e.kind === 'row' && ts.length > 1 && wordHits(e.sec.label, t).length) { score += 30; continue; }
      if (t.length >= 3 && wordHits(e.desc, t).length) { score += 20; via = via || 'desc'; continue; }
      ok = false; break;
    }
    // The person's own settings come before the server's at an equal match.
    if (ok) res.push({ ...e, score: score + (e.kind === 'section' ? 5 : 0) - (e.sec.admin ? 25 : 0), via, kwHit });
  }
  return res.sort((a, b) => b.score - a.score);
}
// Wrap every typed word's matches in <mark>, against the original text.
function hl(text, query) {
  const ts = terms(query);
  if (!ts.length) return esc(text);
  const marks = new Array(text.length).fill(false);
  for (const t of ts) for (const i of wordHits(text, t)) for (let j = i; j < i + t.length; j++) marks[j] = true;
  let out = '', open = false;
  [...text].forEach((c, i) => {
    if (marks[i] && !open) { out += '<mark>'; open = true; }
    if (!marks[i] && open) { out += '</mark>'; open = false; }
    out += esc(c);
  });
  return out + (open ? '</mark>' : '');
}
function snippet(text, query) {
  const t = terms(query).find(t => wordHits(text, t).length);
  const i = t ? wordHits(text, t)[0] : 0;
  const start = Math.max(0, text.lastIndexOf(' ', Math.max(0, i - 24)));
  return (start > 0 ? '…' : '') + hl(text.slice(start).trim(), query);
}
