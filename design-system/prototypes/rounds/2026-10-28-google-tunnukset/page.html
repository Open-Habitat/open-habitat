const blockHTML = (b, opts) => b.field

  const doB = step.blocks.filter(b => b.side === 'do' && !b.only3), get = step.blocks.filter(b => b.side === 'get');
  return `${doB.map(b => blockHTML(b)).join('')}${step.intro ? step.intro() : ''}<p class="gw-then" data-testid="gw-then"><span>${esc(step.then)}</span></p>${getHTML(get)}`;
}

  const paths = W.open === 'dropbox' ? Path('Settings › App key, App secret (Show)') : pre.join('');
  return `${paths}<div class="si-fields">${f.map(b => field(FIELDS[W.open].find(x => x.id === b.field)) + (b.after ? b.after() : '')).join('')}</div>${rest.map(b => `<div class="si-handoff"><span class="si-quiet">${esc(b.t)}.</span>${b.html()}</div>`).join('')}`;

function mergedSplit(step) {

  const left = i === 0 && !last ? `<button class="btn b-row b-quiet" data-testid="si-skip" data-act="skip">${SKIP[W.open]}</button>` : '';
  const back = i > 0 || (W.skip && V !== 'cur') ? `<button class="btn b-row b-secondary" data-testid="si-back" data-act="back"${W.saving ? ' disabled' : ''}>Takaisin</button>` : `<button class="btn b-row b-secondary" data-act="close"${W.saving ? ' disabled' : ''}>Peruuta</button>`;
  const fwd = last ? `<button class="btn b-page b-primary" data-testid="si-save" data-act="save"${W.saving ? ' disabled' : ''}>${W.saving ? 'Odottaa palvelinta…' : 'Tallenna'}</button>` : `<button class="btn b-page b-primary" data-testid="si-next" data-act="next">Seuraava</button>`;
  return `<div class="ah-overlay" data-act="scrim"><div class="ah-modal si-modal${many ? ' si-wide' : ''}${split ? ' gw-split-modal' : ''}"><section class="ah-dialog si-dialog" role="dialog" aria-label="${esc(title)}" data-testid="si-setup-dialog" data-variant="${V}"><h2>${esc(title)}</h2>${progress}<div class="si-stepbody" data-testid="si-step-${step.id}">${stepBody(step, last)}</div><div class="si-foot">${left}<span class="si-grow"></span>${back}${fwd}</div></section></div></div>`;
}

// ---- Frame geometry ----
const HEIGHTS = { 1280: 900, 390: 844 };
const viewport = document.getElementById('viewport');
const sizer = document.getElementById('sizer');
const stage = document.getElementById('frame');
function layoutFrame() {
  const W_ = +S.w, H = HEIGHTS[S.w];
  const bare = document.body.classList.contains('bare');
  const s = bare ? 1 : Math.min(1, (viewport.clientWidth - 24) / W_, (viewport.clientHeight - 24) / H);
  stage.style.width = W_ + 'px'; stage.style.height = H + 'px';
  stage.style.transform = s < 1 ? `scale(${s})` : '';
  sizer.style.width = Math.round(W_ * s) + 'px'; sizer.style.height = Math.round(H * s) + 'px';
  stage.dataset.theme = S.t;
}
function readout() {
  const r = document.getElementById('readout');
  if (!W.open) { r.textContent = 'Avaa ohje rivin painikkeesta Aseta tunnukset…'; return; }
  const n = steps().length;
  r.textContent = `${NAME[W.open]}: ${n} ${n === 1 ? 'vaihe' : 'vaihetta'}${W.skip ? ' (Minulla on jo …)' : ''}`;
}
function paint() {
  const keepScroll = stage.querySelector('.ah-modal')?.scrollTop || 0;
  stage.innerHTML = appHTML();
  const m = stage.querySelector('.ah-modal'); if (m) m.scrollTop = keepScroll;
  readout();
}

// ---- Interaction inside the frame ----
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-act],[data-copy],a');
  if (!t) return;
  if (t.matches('a')) { e.preventDefault(); return; }
  if (t.dataset.copy !== undefined) { navigator.clipboard?.writeText(t.dataset.copy).catch(() => {}); t.innerHTML = ic('check'); setTimeout(() => { t.innerHTML = ic('copy'); }, 1400); return; }
  if (t.dataset.open) { W = fresh(); W.open = t.dataset.open; paint(); stage.querySelector('[role=dialog]')?.focus(); return; }
  const act = t.dataset.act;
  if (act === 'scrim' && e.target !== t) return;
  if ((act === 'close' || act === 'scrim') && !W.saving) { W = fresh(); paint(); return; }
  // Production jumps to its Tunnukset step and keeps Takaisin to the guide.
  if (act === 'skip') { if (V === 'cur') W.at = steps().length - 1; else { W.skip = true; W.at = 0; } paint(); return; }
  if (act === 'back') { if (W.skip) { W.skip = false; W.at = 0; } else W.at--; W.errors = {}; const m = stage.querySelector('.ah-modal'); paint(); stage.querySelector('.ah-modal').scrollTop = 0; return; }
  if (act === 'next') { W.at++; paint(); stage.querySelector('.ah-modal').scrollTop = 0; return; }
  if (act === 'save') {
    W.errors = appErrors(W.open, W.values);
    if (Object.keys(W.errors).length) { paint(); stage.querySelector('[aria-invalid]')?.focus(); return; }
    W.saving = true; paint();
    const p = W.open;
    setTimeout(() => { READY[p] = true; W = fresh(); paint(); }, 700);
  }
});
stage.addEventListener('input', e => {
  const f = e.target.dataset.field; if (!f) return;
  W.values[f] = e.target.value;
  if (W.errors[f]) { delete W.errors[f]; e.target.removeAttribute('aria-invalid'); e.target.parentElement.querySelector('.err')?.remove(); }
  const link = stage.querySelector('[data-testid=gw-consent-link]');
  if (link) link.outerHTML = consentLink();
});

// ---- Picker wiring (picker.js expects `stage` and `variants`) ----
const VARIANTS = ['d1', 'd2', 'd3', 'cur'];
let lastV = null;
const variants = VARIANTS.map(v => () => {
  // A new direction starts its dialog over; theme and window changes keep it.
  if (lastV && lastV !== v && W.open) { const o = W.open, skip = W.skip; W = fresh(); W.open = o; W.skip = skip; }
  lastV = v; V = v; stage.dataset.variant = v; layoutFrame();
  setTimeout(readout);
  return appHTML();
});
</script>
<script>
/*PICKER_JS*/
</script>
<script>
// ---- Prototype controls ----
function syncControls() {
  document.querySelectorAll('.pc-group[data-k]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
}
function rerender() {
  const url = new URL(location);
  for (const [k, v] of Object.entries(S)) url.searchParams.set(k, v);
  history.replaceState(null, '', url);
  syncControls();
  layoutFrame();
  paint();
}
document.querySelectorAll('.pc-group[data-k]').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.k] = b.dataset.v; rerender();
}));
document.getElementById('fill').addEventListener('click', () => {
  if (!W.open) return;
  for (const f of FIELDS[W.open]) W.values[f.id] = SAMPLE[f.id];
  W.errors = {}; paint();
});
document.getElementById('reset').addEventListener('click', () => { W = fresh(); READY = { google: false, microsoft: false, dropbox: false }; paint(); });
let rz;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { layoutFrame(); }); });
if (PARAMS.get('bare') === '1') document.body.classList.add('bare');
syncControls();
layoutFrame();
</script>
</body>
