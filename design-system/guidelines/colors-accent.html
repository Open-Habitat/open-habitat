<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1;min-width:88px;border:1px solid var(--ah-line);border-radius:var(--ah-r-lg);overflow:hidden;background:var(--ah-surface)}
.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}
.sw code{display:block;font:400 11px var(--ah-mono);color:var(--ah-muted);padding:0 8px 7px}
.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div class="row">
<div class="sw"><i style="background:#2b7f8c"></i><b>Accent</b><code>#2b7f8c</code></div><div class="sw"><i style="background:#1d5f69"></i><b>Accent ink</b><code>#1d5f69</code></div><div class="sw"><i style="background:#e6f1f3"></i><b>Accent soft</b><code>#e6f1f3</code></div><div class="sw"><i style="background:#cfe3e6"></i><b>Accent line</b><code>#cfe3e6</code></div>
</div>
<p style="font:400 12.5px var(--ah-font);color:var(--ah-muted);margin:10px 0 0">Tummassa teemassa korostus vaalenee arvoon #4fa6b4 ja teksti sen päällä on #0f1417.</p>
</body></html>
