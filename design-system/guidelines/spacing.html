<!-- @dsCard group="Spacing" viewport="700x130" name="Väli ja pyöristys" subtitle="4px-ruudukko, keskitiheä" -->
<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1;min-width:88px;border:1px solid var(--ah-line);border-radius:var(--ah-r-lg);overflow:hidden;background:var(--ah-surface)}
.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}
.sw code{display:block;font:400 11px var(--ah-mono);color:var(--ah-muted);padding:0 8px 7px}
.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div class="row" style="align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:9px;height:26px;background:var(--ah-accent-soft);border:1px solid var(--ah-accent-line)"></div><div class="k">9</div></div>
<div style="text-align:center"><div style="width:12px;height:26px;background:var(--ah-accent-soft);border:1px solid var(--ah-accent-line)"></div><div class="k">12</div></div>
<div style="text-align:center"><div style="width:14px;height:26px;background:var(--ah-accent-soft);border:1px solid var(--ah-accent-line)"></div><div class="k">14</div></div>
<div style="text-align:center"><div style="width:18px;height:26px;background:var(--ah-accent-soft);border:1px solid var(--ah-accent-line)"></div><div class="k">18</div></div>
<div style="text-align:center"><div style="width:24px;height:26px;background:var(--ah-accent-soft);border:1px solid var(--ah-accent-line)"></div><div class="k">24</div></div>
<div style="display:flex;gap:8px;margin-left:16px">
  <div style="width:44px;height:30px;border:1px solid var(--ah-line);border-radius:5px;background:var(--ah-surface)"></div>
  <div style="width:44px;height:30px;border:1px solid var(--ah-line);border-radius:8px;background:var(--ah-surface)"></div>
  <div style="width:44px;height:30px;border:1px solid var(--ah-line);border-radius:10px;background:var(--ah-surface)"></div>
  <div style="width:44px;height:30px;border:1px solid var(--ah-line);border-radius:12px;background:var(--ah-surface)"></div>
</div>
</div>
<p style="font:400 12.5px var(--ah-font);color:var(--ah-muted);margin:10px 0 0">Pyöristys: 5 merkinnät · 8 painikkeet ja kentät · 10 kortit ja viestit · 12 sovelluskehys.</p>
</body></html>
