<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1;min-width:88px;border:1px solid var(--ah-line);border-radius:var(--ah-r-lg);overflow:hidden;background:var(--ah-surface)}
.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}
.sw code{display:block;font:400 11px var(--ah-mono);color:var(--ah-muted);padding:0 8px 7px}
.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div class="row" style="gap:12px">
<span style="display:inline-flex;align-items:center;gap:6px;background:var(--ah-accent-soft);color:var(--ah-accent-ink);border:1px solid var(--ah-accent-line);border-radius:999px;padding:4px 11px;font:500 12px var(--ah-font)"><span style="width:7px;height:7px;border-radius:99px;background:var(--ah-accent);animation:ah-pulse var(--ah-pulse)"></span>Työskentelee</span>
<span style="color:var(--ah-ok);font:500 12.5px var(--ah-font)">✓ Valmis</span>
<span style="color:var(--ah-err);font:500 12.5px var(--ah-font)">✕ Virhe · exit 1</span>
<span style="color:var(--ah-muted);font:500 12.5px var(--ah-font)">⃠ Keskeytetty</span>
<span style="color:var(--ah-muted);font:500 12.5px var(--ah-font)">‖ Ei aloitettu</span>
<span style="color:var(--ah-faint);font:500 12.5px var(--ah-font)">? Ei tiedossa</span>
</div>
<p style="font:400 12.5px var(--ah-font);color:var(--ah-muted);margin:12px 0 0">Oletustilaa ei näytetä: yhdistetty ja odottaa viestiä ovat mykkiä. Tuntematonta ei päätellä valmiiksi.</p>
</body></html>
