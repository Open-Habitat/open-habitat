<!-- @dsCard group="Motion" viewport="700x130" name="Liike" subtitle="Vain se mikä oikeasti muuttuu" -->
<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1;min-width:88px;border:1px solid var(--ah-line);border-radius:var(--ah-r-lg);overflow:hidden;background:var(--ah-surface)}
.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}
.sw code{display:block;font:400 11px var(--ah-mono);color:var(--ah-muted);padding:0 8px 7px}
.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div style="display:flex;flex-direction:column;gap:9px;font:400 13px var(--ah-font);color:var(--ah-ink-2)">
<div class="row"><span style="width:9px;height:9px;border-radius:99px;background:var(--ah-accent);animation:ah-pulse var(--ah-pulse)"></span><span>Syke 2,4 s — vain käynnissä oleva työ</span></div>
<div class="row"><span class="k">900 ms</span><span>Laajenevat tunnisteet: yhteys, malli, tilan kuvaus</span></div>
<div class="row"><span class="k">380 ms</span><span>Uusi elementti keskusteluun liukuu sisään vasemmalta</span></div>
<div class="row"><span class="k">0 ms</span><span>prefers-reduced-motion poistaa kaiken liikkeen</span></div>
</div></body></html>
