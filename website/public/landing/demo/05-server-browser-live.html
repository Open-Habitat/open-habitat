:root {
  --ah-title-spin: ah-title-spin 1000ms linear infinite;
  --ah-title-dot: ah-title-dot 1000ms ease-in-out infinite;
  --ah-title-dot-step: 120ms;
  --ah-pulse: 1.6s ease-in-out infinite;
  --ah-expand: 180ms cubic-bezier(.2, .7, .3, 1);
  --ah-fade: 160ms ease;
  --ah-appear: 180ms cubic-bezier(.2, .7, .3, 1);
  --ah-transition: 120ms ease;
  
  --ah-rail-move-ms: 620;
  --ah-rail-edge-ms: 340;
  --ah-rail-flight-ms: 1700;
  --ah-rail-move-ease: cubic-bezier(.25, .75, .25, 1);
  --ah-rail-roll: 480ms var(--ah-rail-move-ease) both;
  --ah-rail-glow: 1.8s ease-out both;
}

@keyframes ah-title-spin { to { transform: rotate(360deg) } }

@keyframes ah-title-dot { 0%, 70%, 100% { opacity: .45 } 35% { opacity: 1; transform: translateY(-2px) } }

@keyframes ah-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
@keyframes ah-appear { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }

@media (prefers-reduced-motion: reduce) {
  :root { --ah-pulse: none; --ah-expand: 0ms; --ah-fade: 0ms; --ah-appear: 0ms; --ah-transition: 0ms; }
  * { animation: none !important; transition: none !important; }
}

.oh-mark{overflow:visible;flex:none;--tx:5px;--ty:-5px}
.oh-ring{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:81.3 18.7}
.oh-dot,.oh-sub{fill:currentColor;transform-box:fill-box;transform-origin:center}



.oh-mark[data-state=thinking] .oh-dot{animation:oh-breathe 1.5s ease-in-out infinite}
@keyframes oh-breathe{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1.2);opacity:1}}


.oh-mark[data-state=working] .oh-ring{stroke-dashoffset:-50;animation:oh-turn 1.7s cubic-bezier(.65,0,.35,1) infinite}
@keyframes oh-turn{to{stroke-dashoffset:-150}}


.oh-mark[data-state=waiting]{color:var(--ah-turn)}
.oh-mark[data-state=waiting] .oh-dot{animation:oh-knock 2.6s ease-in-out infinite}
@keyframes oh-knock{0%,8%{transform:translate(0,0)}28%{transform:translate(var(--tx),var(--ty))}38%{transform:translate(calc(var(--tx)*.75),calc(var(--ty)*.75))}48%{transform:translate(var(--tx),var(--ty))}58%{transform:translate(calc(var(--tx)*.75),calc(var(--ty)*.75))}68%,82%{transform:translate(var(--tx),var(--ty))}100%{transform:translate(0,0)}}

.oh-mark[data-state=done]{color:var(--ah-ok)}
.oh-mark[data-state=done] .oh-ring{stroke-dasharray:100 0}

.oh-mark[data-state=error]{color:var(--ah-err)}
.oh-mark[data-state=error] .oh-dot{fill:none;stroke:currentColor;stroke-width:1.6}

.oh-mark[data-state=read]{color:var(--ah-turn)}
.oh-mark[data-state=read] .oh-dot{fill:none;stroke:currentColor;stroke-width:1.6;transform:translate(var(--tx),var(--ty))}

.oh-mark[data-state=background] .oh-dot{opacity:.45}
.oh-mark[data-state=background] .oh-ring{stroke-dashoffset:-25;animation:oh-drift 6s linear infinite}
@keyframes oh-drift{to{stroke-dashoffset:-125}}

.oh-mark[data-state=awaited] .oh-ring{stroke-dashoffset:-50;animation:oh-turn 1.7s cubic-bezier(.65,0,.35,1) infinite}
.oh-mark[data-state=awaited] .oh-dot{animation:oh-breathe 1.5s ease-in-out infinite}

.oh-mark[data-state=unknown]{color:var(--ah-muted)}
.oh-mark[data-state=unknown] .oh-ring{stroke-dasharray:4.5 8}
.oh-mark[data-state=unknown] .oh-dot{display:none}

.oh-mark[data-state=stopping] .oh-ring{animation:oh-close 1.2s ease-in-out infinite alternate}
.oh-mark[data-state=stopping] .oh-dot{opacity:.45}
@keyframes oh-close{from{stroke-dasharray:81.3 18.7}to{stroke-dasharray:100 0}}

.oh-mark[data-state=loading] .oh-dot{transform:scale(.4);opacity:.3}
.oh-mark[data-state=loading] .oh-ring{animation:oh-load 1.8s ease-in-out infinite}
@keyframes oh-load{0%{stroke-dasharray:8 92;stroke-dashoffset:0}50%{stroke-dasharray:70 30;stroke-dashoffset:-40}100%{stroke-dasharray:8 92;stroke-dashoffset:-100}}

.oh-mark[data-state=intro] .oh-ring{animation:oh-draw 1.1s ease-in-out both}
@keyframes oh-draw{from{stroke-dasharray:0 100}to{stroke-dasharray:81.3 18.7}}
.oh-mark[data-state=intro] .oh-dot{animation:oh-enter .7s cubic-bezier(.3,1.3,.5,1) .9s both}
@keyframes oh-enter{from{transform:translate(calc(var(--tx)*2.6),calc(var(--ty)*2.6)) scale(.4);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}


.oh-orbit{animation:oh-orbit 16s linear infinite}
@keyframes oh-orbit{to{transform:rotate(360deg)}}
.oh-mark:has(.oh-sub) .oh-dot{r:2px}
.oh-sub[data-state=working]{animation:oh-breathe .9s ease-in-out infinite}
.oh-sub[data-state=thinking]{animation:oh-breathe 1.9s ease-in-out infinite}
.oh-sub[data-state=waiting]{fill:var(--ah-turn);animation:oh-blink 1.2s steps(2,jump-none) infinite}
.oh-sub[data-state=error]{fill:var(--ah-err)}
@keyframes oh-blink{0%{opacity:1}100%{opacity:.2}}


@media (prefers-reduced-motion:reduce){
 .oh-mark *,.oh-orbit{animation:none!important}
 .oh-mark[data-state=waiting] .oh-dot{transform:translate(var(--tx),var(--ty))}
 .oh-mark[data-state=read] .oh-dot{transform:translate(var(--tx),var(--ty))}
}

  font-size: var(--ah-size-meta);
}
.sb-paste textarea,
.sb-secret-field > input {
  width: 100%;
  box-sizing: border-box;
  resize: vertical;
  padding: var(--ah-s1) var(--ah-s2);
  border: 1px solid var(--ah-control-line);
  border-radius: var(--ah-r-md);
  background: var(--ah-surface);
  color: var(--ah-ink);
  font-family: var(--ah-mono);
  font-size: var(--ah-size-meta);
}
.sb-secret-field {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--ah-s1);
}
.sb-paste textarea.sb-masked {
  -webkit-text-security: disc;
}
.sb-paste small,
.sb-clip-note {
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
  line-height: 1.4;
}
.sb-paste-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ah-s2);
  align-items: center;
}
.sb-check {
  display: inline-flex;
  align-items: center;
  gap: var(--ah-s1);
  font-size: var(--ah-size-meta);
}
.sb-enter-warn {
  display: flex;
  gap: var(--ah-s2);
  margin: 0;
  padding: var(--ah-s2);
  border: 1px solid var(--ah-accent-line);
  border-radius: var(--ah-r-md);
  background: var(--ah-accent-soft);
  font-size: var(--ah-size-meta);
  line-height: 1.4;
}
.sb-enter-warn svg {
  width: 16px;
  height: 16px;
  flex: none;
}
.sb-remote-clip {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ah-s2);
  align-items: center;
  padding: var(--ah-s2);
  border: 1px dashed var(--ah-line-strong);
  border-radius: var(--ah-r-md);
  font-size: var(--ah-size-meta);
}
.sb-remote-clip input {
  min-width: 0;
  width: 100%;
  padding: var(--ah-s1) var(--ah-s2);
  border: 1px solid var(--ah-control-line);
  border-radius: var(--ah-r-sm);
  background: var(--ah-surface);
  color: var(--ah-ink);
  font-family: var(--ah-mono);
  font-size: var(--ah-size-meta);
}
.sb-says {
  flex: 1;
  min-width: 0;
  max-height: 3.5em;
  overflow: auto;
  margin: 0;
  padding: var(--ah-s1) var(--ah-s3);
  border: 1px solid var(--ah-line);
  border-radius: var(--ah-r-md);
  background: var(--ah-surface);
  font-size: var(--ah-size-meta);
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.sb-frame-screen {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 0 0 calc(var(--ah-r-lg) - 3px) calc(var(--ah-r-lg) - 3px);
  background: var(--ah-surface-2);
}
.sb-viewer {
  position: absolute;
  inset: 0;
  outline: none;
}
.sb-viewer:focus-visible {
  box-shadow: inset 0 0 0 2px var(--ah-accent);
}
.sb-canvas-hint {
  position: absolute;
  top: var(--ah-s3);
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: var(--ah-s1);
  max-width: calc(100% - 2 * var(--ah-s3));
  padding: var(--ah-s1) var(--ah-s3);
  border: 1px solid var(--ah-line-strong);
  border-radius: var(--ah-r-pill);
  background: var(--ah-surface);
  box-shadow: var(--ah-shadow-float);
  font-size: var(--ah-size-meta);
  pointer-events: none;
}
.sb-canvas-hint svg {
  width: 16px;
  height: 16px;
  flex: none;
}
.sb-mid {
  position: absolute;
  left: var(--sb-mid-x);
  top: var(--sb-mid-y);
  z-index: 3;
  width: min(360px, calc(100% - 2 * var(--ah-s2)));
  padding: var(--ah-s3);
  border: 1px solid var(--ah-line-strong);
  border-radius: var(--ah-r-lg);
  background: var(--ah-surface);
  color: var(--ah-ink);
  box-shadow: var(--ah-shadow-menu);
}
.sb-mid strong {
  display: flex;
  align-items: center;
  gap: var(--ah-s1);
}
.sb-mid strong svg {
  width: 16px;
  height: 16px;
}
.sb-mid p {
  margin: var(--ah-s1) 0 var(--ah-s3);
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
  line-height: 1.45;
}
.sb-frame-foot {
  position: absolute;
  left: var(--ah-s3);
  right: var(--ah-s3);
  bottom: var(--ah-s3);
  z-index: 2;
  display: grid;
  gap: var(--ah-s1);
  justify-items: center;
  pointer-events: none;
}
.sb-frame-foot > * {
  pointer-events: auto;
  max-width: 100%;
}
.sb-idle {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ah-s2);
  padding: var(--ah-s2) var(--ah-s3);
  border: 1px solid var(--ah-accent-line);
  border-radius: var(--ah-r-md);
  background: var(--ah-surface);
  box-shadow: var(--ah-shadow-float);
  font-size: var(--ah-size-meta);
  line-height: 1.4;
}
.sb-idle span {
  flex: 1 1 14rem;
}
.sb-toast {
  margin: 0;
  padding: var(--ah-s1) var(--ah-s3);
  border-radius: var(--ah-r-pill);
  background: var(--ah-ink);
  color: var(--ah-surface);
  font-size: var(--ah-size-meta);
}
.sb-toast:empty {
  display: none;
}
.sb-viewer-note {
  position: relative;
  z-index: 1;
  display: grid;
  justify-items: center;
  gap: var(--ah-s2);
  margin: 0;
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
}
.sb-sheet-screen > .sb-viewer-note {
  margin: auto;
}
.sb-truth {
  margin: 0;
  padding: var(--ah-s2) var(--ah-s4);
  border-top: 1px solid var(--ah-line);
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
}

@media (max-width: 600px) {
  .sb-card-rows {
    grid-template-columns: 3em minmax(0, 1fr);
  }
  .sb-card-rows .sb-card-path {
    grid-column: 2;
  }
  .sb-card-actions {
    padding: 0 var(--ah-s3) var(--ah-s2);
  }
  .ah-overlay.sb-sheet-overlay {
    padding: 0;
    align-items: end;
  }
  .ah-modal.sb-sheet {
    height: 100dvh;
    border-radius: 0;
  }
  .sb-sheet-screen {
    padding: var(--ah-s2);
  }
  .sb-sheet-head {
    gap: var(--ah-s1);
    padding: var(--ah-s2);
  }
  .sb-bar-controls,
  .sb-bar-turn {
    gap: var(--ah-s1);
  }
  .sb-bar-turn {
    flex: 1;
  }
  .sb-bar-turn:has(+ .sb-says) {
    flex: 0 0 auto;
  }
  .sb-bar-turn:has(+ .sb-says) strong {
    max-width: 4em;
  }
  .sb-says {
    padding: var(--ah-s1);
  }
  .sb-mid {
    left: var(--ah-s2);
    right: var(--ah-s2);
    width: auto;
  }
  .sb-frame-foot {
    position: static;
    padding: var(--ah-s2);
  }
}

/* ---- web/src/components/TurnChanges.css ---- */


.ah-tc-sentinel {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}
.ah-turn-changes {
  grid-column: 2;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--ah-line);
  border-radius: var(--ah-r-lg);
  background: var(--ah-surface);
}

.ah-tc-unread {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  column-gap: var(--ah-s2);
  min-width: 0;
  margin: 0;
  color: var(--ah-muted);
  font-size: var(--ah-size-meta);
}
.ah-tc-unread > svg {
  width: 14px;
  height: 14px;
}
.ah-tc-unread-retry {
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ah-ink-2);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}
.ah-tc-unread-retry:focus-visible {
  outline: var(--ah-focus-width) solid var(--ah-focus);
  outline-offset: 2px;
}
.ah-tc-head {
  display: flex;
  align-items: stretch;
  min-width: 0;
}
.ah-turn-changes[data-open] > .ah-tc-head {
  border-bottom: 1px solid var(--ah-line-soft);
}
.ah-tc-toggle {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  column-gap: var(--ah-s2);
  min-height: 36px;
  padding: 6px var(--ah-s3);
  border: 0;
  background: none;
  color: var(--ah-ink);
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.ah-tc-toggle > svg {
  width: 15px;
  height: 15px;
  color: var(--ah-ink-2);
}
.ah-tc-toggle > .ah-disclosure-chevron {
  color: var(--ah-muted);
}
.ah-tc-line {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: var(--ah-s2);
  min-width: 0;
}
.ah-tc-title {
  font-size: var(--ah-size-ui);
  font-weight: 600;
  white-space: nowrap;
}
.ah-tc-meta {
  display: inline-flex;
  align-items: baseline;
  gap: var(--ah-s2);
  min-width: 0;
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
  white-space: nowrap;
}
.ah-tc-timeline-button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--ah-s3);
  border: 0;
  border-left: 1px solid var(--ah-line-soft);
  background: none;
  color: var(--ah-ink-2);
  font: 500 var(--ah-size-meta) var(--ah-font);
  cursor: pointer;
}
.ah-tc-timeline-button svg {
  width: 14px;
  height: 14px;
}
.ah-tc-timeline-button[aria-pressed="true"] {
  background: var(--ah-accent-soft);
  color: var(--ah-ink);
}
:is(.ah-tc-toggle, .ah-tc-timeline-button, .ah-tc-file, .ah-tc-name):hover {
  background: var(--ah-hover);
}
:is(
  .ah-tc-toggle,
  .ah-tc-timeline-button,
  .ah-tc-file,
  .ah-tc-name
):focus-visible {
  outline: var(--ah-focus-width) solid var(--ah-focus);
  outline-offset: calc(-1 * var(--ah-focus-width));
}


.ah-tc-counts {
  display: inline-flex;
  gap: 6px;
  font: var(--ah-size-meta) / 1 var(--ah-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ah-tc-add {
  color: var(--ah-ok);
}
.ah-tc-del {
  color: var(--ah-err);
}
.ah-tc-path {
  display: inline-flex;
  min-width: 0;
  font: var(--ah-size-code) / 1.4 var(--ah-mono);
  overflow: hidden;
  white-space: nowrap;
}
.ah-tc-dir {
  flex: 0 1 auto;
  min-width: 2ch;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ah-muted);
}
.ah-tc-base {
  flex: none;
  color: var(--ah-ink);
}
.ah-tc-meta .ah-tc-path {
  min-width: 0;
}
.ah-tc-tags {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}
.ah-tc-tag {
  padding: 0 6px;
  border: 1px solid var(--ah-line);
  border-radius: var(--ah-r-pill);
  background: var(--ah-surface-2);
  color: var(--ah-ink-2);
  font-size: 11px;
  line-height: 17px;
  white-space: nowrap;
}
.ah-tc-tag[data-tag="deleted"] {
  border-color: color-mix(in srgb, var(--ah-err) 40%, var(--ah-line));
  background: var(--ah-err-soft);
  color: var(--ah-err);
}
.ah-tc-tag-plain {
  font-size: 11px;
  color: var(--ah-muted);
  white-space: nowrap;
}
.ah-tc-note {
  display: flex;
  align-items: flex-start;
  gap: var(--ah-s2);
  margin: 0;
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
  line-height: 1.45;
}
.ah-tc-note svg {
  flex: none;
  width: 14px;
  height: 14px;
  margin-top: 2px;
}
.ah-tc-note code {
  font: var(--ah-size-meta) / 1.4 var(--ah-mono);
  color: var(--ah-ink);
  overflow-wrap: anywhere;
}
.ah-tc-diff {
  display: grid;
  gap: var(--ah-s2);
  min-width: 0;
  padding: var(--ah-s2) var(--ah-s3) var(--ah-s3);
}
.ah-tc-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--ah-s2);
}


.ah-tc-list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.ah-tc-list > li + li {
  border-top: 1px solid var(--ah-line-soft);
}
.ah-tc-file {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--ah-s2);
  width: 100%;
  min-height: 36px;
  padding: 4px var(--ah-s3);
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}


.ah-tc-grid {
  display: grid;
  grid-template-columns: minmax(180px, 38%) minmax(0, 1fr);
  column-gap: var(--ah-s3);
  padding: var(--ah-s2) var(--ah-s3);
}
.ah-tc-axis,
.ah-tc-row {
  display: contents;
}
.ah-tc-track {
  position: relative;
  min-height: 30px;
}
.ah-tc-row > .ah-tc-track {
  border-top: 1px solid var(--ah-line-soft);
}
.ah-tc-row > .ah-tc-track::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  border-top: 1px dashed var(--ah-line);
}
.ah-tc-scale {
  min-height: 34px;
  margin-inline: 8px;
}
.ah-tc-stage {
  position: absolute;
  top: 2px;
  height: 16px;
  box-sizing: border-box;
  padding: 0 6px;
  overflow: hidden;
  border-left: 1px solid var(--ah-line-strong);
  color: var(--ah-ink-2);
  font-size: 11px;
  line-height: 16px;
  white-space: nowrap;
}
.ah-tc-tick {
  position: absolute;
  bottom: 0;
  color: var(--ah-muted);
  font: 11px / 14px var(--ah-mono);
}
.ah-tc-tick-end {
  transform: translateX(-100%);
}
.ah-tc-name {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ah-s2);
  min-width: 0;
  padding: 0 var(--ah-s1);
  border: 0;
  border-top: 1px solid var(--ah-line-soft);
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.ah-tc-name[aria-pressed="true"] {
  background: var(--ah-accent-soft);
}
.ah-tc-row > .ah-tc-track {
  margin-inline: 8px;
}
.ah-tc-interim {
  position: absolute;
  top: 0;
  bottom: 0;
  border-left: 1px solid var(--ah-line-strong);
}
.ah-tc-mark {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  padding: 0;
  border: 2px solid var(--ah-accent);
  border-radius: 50%;
  background: var(--ah-surface);
  cursor: pointer;
}

.ah-tc-mark[data-tool="bash"] {
  border-radius: 3px;
  border-color: var(--ah-ink-2);
}
.ah-tc-mark[data-change="deleted"] {
  border-color: var(--ah-err);
}
.ah-tc-mark[aria-pressed="true"] {
  background: var(--ah-accent);
  box-shadow: 0 0 0 3px var(--ah-accent-soft);
}
.ah-tc-mark[data-tool="bash"][aria-pressed="true"] {
  background: var(--ah-ink-2);
}
.ah-tc-mark:focus-visible {
  outline: var(--ah-focus-width) solid var(--ah-focus);
  outline-offset: 1px;
}
.ah-tc-detail {
  grid-column: 1 / -1;
  margin: 0 0 var(--ah-s2);
  border: 1px solid var(--ah-line);
  border-radius: var(--ah-r-md);
  background: var(--ah-bg);
}
.ah-tc-detail-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ah-s2);
  padding: var(--ah-s2) var(--ah-s3) 0;
}
.ah-tc-detail > :is(.ah-file-diff-box, .ah-output-box) {
  margin: var(--ah-s2) var(--ah-s3) var(--ah-s3);
}
.ah-tc-segment {
  display: inline-flex;
  min-width: 0;
  margin: 0;
  padding: 0;
  flex-wrap: wrap;
  overflow: hidden;
  border: 1px solid var(--ah-line);
  border-radius: var(--ah-r-md);
}
.ah-tc-segment button {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 3px 8px;
  border: 0;
  border-right: 1px solid var(--ah-line);
  background: var(--ah-surface);
  color: var(--ah-ink-2);
  font: var(--ah-size-meta) / 1.4 var(--ah-font);
  cursor: pointer;
}
.ah-tc-segment button:last-child {
  border-right: 0;
}
.ah-tc-segment button[aria-pressed="true"] {
  background: var(--ah-accent-soft);
  color: var(--ah-ink);
  font-weight: 600;
}
.ah-tc-segment button:focus-visible {
  outline: var(--ah-focus-width) solid var(--ah-focus);
  outline-offset: -2px;
}
.ah-tc-what {
  color: var(--ah-ink-2);
  font-size: var(--ah-size-meta);
}

@media (max-width: 800px) {
  
  .ah-tc-toggle {
    padding-inline: var(--ah-s2);
  }
  .ah-tc-timeline-button {
    padding: 0 var(--ah-s3);
  }
  .ah-tc-timeline-button span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .ah-tc-file {
    grid-template-columns: auto minmax(0, 1fr) auto;
    row-gap: 2px;
    padding-inline: var(--ah-s2);
  }
  .ah-tc-file .ah-tc-tags {
    grid-column: 2 / 3;
    grid-row: 2;
  }
  .ah-tc-file .ah-tc-counts {
    grid-column: 3;
    grid-row: 1;
  }
  .ah-tc-diff {
    padding-inline: var(--ah-s2);
  }
  .ah-tc-grid {
    grid-template-columns: minmax(0, 1fr);
    padding-inline: var(--ah-s2);
  }
  .ah-tc-axis > span:first-child {
    display: none;
  }
  .ah-tc-name {
    min-height: 28px;
  }
  .ah-tc-row > .ah-tc-track {
    border-top: 0;
  }
}

/* ---- web/src/components/Multiplayer.css ---- */


.ah-mp-avatar {
  --ah-mp-hue: var(--ah-glyph-1);
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--ah-mp-hue);
  background: var(--ah-surface);
  color: var(--ah-ink);
  font-size: 10px;
  font-weight: 600;
  overflow: hidden;
  position: relative;
}
.ah-mp-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.ah-mp-avatar[data-presence="invited"] {
  border-style: dashed;
  opacity: 0.8;
}
.ah-mp-avatar[data-presence="here"]::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ah-ok);
  border: 1.5px solid var(--ah-bg);
}

.ah-mp-message {
  --ah-mp-hue: var(--ah-glyph-1);
  border-left: 3px solid var(--ah-mp-hue);
  padding: 6px 0 6px 12px;
  margin: 8px 0;
}
.ah-mp-message header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 13px;
}
.ah-mp-message time {
  color: var(--ah-muted);
  font-size: 12px;
}
.ah-mp-text {
  margin: 6px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.ah-mp-role {
  font-size: 12px;
  padding: 0 6px;
  border-radius: 999px;
  border: 1px solid var(--ah-line-strong);
  color: var(--ah-muted);
}
.ah-mp-role[data-role="full_rights"] {
  border-color: var(--ah-turn-line);
  color: var(--ah-ink);
}

.ah-mp-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0;
  color: var(--ah-muted);

<style>/* The demo videos' stage around the product window. The window itself is the

   composer the front page does not draw, and the screen-space title and

   stay: scene.js pauses them and sets their time from t (syncAnimations). */

#world > .pg { position: absolute; inset: 0; padding: 0; background: transparent; overflow: visible; }

/* ---------- The product window ---------- */
.v-app { position: absolute; left: 0; top: 0; width: 1280px; height: 740px; display: flex; flex-direction: column;
  border: 1px solid var(--ah-line); border-radius: 14px; background: var(--ah-bg); box-shadow: var(--ah-shadow-app); overflow: hidden; }

#label { position: absolute; left: 56px; top: 44px; display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; border-radius: var(--ah-r-pill);
  background: color-mix(in srgb, var(--ah-surface) 92%, transparent); box-shadow: 0 0 0 1px var(--ah-line), 0 8px 24px rgba(16, 24, 40, .08);

  background: color-mix(in srgb, var(--ah-ink) 90%, transparent); color: var(--ah-bg); font: 500 32px/1.3 var(--ah-font); text-align: center; text-wrap: balance; opacity: 0; }

/* ---------- A tool row while it runs, as in the README's agent-at-work.png ----------
   The kit draws finished rows only; parts.mjs swaps in this status. */

.v-ring { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; }
.scr .ah-ordered-blocks > .ah-pi-tool-use:has([data-state="running"])::before { background: var(--ah-surface); border-color: var(--ah-line-strong); }

/* The view opening beside the conversation: scene.js sets the columns. */

.v-app .scr-view { overflow: hidden; min-width: 0; }
.v-frames { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; background: #1d2b42; }

  font: 600 var(--b-font)/1.2 var(--ah-font); white-space: nowrap; cursor: default; }

.v-btn:not(:has(.sb-bar-label)) { padding: 0; width: var(--b-h); }
.v-inline { --b-h: var(--ah-control-inline); --b-font: var(--ah-control-inline-font); --b-pad: var(--ah-control-inline-pad); --b-icon: var(--ah-control-inline-icon); --b-gap: var(--ah-control-inline-gap); }
.v-row { --b-h: var(--ah-control-row); --b-font: var(--ah-control-row-font); --b-pad: var(--ah-control-row-pad); --b-icon: var(--ah-control-row-icon); --b-gap: var(--ah-control-row-gap); }
.v-primary { --i-bg: var(--ah-accent); --i-fg: var(--ah-on-accent); }

<script>// The demo videos' shared runtime: time helpers, the camera, the rail that
// moves conversations between Your turn, Running and Quiet, items that grow
// into the feed, the cursor, and the screen-space title, label and captions.
// Everything here is a pure function of t (scenecast's contract), so any
// frame renders the same in any order.
(() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const lerp = (a, b, p) => a + (b - a) * p;
  // 0 → 1 → 0 over [a, b], fading for f seconds at each end.
  const win = (t, a, b, f) => clamp(Math.min((t - a) / f, (b - t) / f));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * prog(t, a, b)));
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  // ---------- World coordinates and the camera ----------
  const world = () => document.getElementById('world');
  function W(e) {
    const w = world(), r = e.getBoundingClientRect(), b = w.getBoundingClientRect(), k = b.width / w.offsetWidth;
    return { x: (r.left - b.left) / k, y: (r.top - b.top) / k, w: r.width / k, h: r.height / k };
  }
  const pad = (r, p, q = p) => ({ x: r.x - p, y: r.y - q, w: r.w + 2 * p, h: r.h + 2 * q });
  const union = (...rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
  // A shot keeps the caption band clear: the frame it fits into is shorter
  // than 1080 by `band` and sits at the top.
  // anchor 'left' keeps the rect's left edge at the frame's left edge when the
  // height decides the zoom, so a neighbour is not cut mid-word.
  function fit(r, band = 0, anchor = 'center') {
    const s = Math.min(1920 / r.w, (1080 - band) / r.h);
    const cx = anchor === 'left' ? r.x + 960 / s : anchor === 'right' ? r.x + r.w - 960 / s : r.x + r.w / 2;
    return { cx, cy: r.y + r.h / 2 + band / 2 / s, s };
  }
  // CAMERA: [start, duration, shot, drift]. A move eases position linearly and
  // zoom in log space; drift is a slow push reached by the next move.
  // moveEase: the move's easing (default the steep cubic the first scenes use).
  function camera(SHOTS, CAMERA, t, duration, moveEase = ease) {
    let i = 0; CAMERA.forEach((c, k) => { if (t >= c[0]) i = k; });
    const [start, dur, shot, drift = 0] = CAMERA[i];
    const to = SHOTS[shot]();
    if (i > 0 && t < start + dur) {
      const prev = CAMERA[i - 1], from = { ...SHOTS[prev[2]]() };
      from.s *= 1 + (prev[3] ?? 0);
      const p = moveEase((t - start) / dur);
      return { shot: `${prev[2]} → ${shot}`, from: prev[2], to: shot, p, cx: lerp(from.cx, to.cx, p), cy: lerp(from.cy, to.cy, p), s: Math.exp(lerp(Math.log(from.s), Math.log(to.s), p)) };
    }
    const next = CAMERA[i + 1]?.[0] ?? duration;
    return { shot, ...to, s: to.s * (1 + drift * ease((t - start - dur) / (next - start - dur))) };
  }
  function applyCamera(cam) {
    world().style.transform = `translate(${960 - cam.cx * cam.s}px, ${540 - cam.cy * cam.s}px) scale(${cam.s})`;
    window.__cam = cam;
  }

  // ---------- CSS animations driven by t ----------
  // The product's marks turn and knock with CSS keyframes (brand.css). Each is
  // paused and set to t, so a frame does not depend on the wall clock.
  function syncAnimations(t) {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
  }

  // ---------- Clock ----------
  // keys: [[t, 'hh:mm'], ...]; minutes interpolate between keys.
  const mins = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hhmm = (n) => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(Math.floor(n % 60)).padStart(2, '0')}`;
  function clock(t, keys) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [t1, c1] = keys[i], [t0, c0] = keys[i - 1];
      if (t < t1) return hhmm(lerp(mins(c0), mins(c1), ease((t - t0) / (t1 - t0))));
    }
    return keys[keys.length - 1][1];
  }

  // The video time at which the clock shows c (first match), for placing
  // alice-day's state changes on the video's timeline.
  function clockToT(keys, c) {
    const target = mins(c);
    if (target <= mins(keys[0][1])) return -1;
    for (let i = 1; i < keys.length; i++) {
      const [t1, c1] = keys[i], [t0] = keys[i - 1];
      if (target <= mins(c1)) {
        let a = t0, b = t1;
        for (let k = 0; k < 40; k++) { const m = (a + b) / 2; if (mins(clock(m, keys)) < target) a = m; else b = m; }
        return b;
      }
    }
    return Infinity;
  }

  // own: { id, segs } replaces one conversation's segs with the scene's own.
  function daySessions(sess, keys, own = {}) {
    return sess.map((s) => ({ id: s.id, title: s.title, segs: own[s.id] ?? s.segs.map(([c, st, line]) => [clockToT(keys, c), st, line, c]).filter((g) => g[0] !== Infinity) }))

  }

  // An item grows to its natural height and fades in over `dur` from `at`;
  // before that it takes no space. Returns its progress.
  // From `until` it shrinks away again over `out` seconds.
  function grow(el, t, at, dur = .45, until = Infinity, out = 0) {
    if (t < at || t >= until + out) { el.style.display = 'none'; return 0; }
    el.style.display = '';
    const p = t >= until ? 1 - ease((t - until) / out) : easeOut((t - at) / dur);
    if (p >= 1) { el.style.height = ''; el.style.opacity = ''; el.style.transform = ''; el.classList.remove('v-grow'); return 1; }
    el.classList.add('v-grow');
    el.style.height = '';
    const h = el.scrollHeight;
    el.style.height = `${h * p}px`;
    el.style.opacity = clamp(p * 1.4);
    el.style.transform = `translateY(${(1 - p) * 10}px)`;
    return p;
  }
  // The feed follows its end, as the product does when the reader is there.
  function follow(view, feed) {
    feed.style.transform = '';
    const over = feed.offsetHeight - view.clientHeight;
    feed.style.transform = over > 0 ? `translateY(${-over}px)` : '';
    return Math.max(0, over);
  }

  // ---------- The rail ----------
  // sessions: [{ id, title, segs: [[t, state, line, clock]] }]; state is
  // turn | run | quiet. A conversation shows from its first seg. When a seg
  // starts, rows travel to their new places over `move` seconds.
  const LABEL = { turn: 'Your turn', run: 'Running', quiet: 'Quiet' };
  const MARK_STATE = { run: 'working', turn: 'waiting', quiet: 'idle' };
  // timeHtml(id, t): markup that takes the time's place on a row (the
  // browser mark), or null for the time.
  function Rail(el, { sessions, active, marks, move = .7, gap = 14, timeHtml = null }) {

  V.grow(youEl, t, T.you);
  V.grow(strip1, t, T.strip1[0], .3, T.strip1[1], .3);
  V.grow(turn1, t, T.card0, .01);
  V.grow(t1stage1, t, T.interim, .3);
  V.grow(t1reply1, t, T.reply1i);
  V.grow(card1, t, T.card0, .35);
  swap('card1', card1, t < T.ask ? 'working0' : t < T.take ? 'ask' : t < T.giveBack ? 'control' : t < T.stage1 ? 'working1' : 'done1', (k) => P.cards[k]);
  V.grow(gave, t, T.giveBack + .1, .35);
  V.grow(strip2, t, T.strip2[0], .3, T.strip2[1], .3);
  V.grow(t1stage2, t, T.stage1, .3);
  V.grow(t1reply2, t, T.reply1, .5);
  V.grow(you2, t, T.you2);
  V.grow(strip3, t, T.strip3[0], .3, T.strip3[1], .3);
  V.grow(turn2, t, T.card2, .01);
  V.grow(card2, t, T.card2, .35);
  swap('card2', card2, 'working2', (k) => P.cards[k]);
  V.grow(t2stage, t, T.stage2, .3);
  V.grow(t2reply, t, T.reply2);
  V.grow(strip4, t, T.strip4, .35);
  // Presses on the cards.
  const tb = $('.v-take', card1); if (tb) tb.classList.toggle('v-press', pressed(t, T.take));
  const gb = $('.v-giveback', card1); if (gb) gb.classList.toggle('v-press', pressed(t, T.giveBack));
  V.follow(convo, feed);

  // ----- The rail -----
  const ps = t < T.card0 ? 'idle' : t < T.ask ? 'agent' : t < T.take ? 'ask' : t < T.giveBack ? 'person' : t < T.stage1 ? 'agent' : t < T.send2 ? 'idle' : 'agent';
  place.dataset.state = ps;
  placeState.textContent = { agent: 'agent', ask: 'waiting for you', person: 'you control', idle: '1 window' }[ps];
  place.classList.toggle('v-press', pressed(t, T.openRail));
  rail.at(t);

  // ----- The sheet: open while Alice controls it, and while she watches -----
  // Opening and closing are cuts, not animations.
  const open = (t >= T.take && t < T.close1) || (t >= T.openRail && t < T.close2);
  // Hidden, not removed: the camera can measure it while it is closed.
  sheet.style.visibility = scrim.style.visibility = open ? '' : 'hidden';
  sheet.style.opacity = scrim.style.opacity = 1;
  sheet.style.transform = '';
  const mine = t < T.giveBack;
  frame.dataset.control = mine ? 'person' : 'agent';
  // While he checks the form the agent's turn has ended: Agent in control.
  swap('bar', turnBar, mine ? 'you' : 'agent', (k) => k === 'you' ? `${P.icons.user}<strong>You are in control</strong>${P.turnButtons.done}` : `${P.icons.agent}<strong>Agent in control</strong>${P.turnButtons.take}`);
  says.style.display = mine ? '' : 'none';
  xBtn.classList.toggle('v-press', pressed(t, T.close1) || pressed(t, T.close2));
  // The portal's pages, all laid out so each can be measured.
  const pg = t < T.codePage ? 'login' : t < T.invoices ? 'code' : t < T.readingPage ? 'invoices' : 'reading';
  for (const n of ['login', 'code', 'invoices', 'reading']) page(n).style.visibility = n === pg && open ? 'visible' : 'hidden';
  wtitle.textContent = { login: 'Sign in · Northline Energy', code: 'Verify · Northline Energy', invoices: 'Invoices · Northline Energy', reading: 'Meter reading · Northline Energy' }[pg];
  field('email').innerHTML = (t < T.email[0] ? '' : V.typed(P.email, t, ...T.email)) + (t >= T.emailFocus && t < T.pwFocus ? '<span class="caret"></span>' : '');
  field('email').classList.toggle('on', t >= T.emailFocus && t < T.pwFocus);
  // ⌘V in the password field: the dots arrive as keystrokes, one by one.
  const n = Math.round(14 * V.prog(t, T.paste, T.paste + .35));
  field('password').innerHTML = '•'.repeat(n) + (t >= T.pwFocus && t < T.signin && Math.floor(t * 2.5) % 2 === 0 ? '<span class="caret"></span>' : '');
  field('password').classList.toggle('on', t >= T.pwFocus && t < T.signin);
  button('signin').classList.toggle('press', pressed(t, T.signin + .05));
  const c = Math.round(6 * V.prog(t, ...T.code));
  codeBoxes.forEach((b, i) => { b.textContent = i < c ? '•' : ''; b.classList.toggle('on', t >= T.code[0] - .2 && t < T.verify && i === Math.min(c, 5)); });
  button('verify').classList.toggle('press', pressed(t, T.verify + .05));
  pdfs.forEach((p) => { p.classList.remove('got'); p.textContent = 'PDF ↓'; });
  const rd = field('reading');
  rd.textContent = '48213';
  rd.classList.remove('on');
  button('submit').classList.add('ready');
  $('.ne-done', sheet).style.display = 'none';

  V.applyCamera(V.camera(SHOTS, CAMERA, t, DURATION, SOFT));

  // ⌘V keycaps beside the password field.
  const pw = V.W(field('password'));
  keys.style.opacity = V.win(t, ...T.keys, .25);
  keys.style.transform = `translate(${pw.x + pw.w + 14}px, ${pw.y - 4}px)`;
  $$('kbd', keys).forEach((k) => k.classList.toggle('down', t >= T.paste - .15 && t < T.paste + .25));

  // Your pointer: constant size whatever the zoom (scene.js scales it by
  // 1/zoom), eased between points, a ring where it clicks.
  const at = (el, fx = .5, fy = .5) => { const e = () => (typeof el === 'function' ? el() : el) || app; return [() => V.W(e()).x + V.W(e()).w * fx, () => V.W(e()).y + V.W(e()).h * fy]; };
  const send = $('.v-send'), takeB = () => $('.v-take', card1), gbB = () => $('.v-giveback', card1);
  V.cursor(t, [
    [2.2, ...at(send, -6, .4)], [T.send - .25, ...at(send)], [T.send, ...at(send), true],
    [4.6, ...at(send, -8, -3)],
    [T.take - 1.1, ...at(takeB, .2, 3)], [T.take - .2, ...at(takeB, .45, .55)], [T.take, ...at(takeB, .45, .55), true],
    [T.emailFocus - .3, ...at(field('email'), .35, .55)], [T.emailFocus, ...at(field('email'), .35, .55), true],
    [T.pwFocus - .3, ...at(field('password'), .35, .55)], [T.pwFocus, ...at(field('password'), .35, .55), true],
    [T.signin - .5, ...at(button('signin'), .55, .55)], [T.signin, ...at(button('signin'), .55, .55), true],
    [T.verify - .4, ...at(button('verify'), .55, .55)], [T.verify, ...at(button('verify'), .55, .55), true],
    [T.close1 - .6, ...at(xBtn)], [T.close1, ...at(xBtn), true],
    [T.giveBack - 1.2, ...at(gbB, -1.5, 2)], [T.giveBack - .25, ...at(gbB)], [T.giveBack, ...at(gbB), true],
    [T.giveBack + 1, ...at(gbB, -2, 4)],
    [T.openRail - 1.2, ...at(place, 1.4, 2.5)], [T.openRail - .25, ...at(place, .45, .55)], [T.openRail, ...at(place, .45, .55), true],
    [T.openRail + 1.0, ...at(field('reading'), .6, .6)], [T.close2 - 1.0, ...at(button('submit'), .5, 1.6)],
    [T.close2 - .3, ...at(xBtn)], [T.close2, ...at(xBtn), true],
    [T.send2 - .9, ...at(send, -4, .4)], [T.send2 - .25, ...at(send)], [T.send2, ...at(send), true],
    [T.send2 + .7, ...at(send, -5, -2)],
  ], [[2.2, T.giveBack + 1.2], [T.openRail - 1.4, T.send2 + .8]]);

  // The caption band.
  const cp = CAPTIONS.find(([a, b]) => t >= a && t < b);
  if (cp && caption.dataset.k !== String(cp[0])) { caption.innerHTML = cp[2]; caption.dataset.k = String(cp[0]); }
  caption.style.opacity = cp ? V.win(t, cp[0], cp[1], .25) : 0;
  V.syncAnimations(t);
}

// ---------- Contract with scenecast and the page driver ----------
window.DURATION = DURATION;
window.SEGMENTS = SEGMENTS;
window.FPS = 60;
window.seek = seek;
window.inspect = () => [`Camera: shot "${window.__cam.shot}" at zoom ${window.__cam.s.toFixed(2)}`];
window.ready = document.fonts.ready.then(() => Promise.all([...document.fonts].map((f) => f.load()))).then(() => seek(0));
</script>
<style>html, body { width: 100%; height: 100%; } #stage { transform-origin: 0 0; }</style><script>
// The 1920x1080 stage scales to whatever box the file is shown in, so a page
// can size its iframe freely (16:9).
const fitStage = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById('stage').style.transform = 'scale(' + k + ')'; };
addEventListener('resize', fitStage); fitStage();
// It plays by itself in a loop wherever it is shown, also inside an iframe
// such as Habitat's view card, until a host takes it over: ?host=1 in the
// address, a postMessage {scenecast: 'host'}, or the host calling seek(t)
// itself. Under reduced motion it holds the poster frame and stays still.
//
// A host without same-origin access (sandbox="allow-scripts") controls the
// loop with postMessage:
//   {scenecast: 'pause'}  holds the current frame
//   {scenecast: 'play'}   continues from that frame (also after reduced
//                         motion's poster: the person asked for it)
//   {scenecast: 'state'}  asks for the state
// After each of these the scene answers the sender with
//   {scenecast: 'state', playing: <boolean>, t: <seconds>, duration: <seconds>}
// A hosted scene (taken over as above) ignores pause and play and answers
// playing: false.
(() => {
  const draw = window.seek;
  let hosted = new URLSearchParams(location.search).get('host') === '1';
  // The scene's own first draw (seek(0) in ready) goes through the global
  // binding too, so only calls after ready count as a host's.
  let armed = false;
  window.seek = (t) => { if (armed) hosted = true; draw(t); };
  let playing = false, t = 0, from = 0, frame = 0;
  const tick = (now) => {
    if (!playing || hosted) { playing = false; return; }
    t = ((now - from) / 1000) % DURATION;
    draw(t);
    frame = requestAnimationFrame(tick);
  };
  const play = () => { if (playing || hosted) return; playing = true; from = performance.now() - t * 1000; frame = requestAnimationFrame(tick); };
  const pause = () => { playing = false; cancelAnimationFrame(frame); };
  const tell = (to) => to && to.postMessage({ scenecast: 'state', playing: playing && !hosted, t: Math.round(t * 1000) / 1000, duration: DURATION }, '*');
  const queue = [];
  addEventListener('message', (e) => {
    const m = e.data && e.data.scenecast;
    if (m === 'host') { hosted = true; pause(); return; }
    if (m !== 'pause' && m !== 'play' && m !== 'state') return;
    if (!armed) { queue.push([m, e.source]); return; }
    if (m === 'pause') pause();
    if (m === 'play') play();
    tell(e.source);
  });
  window.ready.then(() => {
    armed = true;
    if (!hosted) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { t = 12.6; draw(t); }
      else play();
    }
    // Messages that came before the scene was ready, in order.
    for (const [m, src] of queue) { if (m === 'pause') pause(); if (m === 'play') play(); tell(src); }
  });
})();
</script>
