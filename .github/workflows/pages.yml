name: Website

# Publishes the website (website/, Astro + Starlight) to GitHub Pages at
# https://open-habitat.ai. The CNAME file in website/public/ sets the custom
# domain.
#
# Only an explicit dispatch publishes, never a push: main is shared, and a
# change there is not live until someone publishes that exact commit. The
# maintainer's publish script lives outside this repository.
run-name: Publish ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha on main to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build website
    if: github.repository == 'Open-Habitat/open-habitat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: check the commit sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit sha, got '$SHA'"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: require the commit to be on main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not reachable from origin/main"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - name: record the published commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          {
            echo "## Website build"
            echo
            echo "Commit: [\`$SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)"
            git log -1 --format='Subject: %s' "$SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
