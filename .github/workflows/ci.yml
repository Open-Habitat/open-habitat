name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  green-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.1', cache: false }
      - uses: actions/setup-node@v6
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Run clean-checkout parity gate
        run: ./scripts/ci-local.sh --clean --json
