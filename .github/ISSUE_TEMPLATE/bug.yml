name: Bug report
description: Something in Open Habitat does not work as it should.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste logs, screenshots, hostnames, account names or conversations from a real installation. Describe the problem with made-up accounts and paths.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest steps that show the problem on a fresh installation.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Habitat version
      description: The release, for example 0.1.3. An operator sees it with `open-habitat version --json`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it shows
      options:
        - In the browser, on a desktop
        - In the browser, on a phone
        - Installing or upgrading a server
        - Operating a running server
        - Somewhere else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Only for a problem in the browser.
