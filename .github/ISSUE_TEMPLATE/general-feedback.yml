name: Feedback about Habitat
description: General feedback about Open Habitat, not tied to an explanation card.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste conversations, workspace names, hostnames or account names.
  - type: textarea
    id: fix
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Habitat version
  - type: input
    id: language
    attributes:
      label: Interface language
