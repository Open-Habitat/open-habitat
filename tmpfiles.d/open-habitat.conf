d /var/lib/open-habitat-gateway 0700 open-habitat-gateway open-habitat-gateway -
d /run/open-habitat 0750 root open-habitat-gateway -
d /run/open-habitat/users 0710 root open-habitat-gateway -
# Agents' persistent /var/tmp (open-habitat-daemon@.service), aged like /var/tmp.
e /var/lib/open-habitat-tmp/* - - - 30d
