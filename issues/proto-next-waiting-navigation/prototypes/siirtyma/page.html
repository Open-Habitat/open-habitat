<style>

* { box-sizing: border-box; }

/* ===== Sovelluskehys (tuotannon mitat käsin, ei tuotantokomponentteja) ===== */
.shell { flex: 1; min-height: 0; display: flex; position: relative; }

.rail h2 .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--ah-r-pill); background: var(--ah-accent); color: var(--ah-on-accent); font-size: 10.5px; line-height: 18px; text-align: center; letter-spacing: 0; }
.rail h2 .c { color: var(--ah-muted); letter-spacing: 0; }

.rrow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px; border: 0; border-radius: var(--ah-r-nav); background: transparent; color: var(--ah-ink-2); text-align: left; cursor: pointer; }
.rrow:hover { background: var(--ah-hover); color: var(--ah-ink); }
.rrow[aria-current] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); }
.rrow.pane-open { box-shadow: inset 2px 0 0 var(--ah-accent); }
.rrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .age { flex: none; color: var(--ah-muted); font-size: var(--ah-size-meta); }
.ws-row { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; color: var(--ah-ink-2); font: 400 12.5px var(--ah-mono); }
.ws-row svg { width: 15px; height: 15px; }
.rail-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 6px 2px; border-top: 1px solid var(--ah-line); color: var(--ah-ink-2); }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ah-accent-soft); color: var(--ah-accent-ink); font: 600 11px var(--ah-font); }

/* Pallo: sama kieli kuin sivupalkissa (sinun vuorosi, työskentelee, valmis). */
.ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-muted); }
.ball.you { background: var(--ah-turn); }
.ball.done { background: var(--ah-ok); }
.ball.work { width: 10px; height: 10px; background: transparent; border: 2px solid var(--ah-accent-line); border-top-color: var(--ah-accent); animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ball.work { animation: none; } }

.main { flex: 1; min-width: 0; display: flex; position: relative; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px 6px var(--ah-topbar-pad-inline); background: var(--ah-surface); border-bottom: 1px solid var(--ah-line); }
.tb-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }

.icon-btn:hover { background: var(--ah-control-hover); color: var(--ah-ink); }
.icon-btn svg { width: 17px; height: 17px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.menu-btn { display: none; }
.menu-btn .badge { position: absolute; top: 2px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: var(--ah-r-pill); background: var(--ah-turn); color: #fff; font: 600 10px/15px var(--ah-font); }
:focus-visible { outline: 2px solid var(--ah-focus); outline-offset: 1px; }

.content { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: var(--ah-column-pad-block) var(--ah-column-pad-inline) 12px; }
.content > * { width: min(100%, var(--ah-conversation-width)); }
.thread { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
.msg { padding: 10px 14px 12px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); }
.msg .who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font: 600 11.5px var(--ah-font); letter-spacing: .05em; text-transform: uppercase; color: var(--ah-ink-2); }
.msg.you { align-self: flex-end; max-width: 78%; }
.msg.agent .who { text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.msg.agent .who svg { width: 14px; height: 14px; color: var(--ah-ok); }
.msg p { margin: 0; }
.msg code { font: 400 var(--ah-size-code) var(--ah-mono); }
.msg .tag { margin-left: 4px; padding: 0 6px; border-radius: var(--ah-r-pill); background: var(--ah-control); font: 500 10.5px/16px var(--ah-font); letter-spacing: 0; text-transform: none; color: var(--ah-muted); }

.opt:hover { background: var(--ah-surface-hover); border-color: var(--ah-ink-2); }

.cbox:focus-within { border-color: var(--ah-composer-focus); }
.cbox textarea { display: block; width: 100%; height: 48px; resize: none; padding: 12px 14px 4px; border: 0; background: transparent; font: inherit; color: var(--ah-ink); outline: none; }
.crow { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 12px; color: var(--ah-muted); font-size: 12.5px; }
.crow .hint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.send { min-height: 32px; padding: 0 14px; border: 0; border-radius: var(--ah-r-md); background: var(--ah-accent); color: var(--ah-on-accent); font: 600 12.5px var(--ah-font); cursor: pointer; }
.send:hover { background: var(--ah-accent-hover); }

/* ===== Telakka kentän yllä: tarjous, paluu, jono ===== */
.dock { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 var(--ah-column-pad-inline) 6px; }
.dock > * { width: min(100%, var(--ah-conversation-width)); }
.dock .enter { animation: dock-in 180ms ease-out; }
@keyframes dock-in { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .dock .enter { animation: none; } }
.note { margin: 0; color: var(--ah-muted); font-size: 12px; font-style: italic; text-align: center; }
.nx { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 6px 4px 12px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); color: var(--ah-ink); font-size: 13px; text-align: left; cursor: pointer; }
.nx:hover { border-color: var(--ah-accent); }
.nx .lbl { flex: none; color: var(--ah-accent-ink); font-size: 12px; font-weight: 600; }
.nx .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

.nx .go { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--ah-r-md); background: var(--ah-accent); color: var(--ah-on-accent); font-size: 12.5px; font-weight: 600; }
.nx kbd { font: 600 11px var(--ah-mono); }
/* Paluu: rivi Alt+↑:lle kentän ylle, tarjous Alt+↓:lle sen alle. */
.nx.back { border-color: var(--ah-line); background: var(--ah-surface); }
.nx.back:hover { border-color: var(--ah-line-strong); }
.nx.back .lbl { color: var(--ah-ink-2); display: inline-flex; align-items: center; gap: 4px; }

.nx.back.ready .lbl { color: var(--ah-turn); }

.nx.quiet { justify-content: center; border-style: dashed; background: transparent; color: var(--ah-muted); cursor: default; }

/* Jono: koko kierros näkyvissä kentän yllä */
.q { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); font-size: 12.5px; }
.q .qh { flex: none; padding: 0 6px 0 6px; color: var(--ah-accent-ink); font-weight: 600; font-size: 12px; white-space: nowrap; }
.q ol { flex: 1; min-width: 0; display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; overflow: hidden; }
.q li { min-width: 0; flex: 0 1 auto; display: flex; }
.q li.on { flex: 0 0 auto; max-width: 46%; }
.qs { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--ah-r-sm); background: transparent; color: var(--ah-ink-2); cursor: pointer; white-space: nowrap; }
.qs:hover { background: var(--ah-control-hover); color: var(--ah-ink); }
.qs .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.qs:not([aria-current]) .st { display: none; }
.qs .st { flex: none; color: var(--ah-muted); font-size: 11.5px; }
.qs[aria-current] { background: var(--ah-surface); color: var(--ah-ink); font-weight: 600; box-shadow: 0 0 0 1px var(--ah-accent-line); }
.qs.handled .tt { color: var(--ah-muted); }
.qs.gone .tt { text-decoration: line-through; color: var(--ah-muted); }
.qs .chk { width: 13px; height: 13px; color: var(--ah-ok); flex: none; }
.qn { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--ah-r-sm); background: var(--ah-accent); color: var(--ah-on-accent); font: 600 12px var(--ah-font); cursor: pointer; white-space: nowrap; }
.qn.prev { background: var(--ah-surface); color: var(--ah-ink-2); box-shadow: 0 0 0 1px var(--ah-line) inset; }
.qn kbd { font: 600 11px var(--ah-mono); }
.qn[disabled] { opacity: .45; cursor: default; }
.qx { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--ah-r-sm); background: transparent; color: var(--ah-muted); cursor: pointer; }
.qx:hover { background: var(--ah-control-hover); color: var(--ah-ink); }
.qx svg { width: 14px; height: 14px; }

/* Rinnakkain: odottava avautuu nykyisen viereen */
.pane { flex: 0 0 46%; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--ah-line-strong); background: var(--ah-bg); box-shadow: -8px 0 24px rgba(16,24,40,.06); }
.pane.enter { animation: pane-in 200ms ease-out; }

.toast { position: absolute; left: 50%; bottom: 120px; z-index: 9; transform: translate(-50%, 8px); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: var(--ah-r-md); background: var(--ah-ink); color: var(--ah-bg); font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 180ms ease-out, transform 180ms ease-out; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

/* ===== Puhelin ===== */
@container (max-width: 800px) {
  .rail { position: absolute; inset: 0 auto 0 0; z-index: 8; width: min(86%, 320px); transform: translateX(-102%); transition: transform 200ms ease-out; box-shadow: 0 0 32px rgba(16,24,40,.18); }

  .nx { min-height: 40px; }
  .nx .lbl:not(.keep), .nx .det, .nx kbd { display: none; }

  .q { flex-wrap: wrap; }
  .q ol { display: none; }
  .q .dots { display: flex; flex: 1; min-width: 0; align-items: center; gap: 6px; padding: 0 4px; }
  .q .dots .cur { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .q .dots .pips { flex: none; display: flex; gap: 3px; }
  .q .dots .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--ah-accent-line); }
  .q .dots .pip.on { background: var(--ah-accent); }
  .q .dots .pip.ok { background: var(--ah-ok); }
  .qn kbd { display: none; }
  .qn { min-height: 34px; min-width: 40px; justify-content: center; }
  .q .qh { display: none; }
  /* Rinnakkain puhelimessa: alalehti nykyisen päällä, nykyinen näkyy ylärivinä. */
  .pane { position: absolute; inset: 52px 0 0 0; z-index: 6; border-left: 0; border-top: 1px solid var(--ah-line-strong); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 32px rgba(16,24,40,.22); overflow: hidden; }
  .pane.enter { animation-name: sheet-in; }

}

<style>
/* ===== Valitsin (PICKER.md, sanatarkasti) ===== */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="page-bar">
  <h1>Seuraava odottava: siirtyminen ja paluu</h1>
  <span class="events">Tapahtuu:
    <button type="button" data-ev="origin">Kirjautuminen valmistuu</button>
    <button type="button" data-ev="elsewhere">Varmuuskopio vastataan toisella laitteella</button>
    <button type="button" data-ev="arrive">Uusi vastaus saapuu</button>
  </span>
  <label>Ikkuna <select id="c-w"><option value="fit">Oma</option><option value="1280">1280</option><option value="390">Puhelin</option></select></label>
  <label>Teema <select id="c-t"><option value="light">Vaalea</option><option value="dark">Tumma</option></select></label>
</div>
<div class="frame-wrap" id="wrap"><div class="frame" id="frame"></div></div>

<!-- Telakka on kentän yllä alareunan keskellä, joten valitsin on ylhäällä (PICKER.md:n ainoa sallittu muutos). -->
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Paluu</button>
  <button class="proto-picker-item">Jono</button>
  <button class="proto-picker-item">Rinnakkain</button>
  <button class="proto-picker-item">Nykyinen</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
// ----- Synteettinen data: neljä keskustelua, joista yksi on se, jossa olet -----
const ICON = {
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10M9 21v-7h6v7"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',
  back: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  expand: '<path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/>',
  up: '<path d="m6 15 6-6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
};
const svg = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*([^*]+)\*/g, '<em>$1</em>');

const WS = { oh: 'open-habitat', hb: 'fleetrepo', ks: 'kotisivu' };
const HOME_WS = 'oh';
const MIN = 60000;
// Sivupalkin (luettelon) järjestys; tarjous seuraa sitä kuten tuotannossa.
const ORDER = ['a', 'b', 'c', 'd', 'e'];
function story(now) {
  return {
    a: { title: 'Kirjautumisen virheilmoitukset', ws: 'oh', run: 'working', since: now - 14000, unread: false, question: null, changedAt: now - 14000,
      hist: [{ who: 'you', text: 'Kirjautumissivun virheilmoitukset ovat englanniksi. Suomenna ne ja tee niistä samanlaiset kuin asetuksissa.' }],
      done: 'Suomensin seitsemän virheilmoitusta (`internal/gateway/login.go`) ja tein niistä saman ilmoitusmuodon kuin asetuksissa. Testit menevät läpi. Katso vielä sanamuoto *Istunto vanheni, kirjaudu uudelleen*.',
      dur: 45000 },
    b: { title: 'Varmuuskopion ajastus', ws: 'hb', run: 'idle', unread: false, changedAt: now - 4 * MIN,
      hist: [{ who: 'you', text: 'Siirrä Nextcloudin varmuuskopio yöajoon.' }],
      question: { text: 'Ajetaanko yöllinen varmuuskopio klo 3.00 vai 4.30? Nextcloudin oma ylläpito alkaa 3.15, joten 3.00 voi venyä sen päälle.', opts: ['Klo 3.00', 'Klo 4.30'] },
      done: 'Ajastin kopion (`backup.timer`). Ensimmäinen ajo on ensi yönä, ja tulos tulee Telegramiin.', dur: 16000 },
    c: { title: 'Tiedostopuun lajittelu', ws: 'oh', run: 'idle', unread: true, question: null, changedAt: now - 12 * MIN,
      hist: [{ who: 'you', text: 'Lajittele tiedostopuu: kansiot ensin, sitten tiedostot aakkosjärjestyksessä.' },
        { who: 'agent', text: 'Tiedostopuu lajittelee nyt kansiot ensin ja tiedostot suomen aakkosjärjestykseen (å, ä ja ö lopussa). 42 testiä menee läpi. Teenkö saman työtilojen listalle?' }],
      done: 'Työtilojen lista lajittuu nyt samalla tavalla. Testit läpi.', dur: 14000 },
    d: { title: 'Laskun PDF-pohja', ws: 'ks', run: 'idle', unread: true, question: null, changedAt: now - 25 * MIN,
      hist: [{ who: 'you', text: 'Tee laskulle PDF-pohja: logo, y-tunnus ja eräpäivä isolla.' },
        { who: 'agent', text: 'Pohja on valmis: `templates/invoice.html`, esikatselu `invoice-preview.pdf`. Eräpäivä on 18 pt lihavoituna oikeassa yläkulmassa.' }],
      done: 'Lisäsin viivakoodin pohjan alareunaan.', dur: 14000 },
    e: { title: 'Julkaisumuistiinpanot', ws: 'oh', run: 'working', since: now - 3 * MIN, unread: false, question: null, changedAt: now - 3 * MIN,
      hist: [{ who: 'you', text: 'Kokoa julkaisumuistiinpanot viime viikon commiteista.' }],
      done: 'Muistiinpanot ovat tiedostossa `docs/release-notes.md`: 14 muutosta kolmessa ryhmässä.', dur: 0 },
  };
}

const qs = new URLSearchParams(location.search);
const AUTO = qs.get('auto') !== '0';
const S = { w: qs.get('w') || 'fit', t: qs.get('t') || 'light', bare: qs.get('bare') === '1', shot: qs.get('shot') === '1' };
let VAR = 0;           // 0 Paluu, 1 Jono, 2 Rinnakkain, 3 Nykyinen
let C, cur, drafts, visit, walk, origin, queue, pane, paneSeen, note, drawer, timers = [], seenDock = new Set(), noteTimer;

function reset() {
  timers.forEach(clearTimeout); timers = [];
  const now = Date.now();
  C = story(now);
  cur = 'a'; drafts = {}; drawer = false; note = '';
  // Tuotannon kävely (nextWaiting.ts): tässä välilehdessä avatut keskustelut järjestyksessä.
  walk = ['a'];
  origin = null;     // Paluu: keskustelu, josta kävely lähti
  queue = null;      // Jono: { steps, pos }
  pane = null;       // Rinnakkain: viereen avattu keskustelu
  paneSeen = new Set();
  // Käynti: tuotannon salpa — rivi näkyy, kun host vahvistaa agentin työn tällä käynnillä.
  visit = { engaged: C.a.run === 'working', viaWalk: false };
  seenDock = new Set();
  if (AUTO) schedule('a', C.a.dur - (now - C.a.since));
}
function schedule(id, ms) { timers.push(setTimeout(() => finish(id), Math.max(800, ms))); }

// ----- Tosiasiat, jotka tuotannossa tulevat sivupalkin mallista -----
const waits = (id) => !!C[id].question || (C[id].unread && C[id].run === 'idle');
const yours = () => ORDER.filter(waits);
// Puhelimessa alalehti peittää nykyisen: sen valmistuminen näkyy vain ylärivillä, ei luettuna.
const narrow = () => frame.clientWidth <= 800;
const onScreen = (id) => (id === cur && !(pane && narrow())) || id === pane;
function why(id) { return C[id].question ? 'kysyy' : 'uusi vastaus'; }
function age(id) {
  const m = Math.floor((Date.now() - C[id].changedAt) / MIN);
  return m < 1 ? 'nyt' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} t`;
}
const clock = (since) => { const s = Math.max(0, Math.floor((Date.now() - since) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function ballOf(id) { const c = C[id]; return waits(id) ? 'you' : c.run === 'working' ? 'work' : 'done'; }
function stateWords(id) {
  const c = C[id];
  if (c.question) return 'kysyy sinulta';
  if (c.run === 'working') return 'työskentelee';
  return c.unread ? 'valmis, uusi vastaus' : 'valmis';
}
function detail(id) {
  return [C[id].ws !== C[cur].ws ? WS[C[id].ws] : '', why(id), age(id)].filter(Boolean).join(' · ');
}

// ----- Tapahtumat -----
function send(id, text) {
  const c = C[id];
  if (!text.trim()) return;
  c.hist.push({ who: 'you', text });
  c.question = null; c.run = 'working'; c.since = Date.now(); c.changedAt = Date.now(); c.unread = false;
  drafts[id] = '';
  if (id === cur) visit.engaged = true;
  if (AUTO) schedule(id, c.dur);
  render();
}
function finish(id) {
  const c = C[id];
  if (c.run !== 'working') return;
  c.run = 'idle'; c.hist.push({ who: 'agent', text: c.done }); c.changedAt = Date.now();
  c.unread = !onScreen(id);
  render();
}
function elsewhere() {
  const c = C.b;
  if (!c.question) return;
  const offered = offerFor(cur)?.next;
  c.hist.push({ who: 'you', text: 'Klo 4.30', tag: 'toisella laitteella' });
  c.question = null; c.run = 'working'; c.since = Date.now(); c.changedAt = Date.now(); c.gone = true;
  if (AUTO) schedule('b', c.dur);
  if (offered === 'b' || pane === 'b' || queue) say(`${c.title} hoidettiin toisaalla.`);
  render();
}
function say(text) {
  note = text; clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { note = ''; render(); }, 5000);
}

// Siirtyminen. Jokainen reitti keskusteluun on käynti, kuten tuotannossa.
function go(id, how = 'rail') {
  if (!id) return;
  drawer = false;
  if (id !== cur) {
    cur = id;
    if (walk.at(-1) !== id) walk.push(id);
    visit = { engaged: C[id].run === 'working', viaWalk: how === 'walk' };
    if (C[id].run === 'idle') C[id].unread = false;
    if (pane === id) pane = null;
  }
  render();
  focusComposer();
}
function focusComposer(id = cur) { requestAnimationFrame(() => frame.querySelector(`textarea[data-conv="${id}"]`)?.focus({ preventScroll: true })); }

// Tarjous: tuotannon WaitingWalk.offer — ensimmäinen Sinun vuorosi, jota ei ole avattu tällä kävelyllä.
function offerFor(from, visited = walk) {
  const others = yours().filter((id) => id !== from && id !== origin);
  const fresh = others.find((id) => !visited.includes(id));
  return others.length ? { next: fresh ?? others[0], restart: !fresh, more: others.length - 1 } : null;
}
function forward() {
  const o = offerFor(cur);
  if (!o) return false;
  if (VAR === 0 && !origin) origin = cur;
  if (o.restart) walk = walk.at(-1) === cur ? [cur] : [];
  go(o.next, 'walk');
  return true;
}
// Nykyinen: Alt+↑ kelaa kävelyn edelliseen; mikään ei kerro, minne.
function stepBack() {
  for (let i = walk.length - 1; i >= 0; i--) {
    if (walk[i] === cur) continue;
    const id = walk[i]; walk = walk.slice(0, i); go(id, 'walk'); return true;
  }
  return false;
}
// Paluu: Alt+↑ vie aina lähtöön, ja kävely päättyy siihen.
function returnHome() {
  if (!origin || origin === cur) return false;
  const id = origin; origin = null; walk = [];
  go(id, 'walk');
  return true;
}
// Jono
function startQueue() {
  const steps = [cur, ...yours().filter((id) => id !== cur)];
  if (steps.length < 2) return false;
  queue = { steps, pos: 0 };
  qGo(1);
  return true;
}
function qSync() {
  if (!queue) return;
  for (const id of yours()) if (!queue.steps.includes(id)) queue.steps.push(id);
}
function qGo(i) {
  if (!queue) return;
  if (i >= queue.steps.length) { const home = queue.steps[0]; const n = queue.steps.slice(1).filter((id) => !waits(id)).length; queue = null; say(`Kierros käyty: ${n} hoidettu.`); go(home, 'walk'); return; }
  if (i < 0) return;
  queue.pos = i; go(queue.steps[i], 'walk');
}
function qMove(d) {
  if (!queue) return false;
  let i = queue.pos + d;
  while (i > 0 && i < queue.steps.length && C[queue.steps[i]].gone && !waits(queue.steps[i])) i += d;
  qGo(i);
  return true;
}
// Rinnakkain
function openBeside(id) { if (!id) return false; pane = id; paneSeen.add(id); if (C[id].run === 'idle') C[id].unread = false; render(); focusComposer(id); return true; }
function closePane() {
  if (!pane) return false;
  seenDock.delete('pane:' + pane); pane = null;
  if (C[cur].run === 'idle') C[cur].unread = false;
  render(); focusComposer(); return true;
}
function paneOffer() {
  const others = yours().filter((id) => id !== cur && id !== pane);
  const fresh = others.find((id) => !paneSeen.has(id));
  return others.length ? { next: fresh ?? others[0], more: others.length - 1 } : null;
}
function promotePane() { const id = pane; pane = null; go(id, 'walk'); }

// ----- Piirto -----
function railRow(id) {
  const c = C[id];
  return `<button class="rrow${pane === id ? ' pane-open' : ''}" data-act="open" data-id="${id}"${id === cur ? ' aria-current="page"' : ''}>
    <span class="ball ${ballOf(id)}"></span><span class="t">${esc(c.title)}</span><span class="age">${age(id)}</span></button>`;
}
function railHTML() {
  const y = yours();
  const running = ORDER.filter((id) => !waits(id) && C[id].run === 'working');
  const groups = Object.keys(WS).map((w) => [w, running.filter((id) => C[id].ws === w)]).filter(([, l]) => l.length);
  return `<nav class="rail" aria-label="Sivupalkki">
    <div class="rail-head"><span class="srv">Habitat</span><span class="conn"><span class="dot-ok"></span>Yhdistetty</span></div>
    <div class="home-row">${svg('home')} Etusivu</div>
    <h2>Sinun vuorosi ${y.length ? `<span class="n">${y.length}</span>` : ''}</h2>
    ${y.map(railRow).join('') || '<div class="ws-row" style="font-family:var(--ah-font);color:var(--ah-muted)">Ei odottavia</div>'}
    <h2>Käynnissä <span class="c">${running.length}</span></h2>
    ${groups.map(([w, l]) => `<div class="wsg">${WS[w]}</div>${l.map(railRow).join('')}`).join('')}
    <h2>Työtilat <span class="c">3</span></h2>
    ${Object.values(WS).map((n) => `<div class="ws-row">${svg('folder')} ${n}</div>`).join('')}
    <div class="rail-foot"><span class="avatar">J</span> Jari</div>
  </nav>`;
}
function threadHTML(id) {
  const c = C[id];
  const items = c.hist.map((m) => m.who === 'you'
    ? `<div class="msg you"><div class="who">Sinä${m.tag ? `<span class="tag">${esc(m.tag)}</span>` : ''}</div><p>${md(m.text)}</p></div>`
    : `<div class="msg agent"><div class="who">${svg('check')} Vastaus valmis</div><p>${md(m.text)}</p></div>`);
  if (c.question) items.push(`<div class="msg agent ask"><div class="who">Agentti kysyy</div><p>${md(c.question.text)}</p>
    <div class="opts">${c.question.opts.map((o) => `<button class="opt" data-act="answer" data-conv="${id}" data-text="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`);
  if (c.run === 'working') items.push(`<div class="working"><span class="ball work"></span>Agentti työskentelee<span class="tm" data-since="${c.since}">${clock(c.since)}</span></div>`);
  return `<div class="thread">${items.join('')}</div>`;
}
function composerHTML(id) {
  const c = C[id];
  const ph = c.question ? 'Vastaa agentille…' : c.run === 'working' ? 'Ohjaa agenttia… · Alt+Enter: työn jälkeen' : 'Kirjoita viesti…';
  return `<div class="composer"><div class="cbox">
    <textarea data-conv="${id}" data-fkey="ta-${id}" placeholder="${ph}" aria-label="Viesti: ${esc(c.title)}">${esc(drafts[id] || '')}</textarea>
    <div class="crow"><span class="hint">${hintFor(id)}</span><button class="send" data-act="send" data-conv="${id}">Lähetä</button></div>
  </div></div>`;
}
function hintFor(id) {
  if (VAR === 3) return '';
  if (VAR === 1 && queue) return 'Alt+↑ ja Alt+↓ kulkevat jonossa myös kirjoittaessa';
  return '';
}
const enter = (key) => { const isNew = !seenDock.has(key); seenDock.add(key); return isNew ? ' enter' : ''; };
function offerRow(o, label, goText, act) {
  return `<button class="nx${enter('offer:' + o.next + label)}" data-act="${act}" data-testid="next-open" data-offer="${o.next}" aria-keyshortcuts="Alt+ArrowDown" title="Avaa ${esc(C[o.next].title)} (Alt+↓)">
    <span class="lbl">${label}</span><span class="ball you"></span><span class="ttl">${esc(C[o.next].title)}</span>
    <span class="det">${esc(detail(o.next))}</span>${o.more > 0 ? `<span class="more" title="${o.more} muuta odottaa sinua">+${o.more}</span>` : ''}
    <span class="go">${goText} <kbd>Alt+↓</kbd></span></button>`;
}
const noteHTML = () => note ? `<p class="note" role="status" data-testid="next-note">${esc(note)}</p>` : '';

function dockHTML(id, role = 'main') {
  const c = C[id];
  const needsYou = !!c.question;
  const parts = [];
  if (VAR === 3) {
    // Tuotanto: rivi vain, kun agentin työ on vahvistettu tällä käynnillä; ei kysyessä.
    const o = visit.engaged && !needsYou ? offerFor(id) : null;
    if (o) parts.push(offerRow(o, 'Sillä aikaa', 'Avaa', 'forward'));
    parts.unshift(noteHTML());
  }
  if (VAR === 0) {
    if (origin && origin !== id) {
      const ready = waits(origin);
      const o = C[origin];
      parts.push(`<button class="nx back${ready ? ' ready' : ''}${enter('back:' + origin + ready)}" data-act="return" data-testid="return" aria-keyshortcuts="Alt+ArrowUp" title="Takaisin: ${esc(o.title)} (Alt+↑)">
        <span class="lbl keep">${svg('back')} Takaisin</span><span class="ball ${ballOf(origin)}"></span><span class="ttl">${esc(o.title)}</span>
        <span class="det keep">${o.run === 'working' ? `työskentelee <span data-since="${o.since}">${clock(o.since)}</span>` : esc(stateWords(origin))}</span>
        <span class="go${ready ? '' : ' kbd-only'}">${ready ? 'Palaa ' : ''}<kbd>Alt+↑</kbd></span></button>`);
    }
    const o = !needsYou && (visit.engaged || visit.viaWalk) ? offerFor(id) : null;
    if (o) parts.push(offerRow(o, origin ? 'Seuraava' : 'Sillä aikaa', 'Avaa', 'forward'));
    else if (origin && origin !== id && !needsYou && !yours().filter((x) => x !== origin && x !== id).length)
      parts.push(`<div class="nx quiet${enter('none')}">Muita ei odota. Alt+↑ vie takaisin.</div>`);
    parts.unshift(noteHTML());
  }
  if (VAR === 1) {
    qSync();
    if (queue) parts.push(queueHTML());
    else {
      const others = yours().filter((x) => x !== id);
      if (visit.engaged && !needsYou && others.length) {
        parts.push(`<button class="nx${enter('qstart' + others.length)}" data-act="qstart" data-testid="next-open" aria-keyshortcuts="Alt+ArrowDown">
          <span class="lbl">Sillä aikaa</span><span class="ball you"></span>
          <span class="ttl">${others.length} odottaa sinua</span>
          <span class="det">${esc(others.map((x) => C[x].title).join(', '))}</span>
          <span class="go">Käy läpi <kbd>Alt+↓</kbd></span></button>`);
      }
    }
    parts.unshift(noteHTML());
  }
  if (VAR === 2) {
    if (role === 'main' && !pane) {
      const o = visit.engaged && !needsYou ? paneOffer() : null;
      if (o) parts.push(offerRow(o, 'Sillä aikaa', 'Avaa viereen', 'beside'));
    }
    if (role === 'pane' && !needsYou) {
      const o = paneOffer();
      if (o) parts.push(offerRow(o, 'Seuraava', 'Avaa', 'beside'));
      else parts.push(`<div class="nx quiet${enter('pnone')}">Muita ei odota. Esc sulkee.</div>`);
    }
    if (role === 'pane' || !pane) parts.unshift(noteHTML());
  }
  const body = parts.filter(Boolean).join('');
  return body ? `<div class="dock" data-testid="dock-${role}">${body}</div>` : '';
}
function queueHTML() {
  const { steps, pos } = queue;
  const step = (id, i) => {
    const c = C[id];
    const handled = i > 0 && !waits(id);
    const st = i === 0 ? (c.run === 'working' ? 'lähtö' : waits(id) ? 'lähtö · valmis' : 'lähtö')
      : c.gone && !waits(id) ? 'toisaalla' : handled ? '' : why(id);
    const mark = handled && !c.gone ? `<svg class="i chk" viewBox="0 0 24 24" aria-hidden="true">${ICON.check}</svg>` : `<span class="ball ${ballOf(id)}"></span>`;
    return `<li${i === pos ? ' class="on"' : ''}><button class="qs${handled ? ' handled' : ''}${c.gone && !waits(id) ? ' gone' : ''}" data-act="qgo" data-i="${i}" data-testid="q-step"${i === pos ? ' aria-current="step"' : ''} title="${esc(c.title)}">
      ${mark}<span class="tt">${esc(c.title)}</span>${st ? `<span class="st">${st}</span>` : ''}</button></li>`;
  };
  const last = pos >= steps.length - 1;
  const done = steps.slice(1).filter((id) => !waits(id)).length;
  return `<div class="q${enter('queue')}" role="navigation" aria-label="Odottavat keskustelut" data-testid="queue">
    <span class="qh">${done}/${steps.length - 1} hoidettu</span>
    <button class="qn prev" data-act="qprev" aria-keyshortcuts="Alt+ArrowUp" ${pos === 0 ? 'disabled' : ''} aria-label="Edellinen">${svg('up').replace('class="i"', 'class="i" width="14" height="14"')}<kbd>Alt+↑</kbd></button>
    <ol>${steps.map(step).join('')}</ol>
    <span class="dots"><span class="pips">${steps.map((id, i) => `<span class="pip${i === pos ? ' on' : i > 0 && !waits(id) ? ' ok' : ''}"></span>`).join('')}</span><span class="cur">${pos === 0 ? 'Lähtö' : `${pos}/${steps.length - 1}`} · ${esc(C[steps[pos]].title)}</span></span>
    <button class="qn" data-act="qnext" aria-keyshortcuts="Alt+ArrowDown" aria-label="${last ? 'Takaisin lähtöön' : 'Seuraava'}">${last ? 'Lähtöön' : 'Seuraava'} <kbd>Alt+↓</kbd></button>
    <button class="qx" data-act="qend" aria-label="Lopeta kierros" title="Lopeta kierros (Esc)">${svg('close')}</button>
  </div>`;
}
function stateHTML(id) {
  const c = C[id];
  return c.run === 'working'
    ? `<span class="ball work"></span>Työskentelee <span data-since="${c.since}">${clock(c.since)}</span>`
    : c.question ? `<span class="ball you"></span>Kysyy sinulta` : `<span class="ball done"></span>Valmis`;
}
function colHTML(id) {
  const c = C[id];
  const n = yours().filter((x) => x !== id).length;
  return `<section class="col" aria-label="${esc(c.title)}">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-act="drawer" aria-label="Sivupalkki">${svg('menu')}${n ? `<span class="badge">${n}</span>` : ''}</button>
      <div class="tb-title"><strong data-testid="title">${esc(c.title)}</strong><code>${WS[c.ws]}</code><span class="sub">${stateHTML(id)}</span></div>
      <div class="tb-right"><span class="state">${stateHTML(id)}</span><button class="icon-btn" aria-label="Tiedot">${svg('info')}</button></div>
    </header>
    <div class="content" data-scroll="${id}">${threadHTML(id)}</div>
    ${dockHTML(id, 'main')}
    ${composerHTML(id)}
  </section>`;
}
function paneHTML(id) {
  const c = C[id];
  return `<section class="pane${enter('pane:' + id)}" data-testid="pane" aria-label="Viereinen: ${esc(c.title)}">
    <header class="pane-head"><span class="grab"></span>
      <span class="ball ${ballOf(id)}"></span>
      <div class="ttl"><strong>${esc(c.title)}</strong><small>${WS[c.ws]} · ${esc(stateWords(id))}</small></div>
      <button class="icon-btn" data-act="promote" aria-label="Avaa kokonaan" title="Avaa kokonaan">${svg('expand')}</button>
      <button class="icon-btn" data-act="close-pane" data-testid="close-pane" aria-label="Sulje viereinen" title="Sulje (Esc, Alt+↑)">${svg('close')}</button>
    </header>
    <div class="content" data-scroll="${id}">${threadHTML(id)}</div>
    ${dockHTML(id, 'pane')}
    ${composerHTML(id)}
  </section>`;
}

const frame = document.getElementById('frame');
const wrap = document.getElementById('wrap');
function render() {
  // Kohdistus ja valinta säilyvät piirron yli.
  const a = document.activeElement;
  const fkey = a && frame.contains(a) ? a.dataset.fkey : null;
  const sel = fkey ? [a.selectionStart, a.selectionEnd] : null;
  const scrolls = {};
  frame.querySelectorAll('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = el.scrollHeight - el.scrollTop - el.clientHeight < 40; });
  document.documentElement.dataset.theme = S.t;
  document.body.classList.toggle('bare', S.bare);
  document.body.classList.toggle('shot', S.shot);
  wrap.className = 'frame-wrap' + (S.w === '390' ? ' phone' : S.w === '1280' ? ' w1280' : '');
  frame.innerHTML = `<div class="shell${drawer ? ' drawer-open' : ''}">${railHTML()}<button class="scrim" data-act="drawer" aria-label="Sulje sivupalkki"></button>
    <main class="main${pane ? ' has-pane' : ''}">${colHTML(cur)}${VAR === 2 && pane ? paneHTML(pane) : ''}</main>
    <div class="toast" id="toast" role="status"></div></div>`;
  frame.querySelectorAll('[data-scroll]').forEach((el) => { if (scrolls[el.dataset.scroll] !== false) el.scrollTop = el.scrollHeight; });
  if (fkey) { const el = frame.querySelector(`[data-fkey="${fkey}"]`); if (el) { el.focus({ preventScroll: true }); if (sel) el.setSelectionRange(...sel); } }
}
// Kello päivittää vain tekstin, ei rivejä, joissa on painikkeita.
setInterval(() => frame.querySelectorAll('[data-since]').forEach((el) => { el.textContent = clock(+el.dataset.since); }), 1000);

frame.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'open') { if (VAR === 2 && pane === b.dataset.id) promotePane(); else go(b.dataset.id); }
  if (act === 'drawer') { drawer = !drawer; render(); }
  if (act === 'send') { const ta = frame.querySelector(`textarea[data-conv="${b.dataset.conv}"]`); send(b.dataset.conv, ta.value); }
  if (act === 'answer') send(b.dataset.conv, b.dataset.text);
  if (act === 'forward') forward();
  if (act === 'return') returnHome();
  if (act === 'qstart') startQueue();
  if (act === 'qgo') qGo(+b.dataset.i);
  if (act === 'qnext') qMove(1);
  if (act === 'qprev') qMove(-1);
  if (act === 'qend') { queue = null; render(); }
  if (act === 'beside') openBeside(b.dataset.offer);
  if (act === 'close-pane') closePane();
  if (act === 'promote') promotePane();
});
frame.addEventListener('input', (e) => { if (e.target.dataset.conv) drafts[e.target.dataset.conv] = e.target.value; });
frame.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey && !e.altKey) { e.preventDefault(); send(e.target.dataset.conv, e.target.value); }
});
// Alt+↓ / Alt+↑ kuten tuotannossa: myös kirjoittaessa. Esc sulkee viereisen ja jonon.
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') {
    if (drawer) { drawer = false; render(); return; }
    if (VAR === 2 && closePane()) return;
    if (VAR === 1 && queue) { queue = null; render(); return; }
  }
  if (!e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  let used = false;
  if (e.key === 'ArrowDown') {
    if (VAR === 0) used = !!frame.querySelector('[data-act="forward"]') && forward();
    if (VAR === 3) used = !!frame.querySelector('[data-act="forward"]') && forward();
    if (VAR === 1) used = queue ? qMove(1) : !!frame.querySelector('[data-act="qstart"]') && startQueue();
    if (VAR === 2) { const b = frame.querySelector('[data-act="beside"]'); used = !!b && openBeside(b.dataset.offer); }
  }
  if (e.key === 'ArrowUp') {
    if (VAR === 0) used = returnHome();
    if (VAR === 3) used = stepBack();
    if (VAR === 1) used = !!queue && queue.pos > 0 && qMove(-1);
    if (VAR === 2) used = closePane();
  }
  if (used) e.preventDefault();
});

function ctl(id, key) {
  const el = document.getElementById(id);
  el.value = S[key];
  el.addEventListener('change', () => { S[key] = el.value; const u = new URL(location); u.searchParams.set(key, el.value); history.replaceState(null, '', u); render(); });
}
ctl('c-w', 'w');
ctl('c-t', 't');
document.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('click', () => {
  const ev = b.dataset.ev;
  if (ev === 'origin') finish('a');
  if (ev === 'elsewhere') elsewhere();
  if (ev === 'arrive') finish('e');
}));

// ----- Valitsin (PICKER.md, viitejohdotus) -----
const variants = [0, 1, 2, 3].map((i) => () => { VAR = i; reset(); render(); return ''; });
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let currentV = 0;

function moveHighlight() {
  const el = items[currentV];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  frame.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  currentV = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(currentV));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((currentV + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((currentV - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(currentV);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
