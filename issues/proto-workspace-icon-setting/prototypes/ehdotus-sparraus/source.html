<style>
/* ---------- Harness chrome (not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #2a2d31; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #ddd; overflow: hidden; }
.h-bar { position: fixed; inset: 0 0 auto 0; height: 40px; white-space: nowrap; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #1c1e21; border-bottom: 1px solid #000; z-index: 50; }
.h-bar b { font-weight: 600; color: #fff; margin-right: 4px; }
.h-seg { flex: none; display: inline-flex; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
.h-seg button, .h-btn { background: transparent; color: #bbb; border: 0; padding: 5px 7px; white-space: nowrap; font: inherit; cursor: pointer; }
.h-seg button + button { border-left: 1px solid #444; }
.h-seg button[aria-pressed="true"] { background: #3d4248; color: #fff; }
.h-btn { border: 1px solid #444; border-radius: 6px; }
.h-label { color: #888; }
.h-note { margin-left: auto; min-width: 0; color: #888; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stage { position: fixed; inset: 40px 0 0 0; overflow: auto; }

/* ---------- App shell, after web/src/components/components.css ---------- */
.app { font-family: var(--ah-font); color: var(--ah-ink); background: var(--ah-bg); -webkit-font-smoothing: antialiased; }
.app button { font: inherit; color: inherit; }
.app code { font-family: var(--ah-mono); }
.shell { display: grid; grid-template-columns: var(--ah-rail-width) minmax(0, 1fr); height: 100%; }
.frame-desktop { position: absolute; inset: 0; }
.frame-phone-wrap { min-height: 100%; display: grid; place-items: start center; padding: 18px 0 90px; background: #2a2d31; }
.frame-phone { position: relative; width: 390px; height: min(800px, calc(100vh - 150px)); border-radius: 34px; border: 10px solid #0d0e10; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.frame-phone .app { position: absolute; inset: 0; }
.phone .shell { grid-template-columns: 1fr; }

.ah-rail { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ah-rail); border-right: 1px solid var(--ah-line); font-size: var(--ah-size-ui); line-height: var(--ah-lh-ui); height: 100%; }
.ah-rail-head { display: grid; gap: var(--ah-s3); padding: 11px 10px var(--ah-s3); border-bottom: 1px solid var(--ah-line-soft); }
.ah-rail-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ah-rail-title strong { font-weight: 600; }
.ah-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; color: var(--ah-ok); }
.ah-status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.ah-iconbtn { margin-left: auto; display: inline-grid; place-items: center; width: var(--ah-control-row); height: var(--ah-control-row); border-radius: var(--ah-r-md); border: 1px solid var(--ah-control-line); background: transparent; color: var(--ah-ink-2); cursor: pointer; }
.ah-iconbtn svg, .ah-qbtn svg { width: 16px; height: 16px; }
.ah-qbtn { display: inline-grid; place-items: center; width: var(--ah-control-row); height: var(--ah-control-row); border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-muted); cursor: pointer; }
.ah-qbtn:hover, .ah-iconbtn:hover { background: var(--ah-control-hover); }
.ah-qbtn.danger { color: var(--ah-err); }
.ah-home { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink); font-size: 13px; text-decoration: none; }
.ah-home svg { width: 16px; height: 16px; color: var(--ah-ink-2); }
.ah-rail-content { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; padding: 8px 8px var(--ah-s5); }
.ah-now { display: grid; gap: 1px; min-width: 0; margin-bottom: var(--ah-s3); }
.ah-now ul, .ws-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; padding: 0; list-style: none; }
.sec-head { display: flex; align-items: center; gap: var(--ah-s2); margin: 0 0 2px; padding-inline: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ah-ink-2); }
.cnt { color: var(--ah-muted); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
.row > a { display: flex; align-items: center; gap: 8px; min-height: 24px; padding: 0 8px 0 6px; border-radius: var(--ah-r-nav); color: var(--ah-ink); font-size: 13px; text-decoration: none; cursor: pointer; }
.row > a:hover { background: var(--ah-control-hover); }
.row .t1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { flex: none; color: var(--ah-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ball-work { background: var(--ah-accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ah-accent) 28%, transparent); animation: ah-pulse var(--ah-pulse); }
.ball-you { background: var(--ah-turn); }
.ball-done { background: var(--ah-ok); }
.grp + .grp { margin-top: 5px; }
.ws-sec { display: grid; gap: 2px; min-width: 0; }
.ws-row > a { display: flex; align-items: center; gap: var(--ah-s2); min-width: 0; min-height: 30px; padding: 4px 8px; border-radius: var(--ah-r-nav); font-size: 12.5px; color: var(--ah-ink); text-decoration: none; cursor: pointer; }
.ws-row > a:hover { background: var(--ah-control-hover); }
.ws-row > a[aria-current="page"] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line) inset; }
.ws-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-row .mark { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--ah-turn); }
.ah-rail-foot { padding: 8px 10px; border-top: 1px solid var(--ah-line-soft); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--ah-accent-soft); color: var(--ah-accent-ink); display: grid; place-items: center; font-size: 11px; }
.phone .row > a { min-height: 40px; font-size: 14px; }
.phone .ws-row > a { min-height: 40px; font-size: 14px; }

/* ---------- workspace icon (Lähdeketju: config → repo logo → letters) ---------- */
.wi { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; line-height: 1; user-select: none; }
.wi-emoji { font-size: 13px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.wi-logo img { width: 100%; height: 100%; display: block; border-radius: 3px; }
.wi-mono { border-radius: 4px; background: color-mix(in srgb, var(--hue) 15%, var(--ah-surface)); color: var(--hue); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hue) 32%, transparent) inset; font: 600 8px/1 var(--ah-font); letter-spacing: -.02em; }
.wi.m { width: 24px; height: 24px; }
.wi-emoji.m { font-size: 19px; }
.wi-mono.m { font-size: 10px; border-radius: 6px; }
.wi.l { width: 40px; height: 40px; }
.wi-emoji.l { font-size: 30px; }
.wi-mono.l { font-size: 16px; border-radius: 10px; }
.wi-logo.l img { border-radius: 8px; }
.wi.xl { width: 56px; height: 56px; }
.wi-emoji.xl { font-size: 42px; }
.wi-mono.xl { font-size: 21px; border-radius: 14px; }
.wi-logo.xl img { border-radius: 12px; }
.hue-0 { --hue: #2b7f8c; } .hue-1 { --hue: #185e87; } .hue-2 { --hue: #71419b; } .hue-3 { --hue: #216142; }
.hue-4 { --hue: #8a4b16; } .hue-5 { --hue: #9b3d73; } .hue-6 { --hue: #4a5a6b; } .hue-7 { --hue: #5c6a1a; }
[data-theme="dark"] .hue-0 { --hue: #4fa6b4; } [data-theme="dark"] .hue-1 { --hue: #9acced; } [data-theme="dark"] .hue-2 { --hue: #c7a3ed; } [data-theme="dark"] .hue-3 { --hue: #93d3ad; }
[data-theme="dark"] .hue-4 { --hue: #edba8d; } [data-theme="dark"] .hue-5 { --hue: #e7a3c8; } [data-theme="dark"] .hue-6 { --hue: #aab6c3; } [data-theme="dark"] .hue-7 { --hue: #c3cf7e; }

/* ---------- workspace page, after web/src/app/WorkspacePage.css ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ah-bg); position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline); border-bottom: 1px solid var(--ah-line-soft); background: var(--ah-surface); min-height: 50px; }
.topbar strong { font: 600 14px var(--ah-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { position: relative; }
.ws-scroll { flex: 1; overflow: auto; padding: 26px var(--ah-column-pad-inline) 96px; }
.ah-workspace-page { display: flex; flex-direction: column; gap: var(--ah-s6); width: 100%; max-width: 860px; margin: 0 auto var(--ah-s6); }
.page-head { position: relative; display: flex; align-items: flex-start; gap: var(--ah-s3); }
.page-title { flex: 1; min-width: 0; }
.page-title h1 { margin: 0 0 4px; font: 600 21px / 1.25 var(--ah-mono); overflow-wrap: anywhere; }
.page-title p { margin: 0; color: var(--ah-muted); font-size: 12px; overflow-wrap: anywhere; }
.page-title .src { margin-top: 4px; }
.page-title .src code { color: var(--ah-ink-2); font-size: 11.5px; }
.icon-row { display: flex; align-items: center; gap: var(--ah-control-gap); flex: none; }
.divider { width: 1px; height: 20px; background: var(--ah-line); margin: 0 4px; }
.head-icon { flex: none; display: grid; place-items: center; margin-top: -2px; }
.head-icon.btn-like { position: relative; padding: 3px; border: 1px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; }
.head-icon.btn-like:hover, .head-icon.btn-like[aria-expanded="true"] { border-color: var(--ah-line-strong); background: var(--ah-control-hover); }
.head-icon .pen { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--ah-surface); border: 1px solid var(--ah-line); color: var(--ah-ink-2); opacity: 0; transition: opacity 120ms ease-out; }
.head-icon:hover .pen, .head-icon:focus-visible .pen, .head-icon[aria-expanded="true"] .pen, .phone .head-icon .pen { opacity: 1; }
.head-icon .pen svg { width: 11px; height: 11px; }
.ws-h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--ah-s3); font-size: 12px; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; }
.ws-h2 span { color: var(--ah-accent-ink); background: var(--ah-accent-soft); padding: 1px 7px; border-radius: var(--ah-r-pill); text-transform: none; letter-spacing: 0; }
.intro { padding: 0 0 var(--ah-s6); border-bottom: 1px solid var(--ah-line-soft); }
.intro h2 { margin: 0; font-size: var(--ah-size-h2); }
.intro p { margin: var(--ah-s2) 0 0; color: var(--ah-ink-2); line-height: var(--ah-lh-body); font-size: var(--ah-size-body); }
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ah-s3); margin-top: var(--ah-s4); }
.goal { position: relative; padding: var(--ah-s4) var(--ah-s8) var(--ah-s4) var(--ah-s5); border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); font-size: 14px; }
.goal strong { display: block; font-weight: 600; }
.goal span { display: block; color: var(--ah-ink-2); font-size: var(--ah-size-ui); margin-top: 4px; }
.goal b { position: absolute; right: var(--ah-s5); top: var(--ah-s4); font-weight: 400; color: var(--ah-muted); }
.intro-line { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ah-s2) var(--ah-s4); padding: var(--ah-s4) var(--ah-s5); border: 1px dashed var(--ah-line-strong); border-radius: var(--ah-r-lg); color: var(--ah-ink-2); font-size: var(--ah-size-ui); }
.intro-line p { margin: 0; flex: 1 1 260px; }
.gitrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.gs-chip { display: inline-flex; align-items: center; gap: 8px; height: var(--ah-control-row); padding: 0 10px; border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-surface); font: 500 12.5px var(--ah-mono); cursor: pointer; color: var(--ah-ink); }
.gs-chip:hover { background: var(--ah-control-hover); }
.gs-chip svg { width: 15px; height: 15px; color: var(--ah-muted); }
.gs-chip .dirty { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ah-turn); }
.gs-note { color: var(--ah-muted); font-size: 12px; }
.summary { color: var(--ah-muted); font-size: 12.5px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); font-size: 14px; }
.card .ch { display: flex; align-items: center; gap: 8px; }
.card .ch strong { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card time, .card small { color: var(--ah-muted); font-size: 12px; }
.empty-note { margin: 0; color: var(--ah-muted); font-size: 13px; }
.phone .ws-scroll { padding: 18px 16px 96px; }
.phone .page-head { flex-wrap: wrap; }
.phone .icon-row { flex-basis: 100%; }
.phone .icon-row .divider { flex: 1; visibility: hidden; }
.phone .goals, .phone .cards { grid-template-columns: 1fr; }

/* ---------- shared controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: var(--ah-control-row); padding: 0 12px; border-radius: var(--ah-r-md); border: 0; background: var(--ah-control); color: var(--ah-ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--ah-control-hover); }
.btn.primary { background: var(--ah-accent); color: var(--ah-on-accent); }
.btn.primary:hover { background: var(--ah-accent-hover); }
.btn.quiet { background: transparent; color: var(--ah-ink-2); }
.btn.quiet:hover { background: var(--ah-control-hover); }
.btn.page { height: 36px; padding: 0 16px; }
.btn[disabled] { opacity: .5; cursor: default; }
.phone .btn { height: 40px; }
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--ah-line); border-left: 3px solid var(--ah-turn); border-radius: var(--ah-r-md); background: var(--ah-surface); font-size: 13px; line-height: 1.5; animation: ah-appear var(--ah-appear); }
.notice.ok { border-left-color: var(--ah-ok); }
.notice.plain { border-left-color: var(--ah-line-strong); }
.notice .nt { flex: 1; min-width: 0; }
.notice .nt b { font-weight: 600; }
.notice .nt small { display: block; color: var(--ah-muted); font-size: 12px; }
.notice .na { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
.phone .notice { flex-wrap: wrap; }
.phone .notice .na { flex-basis: 100%; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: var(--ah-r-pill); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.badge.dirty { background: color-mix(in srgb, var(--ah-turn) 14%, var(--ah-surface)); color: var(--ah-ink); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ah-turn) 40%, transparent) inset; }
.badge.dirty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ah-turn); }
.badge.ok { background: var(--ah-ok-soft); color: var(--ah-ink-2); }
.badge.local { background: var(--ah-sunken); color: var(--ah-ink-2); }

/* the Otsikko picker panel (round 1, being implemented as workspace-icon-setting) */
.pk { display: grid; gap: 12px; }
.pk-h { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); }
.pk-opts { display: grid; gap: 4px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface); text-align: left; cursor: pointer; }
.opt:hover { background: var(--ah-surface-hover); }
.opt[aria-pressed="true"] { border-color: var(--ah-accent); box-shadow: 0 0 0 1px var(--ah-accent) inset; background: var(--ah-accent-soft); }
.opt .ot { flex: 1; min-width: 0; display: grid; }
.opt .ot b { font-weight: 600; font-size: 13px; }
.opt .ot small { color: var(--ah-muted); font-size: 11.5px; overflow-wrap: anywhere; }
.opt .ot small code { font-size: 11px; }
.letters { display: flex; align-items: center; gap: 8px; }
.letters input { width: 64px; height: 30px; padding: 0 8px; border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink); font: 600 13px var(--ah-mono); text-transform: uppercase; }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 2px; }
.egrid button { height: 34px; border: 1px solid transparent; border-radius: var(--ah-r-md); background: transparent; font-size: 19px; cursor: pointer; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.egrid button:hover { background: var(--ah-surface-hover); }
.egrid button[aria-pressed="true"] { border-color: var(--ah-accent); background: var(--ah-accent-soft); }
.own { display: flex; gap: 6px; align-items: center; }
.own input { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink); font-size: 13px; }
.where { display: flex; gap: 8px; margin: 0; padding: 9px 11px; border-radius: var(--ah-r-md); background: var(--ah-sunken); border: 1px solid var(--ah-line-soft); color: var(--ah-ink-2); font-size: 12.5px; line-height: 1.5; }
.where code { font-size: 11.5px; color: var(--ah-ink); }
.where svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--ah-muted); }
.diff { margin: 0; padding: 8px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); font: 12px/1.6 var(--ah-mono); color: var(--ah-ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .add { color: var(--ah-ok); }
.diff .del { color: var(--ah-err); }
.diff .fn { color: var(--ah-muted); }

/* Otsikko: an anchored popover; a sheet on the phone */
.pop { position: absolute; left: 0; top: 54px; z-index: 30; width: 340px; max-height: 520px; overflow: auto; padding: 14px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); }
.pop-top { display: flex; align-items: center; gap: 8px; }
.pop-top strong { flex: 1; font-size: 13.5px; }
.sheet-scrim { position: absolute; inset: 0; z-index: 29; background: var(--ah-scrim); }
.phone .pop { position: absolute; inset: auto 0 0 0; width: auto; max-height: 82%; border-radius: 16px 16px 0 0; padding: 16px 16px 24px; }
.phone .opt { min-height: 46px; }

.scrim { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--ah-scrim); padding: 16px; }
.dlg { width: min(480px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 20px; border-radius: var(--ah-r-xl); background: var(--ah-surface); box-shadow: var(--ah-shadow-dialog); animation: ah-appear var(--ah-appear); display: grid; gap: 14px; }
.phone .scrim { place-items: end stretch; padding: 0; }
.phone .dlg { width: 100%; border-radius: 18px 18px 0 0; max-height: 92%; }
.dlg h2 { margin: 0; font-size: var(--ah-size-h2); font-weight: 600; }
.fld { display: grid; gap: 6px; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--ah-ink-2); }
.fld > span small { font-weight: 400; color: var(--ah-muted); }
.fld input[type="text"] { height: 34px; padding: 0 10px; border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink); font: 14px var(--ah-font); width: 100%; }
.dlg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dlg-actions .sp { flex: 1; }
.fld-sep { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 0; }

/* Git layer: what GitStatusDetails would show, reduced to the files */
.gitdlg h2 { font: 600 15px var(--ah-mono); }
.gfiles { margin: 0; padding: 0; list-style: none; display: grid; }
.gfiles li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--ah-line-soft); font-size: 13px; }
.gfiles li code { font-size: 12px; overflow-wrap: anywhere; }
.gfiles li .st { flex: none; width: 70px; color: var(--ah-muted); font-size: 11.5px; }
.gfiles li.hl code { color: var(--ah-ink); font-weight: 600; }
.gsub { margin: 0; font-size: 12px; color: var(--ah-muted); }

function moveHighlight() {

  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });

  current = i;
  items.forEach((el, j) => {

    if (j === i) el.setAttribute('aria-current', 'true');

      accept(v); break;
    }
    case "not-now": S.dismissed[n] = true; S.again[n] = false; S.chat = false; cancelAI(); break;
    case "again": S.again[n] = true; S.pop = false; if (dir === "chat") S.chat = true; ENTER.add("chat"); break;
    case "chat": S.chat = !S.chat; ENTER.add("chat"); break;
    case "unchat": S.chat = false; break;
    case "more": S.pop = true; S.tab = "ai"; ENTER.add("pop"); break;
    case "ask": return; // the form's submit handles it
    case "quick": ask(el.dataset.v); return;
    case "retry": ask(S.ai.wish); return;
    case "round": S.ai.at = Math.max(0, Math.min(S.ai.rounds.length - 1, S.ai.at + Number(el.dataset.v))); break;
    case "settings": document.getElementById("h-note").textContent = "Tuotannossa tämä avaa Asetukset → Mallit, jossa mallipalveluun kirjaudutaan."; return;
    case "git": S.git = true; break;
    case "close-git": S.git = false; break;
    default: return;
  }
  rerender();
});
stage.addEventListener("submit", (e) => {
  e.preventDefault();
  const inp = e.target.querySelector('[data-in="wish"]'); if (!inp) return;
  const v = inp.value.trim();
  if (!v || S.ai.status === "loading") { inp.focus(); return; }
  inp.value = "";
  ask(v);
});
// A click outside an anchored popover or the chat closes it.
document.addEventListener("click", (e) => {
  if (S.view === "phone" || !stage.contains(e.target)) return;
  if (S.pop && !e.target.closest(".pop") && !e.target.closest("[data-act=pop]") && !e.target.closest("[data-act=more]")) { S.pop = false; rerender(); }
  else if (S.chat && !e.target.closest(".chat") && !e.target.closest("[data-act=chat]") && !e.target.closest("[data-act=again]")) { S.chat = false; rerender(); }
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.pop || S.chat || S.git) { S.pop = false; S.chat = false; S.git = false; rerender(); }
});
stage.addEventListener("input", (e) => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === "letters") {
    const v = e.target.value.toLocaleUpperCase("fi").replace(/[^A-Z0-9ÅÄÖ]/g, "").slice(0, 3);
    e.target.value = v;
    const tile = e.target.closest(".opt")?.querySelector(".wi-mono");
    if (tile && v) { tile.textContent = v; tile.closest("[data-act=choose]")?.setAttribute("data-v", v); }
  }
  if (k === "own") e.target.setCustomValidity("");
});
stage.addEventListener("change", (e) => {
  if (e.target.dataset.in !== "letters" || !e.target.value) return;
  accept(e.target.value);
  rerender();
});
</script>
