<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillä aikaa -rivi tilakoneena</title>
<style>
/*FONTS*/
/*TOKENS*/
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ah-bg);
  color: var(--ah-ink);
  font: 400 var(--ah-size-ui)/var(--ah-lh-ui) var(--ah-font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
kbd { font: 600 11px var(--ah-mono); }

/* ---------- page chrome around the simulation ---------- */
.pg { max-width: 1480px; margin: 0 auto; padding: 72px 24px 40px; }
.pg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; margin-bottom: 14px; }
.pg-head h1 { margin: 0; font-size: var(--ah-size-h1); font-weight: 600; letter-spacing: -.01em; }
.pg-axis { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.pg-toggles { margin-left: auto; display: flex; gap: 8px; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--ah-r-md); background: var(--ah-control); }
.seg button { border: 0; background: transparent; color: var(--ah-ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ah-surface); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-line); font-weight: 600; }
.pg-lead { margin: 0 0 18px; max-width: 92ch; color: var(--ah-ink-2); font-size: var(--ah-size-body); line-height: 1.55; }
.pg-grid { display: grid; grid-template-columns: minmax(520px, 600px) minmax(0, 1fr); gap: 24px; align-items: start; }
.pg[data-device="phone"] .pg-grid { grid-template-columns: minmax(520px, 1fr) auto; }
.card { background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-xl); box-shadow: var(--ah-shadow-app); }
.graph-card { padding: 14px 14px 10px; position: sticky; top: 72px; }
.card h2 { margin: 0 0 2px; font-size: var(--ah-size-h2); font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--ah-muted); font-size: var(--ah-size-meta); }
svg.graph { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 2px 0; color: var(--ah-muted); font-size: 11.5px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ah-ink-2); vertical-align: middle; margin-right: 5px; }
.legend i.bad { border-top: 2px dashed var(--ah-err); }
.legend i.cost { border-top: 2px dashed var(--ah-turn); }
.legend i.hit { border-top: 3px solid var(--ah-accent); }
.notes { margin: 12px 2px 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ah-ink-2); }
.notes li b { color: var(--ah-ink); }
.notes li code { font: 11.5px var(--ah-mono); color: var(--ah-muted); }
.badge { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 700 11px var(--ah-font); color: #fff; background: var(--ah-err); }
.badge.cost { background: var(--ah-turn); color: #1b1300; }
.notes li.lit { background: var(--ah-accent-soft); border-radius: 6px; outline: 4px solid var(--ah-accent-soft); }

/* graph */
.g-node rect { fill: var(--ah-surface-2); stroke: var(--ah-line-strong); stroke-width: 1.2; }
.g-node .t { fill: var(--ah-ink); font: 600 12.5px var(--ah-font); }
.g-node .s { fill: var(--ah-muted); font: 400 10.5px var(--ah-font); }
.g-node.on rect { fill: var(--ah-accent-soft); stroke: var(--ah-accent); stroke-width: 2.5; }
.g-node.on .t { fill: var(--ah-accent-ink); }
.g-node.ghost rect { stroke-dasharray: 4 3; }
.g-edge path { fill: none; stroke: var(--ah-faint); stroke-width: 1.4; }
.g-edge.bad path { stroke: var(--ah-err); stroke-dasharray: 5 4; }
.g-edge.cost path { stroke: var(--ah-turn); stroke-dasharray: 5 4; }
.g-edge.hit path { stroke: var(--ah-accent); stroke-width: 3; stroke-dasharray: none; }
.g-edge text { font: 400 10.5px var(--ah-font); fill: var(--ah-ink-2); paint-order: stroke; stroke: var(--ah-surface); stroke-width: 4px; stroke-linejoin: round; }
.g-edge.hit text { fill: var(--ah-accent-ink); font-weight: 700; }
.g-edge .bd circle { fill: var(--ah-err); }
.g-edge.cost .bd circle { fill: var(--ah-turn); }
.g-edge .bd text { fill: #fff; stroke: none; font: 700 10px var(--ah-font); }
.g-edge.cost .bd text { fill: #1b1300; }
.g-arrow { fill: var(--ah-faint); }
.g-arrow.bad { fill: var(--ah-err); }
.g-arrow.cost { fill: var(--ah-turn); }
.g-arrow.hit { fill: var(--ah-accent); }

/* events */
.ev { padding: 12px 14px; margin-bottom: 14px; }
.ev-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.ev-group h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ah-muted); }
.ev-group .btns { display: flex; flex-wrap: wrap; gap: 5px; }
.evb { border: 1px solid var(--ah-control-line); background: var(--ah-surface); color: var(--ah-ink); border-radius: 6px; padding: 4px 9px; font-size: 12.5px; cursor: pointer; }
.evb:hover:not(:disabled) { background: var(--ah-surface-hover); }
.evb:disabled { opacity: .45; cursor: default; }
.evb.reset { border-style: dashed; color: var(--ah-muted); }
.ev-log { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--ah-line-soft); font-size: 12px; color: var(--ah-muted); min-height: 2.6em; }
.ev-log b { color: var(--ah-ink); font-weight: 600; }

/* ---------- the production-looking app ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 640px; overflow: hidden; border-radius: var(--ah-r-xl); border: 1px solid var(--ah-line); background: var(--ah-bg); box-shadow: var(--ah-shadow-app); color: var(--ah-ink); }
.rail { background: var(--ah-rail); border-right: 1px solid var(--ah-line); padding: 12px 8px; overflow: auto; }
.rail-brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; font-weight: 600; font-size: 13.5px; }
.rail-brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--ah-accent); display: inline-block; }
.rail h4 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
.rail h4 span { color: var(--ah-turn); }
.rail ul { list-style: none; margin: 0; padding: 0; }
.rail a { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); text-decoration: none; font-size: 13px; cursor: pointer; }
.rail a:hover { background: var(--ah-hover); }
.rail a.cur { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); font-weight: 600; }
.rail a small { display: block; color: var(--ah-muted); font-size: 11px; font-weight: 400; }
.rail a .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ball { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ball.work { background: var(--ah-accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ah-accent) 28%, transparent); animation: ah-pulse var(--ah-pulse); }
.ball.you { background: var(--ah-turn); }
.ball.done { background: var(--ah-ok); }

.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ah-bg); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.topbar .menu { display: none; border: 0; background: transparent; color: var(--ah-ink-2); font-size: 18px; padding: 0 4px; cursor: pointer; }
.topbar h5 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .ws { color: var(--ah-muted); font-size: 12px; white-space: nowrap; }
.chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: var(--ah-r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--ah-control); color: var(--ah-ink-2); }
.chip.work { background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.chip.you { background: color-mix(in srgb, var(--ah-turn) 16%, transparent); color: var(--ah-ink); }
.stream { flex: 1; overflow: auto; padding: 18px var(--ah-column-pad-inline) 10px; }
.stream > * { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.msg-user p { margin: 0; max-width: 80%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--ah-accent-soft); color: var(--ah-ink); font-size: var(--ah-size-body); line-height: 1.5; }
.msg-agent { margin-bottom: 14px; font-size: var(--ah-size-body); line-height: var(--ah-lh-body); color: var(--ah-ink); }
.msg-agent p { margin: 0 0 6px; }
.working-line { display: flex; align-items: center; gap: 8px; color: var(--ah-accent-ink); font-size: 13px; margin-bottom: 10px; }
.ask-card { border: 1px solid color-mix(in srgb, var(--ah-turn) 45%, var(--ah-line)); background: color-mix(in srgb, var(--ah-turn) 8%, var(--ah-surface)); border-radius: var(--ah-r-lg); padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
.ask-card b { display: block; font-size: 11px; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.empty-view { margin: 80px auto 0; text-align: center; color: var(--ah-muted); }

.composer { padding: 0 var(--ah-column-pad-inline) var(--ah-composer-pad-block); }
.composer-box { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; min-height: 48px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); }
.composer-box span { flex: 1; color: var(--ah-faint); font-size: var(--ah-size-body); }
.composer-box button { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; background: var(--ah-accent); color: var(--ah-on-accent); }
.composer-box button.stop { background: var(--ah-control); color: var(--ah-ink); }

/* phone form */
.phone-wrap { display: flex; justify-content: center; }
.app.phone { width: 390px; height: 780px; grid-template-columns: 1fr; border-radius: 34px; border-width: 8px; border-color: #0b0d0f; position: relative; }
.app.phone .rail { position: absolute; inset: 0 auto 0 0; width: 82%; z-index: 3; transform: translateX(-102%); transition: transform var(--ah-appear); box-shadow: var(--ah-shadow-dialog); }
.app.phone.rail-open .rail { transform: none; }
.app.phone .topbar { padding: 10px 12px; }
.app.phone .topbar .menu { display: inline-block; }
.app.phone .topbar .ws { display: none; }
.app.phone .stream { padding-inline: 14px; }
.app.phone .composer { padding-inline: 10px; }

/* ---------- the row and bar, as production (NextWaitingRow.css) ---------- */
.ah-next-waiting { flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 0 var(--ah-column-pad-inline) 6px; }
.app.phone .ah-next-waiting { padding-inline: 10px; }
.ah-next-waiting > * { width: min(100%, calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline))); margin-inline: auto; }
.ah-next-note { margin: 0; color: var(--ah-muted); font-size: 12px; font-style: italic; }
.ah-next-open { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 6px 4px 12px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); color: var(--ah-ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.ah-next-open:hover { border-color: var(--ah-accent); }
.ah-next-open.quietrow { background: var(--ah-surface); border-color: var(--ah-line); }
.ah-next-label { flex: none; color: var(--ah-accent-ink); font-size: 12px; font-weight: 600; }
.ah-next-ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-turn); }
.ah-next-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ah-next-det { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ah-muted); font-size: 12px; }
.ah-next-go { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--ah-r-md); background: var(--ah-accent); color: var(--ah-on-accent); font-size: 12.5px; font-weight: 600; }
.ah-next-go kbd { font: 600 11px var(--ah-mono); }
.ah-next-queue { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 4px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); font-size: 12.5px; }
.ah-next-q-head { flex: none; padding: 0 6px; color: var(--ah-accent-ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ah-next-queue ol { flex: 1; min-width: 0; display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; overflow: hidden; }
.ah-next-queue li { flex: 0 1 auto; min-width: 0; display: flex; }
.ah-next-queue li.on { flex: 0 0 auto; max-width: 46%; }
.ah-next-q-step { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--ah-r-sm); background: transparent; color: var(--ah-ink-2); font: inherit; white-space: nowrap; cursor: pointer; }
.ah-next-q-step:hover { background: var(--ah-control-hover); color: var(--ah-ink); }
.ah-next-q-step[aria-current] { background: var(--ah-surface); box-shadow: 0 0 0 1px var(--ah-accent-line); color: var(--ah-ink); font-weight: 600; }
.ah-next-q-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ah-next-q-detail { flex: none; color: var(--ah-muted); font-size: 11.5px; font-weight: 400; }
.ah-next-q-step:not([aria-current]) .ah-next-q-detail { display: none; }
.ah-next-q-step.handled .ah-next-q-title { color: var(--ah-muted); }
.ah-next-q-step.elsewhere .ah-next-q-title { color: var(--ah-muted); text-decoration: line-through; }
.ah-next-q-check { flex: none; color: var(--ah-ok); font-weight: 700; font-size: 12px; }
.ah-next-q-ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ah-next-q-ball-work { background: var(--ah-accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ah-accent) 28%, transparent); animation: ah-pulse var(--ah-pulse); }
.ah-next-q-ball-you { background: var(--ah-turn); }
.ah-next-q-ball-done { background: var(--ah-ok); }
.ah-next-q-move { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--ah-r-sm); background: var(--ah-accent); color: var(--ah-on-accent); font: 600 12px var(--ah-font); white-space: nowrap; cursor: pointer; }
.ah-next-q-move:hover:not(:disabled) { background: var(--ah-accent-hover); }
.ah-next-q-move.prev { background: var(--ah-surface); box-shadow: 0 0 0 1px var(--ah-line) inset; color: var(--ah-ink-2); }
.ah-next-q-move:disabled { opacity: .45; cursor: default; }
.ah-next-q-end { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--ah-r-sm); background: transparent; color: var(--ah-muted); cursor: pointer; font-size: 14px; }
.ah-next-q-end:hover { background: var(--ah-control-hover); color: var(--ah-ink); }
.ah-next-q-compact { display: none; }
.app.phone .ah-next-open { min-height: 40px; }
.app.phone .ah-next-label, .app.phone .ah-next-det, .app.phone .ah-next-go kbd { display: none; }
.app.phone .ah-next-title { flex: 1; }
.app.phone .ah-next-q-head, .app.phone .ah-next-queue ol, .app.phone .ah-next-q-move kbd { display: none; }
.app.phone .ah-next-q-compact { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.ah-next-q-pips { flex: none; display: flex; gap: 3px; }
.ah-next-q-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--ah-accent-line); }
.ah-next-q-pip.on { background: var(--ah-accent); }
.ah-next-q-pip.ok { background: var(--ah-ok); }
.ah-next-q-cur { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.app.phone .ah-next-q-move, .app.phone .ah-next-q-end { min-width: 40px; min-height: 34px; }
.flash { animation: ah-appear var(--ah-appear); }

@media (max-width: 1100px) {
  .pg-grid, .pg[data-device="phone"] .pg-grid { grid-template-columns: 1fr; }
  .graph-card { position: static; }
}
@media (max-width: 700px) {
  .pg { padding: 64px 10px 30px; }
  .ev-grid { grid-template-columns: 1fr; }
  .app.phone { width: 100%; max-width: 390px; }
}

.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }

<script>
'use strict';
// ------------------------------------------------------------------
// The world: conversations and their host facts, as the rail sees them.
// st: work (agent works), reply (unread reply: Sinun vuorosi),
//     ask (question: Sinun vuorosi), idle (turn ended and read).
// ------------------------------------------------------------------
const BASE = [
  { id: 'a', title: 'Rivin tilakone', ws: 'open-habitat', st: 'idle',
    you: 'Katso miksi Sillä aikaa -rivi näkyy väärin ja piirrä se tilakoneena.',
    agent: 'Luin NextWaitingDockin ja kierroksen koodin. Rivin näkyvyys on kiinni lukituksessa, joka syttyy kun agentti työskentelee eikä sammu.' },
  { id: 'b', title: 'Julkaisun muistiinpanot', ws: 'open-habitat', st: 'reply',
    you: 'Kokoa 0.31:n julkaisumuistiinpanot TODO.md:n tarinasta.',
    agent: 'Muistiinpanot ovat valmiina tiedostossa docs/release-0.31.md. Kolme kohtaa jäi auki, katso ne ennen julkaisua.' },
  { id: 'c', title: 'Birch-päivitys', ws: 'fleetrepo', st: 'ask',
    you: 'Päivitä Birch uusimpaan julkaisuun.',
    agent: 'Lataus ja allekirjoituksen tarkistus menivät läpi.',
    q: 'Saanko käynnistää palvelun uudelleen nyt? Kaksi istuntoa on auki.' },
  { id: 'd', title: 'Palomuurin osoitteet', ws: 'fleetrepo', st: 'work',
    you: 'Lisää Aldern uusi julkinen osoite testipalvelimen sallittuihin.',
    agent: 'Haen nykyiset säännöt ja lisään osoitteen.' },
  { id: 'e', title: 'Kuvakaappaukset AVIFiksi', ws: 'open-habitat', st: 'idle',
    you: 'Muunna evidence-kuvat AVIFiksi.',
    agent: '14 kuvaa muunnettu ja tarkistettu. PNG:t poistettu vasta tarkistuksen jälkeen.' },
  { id: 'f', title: 'Laskujen arkistointi', ws: 'workspace', st: 'work',
    you: 'Arkistoi lokakuun laskut Driveen.',
    agent: 'Käyn postilaatikon läpi ja tallennan liitteet.' },
];

// ------------------------------------------------------------------
// Graph drawing: nodes are boxes, edges quadratic curves or self loops.
// ------------------------------------------------------------------
function anchor(n, tx, ty) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return [cx, cy];
  const sx = (n.w / 2 + 3) / Math.abs(dx || 1e-9), sy = (n.h / 2 + 3) / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return [cx + dx * s, cy + dy * s];
}
function graphSVG(g, on, hitEdge, lit) {
  const N = Object.fromEntries(g.nodes.map((n) => [n.id, n]));
  let edges = '', nodes = '';
  for (const e of g.edges) {
    const a = N[e.from], b = N[e.to];
    // an unlabelled edge is a second route of a drawn one: shown only when taken
    if (!e.label && hitEdge !== e) continue;
    const cls = ['g-edge', e.kind || '', hitEdge === e ? 'hit' : ''].join(' ');
    const ak = hitEdge === e ? 'hit' : e.kind || '';
    let d, lx, ly, ex, ey, ang;
    if (e.from === e.to) {
      const side = e.loop || 'top', off = e.off || 0;
      const cx = a.x + a.w / 2 + off, cy = a.y + a.h / 2 + off;
      const r = e.r || 34;
      if (side === 'top') { const x1 = cx - 22, x2 = cx + 22, y = a.y; d = `M${x1},${y} C${x1 - 14},${y - r} ${x2 + 14},${y - r} ${x2},${y - 3}`; lx = cx; ly = y - r * 0.78 - 4; ex = x2; ey = y - 3; ang = 90; }
      else if (side === 'bottom') { const x1 = cx - 22, x2 = cx + 22, y = a.y + a.h; d = `M${x1},${y} C${x1 - 14},${y + r} ${x2 + 14},${y + r} ${x2},${y + 3}`; lx = cx; ly = y + r * 0.78 + 12; ex = x2; ey = y + 3; ang = -90; }
      else if (side === 'right') { const y1 = cy - 12, y2 = cy + 12, x = a.x + a.w; d = `M${x},${y1} C${x + r},${y1 - 12} ${x + r},${y2 + 12} ${x + 3},${y2}`; lx = x + r * 0.8 + 4; ly = cy + 4; ex = x + 3; ey = y2; ang = 180; }
      else { const y1 = cy - 12, y2 = cy + 12, x = a.x; d = `M${x},${y1} C${x - r},${y1 - 12} ${x - r},${y2 + 12} ${x - 3},${y2}`; lx = x - r * 0.8 - 4; ly = cy + 4; ex = x - 3; ey = y2; ang = 0; }
    } else if (e.c || e.c2) {
      const c1 = e.c || e.c2[0], c2 = e.c || e.c2[1];
      const [x1, y1] = e.p0 || anchor(a, c1[0], c1[1]);
      const [x2, y2] = e.p1 || anchor(b, c2[0], c2[1]);
      d = e.c ? `M${x1},${y1} Q${c1[0]},${c1[1]} ${x2},${y2}` : `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`;
      const same = (c2[0] === x2 && c2[1] === y2);
      ex = x2; ey = y2; ang = Math.atan2(y2 - (same ? y1 : c2[1]), x2 - (same ? x1 : c2[0])) * 180 / Math.PI;
      [lx, ly] = e.l || [(x1 + x2) / 2, (y1 + y2) / 2];
    } else {
      const acx = a.x + a.w / 2, acy = a.y + a.h / 2, bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
      const mx = (acx + bcx) / 2, my = (acy + bcy) / 2;
      const len = Math.hypot(bcx - acx, bcy - acy) || 1;
      const nx = -(bcy - acy) / len, ny = (bcx - acx) / len;
      const bend = e.bend || 0;
      const qx = mx + nx * bend, qy = my + ny * bend;
      const [x1, y1] = anchor(a, qx, qy);
      const [x2, y2] = anchor(b, qx, qy);
      d = `M${x1},${y1} Q${qx},${qy} ${x2},${y2}`;
      lx = 0.25 * x1 + 0.5 * qx + 0.25 * x2; ly = 0.25 * y1 + 0.5 * qy + 0.25 * y2;
      ex = x2; ey = y2; ang = Math.atan2(y2 - qy, x2 - qx) * 180 / Math.PI;
    }
    if (e.l && e.from === e.to) [lx, ly] = e.l;
    lx += e.dx || 0; ly += e.dy || 0;
    const lines = e.label.split('\n');
    const anchorAttr = e.align || 'middle';
    const text = lines.map((t, i) => `<tspan x="${lx}" dy="${i ? 12 : 0}">${esc(t)}</tspan>`).join('');
    const badge = e.badge ? (() => {
      const bx = anchorAttr === 'start' ? lx - 12 : anchorAttr === 'end' ? lx + 12 : lx - (Math.max(...lines.map((t) => t.length)) * 2.6) - 12;
      return `<g class="bd"><circle cx="${bx}" cy="${ly - 4}" r="8"/><text x="${bx}" y="${ly - 0.5}" text-anchor="middle">${esc(e.badge)}</text></g>`;
    })() : '';
    edges += `<g class="${cls}" data-edge="${esc(e.from + '>' + e.to)}"><path d="${d}"/>` +
      `<polygon class="g-arrow ${ak}" points="0,0 -8,-4 -8,4" transform="translate(${ex},${ey}) rotate(${ang})"/>` +
      `<text x="${lx}" y="${ly}" text-anchor="${anchorAttr}">${text}</text>${badge}</g>`;
  }
  for (const n of g.nodes) {
    const cls = ['g-node', n.id === on ? 'on' : '', n.ghost ? 'ghost' : ''].join(' ');
    const subs = (n.sub || '').split('\n');
    nodes += `<g class="${cls}" data-node="${n.id}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9"/>` +
      `<text class="t" x="${n.x + n.w / 2}" y="${n.y + 18}" text-anchor="middle">${esc(n.label)}</text>` +
      subs.map((s, i) => `<text class="s" x="${n.x + n.w / 2}" y="${n.y + 33 + i * 12}" text-anchor="middle">${esc(s)}</text>`).join('') + '</g>';
  }
  return `<svg class="graph" viewBox="0 0 ${g.w} ${g.h}" role="img" aria-label="Tilakone">${edges}${nodes}</svg>`;
}

      { from: 'RD', to: 'R', on: ['send', 'start'], c: [350, 230], l: [356, 236], align: 'start', label: 'lähetät' },
      { from: 'R', to: 'RQ', on: ['ask'], c: [500, 200], l: [506, 214], align: 'start', label: 'kysyy' },
      { from: 'RQ', to: 'R', on: ['send', 'start'], c: [440, 250], l: [446, 262], align: 'start', label: 'vastaat' },
      { from: 'RD', to: 'P', on: ['open', 'openRail', 'reload', 'archiveThis', 'row'], c2: [[325, 470], [30, 470]], p0: [300, 364], p1: [40, 159], l: [170, 446], label: 'avaat muun / lataat' },
      { from: 'RQ', to: 'P', on: ['open', 'openRail', 'reload', 'archiveThis', 'row'], c2: [[555, 470], [30, 470]], p0: [555, 364], p1: [40, 159], l: [0, 0], label: '' },
      { from: 'RD', to: 'E', on: ['otherStop', 'archiveOther'], c: [470, 230], l: [0, 0], label: '' },
      { from: 'RQ', to: 'E', on: ['otherStop', 'archiveOther'], c: [555, 230], l: [563, 230], align: 'start', label: 'muut\nlakkaavat' },
    ],
  },
  defects: [
    ['✓', 'ok', 'Ei hyppimistä vuoron lopussa.', 'Rivi kertoo, mitä täällä tapahtui, ja tarjoaa silti seuraavan. Yksi sulkeva tapahtuma: lähtö.'],
    ['F', 'cost', 'Rivi houkuttelee pois keskustelusta, joka odottaa sinua.', 'Juuri tätä Jari moitti kuvassaan (kierros 1, virhe 1). Jos se oli vika, tämä suunta toistaa sen, mutta nyt rivi sanoo tilan ääneen.'],
  ],
  showsRow() { return ['R', 'RD', 'RQ'].includes(this.node()); },
  effect() { const t = this.t; if (t.win && t.win !== W.open) t.win = null; },
  node() {
    if (this.t.win !== W.open || !W.open) return 'P';
    if (!others().length) return 'E';
    const st = here().st;
    return st === 'work' ? 'R' : st === 'ask' ? 'RQ' : 'RD';
  },
  dock() {
    const n = this.node(), o = others();
    if (n === 'R') return sendRow();
    if (n === 'RD') return rowHTML({ label: 'Täällä valmis', title: `${o.length} odottaa yhä`, det: o.map((c) => c.title).join(', '), go: 'Avaa seuraava', act: 'row', quiet: true });
    if (n === 'RQ') return rowHTML({ label: 'Kysyy täällä', title: `${o.length} odottaa myös`, det: o.map((c) => c.title).join(', '), go: 'Avaa seuraava', act: 'row', quiet: true });
    return '';
  },
});

// ------------------------------------------------------------------
// The page: graph + events + app, re-rendered after every event.
// ------------------------------------------------------------------
const params = new URLSearchParams(location.search);
let theme = params.get('t') === 'dark' ? 'dark' : 'light';
let device = params.get('d') === 'phone' ? 'phone' : 'desktop';
let cur = 0, v = null, hit = null, logLine = 'Alku: tämä keskustelu (Rivin tilakone) on valmis ja luettu; kaksi odottaa sinua, kaksi työskentelee.';

function setParam(k, val) { const u = new URL(location); u.searchParams.set(k, val); history.replaceState(null, '', u); }

const EVENTS = [
  ['Tämä keskustelu', [
    ['send', 'Lähetä viesti'], ['sendFail', 'Lähetys epäonnistuu'], ['start', 'Agentti aloittaa'], ['finish', 'Agentti valmistuu'], ['ask', 'Agentti kysyy'], ['archiveThis', 'Arkistoi tämä'],
  ]],
  ['Muut keskustelut', [
    ['otherWait', 'Toinen alkaa odottaa'], ['otherStop', 'Toinen lakkaa odottamasta'], ['archiveOther', 'Arkistoi odottava'],
  ]],
  ['Selain', [
    ['reload', 'Lataa uudelleen'], ['resetAll', 'Alusta tarina'],
  ]],
];
const EVNAME = Object.fromEntries(EVENTS.flatMap(([, l]) => l));
Object.assign(EVNAME, { open: 'Avaat keskustelun raiteesta', row: 'Rivin painike', next: 'Seuraava', nextEnd: 'Seuraava viimeisen jälkeen', prev: 'Edellinen', end: 'Lopeta kierros', openStep: 'Avaat kierroksen askeleen', openOutside: 'Avaat keskustelun kierroksen ulkopuolelta', esc: 'Esc' });

function enabled(ev) {
  const h = here();
  switch (ev) {
    case 'send': return !!h;
    case 'sendFail': return !!h && W.justSent === W.open && h.st === 'work';
    case 'start': return !!h && h.st !== 'work';
    case 'finish': return !!h && h.st === 'work';
    case 'ask': return !!h && h.st === 'work';
    case 'archiveThis': return !!h;
    case 'otherWait': return W.convs.some((c) => c.id !== W.open && !waitsSt(c.st));
    case 'otherStop': case 'archiveOther': return others().length > 0;
    default: return true;
  }
}

function openConv(id) {
  const c = conv(id); if (!c) return;
  if (id !== W.open) v.onNavigate?.();
  if (c.st === 'reply') c.st = 'idle'; // opening marks the reply read
  W.open = id; W.railOpen = false;
}

function fire(ev, arg) {
  const before = v.node();
  let kind = ev, label = EVNAME[ev] || ev;
  if (ev === 'resetAll') return mount(cur);
  if (v.t.note && ev !== 'noop') v.t.note = '';
  W.justSent = ev === 'send' ? W.open : null;
  const h = here();
  switch (ev) {
    case 'send': if (h) { h.st = 'work'; v.onSend?.(); } break;
    case 'sendFail': if (h) { h.st = 'idle'; v.onSendFail?.(); } break;
    case 'fade': v.onFade?.(); label = '4 s kului'; break;
    case 'start': if (h) h.st = 'work'; break;
    case 'finish': if (h) h.st = 'idle'; break; // visible: the reply is seen at once
    case 'ask': if (h) h.st = 'ask'; break;
    case 'archiveThis': v.onNavigate?.(); W.convs = W.convs.filter((c) => c !== h); W.open = null; break;
    case 'otherWait': {
      const c = W.convs.find((c) => c.id !== W.open && c.st === 'work') || W.convs.find((c) => c.id !== W.open && !waitsSt(c.st));
      if (c) { c.st = 'reply'; W.convs = [...W.convs.filter((x) => x !== c), c]; label += `: ${c.title}`; }
      break;
    }
    case 'otherStop': { const c = others()[0]; if (c) { c.st = c.st === 'ask' ? 'work' : 'idle'; label += `: ${c.title} (vastattu toisella laitteella)`; } break; }
    case 'archiveOther': { const c = others()[0]; if (c) { W.convs = W.convs.filter((x) => x !== c); label += `: ${c.title}`; } break; }
    case 'reload': v.t = v.init(); break;
    case 'open': kind = v.classify('open', arg); label = `${EVNAME[kind]}: ${conv(arg).title}`; openConv(arg); break;
    default: {
      // the row's and bar's own actions
      const r = ev === 'step' ? v.goStep?.(arg) : v.act(ev);
      if (!r) return;
      kind = r.kind; label = EVNAME[kind] || kind;
      if (r.go) { openConv(r.go); label += ` → ${conv(r.go).title}`; }
    }
  }
  v.effect();
  const after = v.node();
  const cand = v.graph.edges.filter((e) => e.from === before && e.to === after);
  hit = cand.find((e) => e.on.includes(kind)) || (before !== after ? cand[0] : null) || null;
  logLine = `<b>${esc(label)}</b> · ${esc(nodeLabel(before))} → ${esc(nodeLabel(after))}${hit && hit.badge ? ` · ${hit.kind === 'bad' ? 'virhe' : 'hinta'} ${esc(hit.badge)}` : ''}`;
  render();
}
const nodeLabel = (id) => { const n = v.graph.nodes.find((n) => n.id === id); return n ? n.label + (n.id === 'W0' ? ' (ei muita)' : '') : id; };

function railHTML() {
  const y = yours(), run = W.convs.filter((c) => c.st === 'work'), rest = W.convs.filter((c) => c.st === 'idle');
  const item = (c) => `<li><a class="${c.id === W.open ? 'cur' : ''}" data-open="${c.id}"><span class="ball ${ballOf(c)}"></span><span class="tt">${esc(c.title)}<small>${esc(c.ws)}${c.st === 'ask' ? ' · kysyy' : c.st === 'reply' ? ' · uusi vastaus' : ''}</small></span></a></li>`;
  return `<div class="rail-brand"><i></i>Habitat</div>` +
    `<h4>Sinun vuorosi <span>${y.length || ''}</span></h4><ul>${y.map(item).join('')}</ul>` +
    `<h4>Käynnissä</h4><ul>${run.map(item).join('')}</ul>` +
    `<h4>Muut</h4><ul>${rest.map(item).join('')}</ul>`;
}
function convHTML(phone) {
  const h = here();
  if (!h) return `<header class="topbar"><button class="menu" data-act="rail" aria-label="Keskustelut">☰</button><h5>open-habitat</h5></header><div class="stream"><p class="empty-view">Keskustelu arkistoitiin. Valitse toinen raiteesta.</p></div>`;
  const chip = h.st === 'work' ? '<span class="chip work"><span class="ball work"></span>Työskentelee</span>'
    : h.st === 'ask' ? '<span class="chip you"><span class="ball you"></span>Kysyy sinulta</span>'
    : '<span class="chip">Sinun vuorosi</span>';
  const body = `<div class="msg-user"><p>${esc(h.you)}</p></div><div class="msg-agent"><p>${esc(h.agent)}</p></div>` +
    (h.st === 'ask' ? `<div class="ask-card"><b>Agentti kysyy</b>${esc(h.q || 'Jatkanko tästä?')}</div>` : '') +
    (h.st === 'work' ? `<div class="working-line"><span class="ball work"></span>Työskentelee…</div>` : '');
  const dock = v.dock(phone);
  return `<header class="topbar"><button class="menu" data-act="rail" aria-label="Keskustelut">☰</button><h5>${esc(h.title)}</h5><span class="ws">${esc(h.ws)}</span>${chip}</header>` +
    `<div class="stream">${body}</div>` +
    (dock ? `<div class="ah-next-waiting" data-testid="next-waiting">${dock}</div>` : '') +
    `<div class="composer"><div class="composer-box"><span>${h.st === 'ask' ? 'Vastaa agentille…' : 'Kirjoita agentille…'}</span>` +
    (h.st === 'work' ? `<button type="button" class="stop" data-ev="finish">Pysäytä</button>` : '') +
    `<button type="button" data-ev="send">Lähetä</button></div></div>`;
}

function render() {
  document.documentElement.dataset.theme = theme;
  const node = v.node();
  const phone = device === 'phone';
  const litBadge = hit && hit.badge;
  const app = `<div class="app${phone ? ' phone' : ''}${W.railOpen ? ' rail-open' : ''}" data-theme="${theme}"><aside class="rail">${railHTML()}</aside><section class="conv">${convHTML(phone)}</section></div>`;
  document.getElementById('stage').innerHTML =
    `<main class="pg" data-device="${device}">` +
    `<div class="pg-head"><h1>${esc(v.name)}</h1><span class="pg-axis">${esc(v.axis)}</span>` +
    `<div class="pg-toggles"><div class="seg" role="group" aria-label="Teema"><button data-theme-set="light" aria-pressed="${theme === 'light'}">Vaalea</button><button data-theme-set="dark" aria-pressed="${theme === 'dark'}">Tumma</button></div>` +
    `<div class="seg" role="group" aria-label="Laite"><button data-device-set="desktop" aria-pressed="${!phone}">Työpöytä</button><button data-device-set="phone" aria-pressed="${phone}">Puhelin</button></div></div></div>` +
    `<p class="pg-lead">${v.lead}</p>` +
    `<div class="pg-grid"><section class="card graph-card"><h2>Tilakone</h2><p class="sub">Korostettu laatikko on nykyinen tila, paksu viiva viimeisin siirtymä.</p>` +
    graphSVG(v.graph, node, hit) +
    `<div class="legend"><span><i></i>siirtymä</span><span><i class="hit"></i>viimeisin</span>${v.key === 'nykyinen' ? '<span><i class="bad"></i>virhe</span>' : '<span><i class="cost"></i>hinta</span>'}</div>` +
    `<ul class="notes">${v.defects.map(([b, k, t, d]) => `<li class="${litBadge === b ? 'lit' : ''}"><span class="badge ${k === 'cost' ? 'cost' : ''}" style="${k === 'ok' ? 'background:var(--ah-ok)' : ''}">${esc(b)}</span><span><b>${t}</b> ${d}</span></li>`).join('')}</ul></section>` +
    `<section><div class="card ev"><div class="ev-grid">${EVENTS.map(([g, list]) => `<div class="ev-group"><h3>${g}</h3><div class="btns">${list.map(([e, l]) => `<button type="button" class="evb${e === 'resetAll' ? ' reset' : ''}" data-ev="${e}" ${enabled(e) ? '' : 'disabled'}>${l}</button>`).join('')}</div></div>`).join('')}</div>` +
    `<div class="ev-log" role="status">${logLine}</div></div>` +
    (phone ? `<div class="phone-wrap">${app}</div>` : app) +
    `<p class="sub" style="margin-top:10px;color:var(--ah-muted);font-size:12px">Raiteen keskustelut avautuvat klikkaamalla (puhelimessa ☰). ${ALT}↓ ja Esc toimivat kuten tuotannossa${v.key === 'nykyinen' ? `, ${ALT}↑ askel taaksepäin` : ''}.</p></section></div></main>`;
}

function mount(i) {
  cur = i; v = VR[i]; W = fresh(); v.t = v.init(); hit = null;
  logLine = 'Alku: tämä keskustelu (Rivin tilakone) on valmis ja luettu; kaksi odottaa sinua (yksi kysyy), kaksi työskentelee. Aloita esimerkiksi Lähetä viesti.';
  v.effect();
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-ev],[data-act],[data-open],[data-step],[data-theme-set],[data-device-set]');
  if (!t || t.disabled || !document.getElementById('stage').contains(t)) return;
  if (t.dataset.themeSet) { theme = t.dataset.themeSet; setParam('t', theme); return render(); }
  if (t.dataset.deviceSet) { device = t.dataset.deviceSet; setParam('d', device); return render(); }
  if (t.dataset.ev) return fire(t.dataset.ev);
  if (t.dataset.open) return fire('open', t.dataset.open);
  if (t.dataset.step) return fire('step', +t.dataset.step);
  if (t.dataset.act === 'rail') { W.railOpen = !W.railOpen; return render(); }
  if (t.dataset.act) return fire(t.dataset.act);
});
document.addEventListener('keydown', (e) => {
  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); fire(e.key === 'ArrowDown' ? 'altDown' : 'altUp');
  } else if (e.key === 'Escape' && !e.altKey && !e.ctrlKey && !e.metaKey) fire('esc');
});

// ---------- picker (PICKER.md reference wiring) ----------
const VR = V.filter((x) => (x.rounds || [1]).includes(ROUND));
const variants = VR.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
// For screenshots: ?play=send,finish plays events after mount.
window.__play = (list) => { for (const x of list) { const [e, a] = x.split(':'); fire(e, a); } };
</script>
