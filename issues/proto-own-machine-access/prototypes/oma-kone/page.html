<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oma kone agentin käyttöön — prototyyppi</title>
<style>
/*TOKENS*/
/*PICKER_CSS*/

/* ---- Prototype chrome (not a contestant) ---- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0c0d0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.pc-bar {
  position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 50;
  display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: #16181b; color: #c9cdd2; font-size: 12px; border-bottom: 1px solid #262a2f;
  overflow-x: auto; white-space: nowrap;
}
.pc-group { display: inline-flex; align-items: center; gap: 2px; }
.pc-group > span { margin-right: 4px; color: #8a9097; }
.pc-group button {
  height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent;
  color: #aeb4ba; font: inherit; cursor: pointer;
}
.pc-group button:hover { background: rgba(255,255,255,.06); }
.pc-group button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: #fff; }
.pc-read { margin-left: auto; color: #8a9097; }
.pc-read b { color: #e6e9ec; font-weight: 500; }
#viewport { position: fixed; inset: 44px 0 64px 0; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
body.bare .pc-bar { display: none; }
body.bare #viewport { inset: 0; padding: 0; }
body.bare .proto-picker { display: none; }
#sizer { position: relative; flex: none; }
#frame {
  position: absolute; top: 0; left: 0; transform-origin: top left; overflow: hidden;
  background: var(--ah-bg); color: var(--ah-ink); font-family: var(--ah-font);
  font-size: var(--ah-size-body); line-height: var(--ah-lh-ui);
  box-shadow: 0 0 0 1px #2a2e33;
}
body.bare #frame { box-shadow: none; }

/* ---- App shell (production context, simplified) ---- */
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app { display: flex; height: 100%; position: relative; }
.rail {
  flex: none; width: var(--ah-rail-width); background: var(--ah-rail); border-right: 1px solid var(--ah-line);
  display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; font-size: var(--ah-size-ui); overflow: hidden;
}
.rail-head { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px; font-weight: 600; margin-bottom: 8px; }
.rail-ws { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; margin-top: 8px; color: var(--ah-muted); font-family: var(--ah-mono); font-size: var(--ah-size-meta); }
.rail-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); white-space: nowrap; overflow: hidden; cursor: pointer; }
.rail-item.sub { padding-left: 22px; }
.rail-item span { overflow: hidden; text-overflow: ellipsis; }
.rail-item:hover { background: var(--ah-hover); }
.rail-item.cur { background: var(--ah-current); box-shadow: inset 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); }
.rail-fill { flex: 1; }
.rail-account { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; border-top: 1px solid var(--ah-line); margin-top: 6px; padding-top: 6px; color: var(--ah-ink); cursor: pointer; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ah-accent-soft); color: var(--ah-accent-ink); font-size: 11px; font-weight: 600; flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ah-bg); }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; height: 49px; padding: 0 var(--ah-topbar-pad-inline); border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.topbar h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.burger { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--ah-r-md); color: var(--ah-muted); cursor: pointer; }
.burger svg.i { width: 20px; height: 20px; }
.scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---- Buttons (ControlButton look) ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ah-control-row); padding: 0 var(--ah-control-row-pad);
  border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-control); color: var(--ah-ink);
  font: inherit; font-size: var(--ah-control-row-font); font-weight: 500; white-space: nowrap; cursor: pointer;
}
.btn:hover { background: var(--ah-control-hover); }
.btn:disabled { color: var(--ah-disabled-fg); background: var(--ah-disabled-bg); cursor: default; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ah-ink-2); }
.btn.quiet:hover { background: var(--ah-hover); }
.btn.icon { width: var(--ah-control-row); padding: 0; }
.btn svg.i { width: 15px; height: 15px; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, summary:focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: var(--ah-focus-offset); }

/* ---- Segmented (production Segmented look) ---- */
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ah-ink-2); font: 500 12.5px var(--ah-font); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: var(--ah-hover); }
.seg button[aria-checked="true"] { background: var(--ah-surface); box-shadow: 0 0 0 1px var(--ah-line-strong); color: var(--ah-ink); font-weight: 600; }
.seg button:disabled { color: var(--ah-disabled-fg); cursor: default; text-decoration: line-through; }
.seg button:disabled:hover { background: transparent; }
.seg.mono button { font-family: var(--ah-mono); }

/* ---- Settings (Asetukset; Settings.css, simplified) ---- */
.settings { display: flex; gap: var(--ah-s8); padding: var(--ah-s5) 28px 40px; }
.s-nav { flex: none; width: 190px; display: flex; flex-direction: column; gap: 2px; font-size: var(--ah-size-ui); position: sticky; top: var(--ah-s5); align-self: flex-start; }
.s-nav .s-h { margin: var(--ah-s4) 10px; font-size: var(--ah-size-h1); font-weight: 600; }
.s-nav-i { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font-weight: 500; cursor: pointer; }
.s-nav-i:hover { background: var(--ah-hover); }
.s-nav-i.cur { background: var(--ah-current); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-current-line); }
.s-main { flex: 1; min-width: 0; max-width: 720px; }
.s-main > h2 { font-size: var(--ah-size-h2); margin: var(--ah-s4) 0 var(--ah-s4); }
.s-back { display: none; }
.s-intro { margin: 0 0 14px; color: var(--ah-muted); font-size: var(--ah-size-ui); line-height: 1.5; }
.s-h3 { margin: var(--ah-s6) 0 6px; font-size: var(--ah-size-ui); font-weight: 600; }
.s-h3 + .s-intro { margin-bottom: 10px; }
.s-card { border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); overflow: hidden; }
.s-card:has([data-open]) { overflow: visible; }
.s-card > * + * { border-top: 1px solid var(--ah-line-soft); }
.s-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(0, auto); gap: var(--ah-s3) var(--ah-s6); align-items: center; padding: var(--ah-s4) var(--ah-s5); font-size: var(--ah-size-ui); }
.s-row.icon { grid-template-columns: auto minmax(160px, 1fr) minmax(0, auto); }
.s-row.wide { grid-template-columns: 1fr; }
.s-lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.s-lbl strong { font-weight: 600; }
.s-desc { color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; }
.s-warn { grid-column: 1 / -1; margin: -4px 0 0; color: var(--ah-err); font-size: var(--ah-size-meta); line-height: 1.45; }
.s-val { display: flex; align-items: center; justify-content: flex-end; gap: var(--ah-s3); flex-wrap: wrap; min-width: 0; }
.s-row[data-landed] { animation: landed 2.4s ease-out both; }
@keyframes landed { 0%, 40% { background: var(--ah-accent-soft); } 100% { background: transparent; } }
.s-foot { padding: 10px var(--ah-s5); color: var(--ah-muted); font-size: var(--ah-size-meta); line-height: 1.45; background: var(--ah-surface-2); }
.s-foot b { color: var(--ah-ink-2); font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ah-ok); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-ok); }
.preview { padding: 14px var(--ah-s5) 16px; background: var(--ah-bg); }
.preview .lbl { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); margin-bottom: 6px; }
.preview .ah-recap { margin: 0; width: 100%; max-height: none; }
.s-actions { display: flex; justify-content: flex-end; padding: 10px var(--ah-s5); }

/* LetterMark (Integrations.css) */
.ig-mark { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font: 700 11px var(--ah-font); color: var(--ah-bg); }
.ig-mark.lg { width: 28px; height: 28px; border-radius: 7px; }
.ig-tone-0 { background: var(--ah-sunken); color: var(--ah-ink-2); box-shadow: inset 0 0 0 1px var(--ah-line); }
.ig-tone-1 { background: var(--ah-source-1); }
.ig-tone-2 { background: var(--ah-source-2); }

.s-nav-i.new::after { content: "uusi"; margin-left: auto; font-size: 10.5px; color: var(--ah-accent-ink); font-weight: 600; }

/* Phone settings: the section alone, with a back row (production at <= 760px). */
.ph .settings { display: block; padding: 10px 14px 32px; }
.ph .s-nav { display: none; }
.ph .s-back { display: inline-flex; margin: 0 0 4px -8px; }
.ph .s-main > h2 { margin-top: 4px; }
.ph .s-row, .ph .s-row.icon { grid-template-columns: 1fr; gap: 8px; }
.ph .s-row.icon .ig-mark { display: none; }
.ph .s-val, .ph .mp-anchor { justify-content: flex-start; }
.ph .seg { width: 100%; }
.ph .seg button { flex: 1; padding: 0 6px; }
.ph .mp-anchor { width: 100%; }

/* ---- Conversation ---- */
.conv { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.conv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline); min-height: 49px; border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.conv-head h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-head .ws { font-family: var(--ah-mono); font-size: var(--ah-size-meta); color: var(--ah-muted); }
.conv-head .grow { flex: 1; }
.conv-head .idle { font-size: var(--ah-size-meta); color: var(--ah-muted); display: inline-flex; align-items: center; gap: 6px; }
.conv-head .idle i { width: 7px; height: 7px; border-radius: 50%; background: var(--ah-muted); }
.stream { flex: 1; min-height: 0; overflow: hidden; padding: var(--ah-column-pad-block) var(--ah-column-pad-inline); display: flex; flex-direction: column; justify-content: flex-end; }
.col { width: 100%; max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto; display: grid; gap: 14px; }
.msg-user { justify-self: end; max-width: 80%; background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-xl); padding: 8px 12px; line-height: var(--ah-lh-body); }
.msg-agent p { margin: 0 0 8px; line-height: var(--ah-lh-body); }
.msg-agent .work { font-size: var(--ah-size-meta); color: var(--ah-muted); margin-bottom: 6px; }
.msg-agent code { font: var(--ah-size-code) var(--ah-mono); background: var(--ah-sunken); padding: 1px 4px; border-radius: 4px; }
.msg-agent pre { margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-sunken); font: var(--ah-size-code)/1.55 var(--ah-mono); color: var(--ah-ink-2); white-space: pre-wrap; }
.composer { flex: none; padding: var(--ah-composer-pad-block) var(--ah-column-pad-inline); }
.field { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin: 0 auto; min-height: var(--ah-composer-rest-height); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); color: var(--ah-faint); font-size: var(--ah-size-ui); }
.field .ph-t { flex: 1; }
.send { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--ah-accent); color: var(--ah-on-accent); }

/* ---- Recap card (RecapCard.tsx + components.css, verbatim geometry) ---- */
.rc-slot { flex: none; position: relative; width: min(calc(100% - 2 * var(--ah-column-pad-inline)), calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline))); margin: var(--ah-s2) auto 0; }
.pc-group select { height: 26px; border: 0; border-radius: 6px; background: rgba(255,255,255,.1); color: #fff; font: inherit; padding: 0 6px; }

/* ---- Round: own machine ---- */
.btn.primary { background: var(--ah-accent); border-color: var(--ah-accent); color: var(--ah-on-accent); }
.btn.primary:hover { background: var(--ah-accent-hover); }
.btn.primary:disabled { background: var(--ah-disabled-bg); border-color: var(--ah-control-line); color: var(--ah-disabled-fg); }
.btn.danger { color: var(--ah-err); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btns.end { justify-content: flex-end; }
.mono { font-family: var(--ah-mono); font-size: var(--ah-size-code); }
.muted { color: var(--ah-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: var(--ah-r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--ah-surface-2); color: var(--ah-ink-2); box-shadow: inset 0 0 0 1px var(--ah-line); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ah-ok-soft); color: var(--ah-ok); box-shadow: none; }
.pill.err { background: var(--ah-err-soft); color: var(--ah-err); box-shadow: none; }
.pill.wait { color: var(--ah-accent-ink); background: var(--ah-accent-soft); box-shadow: none; }
.pill.wait i { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: var(--ah-size-ui); }
.facts dt { color: var(--ah-muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.blk { padding: var(--ah-s4) var(--ah-s5); font-size: var(--ah-size-ui); display: grid; gap: 10px; }
.blk > p, .blk p { margin: 0; line-height: 1.5; }
.blk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.blk-head strong { font-weight: 600; }
.blk-head .grow { flex: 1; }
.copybox { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px; padding: 8px 8px 8px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-sunken); }
.copybox code { font: var(--ah-size-code)/1.55 var(--ah-mono); color: var(--ah-ink); white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.copybox .btn { height: 28px; padding: 0 9px; font-size: 12px; }
.copybox .btn[data-done] { color: var(--ah-ok); }
.fp { font: 600 var(--ah-size-code) var(--ah-mono); letter-spacing: .01em; overflow-wrap: anywhere; }
.note { padding: 10px 12px; border-radius: var(--ah-r-md); background: var(--ah-surface-2); border: 1px solid var(--ah-line-soft); color: var(--ah-ink-2); font-size: var(--ah-size-meta); line-height: 1.5; }
.note.err { background: var(--ah-err-soft); border-color: var(--ah-err-line); color: var(--ah-ink); }
.note.ok { background: var(--ah-ok-soft); border-color: transparent; color: var(--ah-ink); }
.note strong { font-weight: 600; }
.qr { width: 116px; height: 116px; flex: none; padding: 6px; background: #fff; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--ah-line); }
.qr svg { width: 100%; height: 100%; display: block; }
.login { display: flex; gap: 16px; align-items: center; }
.login .grow { flex: 1; min-width: 0; display: grid; gap: 8px; }
.ph .login .qr { display: none; }
.choices { display: grid; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); overflow: hidden; }
.choice { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; min-height: 44px; padding: 6px 12px 6px 10px; cursor: pointer; font-size: var(--ah-size-ui); }
.choice + .choice { border-top: 1px solid var(--ah-line-soft); }
.choice:hover { background: var(--ah-hover); }
.choice[aria-checked="true"] { background: var(--ah-accent-soft); }
.choice[aria-disabled="true"] { color: var(--ah-muted); cursor: not-allowed; }
.choice[aria-disabled="true"]:hover { background: transparent; }
.choice .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ah-line-strong); }
.choice[aria-checked="true"] .dot { border: 4px solid var(--ah-accent); }
.choice .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.choice .t small { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.choice .tag { font-size: 11.5px; color: var(--ah-muted); white-space: nowrap; }
.on-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ah-ok); margin-right: 5px; vertical-align: 1px; }
.off-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ah-faint); margin-right: 5px; vertical-align: 1px; }
.steps-mac { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.5; }
.steps-mac b { font-weight: 600; }
.mock { display: grid; gap: 0; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); overflow: hidden; font-size: var(--ah-size-meta); max-width: 420px; }
.mock > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; }
.mock > div + div { border-top: 1px solid var(--ah-line-soft); }
.mock .h { background: var(--ah-surface-2); font-weight: 600; }
.sw { width: 28px; height: 16px; border-radius: 9px; background: var(--ah-line-strong); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--ah-accent); }
.sw.on::after { left: 14px; }
.truths { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.truths li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; line-height: 1.5; font-size: var(--ah-size-ui); }
.truths li svg.i { margin-top: 3px; color: var(--ah-muted); }
.truths b { font-weight: 600; }
.explain { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: var(--ah-size-meta); color: var(--ah-ink-2); line-height: 1.45; }
.explain dt { font-family: var(--ah-mono); color: var(--ah-ink); }
.explain dd { margin: 0; }
details.more > summary { cursor: pointer; font-size: var(--ah-size-meta); color: var(--ah-ink-2); padding: 2px 0; }
details.more[open] > summary { margin-bottom: 8px; }
.tabs { display: flex; gap: 2px; }
.s-sub { margin: var(--ah-s6) 0 6px; font-size: var(--ah-size-ui); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.s-sub .grow { flex: 1; }
.removed { margin-top: 10px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--ah-line-strong); border-top-color: var(--ah-accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Machine card header */
.mc-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: var(--ah-s4) var(--ah-s5); }
.mc-head .nm { font-weight: 600; font-size: var(--ah-size-ui); }
.mc-head .sub { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.os-mark { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--ah-surface-2); box-shadow: inset 0 0 0 1px var(--ah-line); color: var(--ah-ink-2); }
.os-mark svg.i { width: 18px; height: 18px; }
.ph .mc-head { grid-template-columns: auto minmax(0, 1fr); }
.ph .mc-head .pill { grid-column: 1 / -1; justify-self: start; }

/* ---- Direction 1: the wizard dialog ---- */
.wz-scrim { position: absolute; inset: 0; z-index: 30; background: var(--ah-scrim); display: grid; place-items: center; padding: 24px; animation: fade .14s ease-out both; }
@keyframes fade { from { opacity: 0; } }

};

  { name: 'jarin-macbook-air', os: 'macOS', on: true, id: 'mac' },

const plus = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };

let W;

    removed: false, renew: false, wz: false, open: '', opening: false, adding: false, asked: [], until: plus(30), checked: '' };

  if (st === 'asleep') W.asleep = true;

  // A renewal opened straight from the URL (Käyttöönotto on an expired or revoked grant).

// ---- Icons ----

  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);

      <p>Kirjaudu omalla Tailscale-tunnuksellasi ja hyväksy laite <b class="mono">${NODE.name}</b>.${phone() ? '' : ' Voit myös skannata koodin puhelimella.'}</p>
      ${W.opening ? `<div class="btns"><span class="spin"></span><span class="s-desc">Odotetaan, että hyväksyt laitteen Tailscalessa…</span></div>`
        : `<div class="btns"><button class="btn primary" data-act="ts-open" data-testid="ts-open">${ic('ext')}Avaa kirjautumissivu</button><button class="btn quiet" data-act="ts-cancel">Peru</button></div>`}
      <span class="s-desc mono">${AUTH_URL}</span></div></div>`;
  return `<dl class="facts" data-testid="ts-facts">
      <dt>Laite</dt><dd class="mono">${NODE.name} · ${NODE.ip}</dd>
      <dt>Verkko</dt><dd>${NODE.tailnet} <span class="muted">(${NODE.login})</span></dd>

}
const tsPill = () => pill('ts-' + W.ts);

function tsInstall() {

}
function peerChoices() {

}
function expirySeg() {
  return `<div class="blk-head"><span>Pääsyn kesto</span><span class="grow"></span>${seg('exp', [[7, '7 pv'], [30, '30 pv'], [90, '90 pv']], W.exp)}</div><p class="s-desc" data-testid="until">Kone lakkaa hyväksymästä avainta ${fiDate(newUntil())}. Pääsyä voi jatkaa korvaamalla rivin.</p>`;
}
function remoteBlock() {
  if (S.os === 'mac') return `<ol class="steps-mac">
      <li>Avaa Macissa <b>Järjestelmäasetukset › Yleiset › Jakaminen</b>.</li>
      <li>Laita <b>Etäkirjautuminen</b> päälle ja avaa sen ⓘ-painike.</li>
      <li>Valitse <b>Salli pääsy: Vain nämä käyttäjät</b> ja jätä listaan vain ${M().user}.</li>

    <div class="mock" aria-label="Näin asetusten pitäisi näyttää"><div class="h">Etäkirjautuminen <span class="sw on"></span></div><div>Salli pääsy <span>Vain nämä käyttäjät: ${M().user}</span></div><div>Salli etäkäyttäjille täysi levyn käyttöoikeus <span class="sw"></span></div></div>`;
  return `<p>Asenna SSH-palvelin ja käynnistä se (Ubuntu ja Debian):</p>${copybox('sshd')}<p class="s-desc">Fedorassa paketti on sama, asennus <span class="mono">sudo dnf install openssh-server</span>.</p>`;

function lineBlock({ compact = false } = {}) {

    ${copybox('cmd', { testid: 'install-cmd' })}
    <details class="more"><summary>Pelkkä rivi ja mitä sen osat tarkoittavat</summary>${copybox('line', { testid: 'line' })}
      <dl class="explain" style="margin-top:8px">
        <dt>restrict</dt><dd>Ei porttien, agentin tai näytön välitystä eikä päätettä. Komennot toimivat.</dd>
        <dt>from="${NODE.ip}"</dt><dd>Kelpaa vain Habitatin osoitteesta Tailscale-verkossasi.</dd>
        <dt>expiry-time="${ymd(newUntil())}"</dt><dd>Kone lakkaa hyväksymästä avainta ${fiDate(newUntil())}.</dd>

}
function checkResult() {

  if (W.check === 'denied') return `<div class="note err" data-testid="denied"><strong>Kone ei hyväksy avainta vielä.</strong> Kone vastaa, mutta sanoo <span class="mono">Permission denied (publickey)</span>. Aja komento koneella käyttäjänä ${M().user} ja tarkista uudelleen.${S.os === 'mac' ? ' Jos ajoit sen, tarkista että etäkirjautuminen sallii käyttäjän ' + M().user + '.' : ''}</div>`;
  if (W.check === 'hostkey') return `<div class="note ok" data-testid="accepted"><strong>Kone hyväksyi avaimen.</strong> Vielä yksi tarkistus: koneen tunniste.</div>`;

}
const checkBtn = (label = 'Tarkista yhteys') => `<button class="btn${W.check === 'hostkey' ? '' : ' primary'}" data-act="check" data-testid="check"${W.check === 'checking' ? ' disabled' : ''}>${ic('refresh')}${label}</button>`;
function hostkeyBlock() {

  return `<p>Varmista, että Habitat puhuu oikean koneen kanssa. Aja koneella:</p>${copybox('hk')}
    <p>Tuloksessa pitää olla sama sormenjälki kuin tässä:</p><div class="copybox" data-testid="hostkey"><span class="fp">${M().hk}</span><span class="s-desc">ED25519</span></div>`;
}
const hkButtons = () => W.check === 'mismatch' ? '' : `<div class="btns"><button class="btn primary" data-act="hk-ok" data-testid="hk-ok">Täsmää, tallenna</button><button class="btn" data-act="hk-bad" data-testid="hk-bad">Ei täsmää</button></div>`;

// The machine once granted: what it is, until when, what ends it.
function machineFacts() {
  const m = M(), st = mstate();
  const until = st === 'expired' ? `<span style="color:var(--ah-err)">Päättyi ${fiDate(W.until)}</span>` : fiDate(W.until);

  return `<dl class="facts" data-testid="machine-facts">
    <dt>Pääsy päättyy</dt><dd>${until}</dd>

    <dt>Koneen tunniste</dt><dd class="mono">${m.hk}</dd>

    <dt>Tailscalessa</dt><dd>${W.asleep ? '<span class="off-dot"></span>viimeksi paikalla 2 h sitten' : `<span class="on-dot"></span>${peer && peer.on ? 'paikalla' : 'ei paikalla'}`}</dd>

}
function stateNote() {
  const st = mstate(), m = M();

  if (st === 'asleep') return `<div class="note" data-testid="asleep-note"><strong>${esc(m.peer)} ei vastaa.</strong> Kone on luultavasti unessa tai Tailscale on suljettu. Agentti yrittää uudelleen, kun pyydät.</div>`;

}

function removeConfirm() {

    <div class="btns end"><button class="btn quiet" data-act="cancel">Peru</button><button class="btn danger" data-act="remove-yes" data-testid="remove-yes">Poista kone</button></div></div>`;
}
const renewLabel = () => (W.grant === 'revoked' ? 'Yhdistä uudelleen' : 'Uusi pääsy');
function machineHead() {

  return `<div class="mc-head"><span class="os-mark">${ic(m.icon)}</span><span style="min-width:0"><div class="nm mono">${esc(m.peer)}</div><div class="sub">${m.os} · ${m.ip}</div></span>${pill(mstate())}</div>`;
}
function machineActions(extra = '') {

}
function removedNote() {
  if (!W.removed) return '';
  return `<div class="note removed" data-testid="removed-note"><strong>Kone poistettu Habitatista.</strong> Poista vielä rivi koneelta, niin pääsy loppuu varmasti:<div style="margin-top:8px">${copybox('rm')}</div></div>`;
}

const intro = `<h2>Omat koneet</h2><p class="s-intro">Agentti voi käyttää omaa tietokonettasi SSH:lla oman Tailscale-verkkosi kautta, esimerkiksi tarkistaakseen asetuksia tai avatakseen tiedoston. Koneellesi ei asenneta mitään Habitatin omaa.</p>`;

// ---- 1 Ohjattu: the settings page summarises; a step-by-step dialog does the setup ----
const WZ_STEPS = ['Tailscale', 'Kone', 'Etäkirjautuminen', 'Avainrivi', 'Vahvistus'];
function sectionWizard() {
  const st = mstate();
  let machine;
  if (st === 'none') machine = `<div class="s-card"><div class="blk"><p class="muted">Ei yhdistettyjä koneita.</p><div class="btns"><button class="btn primary" data-act="wz-open" data-testid="add-machine"${W.ts === 'missing' ? ' disabled' : ''}>${ic('plus')}Lisää kone</button><span class="s-desc">Noin viisi minuuttia. Tarvitset koneen viereesi.</span></div></div></div>`;
  else if (st === 'setup' || st === 'renew') machine = `<div class="s-card"><div class="blk"><div class="blk-head"><strong>${st === 'renew' ? 'Pääsyn uusiminen kesken' : 'Käyttöönotto kesken'}</strong><span class="grow"></span>${pill(st)}</div><p class="muted">Vaihe ${Math.min(W.step, 5)}/5: ${WZ_STEPS[Math.min(W.step, 5) - 1]}${W.peer ? ` · ${esc(W.peer)}` : ''}</p><div class="btns"><button class="btn primary" data-act="wz-open" data-testid="wz-continue">Jatka</button></div></div></div>`;
  else machine = `<div class="s-card" data-testid="machine">${machineHead()}<div class="blk">${stateNote()}${machineFacts()}<details class="more"><summary>Mitä yhteys antaa</summary>${truths({ short: true })}</details>${cutDetails()}</div>${R.confirm === 'remove' ? removeConfirm() : machineActions()}</div>`;
  return `${intro}
    <div class="s-card" data-testid="ts-card"><div class="s-row"><span class="s-lbl"><strong>Tailscale</strong><span class="s-desc">${W.ts === 'on' ? `${NODE.name} verkossa ${NODE.tailnet}` : 'Habitatin yhteys omaan verkkoosi'}</span></span><span class="s-val">${tsPill()}</span></div>
      ${W.ts === 'on' ? `<div class="blk">${tsBlock()}</div>` : ''}</div>
    <div class="s-sub">Koneet</div>${machine}${removedNote()}`;
}
function wizard() {
  if (!W.wz) return '';
  const st = mstate(), step = W.step, renew = st === 'renew' || (W.renewDone && step === 6);
  const steps = WZ_STEPS.map((l, i) => `<span class="wz-step${i + 1 === step ? ' cur' : ''}${i + 1 < step ? ' done' : ''}"><b>${i + 1 < step ? ic('check') : i + 1}</b><span>${l}</span></span>`).join('');
  let body, next = '', back = step > 1 && step < 6 && !(renew && step === 4);
  if (step === 1) { body = `<h3>Liitä Habitat omaan Tailscale-verkkoosi</h3>${tsBlock()}`; next = W.ts === 'on' ? 'ok' : 'off'; }
  else if (step === 2) { body = `<h3>Valitse kone</h3>${osTabs()}${tsInstall()}${peerChoices()}${expirySeg()}`; next = W.peer ? 'ok' : 'off'; }
  else if (step === 3) { body = `<h3>Salli etäkirjautuminen ${S.os === 'mac' ? 'Macissa' : 'koneella'}</h3><p>Agentti ottaa yhteyden tavallisella SSH:lla. Sinä päätät koneella, kuka saa kirjautua.</p>${remoteBlock()}`; next = 'ok'; }
  else if (step === 4) { body = `<h3>${renew ? `Uusi pääsy: ${esc(W.peer)}` : 'Lisää avainrivi koneelle'}</h3>${renew ? expirySeg() : ''}${lineBlock()}<div class="btns">${checkBtn()}</div>${checkResult()}`; next = W.check === 'hostkey' ? 'ok' : 'off'; }
  else if (step === 5) { body = `<h3>Vahvista koneen tunniste</h3>${hostkeyBlock()}<div class="note"><strong>Ennen kuin tallennat</strong>${truths()}</div>`; }
  else body = `<div class="note ok" data-testid="wz-done"><strong>${esc(W.peer)} on yhdistetty.</strong> Agentti voi käyttää sitä ${fiDate(W.until)} asti.</div><p>Pyydä keskustelussa agenttia katsomaan jotain koneeltasi. Näet asetuksista, milloin pääsy päättyy ja miten sen katkaisee.</p>${truths()}`;
  const foot = step === 6
    ? `<span class="grow"></span><button class="btn primary" data-act="wz-close" data-testid="wz-finish">Valmis</button>`
    : step === 5 ? `${back ? `<button class="btn quiet" data-act="wz-back">Takaisin</button>` : ''}<span class="grow"></span>${hkButtons()}`
    : `${back ? `<button class="btn quiet" data-act="wz-back">Takaisin</button>` : ''}<span class="hint">Vaihe ${step}/5</span><span class="grow"></span><button class="btn primary" data-act="wz-next" data-testid="wz-next"${next === 'ok' ? '' : ' disabled'}>Seuraava</button>`;
  return `<div class="wz-scrim" data-act="wz-scrim"><div class="wz" role="dialog" aria-modal="true" aria-label="Lisää kone" data-testid="wizard">
    <div class="wz-head"><h2>${renew ? renewLabel() : 'Lisää kone'}</h2><button class="btn quiet icon" data-act="wz-close" aria-label="Sulje">${ic('cross')}</button></div>
    <div class="wz-steps">${steps}</div><div class="wz-body" data-testid="wz-step-${step}">${body}</div><div class="wz-foot">${foot}</div></div></div>`;
}

// ---- 2 Tilasivu: one page; the machine card is a checklist that also diagnoses ----
function ckRows() {
  const st = mstate(), granted = ['active', 'asleep'].includes(st);
  const lineOk = granted || W.check === 'hostkey' || (st === 'renew' && false);
  const rows = [
    { id: 'kone', t: 'Kone Tailscale-verkossa', sub: W.peer ? `${W.peer}${W.grant === 'none' ? `, pääsy ${W.exp} pv` : ''}` : 'Valitse kone ja pääsyn kesto',
      s: W.peer ? 'ok' : 'todo', lbl: W.peer ? 'Valittu' : 'Valitse', body: () => `${W.peer && W.grant !== 'none' ? '' : `${osTabs()}${tsInstall()}${peerChoices()}${expirySeg()}`}${W.peer && W.grant !== 'none' ? `<p>Kone on verkossasi nimellä <span class="mono">${W.peer}</span> (${M().ip}).</p>` : ''}` },
    { id: 'remote', t: S.os === 'mac' ? 'Etäkirjautuminen päällä' : 'SSH-palvelin käynnissä', sub: 'Vain käyttäjälle ' + M().user + (S.os === 'mac' ? ', ilman täyttä levyn käyttöoikeutta' : ''),
      s: granted || W.check === 'hostkey' || W.check === 'denied' || st === 'expired' || (st === 'renew') ? 'ok' : st === 'revoked' ? 'unk' : 'todo',
      lbl: granted || W.check === 'hostkey' || W.check === 'denied' || st === 'expired' || st === 'renew' ? 'Kone vastaa' : st === 'revoked' ? 'Ei tiedossa' : 'Ei tarkistettu', body: remoteBlock },
    { id: 'line', t: 'Avainrivi koneella', sub: st === 'renew' || W.grant === 'none' ? `Voimassa ${fiDate(newUntil())} asti` : `Voimassa ${fiDate(W.until)} asti`,
      s: st === 'expired' || st === 'revoked' || W.check === 'denied' ? 'err' : lineOk ? 'ok' : 'todo',
      lbl: st === 'expired' ? `Vanheni ${fiDate(W.until)}` : st === 'revoked' ? 'Kone hylkää avaimen' : W.check === 'denied' ? 'Kone ei hyväksy' : lineOk ? 'Kelpaa' : 'Ei tarkistettu',
      body: () => `${st === 'expired' || st === 'revoked' || st === 'renew' ? `${stateNote()}${expirySeg()}` : ''}${lineBlock()}${checkResult()}` },
    { id: 'hostkey', t: 'Koneen tunniste vahvistettu', sub: W.pinned ? `${M().hk.slice(0, 22)}…` : 'Vertaa sormenjälki koneella', s: W.pinned ? 'ok' : W.check === 'mismatch' ? 'err' : 'todo',
      lbl: W.pinned ? 'Vahvistettu 29.10.' : W.check === 'mismatch' ? 'Ei täsmännyt' : W.check === 'hostkey' ? 'Odottaa sinua' : 'Ei vielä',
      body: () => (W.pinned ? `<p>Habitat tallensi tunnisteen <span class="mono">${M().hk}</span> ja hylkää yhteyden, jos kone vaihtuu.</p>` : W.check === 'hostkey' || W.check === 'mismatch' ? `${hostkeyBlock()}${hkButtons()}` : '<p class="muted">Tämä tulee vastaan, kun kone hyväksyy avaimen.</p>') },
  ];
  return rows;
}
function checklist() {
  const rows = ckRows();
  const first = rows.find(r => r.s === 'err') || rows.find(r => r.s !== 'ok');
  const open = W.open === '-' ? null : W.open || (first && first.id);
  const mark = s => `<span class="ck-mark ${s === 'ok' ? 'ok' : s === 'err' ? 'err' : ''}">${s === 'ok' ? ic('check') : s === 'err' ? ic('cross') : ''}</span>`;
  const done = rows.filter(r => r.s === 'ok').length;
  return `<div class="ck" data-testid="checklist">${rows.map(r => `<div class="ck-row" data-ck="${r.id}"${open === r.id ? ' data-open' : ''}>
      <div class="ck-sum" data-act="ck" data-v="${r.id}" role="button" tabindex="0" aria-expanded="${open === r.id}">${mark(r.s)}<span class="t"><span>${r.t}</span><small>${esc(r.sub)}</small></span><span class="ck-state ${r.s === 'ok' ? 'ok' : r.s === 'err' ? 'err' : ''}">${r.lbl}</span>${ic('chev', 'chev')}</div>
      ${open === r.id ? `<div class="ck-body">${r.body()}</div>` : ''}</div>`).join('')}
    <div class="ck-bar"><span>${done}/4 kunnossa${W.checked ? ` · tarkistettu klo ${W.checked}` : ''}</span><span class="grow"></span>${W.check === 'checking' ? `<span class="spin"></span>Tarkistetaan…` : `<button class="btn sm" data-act="check" data-testid="check">${ic('refresh')}Tarkista nyt</button>`}</div></div>`;
}
function sectionPage() {
  const st = mstate();
  let machine;

// Which stage the setup conversation has reached; history stays once a stage is passed.
function agentStage() {
  if (W.ts === 'missing') return 'missing';
  if (W.ts === 'off') return 'start';
  if (W.ts === 'waiting') return 'login';
  const st = mstate();
  if (st === 'renew') return W.check === 'denied' ? 'renew-denied' : 'renew';
  if (st === 'setup' || st === 'none') {
    if (!W.peer) return 'peer';
    if (W.check === 'mismatch') return 'mismatch';
    if (W.check === 'hostkey') return 'hostkey';
    if (W.check === 'denied') return 'denied';
    return 'line';
  }
  return 'done';
}
const ORDER = ['start', 'login', 'peer', 'line', 'denied', 'hostkey', 'mismatch', 'done'];
const toolRow = (cmd, res, { err = false, out = '' } = {}) => `<div class="tool"><div class="tool-h">${W.peer || M().peer ? `<span class="mchip">${ic(M().icon)}${esc(M().peer)}</span>` : ''}<code>${esc(cmd)}</code><span class="x${err ? ' err' : ''}">${res}</span></div>${out ? `<pre>${esc(out)}</pre>` : ''}</div>`;
const ANSWERS = {

  fda: ['Mitä täysi levyn käyttöoikeus tarkoittaa?', `<p>Jos se on päällä, etäkirjautunut ohjelma pääsee myös kansioihin, joita macOS muuten suojaa: Työpöytä, Dokumentit, Mail ja Viestit. Kun jätät sen pois, macOS kysyy tai kieltää, ja minä näen lähinnä asetukset ja ne tiedostot, jotka annat erikseen.</p>`],
};

const HEIGHTS = { 1280: 800, 390: 844 };

const sizer = document.getElementById('sizer');
const stage = document.getElementById('frame');
function frameSize() {

}
function layoutFrame() {

  const s = S.w === 'oma' || bare ? 1 : Math.min(1, (viewport.clientWidth - 24) / fw, (viewport.clientHeight - 84) / fh);

  else if (act === 'remove-yes') { R.confirm = ''; W.grant = 'none'; W.peer = null; W.adding = false; W.pinned = false; W.removed = true; W.renew = false; W.step = 1; W.asleep = false; }

  }

  else if (act === 'wz-next') { if (!t.disabled) W.step = Math.min(6, W.step + 1); }
