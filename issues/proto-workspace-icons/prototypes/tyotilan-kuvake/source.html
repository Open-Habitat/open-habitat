<style>
/* ---------- Harness chrome (not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #2a2d31; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #ddd; overflow: hidden; }
.h-bar { position: fixed; inset: 0 0 auto 0; height: 40px; white-space: nowrap; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #1c1e21; border-bottom: 1px solid #000; z-index: 50; }
.h-bar b { font-weight: 600; color: #fff; margin-right: 6px; }
.h-seg { display: inline-flex; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
.h-seg button, .h-btn { background: transparent; color: #bbb; border: 0; padding: 5px 9px; white-space: nowrap; font: inherit; cursor: pointer; }
.h-seg button + button { border-left: 1px solid #444; }
.h-seg button[aria-pressed="true"] { background: #3d4248; color: #fff; }
.h-btn { border: 1px solid #444; border-radius: 6px; }
.h-label { color: #888; }

#stage { position: fixed; inset: 40px 0 0 0; overflow: auto; }

/* ---------- App shell, after web/src/components/components.css ---------- */
.app { font-family: var(--ah-font); color: var(--ah-ink); background: var(--ah-bg); -webkit-font-smoothing: antialiased; }

.shell { display: grid; grid-template-columns: var(--ah-rail-width) minmax(0, 1fr); height: 100%; }

.frame-desktop { position: absolute; inset: 0; }
.frame-phone-wrap { min-height: 100%; display: grid; place-items: start center; padding: 18px 0 90px; background: #2a2d31; }
.frame-phone { position: relative; width: 390px; height: min(780px, calc(100vh - 150px)); border-radius: 34px; border: 10px solid #0d0e10; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.frame-phone .app { position: absolute; inset: 0; }

.ah-rail { --ah-surface-hover: var(--ah-control-hover); min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ah-rail); border-right: 1px solid var(--ah-line); font-size: var(--ah-size-ui); line-height: var(--ah-lh-ui); height: 100%; }
.ah-rail-head { display: grid; gap: var(--ah-s3); padding: 11px 10px var(--ah-s3); border-bottom: 1px solid var(--ah-line-soft); }

.ah-status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.ah-iconbtn { margin-left: auto; display: inline-grid; place-items: center; width: var(--ah-control-row); height: var(--ah-control-row); border-radius: var(--ah-r-md); border: 1px solid var(--ah-control-line); background: transparent; color: var(--ah-ink-2); cursor: pointer; }
.ah-iconbtn svg, .ah-qbtn svg { width: 16px; height: 16px; }
.ah-qbtn { display: inline-grid; place-items: center; width: var(--ah-control-row); height: var(--ah-control-row); border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-ink-2); cursor: pointer; }
.ah-qbtn:hover, .ah-iconbtn:hover { background: var(--ah-control-hover); }
.ah-home { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink); font-size: 13px; text-decoration: none; }
.ah-home svg { width: 16px; height: 16px; color: var(--ah-ink-2); }
.ah-rail-content { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; padding: 8px 8px var(--ah-s5); }
.ah-now { display: grid; gap: 1px; min-width: 0; margin-bottom: var(--ah-s3); }
.ah-now ul, .ws-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; padding: 0; list-style: none; }
.sec-head { display: flex; align-items: center; gap: var(--ah-s2); margin: 0 0 2px; padding-inline: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ah-ink-2); }
.cnt { color: var(--ah-muted); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
.cnt-att { min-width: 18px; padding: 0 6px; border-radius: var(--ah-r-pill); background: var(--ah-accent); color: var(--ah-on-accent); font-weight: 600; line-height: 18px; text-align: center; }
.empty { margin: 0; padding: 2px 8px 6px; color: var(--ah-muted); font-size: 12px; }

/* one conversation row */
.row { position: relative; }
.row > a { display: flex; align-items: center; gap: 8px; min-height: 24px; padding: 0 8px 0 10px; border-radius: var(--ah-r-nav); color: var(--ah-ink); font-size: 13px; text-decoration: none; cursor: pointer; }
.row > a:hover { background: var(--ah-control-hover); }
.row > a[aria-current="page"] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line) inset; }
.row[data-ball="done"] > a { color: var(--ah-ink-2); }
.row .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row .t1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { display: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ah-muted); font-size: 11.5px; line-height: 1.2; }

.ball-you { background: var(--ah-turn); }

.ball-fail { border-radius: 1px; background: var(--ah-err); transform: scale(.9) rotate(45deg); }
.grp { display: grid; }
.grp + .grp { margin-top: 5px; }
.fold { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 24px; padding: 0 8px 0 12px; border: 0; border-radius: var(--ah-r-nav); background: transparent; color: var(--ah-muted); font-size: 12px; text-align: left; cursor: pointer; }
.fold:hover { background: var(--ah-control-hover); color: var(--ah-ink-2); }
.fold .chev { width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); flex: none; }
.fold[aria-expanded="true"] .chev { transform: rotate(45deg); }
.fold .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold.ws .lbl { font-family: var(--ah-mono); }
.fold.in-grp { padding-left: 34px; }
.rule { display: flex; align-items: center; gap: 8px; margin: 8px 8px 2px; color: var(--ah-muted); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; }
.rule::after { content: ""; flex: 1; height: 1px; background: var(--ah-line); }

/* workspaces list */
.ws-sec { display: grid; gap: 2px; min-width: 0; }
.ws-sec .sec-head { justify-content: space-between; padding-inline-end: 0; }
.filter { margin: 0 0 4px; }
.filter input { width: 100%; height: 30px; padding: 0 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink); font: 400 12.5px/1 var(--ah-font); }
.ws-row { position: relative; display: flex; align-items: center; }
.ws-row > a { display: flex; flex: 1; align-items: center; gap: var(--ah-s2); min-width: 0; min-height: 30px; padding: 4px 8px; border-radius: var(--ah-r-nav); font-size: 12.5px; color: var(--ah-ink); text-decoration: none; cursor: pointer; }
.ws-row > a:hover { background: var(--ah-control-hover); }
.ws-row > a[aria-current="page"] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line) inset; }
.ws-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-row .src-dot { color: var(--ah-muted); font-size: 10.5px; font-family: var(--ah-mono); }
.ah-rail-foot { padding: 8px 10px; border-top: 1px solid var(--ah-line-soft); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--ah-accent-soft); color: var(--ah-accent-ink); display: grid; place-items: center; font-size: 11px; }

/* compact strip */
.ah-rail.compact .ah-rail-head { padding: 10px 0; border: 0; justify-items: center; }
.ah-rail.compact .ah-rail-content { align-items: center; padding-inline: 0; }
.dots, .dots ul { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0; padding: 0; list-style: none; }
.dots hr { width: 24px; margin: 4px 0; border: 0; border-top: 1px solid var(--ah-line); }
.dot { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--ah-r-md); cursor: pointer; text-decoration: none; color: inherit; }
.dot:hover { background: var(--ah-control-hover); }
.dot[aria-current="page"] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line) inset; }
.dot .ball { position: absolute; right: 2px; bottom: 3px; transform: scale(.9); box-shadow: 0 0 0 2px var(--ah-rail); }
.dot .ball-work { box-shadow: 0 0 0 2px var(--ah-rail); }
.dot .ball-fail { transform: scale(.8) rotate(45deg); }

/* ---------- workspace icon ---------- */
.wi { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; line-height: 1; user-select: none; }
.wi-emoji { font-size: 13px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.wi-logo img { width: 100%; height: 100%; display: block; border-radius: 3px; }
.wi-mono { border-radius: 4px; background: color-mix(in srgb, var(--hue) 15%, var(--ah-surface)); color: var(--hue); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hue) 32%, transparent) inset; font: 600 8px/1 var(--ah-font); letter-spacing: -.02em; }
.wi.m { width: 22px; height: 22px; }
.wi-emoji.m { font-size: 18px; }

.wi.l { width: 40px; height: 40px; }
.wi-emoji.l { font-size: 30px; }

.wi-logo.l img { border-radius: 8px; }
.hue-0 { --hue: #2b7f8c; } .hue-1 { --hue: #185e87; } .hue-2 { --hue: #71419b; } .hue-3 { --hue: #216142; }
.hue-4 { --hue: #8a4b16; } .hue-5 { --hue: #9b3d73; } .hue-6 { --hue: #4a5a6b; } .hue-7 { --hue: #5c6a1a; }
[data-theme="dark"] .hue-0 { --hue: #4fa6b4; } [data-theme="dark"] .hue-1 { --hue: #9acced; } [data-theme="dark"] .hue-2 { --hue: #c7a3ed; } [data-theme="dark"] .hue-3 { --hue: #93d3ad; }
[data-theme="dark"] .hue-4 { --hue: #edba8d; } [data-theme="dark"] .hue-5 { --hue: #e7a3c8; } [data-theme="dark"] .hue-6 { --hue: #aab6c3; } [data-theme="dark"] .hue-7 { --hue: #c3cf7e; }

/* Hymiö: the name is a tooltip on the emoji; on the phone a second line. */
.tip { cursor: default; }
#tip { position: fixed; z-index: 60; display: none; padding: 3px 8px; border-radius: 6px; background: #16191d; color: #f6f7f8; font: 500 11.5px/1.35 "JetBrains Mono", ui-monospace, monospace; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#tip[data-theme="dark"] { background: #e6e9ec; color: #14171a; }

.v-emoji.phone .row .t2 { display: block; }
.phone .row > a { min-height: 40px; font-size: 14px; }
.phone .fold { min-height: 36px; }
.phone .fold.in-grp { padding-left: 38px; }

/* Monogrammi: the tile carries the state ball; hovering it opens the name. */
.v-mono .row .lead { position: relative; flex: none; display: grid; place-items: center; width: 20px; height: 18px; }
.v-mono .row .lead .wi { width: 18px; height: 17px; font-size: 8.5px; }
.v-mono .row .lead .ball { position: absolute; right: -3px; bottom: -2px; width: 7px; height: 7px; box-shadow: 0 0 0 1.5px var(--ah-rail); }

.v-mono .row > a[aria-current="page"] .lead .ball { box-shadow: 0 0 0 1.5px var(--ah-current); }
.pill { position: absolute; left: 6px; top: 50%; z-index: 4; display: none; align-items: center; gap: 6px; height: 20px; padding: 0 8px 0 3px; transform: translateY(-50%); border-radius: 6px; background: color-mix(in srgb, var(--hue) 14%, var(--ah-surface)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hue) 35%, transparent) inset, var(--ah-shadow-float); color: var(--hue); font: 600 11.5px/1 var(--ah-mono); white-space: nowrap; pointer-events: none; animation: ah-appear var(--ah-appear); }
.pill .wi { box-shadow: none; background: transparent; }
.v-mono .row .lead:hover + .pill, .v-mono .row.pill-open .pill { display: inline-flex; }
.v-mono .grp:hover .lead .wi-mono { box-shadow: 0 0 0 1.5px var(--hue) inset; }
.v-mono.phone .row .lead { width: 26px; height: 24px; }
.v-mono.phone .row .lead .wi { width: 24px; height: 22px; font-size: 10px; border-radius: 6px; }

/* Lähdeketju: the icon is its own button; it opens a card with the name. */
.row.has-pre { display: flex; align-items: center; }
.row.has-pre > a { flex: 1; min-width: 0; padding-left: 4px; }
.icbtn { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; margin: 0 0 0 4px; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
.icbtn:hover { background: var(--ah-control-hover); box-shadow: 0 0 0 1px var(--ah-line-strong) inset; }
.phone .icbtn { width: 34px; height: 34px; margin: 0; }
.phone .icbtn .wi { width: 20px; height: 20px; }
.phone .icbtn .wi-emoji { font-size: 16px; }
.pop { position: fixed; z-index: 30; width: 250px; padding: 12px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); animation: ah-appear var(--ah-appear); }
.pop-head { display: flex; align-items: center; gap: 10px; }
.pop-head strong { font: 600 13px/1.3 var(--ah-mono); overflow-wrap: anywhere; }

.pop .mi:hover { background: var(--ah-surface-hover); }
.pop .mi svg { width: 16px; height: 16px; flex: none; color: var(--ah-ink-2); }
.sheet-scrim { position: absolute; inset: 0; z-index: 29; background: var(--ah-scrim); }
.phone .pop { position: absolute; left: 0; right: 0; bottom: 0; top: auto; width: auto; border-radius: 16px 16px 0 0; padding: 16px 16px 28px; }

/* ---------- main area ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ah-bg); }

.crumb:hover { background: var(--ah-control-hover); color: var(--ah-ink-2); }

.ws-page { flex: 1; overflow: auto; padding: 26px var(--ah-column-pad-inline); }

.prev { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 14px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-rail); }

const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {

  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;

  });
  moveHighlight();
  const url = new URL(location);

}

});

  if (b.dataset.hView) { S.view = b.dataset.hView; S.pop = null; S.pill = null; setUrl("view", S.view); }
  else if (b.dataset.hTheme) { S.theme = b.dataset.hTheme; setUrl("theme", S.theme); }
  else if (b.hasAttribute("data-h-reset")) { const v = S.view, t = S.theme; S = fresh(); S.view = v; S.theme = t; }
  rerender();
});
stage.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, dir = dirKeys[current];
  if (act === "close" && e.target !== el) return; // clicks inside the dialog card
  switch (act) {
    case "sel":
      if (dir === "mono" && S.view === "phone" && e.target.closest(".lead")) { e.preventDefault(); S.pill = S.pill === el.dataset.id ? null : el.dataset.id; break; }
      S.selected = el.dataset.id; S.wsPage = null; S.pill = null; if (S.view === "phone") S.drawer = false; break;
    case "ws": S.wsPage = el.dataset.ws; S.pop = null; if (S.view === "phone") S.drawer = false; break;
    case "fold": S.open[el.dataset.k] = !S.open[el.dataset.k]; break;
    case "drawer": S.drawer = !S.drawer; break;
    case "pop": {
      e.preventDefault(); e.stopPropagation();
      if (S.pop && S.pop.ws === el.dataset.ws) { S.pop = null; break; }
      const r = el.getBoundingClientRect();
      S.pop = { ws: el.dataset.ws, x: Math.min(r.left, innerWidth - 260), y: Math.min(r.bottom + 4, innerHeight - 250) }; break;
    }
    case "unpop": S.pop = null; break;
    case "dialog": {
      const name = el.dataset.ws; S.pop = null; S.dialog = name;
      S.draft = dir === "emoji" ? { prefix: S.repo[name].prefix } : dir === "mono" ? { ...(S.local.mono[name] || {}) } : { ...(S.local.chain[name] || {}) };
      break;
    }
    case "close": S.dialog = null; break;
    case "pick": if (dir === "emoji") S.draft.prefix = el.dataset.v; else S.draft.emoji = el.dataset.v; break;
    case "reset-icon": S.draft.prefix = undefined; break;
    case "logo": S.draft.useLogo = el.dataset.v === "1" ? undefined : false; break;
    case "hue": S.draft.hue = el.dataset.v === "" ? undefined : Number(el.dataset.v); break;
    case "choice": S.draft.choice = el.dataset.v; break;
    case "save": {
      const name = S.dialog;
      if (dir === "emoji") { const was = S.repo[name].prefix; S.repo[name].prefix = S.draft.prefix || undefined; S.repo[name].changed = S.repo[name].changed || was !== S.repo[name].prefix; }
      else S.local[dir][name] = { ...S.draft };
      S.dialog = null; S.wsPage = name; if (S.view === "phone") S.drawer = false; break;
    }
    default: return;
  }
  rerender();
});
document.addEventListener("click", (e) => { // a click outside the popover closes it
  if (S.pop && !e.target.closest(".pop") && !e.target.closest("[data-act=pop]") && stage.contains(e.target)) { S.pop = null; rerender(); }
}, true);
// One fixed tooltip, so the narrow strip's scroll box does not clip it.
const tipEl = document.getElementById("tip");
function hideTip() { tipEl.classList.remove("on"); }
stage.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t || S.view === "phone") return hideTip();
  const r = t.getBoundingClientRect();
  tipEl.textContent = t.dataset.tip; tipEl.dataset.theme = S.theme;
  tipEl.style.left = r.right + 8 + "px"; tipEl.style.top = r.top + r.height / 2 - 11 + "px";
  tipEl.classList.add("on");
});
stage.addEventListener("mouseleave", hideTip);
stage.addEventListener("pointerdown", hideTip);
stage.addEventListener("input", (e) => {
  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.value.trim();
  if (k === "emoji") S.draft.prefix = v || S.repo[S.dialog].prefix;
  if (k === "letters") S.draft.letters = v.toLocaleUpperCase("fi") || undefined;
  // Update only the preview so the field keeps focus.
  const dir = dirKeys[current], name = S.dialog;
  const def = monoDefaults()[name];
  const ic = dir === "emoji" ? { kind: "emoji", value: S.draft.prefix || IC[name].value } : { kind: "mono", value: S.draft.letters || def.value, hue: S.draft.hue ?? def.hue };
  document.getElementById("dlg-prev").innerHTML = prevHTML(ic, name);
});
</script>
