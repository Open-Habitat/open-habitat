  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="page-bar">
  <h1>Kello yläpalkissa</h1>
  <label>Näkymä <select id="c-view"><option value="conv">Keskustelu</option><option value="ws">Työtila</option></select></label>
  <label>Tilanne <select id="c-s"><option value="none">Ei mitään</option><option value="warn">Tila lähes täynnä</option><option value="full">Tila täynnä</option><option value="many">Useita</option></select></label>
  <span class="events">Tapahtuu:
    <button type="button" data-ev="version">Uusi versio julkaistaan</button>
    <button type="button" data-ev="fill">Tila täyttyy</button>
    <button type="button" data-ev="free">Tilaa vapautuu</button>
  </span>
  <label>Rooli <select id="c-role"><option value="person">Henkilö</option><option value="admin">Ylläpitäjä</option></select></label>
  <label>Ikkuna <select id="c-w"><option value="fit">Oma</option><option value="1280">1280</option><option value="390">Puhelin</option></select></label>
  <label>Teema <select id="c-t"><option value="light">Vaalea</option><option value="dark">Tumma</option></select></label>
</div>
<div class="frame-wrap" id="wrap"><div class="frame" id="frame"></div></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Tila</button>
  <button class="proto-picker-item">Saapuneet</button>
  <button class="proto-picker-item">Nosto</button>
  <button class="proto-picker-item">Nykyinen</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
// Synteettinen data. Tekstit ovat tuotannon omia (StoragePressure.tsx, Status.tsx
// NewVersionBanner, githubConnection.ts), luvut keksittyjä.
const ICON = {
  bell: '<path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19.5a2 2 0 0 0 4 0"/>',
  warning: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10M9 21v-7h6v7"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  disk: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h.01M11 15h6"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>',
  github: '<path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  up: '<path d="m6 15 6-6 6 6"/>',
};
const svg = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const ADVICE = 'Vapauta tilaa roskakorista tai pyydä agenttia siivoamaan tarpeettomia tiedostoja. Roskakoriin siirtäminen ei vapauta tilaa ennen sen tyhjentämistä.';
// Jokainen ilmoitus on hostin nykyinen tosiasia, ei tallennettu viesti: avain vaihtuu, kun asia muuttuu.
const KINDS = {
  'quota:warn': { tone: 'warning', icon: 'disk', group: 'Sinä', short: 'Tila lähes täynnä', title: 'Tallennustilasi on lähes täynnä', meta: '9,2 GiB / 10 GiB',
    body: ADVICE, acts: [['storage', 'Tallennustila ja roskakori', true], ['recheck', 'Tarkista vapautettu tila']] },
  'quota:full': { tone: 'danger', icon: 'disk', group: 'Sinä', short: 'Tila täynnä', title: 'Tallennustilasi on täynnä', meta: '10 GiB / 10 GiB',
    body: ADVICE + ' Tallennus on voinut epäonnistua. Viestejä ei lähetetä uudelleen automaattisesti.', acts: [['storage', 'Tallennustila ja roskakori', true], ['recheck', 'Tarkista vapautettu tila']] },
  'github:expired': { tone: 'danger', icon: 'github', group: 'Sinä', short: 'GitHub poikki', title: 'GitHub-yhteys on vanhentunut tai peruttu', meta: 'Push ja gh eivät toimi',
    body: 'GitHub ei enää hyväksy palvelimen valtuutusta, eikä palvelin voi uusia sitä itse. Yhdistä uudelleen: GitHub palauttaa sinut tänne, yleensä kysymättä mitään.', acts: [['github', 'Yhdistä uudelleen', true]] },
  'version:2026.10.29': { tone: 'info', icon: 'refresh', group: 'Sinä', short: 'Uusi versio', title: 'Uusi versio on saatavilla', meta: 'Luonnokset säilyvät',
    body: 'Lataa sivu uudelleen, niin saat uusimmat korjaukset. Luonnokset säilyvät.', acts: [['reload', 'Lataa uudelleen', true], ['later', 'Myöhemmin']] },
  'server:overcommitted': { tone: 'warning', icon: 'server', group: 'Palvelin', short: 'Kiintiöt yli levyn', title: 'Kiintiöt ylittävät palvelimen levyn', meta: '160 GiB kiintiöitä · 120 GiB levyä',
    body: 'Jos kaikki käyttävät kiintiönsä, levy täyttyy ennen kiintiöitä. Silloin kenenkään tallennus ei onnistu.', acts: [['server', 'Palvelin › Tallennustila', true]], admin: true },
};
const RANK = { danger: 0, warning: 1, info: 2 };
const SCEN = {
  none: {},
  warn: { quota: 'warn' },
  full: { quota: 'full' },
  many: { quota: 'warn', version: true, github: true },
};

const qs = new URLSearchParams(location.search);
const S = {
  s: qs.get('s') || 'warn', view: qs.get('view') || 'conv', role: qs.get('role') || 'person',
  w: qs.get('w') || 'fit', t: qs.get('t') || 'light', bare: qs.get('bare') === '1',
  open: false, drawer: false,
  conds: {}, at: {}, later: new Set(),
  seen: new Set(), fresh: new Set(), dismissed: new Set(), resolved: [],
  folded: new Set(), openedSince: true, ring: false,
};
let clockNow = 14 * 60 + 32;
const hhmm = (m) => `${Math.floor(m / 60)}.${String(m % 60).padStart(2, '0')}`;

function keysOf(c) {
  const k = [];
  if (c.quota) k.push(`quota:${c.quota}`);
  if (c.github) k.push('github:expired');
  if (c.version) k.push('version:2026.10.29');
  if (c.server) k.push('server:overcommitted');
  return k;
}
function setScenario(name) {
  S.s = name;
  S.conds = { ...SCEN[name], server: S.role === 'admin' && name !== 'none' };
  S.at = {}; S.later = new Set(); S.seen = new Set(); S.fresh = new Set(); S.dismissed = new Set(); S.resolved = []; S.folded = new Set();
  S.open = false; S.openedSince = false;
  keysOf(S.conds).forEach((k, i) => { S.at[k] = hhmm(clockNow - 40 + i * 7); });
  if (qs.get('fold') === '1') keysOf(S.conds).forEach((k) => S.folded.add(k));
}
// Ilmoitukset, jotka ovat nyt voimassa ja tälle roolille.
function current() {
  return keysOf(S.conds)
    .filter((k) => !S.later.has(k))
    .filter((k) => !KINDS[k].admin || S.role === 'admin')
    .map((k) => ({ key: k, at: S.at[k], ...KINDS[k] }))
    .sort((a, b) => RANK[a.tone] - RANK[b.tone] || (a.at < b.at ? 1 : -1));
}
function visible() {
  return VAR === 1 ? current().filter((i) => !S.dismissed.has(i.key)) : current();
}
// Nosto näyttää rivinä vain tärkeimmän taittamattoman asian; muut menevät suoraan kelloon.
function settlePeek() {
  const up = current().filter((i) => !S.folded.has(i.key));
  up.slice(1).forEach((i) => S.folded.add(i.key));
}
// Ehdon muutos: avain katoaa (ratkesi) tai uusi ilmestyy (saapui).
function change(next) {
  const before = new Set(current().map((i) => i.key));
  const beforeItems = current();
  S.conds = { ...S.conds, ...next };
  clockNow += 3;
  for (const k of keysOf(S.conds)) if (!S.at[k]) S.at[k] = hhmm(clockNow);
  const after = current();
  const added = after.filter((i) => !before.has(i.key));
  for (const i of beforeItems) {
    if (!after.some((a) => a.key === i.key)) {
      delete S.at[i.key];
      if (VAR === 1) S.resolved.unshift({ ...i, resolvedAt: hhmm(clockNow) });
    }
  }
  if (added.length) { S.ring = true; S.openedSince = false; }
  if (VAR === 2) settlePeek();
  render();
  return added;
}

// ----- Kehys -----
const frame = document.getElementById('frame');
const wrap = document.getElementById('wrap');
let VAR = 0;

function railHTML() {
  return `<aside class="rail" aria-label="Työtilat">
  <div class="rail-head"><span class="srv">open-habitat-test</span><span class="conn"><span class="dot-ok"></span>Yhdistetty</span></div>
  <a class="home-row" href="#">${svg('home')}<span>Etusivu</span></a>
  <span class="ws-name">kotisivu</span>
  <a class="conv-row" href="#"${S.view === 'conv' ? ' aria-current="page"' : ''}><span class="t">Varmuuskopioiden siivous</span></a>
  <a class="conv-row" href="#"><span class="t">Kuvagallerian pikkukuvat</span><span class="m working"></span></a>
  <span class="ws-name">open-habitat</span>
  <a class="conv-row" href="#"><span class="t">Lomakkeen validointi</span><span class="m attention"></span></a>
  <div class="rail-foot"><span class="avatar">J</span><span>Jari</span></div>
</aside>`;
}

function bellHTML() {
  const items = visible();
  if (VAR === 3) return '';
  const open = S.open ? 'true' : 'false';
  const ring = S.ring ? ' ringing' : '';
  if (VAR === 0) {
    if (!items.length && !S.open) return '';
    const danger = items.find((i) => i.tone === 'danger');
    const n = items.length;
    const label = `Ilmoitukset: ${n ? n + ' voimassa' : 'ei voimassa olevia'}${danger ? ', ' + danger.short : ''}`;
    if (danger) {
      return `<button type="button" class="bell pill${ring}" data-testid="bell" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${esc(label)}" title="${esc(label)}">${svg('bell')}<span class="lbl">${esc(danger.short)}</span>${n > 1 ? `<span class="badge danger">${n}</span>` : ''}</button>`;
    }
    return `<button type="button" class="bell${ring}" data-testid="bell" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${esc(label)}" title="${esc(label)}">${svg('bell')}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }
  if (VAR === 1) {
    const unread = items.filter((i) => !S.seen.has(i.key));
    const danger = unread.some((i) => i.tone === 'danger');
    const label = `Ilmoitukset: ${unread.length ? unread.length + ' lukematonta' : 'ei uusia'}`;
    return `<button type="button" class="bell${unread.length ? '' : ' quiet'}${ring}" data-testid="bell" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${esc(label)}" title="${esc(label)}">${svg('bell')}${unread.length ? `<span class="badge${danger ? ' danger' : ''}">${unread.length}</span>` : ''}</button>`;
  }
  // Nosto: kello on paikka, johon nostot taittuvat.
  if (!items.length && !S.open) return '';
  const folded = items.filter((i) => S.folded.has(i.key));
  const dot = folded.length && !S.openedSince;
  const danger = folded.some((i) => i.tone === 'danger');
  const label = `Ilmoitukset: ${items.length} voimassa${dot ? ', uutta' : ''}`;
  return `<button type="button" class="bell${S.bump ? ' bump' : ''}" data-testid="bell" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${esc(label)}" title="${esc(label)}">${svg('bell')}${dot ? `<span class="unread${danger ? ' danger' : ''}"></span>` : ''}</button>`;
}

function topbarHTML() {
  const menu = `<button type="button" class="icon-btn menu-btn" data-ui="drawer" aria-label="Avaa valikko">${svg('menu')}</button>`;
  if (S.view === 'conv') {
    return `<header class="topbar">${menu}
  <div class="tb-title"><strong>Varmuuskopioiden siivous</strong><code>kotisivu</code></div>
  <div class="tb-right">
    <span class="chip"><span class="ring"></span>42 %</span>
    <span class="chip">Opus 5.5</span>
    <i class="sep"></i>
    ${bellHTML()}
    <button type="button" class="icon-btn" data-ui="noop" aria-label="Tiedot" title="Tiedot">${svg('info')}</button>
    <button type="button" class="icon-btn" data-ui="noop" aria-label="Keskustelun toiminnot" title="Keskustelun toiminnot">${svg('more')}</button>
  </div>
</header>`;
  }
  // Työtilan sivulla ei ole erillistä yläpalkkia työpöydällä; kello on sivun otsakkeessa.
  return `<header class="topbar phone-only">${menu}
  <div class="tb-title"><strong>kotisivu</strong></div>
  <div class="tb-right">${bellHTML()}<button type="button" class="icon-btn" data-ui="noop" aria-label="Työtilan toiminnot" title="Työtilan toiminnot">${svg('more')}</button></div>
</header>`;
}

function contentHTML() {
  if (S.view === 'conv') {
    return `<div class="content"><div class="thread">
  <div class="bubble">Siivoa vanhat varmuuskopiot backups-kansiosta, mutta säilytä viimeisen kuukauden kopiot.</div>
  <div class="answer"><p>Löysin <code>backups/</code>-kansiosta 46 varmuuskopiota, yhteensä 6,1 GiB. Viimeisen 30 päivän 9 kopiota jäävät.</p><p>Siirsin 37 vanhempaa roskakoriin (4,8 GiB). Tila vapautuu vasta, kun roskakori tyhjennetään.</p></div>
  <div class="bubble">Hyvä. Tee sitten pikkukuvat kuvagalleriaan.</div>
  <div class="answer"><p>Aloitan. Pikkukuvat tulevat <code>public/thumbs/</code>-kansioon, noin 380 MiB.</p></div>
</div></div>
<div class="composer"><div><textarea aria-label="Viesti" placeholder="Kirjoita viesti…"></textarea><button type="button">Lähetä</button></div></div>`;
  }
  return `<div class="content" style="justify-content:flex-start">
  <div class="ws-head"><div class="ttl"><h1>kotisivu</h1><span class="ws-path">~/src/kotisivu</span></div>
  <div class="ws-actions"><span class="desk-only">${bellHTML()}</span><button type="button" class="btn primary">Uusi keskustelu</button><button type="button" class="btn">Uusi rinnakkainen</button></div></div>
  <ul class="ws-list">
    <li><span class="t">Kuvagallerian pikkukuvat</span><span class="s">Työskentelee</span></li>
    <li><span class="t">Varmuuskopioiden siivous</span><span class="s">Valmis · 14.12</span></li>
    <li><span class="t">Yhteydenottolomake</span><span class="s">Valmis · eilen</span></li>
  </ul>
</div>`;
}

function actsHTML(i, cls = 'act') {
  return i.acts.map(([a, l, p]) => `<button type="button" class="${cls}${p ? ' primary' : ''}" data-act="${a}" data-key="${esc(i.key)}">${esc(l)}</button>`).join('');
}
function itemHTML(i, { x = false, fresh = false } = {}) {
  return `<article class="item ${i.tone}" data-testid="bell-item" data-key="${esc(i.key)}">
  <span class="ic">${svg(i.icon)}</span>
  <h3>${esc(i.title)}</h3>
  <span class="meta">${fresh ? '<span class="new">Uusi</span>' : ''}${esc(i.meta)} · klo ${esc(i.at)}</span>
  <p>${esc(i.body)}</p>
  <div class="acts">${actsHTML(i)}</div>
  ${x ? `<button type="button" class="x" data-x="${esc(i.key)}" aria-label="Kuittaa: ${esc(i.title)}" title="Kuittaa. Palaa, jos tilanne muuttuu.">${svg('close')}</button>` : ''}
</article>`;
}
function groups(items, fn) {
  const gs = [...new Set(items.map((i) => i.group))];
  if (gs.length < 2) return items.map(fn).join('');
  return gs.map((g) => `<div class="group">${g === 'Sinä' ? 'Sinun' : 'Palvelin'}</div>${items.filter((i) => i.group === g).map(fn).join('')}`).join('');
}
function panelHTML() {
  if (!S.open || VAR === 3) return '';
  const items = visible();
  let body;
  if (VAR === 0) {
    body = `<div class="panel-head"><h2>Ilmoitukset</h2><span class="sub">voimassa nyt</span></div>
${items.length ? groups(items, (i) => itemHTML(i)) : '<p class="empty" data-testid="bell-empty">Kaikki kunnossa. Kello katoaa, kun suljet tämän.</p>'}`;
  } else if (VAR === 1) {
    body = `<div class="panel-head"><h2>Ilmoitukset</h2></div>
${items.length ? groups(items, (i) => itemHTML(i, { x: true, fresh: S.fresh.has(i.key) })) : '<p class="empty" data-testid="bell-empty">Ei ilmoituksia. Tallennustila, uusi versio ja yhteydet kertovat tänne, kun jokin vaatii huomiota.</p>'}
${S.resolved.length ? `<div class="group">Ratkenneet</div>${S.resolved.map((r) => `<article class="item resolved" data-testid="bell-resolved"><span class="ic">${svg('check')}</span><h3>${esc(r.title)}</h3><span class="meta">Ratkesi klo ${esc(r.resolvedAt)}</span></article>`).join('')}<div class="panel-foot"><button type="button" data-ui="clear-resolved">Tyhjennä ratkenneet</button></div>` : ''}`;
  } else {
    body = `<div class="panel-head"><h2>Ilmoitukset</h2><span class="sub">voimassa nyt</span></div>
${items.length ? groups(items, (i) => itemHTML(i)) : '<p class="empty" data-testid="bell-empty">Kaikki kunnossa.</p>'}`;
  }
  return `<section class="panel${S.view === 'ws' ? ' in-page' : ''}" role="dialog" aria-label="Ilmoitukset" tabindex="-1" data-testid="bell-panel">${body}</section>`;
}

// Nosto: korkeimman tärkeyden taittamaton asia näkyy rivinä; muut odottavat kellossa.
function peekHTML() {
  if (VAR !== 2) return '';
  const items = visible().filter((i) => !S.folded.has(i.key));
  if (!items.length) return '';
  const i = items[0];
  const others = visible().length - 1;
  const autoFold = i.tone !== 'danger';
  return `<div class="peek ${i.tone}" role="status" data-testid="peek" data-key="${esc(i.key)}">
  <span class="ic">${svg(i.icon)}</span>
  <span class="txt"><strong>${esc(i.title)}</strong><span class="meta">${esc(i.meta)}</span>${others > 0 ? `<span class="more">+${others} kellossa</span>` : ''}</span>
  <span class="acts">${actsHTML({ ...i, acts: i.acts.filter(([, , p]) => p) })}<button type="button" class="fold" data-fold="${esc(i.key)}" aria-label="Siirrä kelloon" title="Siirrä kelloon">${svg('up')}<span>Kelloon</span></button></span>
  ${autoFold ? '<span class="clock" aria-hidden="true"></span>' : ''}
</div>`;
}

function stripsHTML() {
  if (VAR !== 3) return '';
  const items = current();
  return `<div class="strips">${items.map((i) => `<div class="strip ${i.tone}" role="status" data-testid="strip"><strong>${esc(i.title)}${i.key.startsWith('quota:') ? ` (${esc(i.meta)})` : ''}</strong><span>${esc(i.body)}</span><span class="acts">${actsHTML(i, 'btn')}</span></div>`).join('')}</div>`;
}

let foldTimer;
function render() {
  document.documentElement.dataset.theme = S.t;
  document.body.classList.toggle('bare', S.bare);
  wrap.className = 'frame-wrap' + (S.w === '390' ? ' phone' : S.w === '1280' ? ' w1280' : '');
  const focusKey = document.activeElement?.closest?.('.panel') ? 'panel' : null;
  frame.innerHTML = `${stripsHTML()}<div class="shell${S.drawer ? ' drawer-open' : ''}">${railHTML()}<main class="main">${topbarHTML()}${peekHTML()}${contentHTML()}${panelHTML()}<div class="toast" role="status" id="toast"></div></main><button type="button" class="scrim" data-ui="drawer" aria-label="Sulje valikko"></button></div>`;
  S.ring = false; S.bump = false;
  if (focusKey) frame.querySelector('.panel')?.focus();
  // Varoitus ja tieto taittuvat itse 8 s jälkeen, ellei osoitin tai kohdistus ole rivillä.
  clearTimeout(foldTimer);
  const peek = frame.querySelector('.peek');
  if (peek && !peek.classList.contains('danger')) {
    peek.querySelector('.clock')?.addEventListener('animationend', () => fold(peek.dataset.key));
  }
}

function fold(key) {
  const peek = frame.querySelector('.peek');
  const go = () => { S.folded.add(key); S.openedSince = false; S.bump = true; render(); };
  if (peek && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    peek.classList.add('leaving');
    setTimeout(go, 190);
  } else go();
}

let toastTimer;
function toast(msg) {
  const t = frame.querySelector('#toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

function openPanel(on) {
  S.open = on;
  if (on) {
    if (VAR === 1) { S.fresh = new Set(visible().filter((i) => !S.seen.has(i.key)).map((i) => i.key)); visible().forEach((i) => S.seen.add(i.key)); }
    if (VAR === 2) S.openedSince = true;
  } else {
    S.fresh = new Set();
  }
  render();
  if (on) frame.querySelector('.panel')?.focus();
  else frame.querySelector('[data-testid="bell"]')?.focus();
}

function act(a, key) {
  if (a === 'storage') return toast('Avautuisi: Asetukset › Tallennustila ja roskakori');
  if (a === 'server') return toast('Avautuisi: Asetukset › Palvelin › Tallennustila');
  if (a === 'recheck') { change({ quota: undefined }); return toast('Tarkistettu: 7,1 GiB / 10 GiB. Tilaa on taas.'); }
  if (a === 'reload') { change({ version: false }); return toast('Sivu latautuisi uudelleen uuteen versioon.'); }
  if (a === 'later') { S.later.add(key); render(); return toast('Uusi versio odottaa seuraavaan lataukseen.'); }
  if (a === 'github') { change({ github: false }); return toast('GitHub yhdistetty uudelleen.'); }
}

frame.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t) { if (S.open && !e.target.closest('.panel')) openPanel(false); return; }
  if (t.tagName === 'A') e.preventDefault();
  if (t.matches('[data-testid="bell"]')) return openPanel(!S.open);
  if (t.dataset.ui === 'drawer') { S.drawer = !S.drawer; return render(); }
  if (t.dataset.ui === 'clear-resolved') { S.resolved = []; return render(); }
  if (t.dataset.x) {
    S.dismissed.add(t.dataset.x); render();
    const next = frame.querySelector('.panel .x, .panel .act');
    (next || frame.querySelector('.panel'))?.focus();
    return;
  }
  if (t.dataset.fold) return fold(t.dataset.fold);
  if (t.dataset.act) return act(t.dataset.act, t.dataset.key);
  if (S.open && !t.closest('.panel')) openPanel(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.open) { e.preventDefault(); openPanel(false); }
});

// ----- Sivun ohjaimet -----
const ctl = (id, key, after) => {
  const el = document.getElementById(id);
  el.value = S[key];
  el.addEventListener('change', () => { S[key] = el.value; syncURL(); after ? after() : render(); });
};
function syncURL() {
  const url = new URL(location);
  for (const k of ['s', 'view', 'role', 'w', 't']) url.searchParams.set(k, S[k]);
  history.replaceState(null, '', url);
}
ctl('c-view', 'view');
ctl('c-s', 's', () => { setScenario(S.s); render(); });
ctl('c-role', 'role', () => { setScenario(S.s); render(); });
ctl('c-w', 'w');
ctl('c-t', 't');
document.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('click', () => {
  const ev = b.dataset.ev;
  if (ev === 'version') {
    const k = 'version:2026.10.29';
    // Julkaistaan "uudelleen": edellinen kuittaus tai taitto ei koske uutta julkaisua.
    S.conds.version = false; delete S.at[k];
    for (const set of [S.later, S.seen, S.folded, S.dismissed]) set.delete(k);
    change({ version: true });
  }
  if (ev === 'fill') change({ quota: 'full' });
  if (ev === 'free') change({ quota: undefined });
}));

setScenario(S.s);

// ----- Valitsin (PICKER.md, viitejohdotus) -----
const variants = [0, 1, 2, 3].map((i) => () => { VAR = i; S.open = false; if (i === 2) settlePeek(); render(); return ''; });
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let currentV = 0;

function moveHighlight() {
  const el = items[currentV];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  frame.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => {
    setScenario(S.s);
    variants[i]();
    if (qs.get('open') === '1') openPanel(true);
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  currentV = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(currentV));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((currentV + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((currentV - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(currentV);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
