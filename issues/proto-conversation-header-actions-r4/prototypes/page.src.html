<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yläpalkin painikkeiden selitys: miltä se näyttää</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ah-bg);
  color: var(--ah-ink);
  font: 400 var(--ah-size-ui)/var(--ah-lh-ui) var(--ah-font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- page chrome around the simulation ---------- */
.pg { max-width: 1740px; margin: 0 auto; padding: 72px 24px 40px; }
.pg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; margin-bottom: 10px; }
.pg-head h1 { margin: 0; font-size: var(--ah-size-h1); font-weight: 600; letter-spacing: -.01em; }
.pg-axis { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.pg-toggles { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 0 0 12px; align-items: center; }
.pg-toggles label { color: var(--ah-muted); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--ah-r-md); background: var(--ah-control); }
.seg button { border: 0; background: transparent; color: var(--ah-ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ah-surface); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-line); font-weight: 600; }
.reset { border: 1px solid var(--ah-line-strong); background: var(--ah-surface); color: var(--ah-ink-2); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.pg-lead { margin: 0 0 16px; max-width: 110ch; color: var(--ah-ink-2); font-size: var(--ah-size-body); line-height: 1.55; }
.pg-lead b { color: var(--ah-ink); }
.pg-log { min-height: 20px; margin: 10px 2px 0; color: var(--ah-muted); font-size: 12px; }
.app-wrap { display: flex; justify-content: center; }
.legend { margin-top: 26px; max-width: 110ch; }
.legend h2 { margin: 0 0 8px; font-size: var(--ah-size-h2); font-weight: 600; }
.legend table { border-collapse: collapse; width: 100%; font-size: 13px; }
.legend th, .legend td { text-align: left; vertical-align: top; padding: 6px 10px 6px 0; border-top: 1px solid var(--ah-line-soft); }
.legend th { color: var(--ah-muted); font-weight: 600; font-size: 12px; }
.legend td:first-child { white-space: nowrap; font-weight: 600; }
.legend td:first-child svg.i { vertical-align: -4px; margin-right: 6px; color: var(--ah-accent-ink); }
.legend td.where { color: var(--ah-ink-2); }

/* ---------- the production-looking app ---------- */
.app { position: relative; display: grid; grid-template-columns: 256px minmax(0, 1fr); width: 1320px; height: 720px; overflow: hidden; border-radius: var(--ah-r-xl); border: 1px solid var(--ah-line); background: var(--ah-bg); box-shadow: var(--ah-shadow-app); color: var(--ah-ink); }
.app.narrow { width: 1024px; }
.app.xwide { width: 1680px; }
.rail { background: var(--ah-rail); border-right: 1px solid var(--ah-line); padding: 10px 8px 16px; overflow: auto; }
.rail-brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px; font-weight: 600; font-size: 13.5px; }
.rail-brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--ah-accent); display: inline-block; }
.rail section + section { margin-top: 8px; }
.rail h2 { display: flex; align-items: center; gap: 8px; min-height: 26px; margin: 0; padding: 0 8px; color: var(--ah-muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.cnt { color: var(--ah-muted); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font-size: 13px; }
.row.cur { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); font-weight: 600; }
.row .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { flex: none; color: var(--ah-muted); font-size: 11px; font-weight: 400; }
.ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ball.done { background: var(--ah-ok); }
.ball.you { background: var(--ah-turn); }
.grp h3 { margin: 0; padding: 5px 8px 1px; color: var(--ah-ink-2); font: 600 12px var(--ah-mono); }

.main { position: relative; display: flex; min-width: 0; min-height: 0; }
.conv { position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: var(--ah-bg); }
.stream { flex: 1; overflow: auto; padding: 18px var(--ah-column-pad-inline) 10px; }
.stream > * { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.msg-user p { margin: 0; max-width: 80%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--ah-accent-soft); color: var(--ah-ink); font-size: var(--ah-size-body); line-height: 1.5; }
.msg-agent { margin-bottom: 14px; font-size: var(--ah-size-body); line-height: var(--ah-lh-body); color: var(--ah-ink); }
.msg-agent p { margin: 0 0 6px; }
.msg-agent code { font: var(--ah-size-code) var(--ah-mono); background: var(--ah-sunken); padding: 1px 4px; border-radius: 4px; }
.tool { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; color: var(--ah-muted); font: 12.5px var(--ah-mono); }
.tool b { color: var(--ah-ok); font-weight: 400; }
.recap { margin-bottom: 16px; padding: 12px 14px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-lg); background: var(--ah-accent-soft); font-size: 13.5px; line-height: 1.5; }
.recap h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ah-accent-ink); }
.recap p { margin: 0; }
.composer { padding: 0 var(--ah-column-pad-inline) var(--ah-composer-pad-block); }
.composer-box { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; min-height: 48px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); }
.composer-box span { flex: 1; color: var(--ah-faint); font-size: var(--ah-size-body); }
.composer-box button { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; font-weight: 600; font-size: 13px; background: var(--ah-accent); color: var(--ah-on-accent); }

/* ---------- the header (Navigation.tsx AgentHeader, components.css) ---------- */
.hd { position: relative; z-index: 3; padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline); border-bottom: 1px solid var(--ah-line); background: var(--ah-bg); }
.tl { display: flex; align-items: center; gap: var(--ah-s3); min-width: 0; }
.tr { display: flex; align-items: center; gap: var(--ah-s2); flex: 1 1 0; min-width: 0; }
.tr h1 { margin: 0; min-width: 0; font-size: var(--ah-size-title); font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr h1 button { all: unset; cursor: text; }
.dots { display: none; gap: 3px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--ah-muted); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.dots.on { display: inline-flex; }
@keyframes blink { 50% { opacity: .25; } }
.ws { flex: none; font: 12px var(--ah-mono); color: var(--ah-muted); white-space: nowrap; text-decoration: none; }
.adot { flex: none; position: relative; display: inline-grid; place-items: center; width: 20px; height: 24px; padding: 0; border: 0; background: transparent; cursor: default; }
.adot i { width: 8px; height: 8px; border-radius: 50%; background: var(--ah-ok); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border: 0; border-radius: var(--ah-r-pill); background: transparent; color: var(--ah-ink-2); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.chip:hover { background: var(--ah-hover); }
.chip svg.i { width: 15px; height: 15px; }
.chip.model { color: var(--ah-ink); font-weight: 500; }
.ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--ah-accent) 0 38%, var(--ah-line) 38% 100%); -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px); mask: radial-gradient(circle, transparent 3.5px, #000 4px); }
.sep { flex: none; width: 1px; height: 18px; background: var(--ah-line); }
/* Quiet header buttons, production ControlButton variant="quiet" size="row". */
.hb { flex: none; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ah-control-row); min-width: var(--ah-control-row); padding: 0; border: 1px solid transparent; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-accent-ink); cursor: pointer; white-space: nowrap; }
.hb:hover { background: var(--ah-surface-hover); }
.hb:focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: 1px; }
.hb[aria-pressed="true"], .hb[aria-expanded="true"] { background: var(--ah-accent-soft); }
.hb[disabled] { opacity: .55; cursor: default; }
.hb .w { font-size: 13px; font-weight: 500; }
.hb.word { padding: 0 10px 0 8px; }
.hb.word svg.i { width: 17px; height: 17px; }
/* direction 1 on a phone: a caption under the icon, as in a tab bar */
.hb.cap { flex-direction: column; gap: 1px; width: 48px; padding: 2px 0 0; height: 42px; }
.hb.cap svg.i { width: 18px; height: 18px; }
.hb.cap .w { font-size: 10.5px; font-weight: 500; line-height: 1.1; }
/* The quick shared tooltip that icon-tooltips-slow brings: hover after a
   short delay, keyboard focus at once, never over the button itself. */
[data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; width: max-content; max-width: 260px; padding: 5px 8px; border-radius: 6px; background: var(--ah-ink); color: var(--ah-bg); font-size: 12px; font-weight: 500; line-height: 1.35; white-space: normal; text-align: left; pointer-events: none; opacity: 0; transition: opacity 80ms ease-out 0ms; }
[data-tip]:hover::after { opacity: 1; transition-delay: 300ms; }
[data-tip]:focus-visible::after { opacity: 1; transition-delay: 0ms; }
.app.phone [data-tip]::after { display: none; }
/* desktop shortening steps (HeaderShortening.tsx), measured per render */
.tl[data-s~="1"] > .ws { display: none; }
.tl[data-s~="2"] .ctx-v { display: none; }
.tl[data-s~="3"] > .oneoff { display: none; }
.tl[data-s~="4"] { gap: var(--ah-s1); }
.tl[data-s~="4"] > .sep { display: none; }
.tl[data-s~="5"] .gs-n { display: none; }
.tl[data-s~="6"] > .chip.model { display: none; }
.more-wrap { position: relative; flex: none; }
.more-wrap.hide { display: none; }

/* ---------- menus and popovers ---------- */
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 230px; max-width: 330px; padding: 4px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); display: grid; text-align: left; }
.menu-pop .full { margin: 0; padding: 6px 8px 8px; border-bottom: 1px solid var(--ah-line-soft); margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--ah-ink); white-space: normal; }
.menu-pop .mi { display: grid; grid-template-columns: 18px 1fr; gap: 1px 10px; align-items: center; border: 0; background: transparent; color: var(--ah-ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; text-align: left; white-space: normal; }
.menu-pop .mi:hover { background: var(--ah-surface-hover); }
.menu-pop .mi svg.i { width: 17px; height: 17px; color: var(--ah-accent-ink); }
.menu-pop .mi small { grid-column: 2; color: var(--ah-muted); font-size: 12px; line-height: 1.35; }
.menu-pop .mi.plain { grid-template-columns: 1fr; }
.menu-pop .mi.plain small { grid-column: 1; }
.menu-pop hr { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 4px 2px; }
.menu-pop .mi.on { color: var(--ah-accent-ink); font-weight: 600; }
.details { position: absolute; right: 18px; top: calc(100% + 4px); z-index: 25; width: 360px; padding: 14px 16px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); }
.details h2 { margin: 0 0 8px; font-size: 14px; }
.details dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.details dt { color: var(--ah-muted); }
.details dd { margin: 0; overflow-wrap: anywhere; font-family: var(--ah-mono); font-size: 12px; }
/* direction 3: the first-use explanation under the header */
.coach { position: absolute; right: 14px; top: calc(100% + 8px); z-index: 24; width: 380px; padding: 14px 16px 12px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-float); }
.coach::before { content: ""; position: absolute; top: -7px; right: 40px; width: 12px; height: 12px; transform: rotate(45deg); background: var(--ah-surface); border-left: 1px solid var(--ah-accent-line); border-top: 1px solid var(--ah-accent-line); }
.coach h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.coach ul { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 7px; }
.coach li { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; font-size: 13px; line-height: 1.4; }
.coach li svg.i { width: 18px; height: 18px; color: var(--ah-accent-ink); margin-top: 1px; }
.coach li b { font-weight: 600; }
.coach li span { color: var(--ah-ink-2); }
.coach .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ah-muted); font-size: 12px; }
.coach .ok { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; background: var(--ah-accent); color: var(--ah-on-accent); font-weight: 600; font-size: 13px; cursor: pointer; }

/* round 2: the trigger facts, the situation and the matrix */
.pg-sit { margin: 0 0 6px; color: var(--ah-muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; max-width: 110ch; margin: 0 0 16px; padding: 10px 14px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); font-size: 13px; line-height: 1.45; }
.facts dt { color: var(--ah-muted); font-weight: 600; }
.facts dd { margin: 0; color: var(--ah-ink-2); }
.facts code, .pg-lead code { font: 12px var(--ah-mono); }
.legend th.cur, .legend td.cur { background: var(--ah-accent-soft); }
.legend th.cur { color: var(--ah-accent-ink); }
.legend tr.cur td:first-child { color: var(--ah-accent-ink); }
.legend td, .legend th { padding-left: 8px; }
.legend .h2b { margin-top: 22px; }
/* riff 2: the tooltip carries the name and the meaning line */
[data-tip]::after { white-space: pre-line; }
.app.phone .held[data-tip]::after { display: block; opacity: 1; transition: none; }
/* an open card or note is the explanation; the tooltip would cover it */
.hd:has(> .note) [data-tip]::after, .hd:has(> .coach) [data-tip]::after { display: none; }
/* riff 1: a card about one button points at it */
.coach.one { width: 300px; }
.coach[data-anchor]::before, .note::before { left: var(--arrow, 40px); right: auto; }
.app.phone .coach.one { width: 300px; }
/* riff 3: one line under the button just pressed */
.note { position: absolute; top: calc(100% + 8px); z-index: 24; width: 300px; padding: 10px 12px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-float); font-size: 13px; line-height: 1.45; color: var(--ah-ink-2); }
.note::before { content: ""; position: absolute; top: -7px; width: 12px; height: 12px; transform: rotate(45deg); background: var(--ah-surface); border-left: 1px solid var(--ah-accent-line); border-top: 1px solid var(--ah-accent-line); }
.note p { margin: 0; }
.note b { color: var(--ah-ink); }
.note-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.note .ok { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; background: var(--ah-accent); color: var(--ah-on-accent); font-weight: 600; font-size: 13px; cursor: pointer; }
.note .ghost { border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-md); padding: 6px 12px; background: transparent; color: var(--ah-ink-2); font-size: 13px; cursor: pointer; }

/* ---------- panels the header opens ---------- */
.pane { display: flex; flex-direction: column; flex: 0 0 48%; min-width: 0; border-left: 1px solid var(--ah-line); background: var(--ah-surface); }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--ah-line); color: var(--ah-ink-2); font-size: 12.5px; }
.pane-head button { border: 0; background: transparent; color: var(--ah-ink-2); cursor: pointer; font-size: 16px; }
.pane-body { flex: 1; display: grid; grid-template-columns: 150px 1fr; min-height: 0; }
.tree { border-right: 1px solid var(--ah-line); padding: 8px; font: 12px var(--ah-mono); color: var(--ah-ink-2); display: grid; align-content: start; gap: 3px; }
.tree .cur { color: var(--ah-ink); background: var(--ah-hover); border-radius: 4px; padding: 0 4px; margin: 0 -4px; }
.code { padding: 10px 12px; font: 12px/1.6 var(--ah-mono); color: var(--ah-ink); white-space: pre; overflow: auto; background: var(--ah-sunken); }
.code .k { color: var(--ah-syntax-keyword); } .code .s { color: var(--ah-syntax-string); } .code .c { color: var(--ah-syntax-comment); }
.term { flex: none; height: 190px; display: flex; flex-direction: column; border-top: 1px solid var(--ah-line); background: var(--ah-surface); }
.term-body { flex: 1; padding: 8px 12px; font: 12.5px/1.55 var(--ah-mono); color: var(--ah-ink); background: var(--ah-sunken); white-space: pre; overflow: auto; }

/* ---------- phone form: the token file's ≤800 px values ---------- */
.app.phone { --ah-control-row: 40px; --ah-control-row-font: 14px; --ah-column-pad-inline: 14px; --ah-topbar-pad-block: 6px; --ah-topbar-pad-inline: 12px; width: 390px; height: 800px; grid-template-columns: 1fr; border-radius: 34px; border-width: 8px; border-color: #0b0d0f; }
.app.phone .rail { display: none; }
.app.phone .tl { flex-wrap: wrap; gap: var(--ah-s1) var(--ah-s1); }
.app.phone .tl::after { content: ""; order: 2; flex-basis: 100%; }
.app.phone .tl > * { order: 3; }
.app.phone .tl > .navb, .app.phone .tl > .tr, .app.phone .tl > .row1, .app.phone .tl > .more-wrap { order: 1; }
.app.phone .tl > .ws, .app.phone .tl > .sep, .app.phone .tl > .oneoff, .app.phone .tl > .desk { display: none; }
.navb { display: none; flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--ah-r-md); background: transparent; color: var(--ah-ink-2); }
.app.phone .navb { display: inline-grid; place-items: center; }
.app.phone .pane { position: absolute; inset: 0; z-index: 5; border-left: 0; }
.app.phone .pane-body { grid-template-columns: 1fr; }
.app.phone .tree { display: none; }
.app.phone .menu-pop { min-width: 290px; }
.app.phone .details { left: 8px; right: 8px; width: auto; }
.app.phone .coach { left: 8px; right: 8px; width: auto; }
.app.phone .coach::before { right: 22px; }
@media (max-width: 700px) {
  .pg { padding: 64px 10px 30px; }
  .app.phone { width: 100%; max-width: 390px; }
}

/* ---------- round 3: who explains the header, and where ---------- */
.pg-diffs { margin: 0 0 14px; padding: 10px 14px; max-width: 120ch; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); font-size: 13px; line-height: 1.45; list-style: none; display: grid; gap: 3px; }
.pg-diffs li { display: grid; grid-template-columns: 210px 1fr; gap: 12px; color: var(--ah-ink-2); }
.pg-diffs li b { color: var(--ah-ink); font-weight: 600; }
.pg-diffs li.cur { color: var(--ah-ink); }
.pg-diffs li.cur b { color: var(--ah-accent-ink); }
.pg-diffs li.cur::marker { content: none; }
@media (max-width: 700px) { .pg-diffs li { grid-template-columns: 1fr; gap: 0; } }
/* the empty conversation: the start page where the timeline would be */
.ah-start { padding: 22px 0 8px; color: var(--ah-ink); overflow-wrap: anywhere; }
.ah-start h2 { font-size: var(--ah-size-h2); margin: 0; }
.ah-start p { color: var(--ah-ink-2); line-height: var(--ah-lh-body); margin: 8px 0; }
.ah-start-heading { margin: 18px 0 0; font-size: 14px; font-weight: 600; }
.ah-start-hint { font-size: var(--ah-size-meta); }

const STEPS = ['editor', 'terminal', 'recap', 'retitle', 'archive', 'details', 'more', 'left'];
const selFor = (id) => id === 'more' ? '[data-more]' : A[id].sel || `[data-act="${id}"]`;

const offNote = (id) => (empty() && EMPTY_OFF[id] ? '<small class="g-off">Harmaa, kunnes keskustelussa on jotain.</small>' : '');

// After each render: tags under what the guide explains, the card under the
// tags, and in the tour the current button ringed and the card under it.
function placeGuide() {
  const box = document.querySelector('#stage .lbls');
  if (!box) return;
  const shape = V[cur].shape;
  const hdEl = box.parentElement;
  const hd = hdEl.getBoundingClientRect();
  let ids;
  if (shape === 'steps') ids = STEPS[S.step] === 'left' ? STATUS : [STEPS[S.step]];
  else ids = [...(shape === 'groups' ? STATUS : []), ...rowIds(), 'more'];
  const targets = [];
  for (const id of ids) {
    const { el, inMenu: m } = elFor(id);
    if (!shown(el)) continue;
    if (m && shape !== 'steps') continue;         // the card says what is in ⋯
    targets.push({ id, el, name: m ? `${A[id].name} · ⋯` : A[id].name });
  }
  const levels = shape === 'groups' ? 3 : 2;
  box.innerHTML = targets.map((t, i) => {
    const r = t.el.getBoundingClientRect();
    const level = (targets.length - 1 - i) % levels;
    const k = shape === 'groups' ? ` k-${A[t.id].kind}` : '';
    return `<span class="lbl${k}" style="left:${r.left + r.width / 2 - hd.left}px;top:${r.bottom - hd.top + 6 + level * 22}px;--lead:${6 + level * 22}px">${esc(t.name)}</span>`;
  }).join('');
  let bottom = 0;
  for (const t of box.children) {
    let r = t.getBoundingClientRect();
    if (r.right > hd.right - 4) t.style.left = `${parseFloat(t.style.left) - (r.right - hd.right + 4)}px`;
    if (r.left < hd.left + 4) t.style.left = `${parseFloat(t.style.left) + (hd.left + 4 - r.left)}px`;
    r = t.getBoundingClientRect();
    bottom = Math.max(bottom, r.bottom - hd.top);
  }
  const card = hdEl.querySelector('.coach.guide');
  if (!card) return;
  card.style.top = `${(bottom || hd.height) + 10}px`;
  if (shape !== 'steps') return;
  for (const t of targets) t.el.classList.add('ringed');
  // The card sits under its button, kept inside the header.
  const xs = targets.map((t) => { const r = t.el.getBoundingClientRect(); return r.left + r.width / 2 - hd.left; });
  const mid = (Math.min(...xs) + Math.max(...xs)) / 2;
  const w = card.getBoundingClientRect().width;
  const left = Math.max(8, Math.min(hd.width - w - 8, mid - w / 2));
  card.style.left = `${left}px`;
  card.style.right = 'auto';
  card.style.setProperty('--arrow', `${mid - left - 6}px`);
}

function shorten() {
  const tl = document.querySelector('#stage .tl');
  if (!tl || phone()) return;
  const fits = () => {
    const title = tl.querySelector('h1');
    const box = tl.getBoundingClientRect();
    const right = Math.max(box.left, ...[...tl.children].map((c) => { const r = c.getBoundingClientRect(); return r.width ? r.right : box.left; }));
    if (right > box.right + 1) return false;
    const need = Math.min(title.scrollWidth, box.width * 0.4);
    return title.clientWidth >= need - 1;
  };
  let steps = 0;
  for (; steps < 6; steps++) {
    tl.dataset.s = Array.from({ length: steps }, (_, i) => i + 1).join(' ');
    if (fits()) break;
  }
  if (steps !== S.steps) {
    S.steps = steps;
    if (S.card) S.card = fullCard(true);
    render();
  }
}

window.addEventListener('resize', () => placeGuide());

// ---------- picker (PICKER.md reference wiring) ----------
const variants = V.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
