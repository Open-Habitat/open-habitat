<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Näkymäkortti, kierros 3: kytkin otsikkorivillä ja linkin voimassaolo</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ah-bg);
  color: var(--ah-ink);
  font: 400 var(--ah-size-ui)/var(--ah-lh-ui) var(--ah-font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- page chrome around the simulation ---------- */
.pg { max-width: 1320px; margin: 0 auto; padding: 72px 24px 40px; }
.pg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; margin-bottom: 10px; }
.pg-head h1 { margin: 0; font-size: var(--ah-size-h1); font-weight: 600; letter-spacing: -.01em; }
.pg-axis { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.pg-toggles { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 0 0 12px; align-items: center; }
.pg-toggles label { color: var(--ah-muted); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--ah-r-md); background: var(--ah-control); }
.seg button { border: 0; background: transparent; color: var(--ah-ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ah-surface); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-line); font-weight: 600; }
.reset { border: 1px solid var(--ah-line-strong); background: var(--ah-surface); color: var(--ah-ink-2); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.pg-lead { margin: 0 0 16px; max-width: 100ch; color: var(--ah-ink-2); font-size: var(--ah-size-body); line-height: 1.55; }
.pg-lead b { color: var(--ah-ink); }
.pg-log { min-height: 20px; margin: 10px 2px 0; color: var(--ah-muted); font-size: 12px; }
.phone-wrap { display: flex; justify-content: center; }

/* ---------- the production-looking app ---------- */
.app { position: relative; display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 720px; overflow: hidden; border-radius: var(--ah-r-xl); border: 1px solid var(--ah-line); background: var(--ah-bg); box-shadow: var(--ah-shadow-app); color: var(--ah-ink); }
.rail { background: var(--ah-rail); border-right: 1px solid var(--ah-line); padding: 10px 8px 16px; overflow: auto; }
.rail-brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px; font-weight: 600; font-size: 13.5px; }
.rail-brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--ah-accent); display: inline-block; }
.rail section + section { margin-top: 8px; }
.rail h2 { display: flex; align-items: center; gap: 8px; min-height: 26px; margin: 0; padding: 0 8px; color: var(--ah-muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.cnt { color: var(--ah-muted); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font-size: 13px; }
.row.cur { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); font-weight: 600; }
.row .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { flex: none; color: var(--ah-muted); font-size: 11px; font-weight: 400; }
.ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ball.done { background: var(--ah-ok); }
.ball.you { background: var(--ah-turn); }
.grp h3 { margin: 0; padding: 5px 8px 1px; color: var(--ah-ink-2); font: 600 12px var(--ah-mono); }

.main { display: flex; min-width: 0; min-height: 0; }
.conv { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: var(--ah-bg); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.topbar .menu { display: none; border: 0; background: transparent; color: var(--ah-ink-2); font-size: 18px; padding: 0 4px; }
.topbar h5 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .wsn { color: var(--ah-muted); font: 12px var(--ah-mono); white-space: nowrap; }
.chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: var(--ah-r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--ah-control); color: var(--ah-ink-2); }
.stream { flex: 1; overflow: auto; padding: 18px var(--ah-column-pad-inline) 10px; }
.stream > * { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.msg-user p { margin: 0; max-width: 80%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--ah-accent-soft); color: var(--ah-ink); font-size: var(--ah-size-body); line-height: 1.5; }
.msg-agent { margin-bottom: 12px; font-size: var(--ah-size-body); line-height: var(--ah-lh-body); color: var(--ah-ink); }
.msg-agent p { margin: 0 0 6px; }
.offer-slot { margin-bottom: 18px; }
.composer { padding: 0 var(--ah-column-pad-inline) var(--ah-composer-pad-block); }
.composer-box { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; min-height: 48px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); }
.composer-box span { flex: 1; color: var(--ah-faint); font-size: var(--ah-size-body); }
.composer-box button { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; font-weight: 600; font-size: 13px; background: var(--ah-accent); color: var(--ah-on-accent); }

/* Production ControlButton (Controls.module.css), row size. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--ah-control-row-gap); min-height: var(--ah-control-row); padding: 0 var(--ah-control-row-pad); border: 1px solid transparent; border-radius: var(--ah-r-md); font-size: var(--ah-control-row-font); font-weight: 600; line-height: 1.2; cursor: pointer; background: var(--ah-control); color: var(--ah-ink); transition: background var(--ah-transition); }
.btn:hover { background: var(--ah-control-hover); }
.btn.primary { background: var(--ah-accent); color: var(--ah-on-accent); }
.btn.primary:hover { background: var(--ah-accent-hover); }
.btn.danger { background: var(--ah-err); color: var(--ah-on-err, #fff); }
.btn.secondary { background: var(--ah-surface); border-color: var(--ah-line-strong); }
.btn.quiet { background: transparent; color: var(--ah-accent-ink); }
.btn.quiet:hover { background: var(--ah-surface-hover); }
.btn.icon { width: var(--ah-control-row); padding: 0; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn:focus-visible { outline: var(--ah-focus-width) solid var(--ah-accent); outline-offset: 2px; }

/* ---------- the card on main (ViewPanel.css) ---------- */
.ah-view-offer { max-width: min(var(--ah-measure), 100%); display: flex; align-items: flex-start; gap: var(--ah-s3); padding: var(--ah-s4); border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); }
.ah-view-offer-mark { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); color: var(--ah-accent-ink); font: var(--ah-size-meta) var(--ah-mono); }
.ah-view-offer-body { display: grid; flex: 1; min-width: 0; gap: var(--ah-s1); }
.ah-view-offer-label, .ah-view-offer-meta, .ah-view-offer-status { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.ah-view-offer-title { font-weight: 600; overflow-wrap: anywhere; }
.ah-view-offer-actions { display: flex; flex-wrap: wrap; gap: var(--ah-s2); margin-top: var(--ah-s2); }

/* ---------- directions: shared shape ---------- */
/* The title row carries the mark and the title on one line; the buttons
   follow. No label above the title, no file facts, no tab status. */
.vo { max-width: min(var(--ah-measure), 100%); padding: var(--ah-s4); border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface-2); display: grid; gap: var(--ah-s3); }
.vo-head { display: flex; align-items: center; gap: var(--ah-s3); min-width: 0; }
.vo-mark { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--ah-accent-line); border-radius: var(--ah-r-md); background: var(--ah-accent-soft); color: var(--ah-accent-ink); font: var(--ah-size-meta) var(--ah-mono); }
.vo-titles { display: grid; gap: 1px; min-width: 0; flex: 1; }
.vo-title { font-weight: 600; font-size: var(--ah-size-body); overflow-wrap: anywhere; line-height: 1.35; }
.vo-sub { display: inline-flex; align-items: baseline; gap: 5px; color: var(--ah-muted); font-size: var(--ah-size-meta); }
.vo-sub svg.i { width: 13px; height: 13px; align-self: center; }
.vo-sub.shared { color: var(--ah-accent-ink); }
.vo-actions { display: flex; flex-wrap: wrap; gap: var(--ah-s2); padding-left: calc(32px + var(--ah-s3)); }
.vo-status { color: var(--ah-muted); font-size: var(--ah-size-meta); padding-left: calc(32px + var(--ah-s3)); }
.vo-status.err { color: var(--ah-err); }
/* 1: the share button carries the state. */
.btn.is-shared { background: var(--ah-accent-soft); color: var(--ah-accent-ink); border-color: var(--ah-accent-line); }
/* 3: the visibility control in the title row. */
.vis { position: relative; flex: none; }
.vis-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 8px 0 9px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-pill); background: var(--ah-surface); color: var(--ah-ink-2); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.vis-btn:hover { background: var(--ah-surface-hover); }
.vis-btn svg.i { width: 13px; height: 13px; }
.vis-btn .chev { width: 10px; height: 10px; opacity: .7; }
.vis-btn.shared { border-color: var(--ah-accent-line); background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; min-width: 250px; padding: 4px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); display: grid; }
.menu-pop button { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; text-align: left; border: 0; background: transparent; color: var(--ah-ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu-pop button:hover { background: var(--ah-surface-hover); }
.menu-pop button small { grid-column: 2; color: var(--ah-muted); font-size: 11.5px; line-height: 1.35; }
.menu-pop button.danger { color: var(--ah-err); }
.menu-pop hr { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 4px 2px; }
.menu-pop .tick { color: var(--ah-accent-ink); }

/* ---------- the panel beside the conversation (ViewPanel) ---------- */
.pane { display: flex; flex-direction: column; flex: 0 0 46%; min-width: 0; border-left: 1px solid var(--ah-line); background: var(--ah-surface); }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: var(--ah-s3); padding: var(--ah-s2) var(--ah-s3); border-bottom: 1px solid var(--ah-line); color: var(--ah-muted); }
.pane-head h2 { margin: 0; font: inherit; color: var(--ah-ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-head .ctl { display: flex; gap: 2px; }
.pane-head .btn.on { color: var(--ah-accent-ink); background: var(--ah-accent-soft); }
.pane-frame { flex: 1; min-height: 0; overflow: auto; background: var(--ah-content-canvas); padding: 22px; color: #1d2228; }
.pane-frame h1 { margin: 0 0 6px; font: 600 20px var(--ah-font); }
.pane-frame p { margin: 0 0 14px; color: #4d5560; font-size: 13px; }
.pane-frame .fake { display: grid; gap: 6px; max-width: 260px; padding: 10px; border-radius: 8px; background: #f2f4f6; }
.pane-frame .fake div { height: 22px; border-radius: 6px; background: #e1e5ea; }
.pane-frame .fake div:nth-child(2) { background: #cfe5e8; }
.pane-note { margin: 0; padding: var(--ah-s2) var(--ah-s4); border-top: 1px solid var(--ah-line); color: var(--ah-muted); font-size: var(--ah-size-meta); }

/* ---------- share dialog (ViewLinkDialog, condensed) ---------- */
.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: color-mix(in srgb, #000 32%, transparent); padding: 16px; }
.dialog { width: min(460px, 100%); padding: 20px; border-radius: var(--ah-r-xl); background: var(--ah-surface); box-shadow: var(--ah-shadow-dialog); display: grid; gap: 12px; }
.dialog h3 { margin: 0; font-size: var(--ah-size-h2); font-weight: 600; }
.dialog .what { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.dialog .terms { margin: 0; color: var(--ah-ink-2); font-size: 13px; line-height: 1.5; }
.dialog .step { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dialog .url { display: flex; gap: 8px; }
.dialog .url input { flex: 1; min-width: 0; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-md); padding: 6px 8px; background: var(--ah-surface-2); color: var(--ah-ink); font: 12.5px var(--ah-mono); }
.dialog .meta { margin: 0; color: var(--ah-muted); font-size: var(--ah-size-meta); }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* phone form: the token file's ≤800 px values, applied to the frame. */
.app.phone { --ah-control-row: 40px; --ah-control-row-font: 14px; --ah-column-pad-inline: 14px; width: 390px; height: 800px; grid-template-columns: 1fr; border-radius: 34px; border-width: 8px; border-color: #0b0d0f; }
.app.phone .rail { display: none; }
.app.phone .topbar { padding: 10px 12px; }
.app.phone .topbar .menu { display: inline-block; }
.app.phone .topbar .wsn, .app.phone .chip { display: none; }
.app.phone .pane { position: absolute; inset: 0; z-index: 4; border-left: 0; }
.app.phone .vo-actions, .app.phone .vo-status { padding-left: 0; }
.app.phone .ah-view-offer-actions .btn { flex: 1 1 auto; }
.app.phone .vo-actions .btn { flex: 1 1 auto; }
.app.phone .menu-pop { min-width: 240px; left: 0; right: auto; }
/* 3 on a phone: the control drops under the title so the title keeps its width. */
.app.phone .vo-head { flex-wrap: wrap; row-gap: 6px; }
.app.phone .vis { flex-basis: 100%; padding-left: calc(32px + var(--ah-s3)); }
@media (max-width: 700px) {
  .pg { padding: 64px 10px 30px; }
  .app.phone { width: 100%; max-width: 390px; }
}

/* ---------- picker (PICKER.md, verbatim) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }

/* ---------- round 3: the switch in the title row, and the link's expiry ---------- */
.vo-actions .sp { flex: 1 1 auto; }
.btn.copied { color: var(--ah-ok); }
/* The switch (round 2's riff B). */
.sw { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 2px 0 8px; border: 0; background: transparent; color: var(--ah-ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; border-radius: var(--ah-r-pill); }
.sw:hover { background: var(--ah-surface-hover); }
.sw:focus-visible, .exp:focus-visible { outline: var(--ah-focus-width) solid var(--ah-accent); outline-offset: 2px; }
.sw .track { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--ah-line-strong); transition: background var(--ah-transition); }
.sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ah-surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform var(--ah-transition); }
.sw[aria-checked="true"] { color: var(--ah-accent-ink); }
.sw[aria-checked="true"] .track { background: var(--ah-accent); }
.sw[aria-checked="true"] .track::after { transform: translateX(12px); }
.sw .when { color: var(--ah-muted); font-weight: 500; }
/* The title row's controls: the date (riffs) and the switch. The switch
   keeps its place; the date appears to its left when the view is public. */
.vo-head { position: relative; }
.vo-ctl { flex: none; display: inline-flex; align-items: center; gap: 2px; margin-left: auto; }
.exp { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 7px; border: 0; border-radius: var(--ah-r-pill); background: transparent; color: var(--ah-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.exp:hover, .exp[aria-expanded="true"] { background: var(--ah-surface-hover); color: var(--ah-ink-2); }
.exp svg.i { width: 12px; height: 12px; }
.exp .chev { width: 10px; height: 10px; opacity: .7; transition: transform var(--ah-transition); }
.exp[aria-expanded="true"] .chev { transform: rotate(180deg); }
.exp.soon { color: var(--ah-warn, var(--ah-accent-ink)); }
/* A: a short menu of durations, each with its date. */
.pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; padding: 4px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); box-shadow: var(--ah-shadow-menu); }
.pop-h { padding: 6px 8px 4px; color: var(--ah-muted); font-size: 11.5px; }
.durs { display: grid; min-width: 232px; }
.durs button { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; color: var(--ah-ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.durs button:hover { background: var(--ah-surface-hover); }
.durs button .d { color: var(--ah-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.durs button .tick { color: var(--ah-accent-ink); width: 14px; height: 14px; }
.durs button[aria-checked="false"] .tick { visibility: hidden; }
/* B: a month calendar; any day from tomorrow to the site's maximum. */
.cal { width: 252px; padding: 8px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; font-size: 13px; font-weight: 600; }
.cal-h button { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--ah-ink-2); cursor: pointer; display: grid; place-items: center; }
.cal-h button:hover:not([disabled]) { background: var(--ah-surface-hover); }
.cal-h button[disabled] { opacity: .3; cursor: default; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-g .wd { text-align: center; color: var(--ah-muted); font-size: 11px; padding: 2px 0 4px; }
.cal-g button { height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--ah-ink); font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.cal-g button:hover:not([disabled]) { background: var(--ah-surface-hover); }
.cal-g button[disabled] { color: var(--ah-faint); cursor: default; }
.cal-g button.today { box-shadow: inset 0 0 0 1px var(--ah-line-strong); }
.cal-g button.sel { background: var(--ah-accent); color: var(--ah-on-accent); font-weight: 600; }
.cal-g button.in { background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.cal-f { padding: 8px 2px 2px; color: var(--ah-muted); font-size: 11.5px; }
/* C: the durations as a row of the card itself, no layer. */
.exp-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ah-s2); padding-left: calc(32px + var(--ah-s3)); }
.exp-row .lbl { color: var(--ah-muted); font-size: var(--ah-size-meta); margin-right: 2px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chips button { display: grid; justify-items: center; gap: 0; min-width: 62px; padding: 4px 10px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); background: var(--ah-surface); color: var(--ah-ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer; line-height: 1.25; }
.chips button small { color: var(--ah-muted); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chips button:hover { background: var(--ah-surface-hover); }
.chips button[aria-checked="true"] { border-color: var(--ah-accent-line); background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.chips button[aria-checked="true"] small { color: var(--ah-accent-ink); }
.chips button:focus-visible { outline: var(--ah-focus-width) solid var(--ah-accent); outline-offset: 1px; }
.app.phone .exp-row { padding-left: 0; }
.app.phone .chips { flex: 1 1 100%; }
.app.phone .chips button { flex: 1 1 0; min-width: 0; }
.app.phone .durs { min-width: 220px; }
/* On a phone the controls take their own line under the title, the switch
   still at the right, so the title keeps the card's width. The baseline
   keeps round 2's title row. */
.app.phone .vo-ctl.own { flex: 1 1 100%; justify-content: flex-end; }
/* The address and the host write, shown under the simulation. */
.pg-log code { font: 12px var(--ah-mono); color: var(--ah-ink-2); background: var(--ah-control); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.pg-log b { color: var(--ah-ink-2); }
</style>
</head>
<body>
<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Lähtö · kierroksen 2 riffi B</button>
  <button class="proto-picker-item">A · Kestot valikossa</button>
  <button class="proto-picker-item">B · Kalenteri</button>
  <button class="proto-picker-item">C · Kestot kortissa</button>
</nav>
<div id="stage"></div>
<script>
'use strict';
// ------------------------------------------------------------------
// The world. Two views the agent offered in one conversation. The first is
// already public (only where the site allows links); the second is new and
// private, the default it stays in until the person changes it. The
// address model is round 2's option 1: the public address is born when the
// view is made public and dies when it is made private again.
// ------------------------------------------------------------------
const VIEWS = [
  { id: 'v1', vid: 'v4kq7m2xr9at4cnb6hd3pe5wly', good: 'Viimeisimmät sivupalkissa – prototyyppi, kierros 1', file: 'index.html' },
  { id: 'v2', vid: 'vz8s3fgj2nq6ub7ra5ctm4hokx', good: 'Viimeisimmät sivupalkissa – prototyyppi, kierros 2', file: 'raide.html' },
];
const ICON = {
  external: '<path d="M13 5h6v6M19 5l-9 9"/><path d="M19 14v5H5V5h5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  check: '<path d="m4 12 5 5L20 6"/>',
  cross: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  left: '<path d="m15 6-6 6 6 6"/>',
  right: '<path d="m9 6 6 6-6 6"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
};
const svg = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

// Time as the host counts it. A link's expiry is now + days × 24 h, days an
// integer from 1 to the site's max_days (views.link_max_days, at most 365);
// changing it counts from now again, so it can shorten as well as extend.
// The default when a view is made public is min(30, max_days)
// (viewLinks.ts defaultExpiry); the dialog's choices are 1, 7 and 30 days
// within the maximum, and the maximum itself (expiryChoices).
const NOW = new Date(2026, 10, 1, 14, 20);
const DAY = 24 * 3600 * 1000;
const at = (days) => new Date(NOW.getTime() + days * DAY);
const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysTo = (d) => Math.round((midnight(d) - midnight(NOW)) / DAY);
const defaultExpiry = (max) => Math.min(30, max);
function expiryChoices(max) {
  const c = [1, 7, 30].filter((d) => d <= max);
  if (!c.includes(max)) c.push(max);
  return c;
}
const short = (d) => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear() === NOW.getFullYear() ? '' : d.getFullYear()}`;
const long = (d) => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()} klo ${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`;
const dayWord = (n) => (n === 1 ? '1 päivä' : `${n} päivää`);
const MONTHS = ['tammikuu', 'helmikuu', 'maaliskuu', 'huhtikuu', 'toukokuu', 'kesäkuu', 'heinäkuu', 'elokuu', 'syyskuu', 'lokakuu', 'marraskuu', 'joulukuu'];

const TOKENS = ['Kd8fP2…Zq', 'u7TxQ9…Lb', 'mB4wL1…Rc', 'p3HsV6…Ty', 'Wz2kN8…Ae', 'c9GdJ4…Mo', 'r5YbE7…Uh', 'h1QnX3…Df'];
const APP = 'https://habitat.example.fi';
const LINKHOST = { v1: 'oh-view-q3rzt5…7m.example.fi', v2: 'oh-view-b6kwp2…4e.example.fi' };

const q = new URLSearchParams(location.search);
let theme = q.get('t') === 'dark' ? 'dark' : 'light';
let device = q.get('d') === 'phone' ? 'phone' : 'desktop';
let links = q.get('l') !== 'off';
let titles = q.get('n') === 'file' ? 'file' : 'good';
// The site's longest expiry: 90 on the test server; 7 and 365 show how the
// choices follow it.
let maxDays = [7, 90, 365].includes(Number(q.get('x'))) ? Number(q.get('x')) : 90;
let cur = 0;
let S;
const fresh = () => ({
  // v1 was made public on 29.10. with the default 30 days.
  pub: { v1: { exp: new Date(2026, 10, 28, 9, 5), token: TOKENS[0] } },
  next: 1,
  state: {},          // view id → idle | opening | open | failed
  panel: null,
  open: null,         // view id whose expiry chooser is open
  month: null,        // B: the calendar's month, as a Date on its 1st
  copied: null,
  log: '',
});
const title = (v) => (titles === 'good' ? v.good : v.file);
const pubOf = (v) => (links ? S.pub[v.id] : undefined);
const privateTab = (v) => `${APP}/view?id=${v.vid}`;
const linkURL = (v, token) => `https://${LINKHOST[v.id]}/${token}/`;
const tabURL = (v) => { const p = pubOf(v); return cur > 0 || p ? (p ? linkURL(v, p.token) : privateTab(v)) : privateTab(v); };
const code = (s) => `<code>${esc(s)}</code>`;

function makePublic(v) {
  const days = defaultExpiry(maxDays);
  const token = TOKENS[S.next++ % TOKENS.length];
  S.pub[v.id] = { exp: at(days), days, token };
  S.log = `Näkymä on nyt julkinen ${short(at(days))} asti (${dayWord(days)}, oletus). Sille syntyi osoite ${code(linkURL(v, token))}. ` +
    `Hostille: ${code(`POST /api/v1/view-links {view_id, days: ${days}}`)}.`;
}
function makePrivate(v) {
  const was = S.pub[v.id];
  delete S.pub[v.id];
  S.open = null;
  S.log = `Näkymä on taas vain sinun. ${code(linkURL(v, was.token))} lakkasi toimimasta. Jos teet näkymän uudelleen julkiseksi, se saa uuden osoitteen ja taas ${dayWord(defaultExpiry(maxDays))}.`;
}
function setDays(v, days) {
  const p = S.pub[v.id];
  p.exp = at(days); p.days = days;
  S.open = null;
  S.log = `Linkki on voimassa ${long(p.exp)} asti, ${dayWord(days)} tästä hetkestä. Osoite pysyy samana. ` +
    `Hostille: ${code(`POST /api/v1/view-links/change {link_id, days: ${days}}`)}.`;
}

// ------------------------------------------------------------------
// The card. Every riff is round 2's riff B: the title row, the switch
// Julkinen at its right, Avaa, Avaa omalle välilehdelle and, when public,
// Kopioi linkki. They differ in what pressing the date does.
// ------------------------------------------------------------------
const openBtns = (v) => {
  const st = S.state[v.id] || 'idle';
  return `<button class="btn primary" data-open="${v.id}" ${st === 'opening' ? 'disabled' : ''}>Avaa</button>` +
    `<button class="btn" data-tab="${v.id}">Avaa omalle välilehdelle ${svg('external')}</button>`;
};
const copyBtn = (v) => (!pubOf(v) ? '' : S.copied === v.id
  ? `<button class="btn copied" data-copy="${v.id}">${svg('check')} Kopioitu</button>`
  : `<button class="btn" data-copy="${v.id}" title="Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta ${esc(short(pubOf(v).exp))} asti.">${svg('copy')} Kopioi linkki</button>`);
const failLine = (v) => (S.state[v.id] === 'failed' ? `<div class="vo-status err" role="status">Näkymää ei voitu avata. Se on ehkä poistettu, tai yhteys katkesi.</div>` : '');
const sw = (v, inside = '') => {
  const p = pubOf(v);
  return `<button class="sw" role="switch" aria-checked="${!!p}" data-toggle="${v.id}" title="${p ? 'Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta.' : 'Vain sinä näet näkymän. Kytke päälle, niin kuka tahansa linkin saanut voi avata sen.'}">` +
    `Julkinen${inside}<span class="track" aria-hidden="true"></span></button>`;
};
const card = (v, ctl, pop = '', below = '') => `<aside class="vo" role="note" aria-label="Näkymä: ${esc(title(v))}">` +
  `<div class="vo-head"><span class="vo-mark" aria-hidden="true">&lt;/&gt;</span>` +
  `<div class="vo-titles"><strong class="vo-title">${esc(title(v))}</strong></div>${links ? `<span class="vo-ctl${cur ? ' own' : ''}">${ctl}</span>` : ''}${pop}</div>` +
  `<div class="vo-actions">${openBtns(v)}${copyBtn(v)}</div>${below}${failLine(v)}</aside>`;
// The date as a control, left of the switch, so the switch never moves.
const expBtn = (v, icon) => {
  const p = pubOf(v);
  if (!p) return '';
  const open = S.open === v.id;
  return `<button class="exp" data-exp="${v.id}" aria-haspopup="${icon === 'chev' ? 'menu' : 'dialog'}" aria-expanded="${open}" title="Voimassa ${esc(long(p.exp))} asti. Paina muuttaaksesi.">` +
    (icon === 'cal' ? svg('cal') : '') + `${esc(short(p.exp))} asti` + (icon === 'chev' ? svg('chev', 'chev') : '') + `</button>`;
};

// Lähtö: round 2's riff B as Jari chose it. The date is text inside the
// switch; the expiry is changed only in Settings › Jaetut linkit.
function card0(v) {
  const p = pubOf(v);
  return card(v, sw(v, p ? ` <span class="when">${esc(short(p.exp))} asti</span>` : ''));
}

// A · Kestot valikossa: the date opens a short menu of the dialog's
// durations, each with the date it gives. One choice applies at once.
function cardA(v) {
  const p = pubOf(v);
  let pop = '';
  if (p && S.open === v.id) {
    pop = `<div class="pop" role="menu" aria-label="Voimassa">` +
      `<div class="pop-h">Nyt ${esc(short(p.exp))} asti. Uusi aika lasketaan tästä päivästä.</div><div class="durs">` +
      expiryChoices(maxDays).map((d) => `<button role="menuitemradio" aria-checked="${p.days === d}" data-days="${d}" data-view="${v.id}">` +
        `${svg('check', 'tick')}<span>${dayWord(d)}${d === maxDays && d > 30 ? ' (enintään)' : ''}</span><span class="d">${esc(short(at(d)))} asti</span></button>`).join('') +
      `</div></div>`;
  }
  return card(v, expBtn(v, 'chev') + sw(v), pop);
}

// B · Kalenteri: the date opens a month calendar. Any day from tomorrow to
// the site's maximum can be chosen; the link then expires on that day at the
// time of the choice (whole days from now, as the host counts).
function cardB(v) {
  const p = pubOf(v);
  let pop = '';
  if (p && S.open === v.id) {
    const m = S.month;
    const last = at(maxDays);
    const first = new Date(NOW.getFullYear(), NOW.getMonth(), 1);
    const prevOk = m > first;
    const nextOk = new Date(m.getFullYear(), m.getMonth() + 1, 1) <= last;
    const lead = (m.getDay() + 6) % 7;
    const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = ['ma', 'ti', 'ke', 'to', 'pe', 'la', 'su'].map((w) => `<span class="wd">${w}</span>`).join('');
    cells += '<span></span>'.repeat(lead);
    const selDays = daysTo(p.exp);
    for (let i = 1; i <= n; i++) {
      const d = new Date(m.getFullYear(), m.getMonth(), i);
      const k = daysTo(d);
      const ok = k >= 1 && k <= maxDays;
      const cls = [k === 0 ? 'today' : '', k === selDays ? 'sel' : '', k > 0 && k < selDays ? 'in' : ''].join(' ').trim();
      cells += `<button ${cls ? `class="${cls}"` : ''} ${ok ? `data-days="${k}" data-view="${v.id}"` : 'disabled'} aria-label="${i}.${m.getMonth() + 1}.${m.getFullYear()}"${k === selDays ? ' aria-pressed="true"' : ''}>${i}</button>`;
    }
    pop = `<div class="pop cal" role="dialog" aria-label="Voimassa asti">` +
      `<div class="cal-h"><button data-month="-1" aria-label="Edellinen kuukausi" ${prevOk ? '' : 'disabled'}>${svg('left')}</button>` +
      `<span>${MONTHS[m.getMonth()]} ${m.getFullYear()}</span>` +
      `<button data-month="1" aria-label="Seuraava kuukausi" ${nextOk ? '' : 'disabled'}>${svg('right')}</button></div>` +
      `<div class="cal-g">${cells}</div>` +
      `<div class="cal-f">Valitse päivä, johon asti linkki toimii. Enintään ${esc(short(last))}.</div></div>`;
  }
  return card(v, expBtn(v, 'cal') + sw(v), pop);
}

// C · Kestot kortissa: the date opens a row of the card itself with the
// durations and their dates, no layer over the conversation.
function cardC(v) {
  const p = pubOf(v);
  let below = '';
  if (p && S.open === v.id) {
    below = `<div class="exp-row"><span class="lbl">Voimassa tästä päivästä</span><span class="chips" role="radiogroup" aria-label="Voimassa">` +
      expiryChoices(maxDays).map((d) => `<button role="radio" aria-checked="${p.days === d}" data-days="${d}" data-view="${v.id}">${d === 1 ? '1 pv' : `${d} pv`}<small>${esc(short(at(d)))}</small></button>`).join('') +
      `</span></div>`;
  }
  return card(v, expBtn(v, 'chev') + sw(v), '', below);
}

const V = [
  { name: 'Lähtö · kierroksen 2 riffi B', axis: 'Valitsemasi kortti sellaisenaan: kytkin Julkinen otsikkorivillä, päivämäärä sen sisällä tekstinä. Voimassaoloa muutetaan vain asetuksista.', card: card0,
    lead: 'Kytkin <b>Julkinen</b> tekee näkymästä julkisen yhdellä painalluksella oletusajaksi, ja päivämäärä näkyy kytkimessä. Päivämäärää ei voi painaa: voimassaolo muutetaan kohdassa Asetukset › Jaetut linkit.' },
  { name: 'A · Kestot valikossa', axis: 'Päivämäärä on painike kytkimen vasemmalla puolella. Se avaa lyhyen valikon kestoista, ja jokaisen vieressä on päivä, johon asti linkki silloin toimii.', card: cardA,
    lead: 'Tee toinen kortti julkiseksi ja paina päivämäärää. Valikossa on <b>1 päivä, 7 päivää, 30 päivää</b> ja sivuston enimmäisaika, kunkin vieressä päivä. Valinta tulee voimaan heti, ja osoite pysyy samana. Kaksi painallusta.' },
  { name: 'B · Kalenteri', axis: 'Päivämäärä avaa kuukausikalenterin. Mikä tahansa päivä huomisesta sivuston enimmäisaikaan kelpaa.', card: cardB,
    lead: 'Paina julkisen kortin päivämäärää. Kalenterissa valittu päivä on korostettu ja päivät siihen asti vaaleammin. Valitse mikä tahansa päivä huomisesta enimmäisaikaan; linkki toimii sinä päivänä samaan kellonaikaan asti kuin nyt on. Kaksi painallusta saman kuun sisällä.' },
  { name: 'C · Kestot kortissa', axis: 'Päivämäärä avaa kortin omaan riviin samat kestot kuin A, päivämäärineen. Mitään ei avaudu keskustelun päälle.', card: cardC,
    lead: 'Paina julkisen kortin päivämäärää: kortin alaosaan tulee rivi <b>Voimassa tästä päivästä</b> ja kestot päivämäärineen. Valinta tulee voimaan heti ja rivi sulkeutuu. Puhelimessa kestot täyttävät rivin.' },
];

// ------------------------------------------------------------------
// The conversation around the cards.
// ------------------------------------------------------------------
function railHTML() {
  return `<div class="rail-brand"><i></i>Open Habitat</div>` +
    `<section><h2>Sinun vuorosi <span class="cnt">1</span></h2><ul><li class="row"><span class="ball you"></span><span class="tt">Birch-päivitys</span><time>2 min</time></li></ul></section>` +
    `<section><h2>Viimeisimmät <span class="cnt">4</span></h2><div class="grp"><h3>open-habitat</h3><ul>` +
    `<li class="row cur"><span class="ball done"></span><span class="tt">Raiteen viimeisimmät</span><time>nyt</time></li>` +
    `<li class="row"><span class="ball done"></span><span class="tt">Julkaisun muistiinpanot</span><time>4 min</time></li></ul></div>` +
    `<div class="grp"><h3>deutschpad</h3><ul><li class="row"><span class="ball done"></span><span class="tt">Verbien taivutus</span><time>40 min</time></li></ul></div>` +
    `<div class="grp"><h3>fleetrepo</h3><ul><li class="row"><span class="ball done"></span><span class="tt">Varmuuskopion tarkistus</span><time>1 t</time></li></ul></div></section>`;
}
function convHTML(v) {
  const [a, b] = VIEWS;
  return `<header class="topbar"><button class="menu" aria-label="Avaa navigaatio">☰</button><h5>Raiteen viimeisimmät</h5><span class="wsn">open-habitat</span><span class="chip">Sinun vuorosi</span></header>` +
    `<div class="stream">` +
    `<div class="msg-user"><p>Tee prototyyppi Viimeisimmät-osiosta sellaisena kuin se on mainissa, ja näytä se minulle.</p></div>` +
    `<div class="msg-agent"><p>Sivu on valmis. Siinä on Nykyinen ja kaksi suuntaa siitä, mitkä keskustelut osioon kuuluvat.</p></div>` +
    `<div class="offer-slot">${v.card(a)}</div>` +
    `<div class="msg-user"><p>Hyvä. Tee toinen kierros: worktree-agentit katoavat raiteesta heti valmistuttuaan.</p></div>` +
    `<div class="msg-agent"><p>Toinen kierros on valmis. Rajaus osuu vain selaimesta aloittamiisi worktree-agentteihin, joten akseli on, mitkä valmiit keskustelut Viimeisimmät listaa. Suosittelen suuntaa 1 · Kaikki keskustelut.</p></div>` +
    `<div class="offer-slot">${v.card(b)}</div>` +
    `</div>` +
    `<div class="composer"><div class="composer-box"><span>Kirjoita agentille…</span><button type="button">Lähetä</button></div></div>`;
}
// The panel's Kopioi linkki icon, shown only when the view is public.
function paneHTML() {
  const v = VIEWS.find((x) => x.id === S.panel);
  if (!v) return '';
  const p = pubOf(v);
  const st = S.state[v.id];
  const tool = p ? `<button class="btn quiet icon on" data-copy="${v.id}" aria-label="Kopioi linkki" title="Julkinen ${short(p.exp)} asti · Kopioi linkki">${svg(S.copied === v.id ? 'check' : 'copy')}</button>` : '';
  return `<section class="pane" aria-label="Näkymä: ${esc(title(v))}"><header class="pane-head"><h2>${esc(title(v))}</h2><span class="ctl">` +
    `<button class="btn quiet icon" aria-label="Näkymä koko ikkunaan">${svg('back')}</button>` +
    `<button class="btn quiet icon" data-tab="${v.id}" aria-label="Avaa omalle välilehdelle">${svg('external')}</button>` + tool +
    `<button class="btn quiet icon" data-close aria-label="Sulje näkymä">${svg('cross')}</button></span></header>` +
    `<div class="pane-frame">${st === 'opening' ? '<p>Avataan näkymää…</p>' : `<h1>${v.id === 'v1' ? 'Viimeisimmät, kierros 1' : 'Viimeisimmät, kierros 2'}</h1><p>Agentin tekemä sivu näkyy tässä omalla alkuperällään.</p><div class="fake"><div></div><div></div><div></div><div></div></div>`}</div>` +
    `<p class="pane-note">Sisältö on erillään Habitatista eikä pääse verkkoon.</p></section>`;
}

function render() {
  document.documentElement.dataset.theme = theme;
  const v = V[cur];
  const phone = device === 'phone';
  const app = `<div class="app${phone ? ' phone' : ''}" data-theme="${theme}"><aside class="rail">${railHTML()}</aside>` +
    `<div class="main"><section class="conv">${convHTML(v)}</section>${paneHTML()}</div></div>`;
  const seg = (name, key, list) => `<label>${name}<span class="seg" role="group" aria-label="${name}">${list.map(([val, lab, on]) => `<button data-${key}="${val}" aria-pressed="${on}">${lab}</button>`).join('')}</span></label>`;
  document.getElementById('stage').innerHTML =
    `<main class="pg" data-device="${device}">` +
    `<div class="pg-head"><h1>${esc(v.name)}</h1><span class="pg-axis">${esc(v.axis)}</span></div>` +
    `<div class="pg-toggles">` +
    seg('Teema', 'theme-set', [['light', 'Vaalea', theme === 'light'], ['dark', 'Tumma', theme === 'dark']]) +
    seg('Laite', 'device-set', [['desktop', 'Työpöytä', !phone], ['phone', 'Puhelin', phone]]) +
    seg('Linkit sivustolla', 'links-set', [['on', 'Sallittu', links], ['off', 'Ei linkkejä', !links]]) +
    seg('Enimmäisaika', 'max-set', [7, 90, 365].map((x) => [x, `${x} pv`, maxDays === x])) +
    seg('Otsikko', 'titles-set', [['good', 'Kuvaava (--title)', titles === 'good'], ['file', 'Tiedostonimi', titles === 'file']]) +
    `<button class="reset" data-reset>Alkuun</button></div>` +
    `<p class="pg-lead">${v.lead}</p>` +
    (phone ? `<div class="phone-wrap">${app}</div>` : app) +
    `<p class="pg-log" role="status">${S.log}</p></main>`;
}
function mount(i) { cur = i; S = fresh(); render(); }
function setParam(k, val) { const u = new URL(location); u.searchParams.set(k, val); history.replaceState(null, '', u); }

let openTimer, copyTimer;
document.addEventListener('click', (e) => {
  const stageEl = document.getElementById('stage');
  if (!stageEl.contains(e.target)) return;
  const t = e.target.closest('[data-theme-set],[data-device-set],[data-links-set],[data-max-set],[data-titles-set],[data-reset],[data-open],[data-tab],[data-toggle],[data-exp],[data-days],[data-month],[data-copy],[data-close]');
  // A press outside an open menu or calendar closes it (C's row stays until
  // the date is pressed again or a duration is chosen).
  if (S.open && cur !== 3 && !(t && (t.dataset.exp || t.closest('.pop'))) && !e.target.closest('.pop')) { S.open = null; if (!t) return render(); }
  if (!t || t.disabled) return;
  const d = t.dataset;
  const view = (id) => VIEWS.find((x) => x.id === id);
  if (d.themeSet) { theme = d.themeSet; setParam('t', theme); return render(); }
  if (d.deviceSet) { device = d.deviceSet; setParam('d', device); return render(); }
  if (d.linksSet) { links = d.linksSet === 'on'; setParam('l', links ? 'on' : 'off'); S.open = null; return render(); }
  if (d.maxSet) { maxDays = Number(d.maxSet); setParam('x', maxDays); return mount(cur); }
  if (d.titlesSet) { titles = d.titlesSet; setParam('n', titles); return render(); }
  if (d.reset !== undefined) return mount(cur);
  if (d.open) {
    clearTimeout(openTimer);
    if (S.panel) S.state[S.panel] = 'idle';
    S.panel = d.open; S.state[d.open] = 'opening'; S.log = '';
    render();
    openTimer = setTimeout(() => { if (S.panel === d.open) { S.state[d.open] = 'open'; render(); } }, 450);
    return;
  }
  if (d.tab) {
    const v = view(d.tab);
    const p = pubOf(v);
    S.log = `Uusi välilehti: ${code(tabURL(v))} · avaa: ${p ? 'kuka tahansa, jolla osoite on, kirjautumatta' : 'vain sinä, Habitatiin kirjautuneena'}.` +
      (p ? ' Sama osoite kuin Kopioi linkki antaa.' : '');
    return render();
  }
  if (d.close !== undefined) { S.state[S.panel] = 'idle'; S.panel = null; return render(); }
  if (d.toggle) { const v = view(d.toggle); if (S.pub[v.id]) makePrivate(v); else makePublic(v); return render(); }
  if (d.exp) {
    const p = S.pub[d.exp];
    S.open = S.open === d.exp ? null : d.exp;
    S.month = new Date(p.exp.getFullYear(), p.exp.getMonth(), 1);
    return render();
  }
  if (d.month) { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + Number(d.month), 1); return render(); }
  if (d.days) { setDays(view(d.view), Number(d.days)); return render(); }
  if (d.copy) {
    const v = view(d.copy);
    S.open = null; S.copied = v.id;
    S.log = `Leikepöydälle: ${code(linkURL(v, S.pub[v.id].token))} · sama osoite, jonka Avaa omalle välilehdelle avaa.`;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { if (S.copied === v.id) { S.copied = null; render(); } }, 1600);
    return render();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.open) { S.open = null; render(); }
});

// ---------- picker (PICKER.md reference wiring) ----------
const variants = V.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
