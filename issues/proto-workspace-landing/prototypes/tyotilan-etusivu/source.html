<style>
/* ---------- Tuotannon kehys (esityskopio: kisko 296 px, sivu 860 px) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ah-bg);
  color: var(--ah-ink);
  font: 400 var(--ah-size-body) / var(--ah-lh-ui) var(--ah-font);
  -webkit-font-smoothing: antialiased;
}
body.phone-mode { background: #8a9198; }
[data-theme="dark"] body.phone-mode { background: #050607; }
button { font: inherit; color: inherit; }

#stage { height: 100dvh; }
.phone-mode #stage { display: grid; place-items: center; padding: 72px 0 24px; overflow: auto; }
.app {
  container: app / inline-size;
  display: grid;
  /* The rail sets its own width: a container query cannot restyle .app itself. */
  grid-template-columns: auto minmax(0, 1fr);
  height: 100%;
  background: var(--ah-bg);
  overflow: hidden;
}
.phone-mode .app {
  width: 390px; height: 844px; border-radius: 28px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 20px 60px rgba(0,0,0,.35);
}
.rail {
  width: var(--ah-rail-width);
  display: flex; flex-direction: column; gap: var(--ah-s5);
  background: var(--ah-rail); border-right: 1px solid var(--ah-line);
  padding: var(--ah-s4) var(--ah-s3); min-height: 0; overflow: auto;
}
.rail-site { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-weight: 600; font-size: 14px; }
.rail-site small { color: var(--ah-ok); font-weight: 500; font-size: 12.5px; }
.rail-site small::before { content: "● "; font-size: 10px; }
.rail-home { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--ah-r-nav); font-weight: 600; font-size: 14px; }
.rail h3 { margin: var(--ah-s3) 10px 4px; font-size: var(--ah-size-label); letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); font-weight: 600; }
.rail-quiet { margin: 0 10px; font-size: var(--ah-size-meta); color: var(--ah-muted); }
.rail-ws { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: var(--ah-r-nav); background: transparent; font-family: var(--ah-mono); font-size: 13px; text-align: left; cursor: pointer; }
.rail-ws[aria-current] { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); }
.rail-ws:hover { background: var(--ah-hover); }
.rail-ws svg { --i-fg: var(--ah-muted); }
.rail-ws .run { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ah-accent); }
.rail-account { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--ah-r-md); background: var(--ah-surface); border: 1px solid var(--ah-line); font-weight: 600; font-size: 13.5px; }
.rail-account span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.main { min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.topbar { display: none; }
svg.i { width: 16px; height: 16px; fill: none; stroke: var(--i-fg, currentColor); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Työtilasivu (tuotannon WorkspacePage.css) ---------- */
.wsp-scroll { padding: var(--ah-s5) clamp(var(--ah-s7), 4vw, 64px) 96px; }
.ah-workspace-page { display: flex; flex-direction: column; gap: var(--ah-s6); width: 100%; max-width: 860px; margin: 0 auto; }
.ah-workspace-page-head { display: flex; align-items: flex-start; gap: var(--ah-s3); }
.ah-workspace-page-title { flex: 1; min-width: 0; }
.ah-workspace-page-title h1 { margin: 0 0 4px; font: 600 21px / 1.25 var(--ah-mono); overflow-wrap: anywhere; }
.ah-workspace-page-title > p { margin: 0; color: var(--ah-muted); font-size: 12px; overflow-wrap: anywhere; }
.ah-workspace-page h2.sec { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--ah-s3); font-size: 12px; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; }
.ah-workspace-page h2.sec span { color: var(--ah-accent-ink); background: var(--ah-accent-soft); padding: 1px 7px; border-radius: var(--ah-r-pill); }
.icon-row { display: flex; align-items: center; gap: var(--ah-control-gap); flex: none; }
.ib { display: grid; place-items: center; width: var(--ah-control-page); height: var(--ah-control-page); border: 0; border-radius: var(--ah-r-md); background: transparent; cursor: pointer; --i-fg: var(--ah-muted); }
.ib:hover { background: var(--ah-control-hover); }
.ib svg { width: 18px; height: 18px; }
.ib.danger { background: var(--ah-err-soft); --i-fg: var(--ah-err); }
.ib.primary { background: var(--ah-accent); --i-fg: var(--ah-on-accent); }
.ib.primary:hover { background: var(--ah-accent-hover); }
.divider { width: 1px; height: 20px; background: var(--ah-line); }
.ah-workspace-git { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.git-chip { display: inline-flex; align-items: center; gap: 8px; height: var(--ah-control-page); padding: 0 16px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-pill); background: var(--ah-surface); font: 500 13.5px var(--ah-mono); cursor: pointer; }
.git-chip:hover { background: var(--ah-surface-hover); }
.git-chip.small { height: var(--ah-control-row); padding: 0 12px; font-size: 12.5px; }
.ah-workspace-summary { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.ah-home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ah-s4); }
.ah-home-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 1px solid var(--ah-line); background: var(--ah-surface); border-radius: var(--ah-r-lg); padding: 12px 14px; font-size: 13px; }
.ah-home-card-new { border-left: 3px solid var(--ah-accent); padding-left: 12px; }
.card-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: start; }
.card-title { display: flex; align-items: baseline; gap: 8px; color: var(--ah-ink); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-size: 13.5px; }
.card-title:hover { text-decoration: underline; }
.dot { flex: none; display: inline-block; width: 8px; height: 8px; border: 1px solid currentColor; border-radius: 50%; }
.dot.on { background: var(--ah-accent-ink); color: var(--ah-accent-ink); }
.dot.work { color: var(--ah-accent); background: var(--ah-accent); animation: ah-pulse var(--ah-pulse); }
.card-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; color: var(--ah-ink-2); font-size: 12.5px; }
.card-meta time { color: var(--ah-muted); }
.wt-line { display: flex; align-items: center; gap: 6px; font: 12px var(--ah-mono); color: var(--ah-muted); --i-fg: var(--ah-muted); }
.ah-home-card p { margin: 0; }
.recap { line-height: 1.5; color: var(--ah-ink-2); }
.next { display: flex; gap: 10px; }
.next strong { font-size: 11px; text-transform: uppercase; color: var(--ah-muted); flex: none; padding-top: 2px; }
.live { color: var(--ah-accent-ink); }
.open-link { align-self: flex-end; color: var(--ah-accent-ink); font-weight: 600; background: none; border: 0; cursor: pointer; padding: 4px 0; }
details.done summary { cursor: pointer; font-size: 13px; color: var(--ah-ink-2); }
details.done ul { list-style: none; padding: 0; margin: 8px 0 0; }
details.done li button { display: block; width: 100%; text-align: left; padding: 7px 8px; border: 0; background: none; border-radius: var(--ah-r-sm); cursor: pointer; font-size: 13.5px; }
details.done li button:hover { background: var(--ah-hover); }

/* ---------- Aloitussivu (tuotannon StartHere.css ja GoalGuide.css) ---------- */
.ah-start { color: var(--ah-ink); overflow-wrap: anywhere; }
.ah-start h2.start-title { font-size: var(--ah-size-h2); margin: 0; }
.ah-start p { color: var(--ah-ink-2); line-height: var(--ah-lh-body); }
.md p { margin: 10px 0; }
.ah-start-heading { margin: var(--ah-s7) 0 var(--ah-s4); font-size: var(--ah-size-ui); font-weight: 500; color: var(--ah-ink-2); }
.ah-start-goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ah-s3); margin-block: 0 var(--ah-s5); }
.ah-start-goal { position: relative; display: block; text-align: left; cursor: pointer; color: var(--ah-ink); border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); padding: var(--ah-s5) var(--ah-s8) var(--ah-s5) var(--ah-s5); background: var(--ah-surface); }
.ah-start-goal strong { display: block; font-weight: 600; line-height: 1.4; }
.ah-start-goal span { display: block; color: var(--ah-ink-2); font-size: var(--ah-size-ui); line-height: 1.5; margin-top: var(--ah-s2); }
.ah-start-goal b { position: absolute; right: var(--ah-s5); top: var(--ah-s5); font-weight: 400; color: var(--ah-muted); }
.ah-start-goal:hover { background: var(--ah-hover); }
.ah-start-hint { font-size: var(--ah-size-meta); color: var(--ah-ink-2); margin: 0; }
.ah-goal-guide { color: var(--ah-ink); overflow-wrap: anywhere; }
.ah-guide-eyebrow { font-size: var(--ah-size-meta); color: var(--ah-muted); margin: var(--ah-s5) 0 var(--ah-s2); }
.ah-goal-guide h2 { margin: 0; font-size: var(--ah-size-h2); line-height: 1.3; }
.ah-goal-guide h2:focus { outline: none; }
.ah-goal-guide section { margin-top: var(--ah-s6); }
.ah-goal-guide section h3 { margin: 0 0 var(--ah-s2); font-size: var(--ah-size-ui); font-weight: 600; }
.ah-goal-guide section p, .ah-goal-guide section ol { color: var(--ah-ink-2); line-height: var(--ah-lh-body); margin: 0; }
.ah-goal-guide ol { padding-left: var(--ah-s6); }
.ah-goal-guide li + li { margin-top: var(--ah-s2); }
.ah-guide-disclosure { margin-top: var(--ah-s6); font-size: var(--ah-size-ui); color: var(--ah-ink-2); }
.ah-guide-disclosure summary { padding-block: var(--ah-s2); cursor: pointer; }
.ah-guide-prompt { white-space: pre-wrap; max-height: 16em; overflow: auto; padding: var(--ah-s4); background: var(--ah-surface-2); border: 1px solid var(--ah-line); border-radius: var(--ah-r-md); font: inherit; line-height: var(--ah-lh-body); color: var(--ah-ink); }
.ah-guide-actions { margin-top: var(--ah-s5); display: flex; gap: var(--ah-s4); }
.btn { display: inline-flex; align-items: center; gap: var(--ah-control-row-gap); height: var(--ah-control-row); padding: 0 var(--ah-control-row-pad); border: 1px solid var(--ah-control-line); border-radius: var(--ah-r-md); background: var(--ah-surface); font-size: var(--ah-control-row-font); font-weight: 500; cursor: pointer; white-space: nowrap; --i-fg: currentColor; }
.btn:hover { background: var(--ah-surface-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ah-ink-2); }
.btn.quiet:hover { background: var(--ah-control-hover); }
.btn.primary { border-color: transparent; background: var(--ah-accent); color: var(--ah-on-accent); }
.btn.primary:hover { background: var(--ah-accent-hover); }
.btn.page { height: var(--ah-control-page); padding: 0 var(--ah-control-page-pad); font-size: var(--ah-control-page-font); }
.btn.inline { height: var(--ah-control-inline); padding: 0 var(--ah-control-inline-pad); font-size: var(--ah-control-inline-font); }
:is(button, summary, a):focus-visible { outline: var(--ah-focus-width) solid var(--ah-focus); outline-offset: var(--ah-focus-offset); }

/* ---------- Uusi keskustelu (PendingConversation + kenttä) ---------- */
.conv { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.conv-head { display: flex; align-items: center; gap: var(--ah-s4); padding: var(--ah-topbar-pad-block) var(--ah-topbar-pad-inline); border-bottom: 1px solid var(--ah-line); background: var(--ah-content-canvas, var(--ah-surface)); }
.conv-head h1 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; }
.conv-head p { margin: 0; font: 12px var(--ah-mono); color: var(--ah-muted); }
.conv-stream { flex: 1; min-height: 0; overflow: auto; padding: var(--ah-column-pad-block) var(--ah-column-pad-inline); display: flex; flex-direction: column; }
.conv-col { width: 100%; max-width: var(--ah-conversation-width); margin: auto auto 0; padding: var(--ah-s7) 0; }
.conv-col.top { margin-top: 0; }
.bubble { align-self: flex-end; max-width: 80%; margin-left: auto; padding: 10px 14px; border-radius: var(--ah-r-xl); background: var(--ah-accent-soft); color: var(--ah-ink); white-space: pre-wrap; line-height: var(--ah-lh-body); }
.reply-note { color: var(--ah-muted); font-size: var(--ah-size-meta); margin-top: var(--ah-s5); }
.composer-wrap { padding: var(--ah-composer-pad-block) var(--ah-column-pad-inline) calc(var(--ah-composer-pad-block) + 4px); }
.composer { max-width: var(--ah-conversation-width); margin: 0 auto; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); padding: 8px 8px 8px 12px; }
.composer:focus-within { border-color: var(--ah-composer-focus); }
.composer textarea { width: 100%; min-height: 44px; max-height: 180px; border: 0; outline: 0; resize: none; background: transparent; color: var(--ah-ink); font: var(--ah-size-body) / 1.5 var(--ah-font); padding: 4px 0; }
.composer-row { display: flex; align-items: center; gap: var(--ah-control-gap); }
.composer-row .grow { flex: 1; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--ah-control-inline); padding: 0 9px; border-radius: var(--ah-r-pill); background: var(--ah-control); font-size: 12px; color: var(--ah-ink-2); border: 0; }
.send { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ah-accent); --i-fg: var(--ah-on-accent); cursor: pointer; }
.send:disabled { background: var(--ah-disabled-bg); --i-fg: var(--ah-disabled-fg); cursor: default; }
.inert-note { font-size: 11px; color: var(--ah-muted); }

/* ---------- Git-kerros ---------- */
.layer-scrim { position: absolute; inset: 0; z-index: 20; }
.git-layer { position: absolute; z-index: 21; width: min(360px, calc(100% - 32px)); max-height: 80%; overflow: auto; background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); box-shadow: var(--ah-shadow-menu); padding: var(--ah-s4); font-size: 13px; }
.git-layer h2 { margin: 0 0 var(--ah-s3); font-size: 14px; }
.git-layer h3 { margin: var(--ah-s4) 0 4px; font-size: 12px; color: var(--ah-muted); }
.git-list { list-style: none; padding: 0; margin: 0; }
.git-list li { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--ah-line-soft); align-items: baseline; }
.git-list code { flex: none; }
.git-list span { flex: 1; min-width: 0; }
.git-list time { color: var(--ah-muted); font-size: 11px; flex: none; }
.git-close { display: flex; justify-content: flex-end; margin-top: var(--ah-s4); }
.main-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Tilailmoitus ---------- */
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 9px 14px; border-radius: var(--ah-r-md); background: var(--ah-ink); color: var(--ah-bg); font-size: 13px; box-shadow: var(--ah-shadow-float); animation: ah-appear var(--ah-appear); }

/* ========== A · Esittely ========== */
.lp-intro { border-bottom: 1px solid var(--ah-line-soft); padding-bottom: var(--ah-s6); }
.lp-intro .md p:first-child { margin-top: 8px; }
.more-btn { margin: 0; }
.lp-absent { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 14px; border: 1px dashed var(--ah-line-strong); border-radius: var(--ah-r-lg); color: var(--ah-ink-2); font-size: var(--ah-size-ui); }
.lp-absent p { margin: 0; flex: 1 1 260px; }

/* ========== B · Tilannekuva ========== */
.tk-desc { margin: 8px 0 0; color: var(--ah-ink-2); font-size: var(--ah-size-ui); line-height: 1.5; max-width: 62ch; }
.tk-desc button { margin-left: 4px; }
.tk-introbody { margin-top: 4px; padding: 4px 14px; border-left: 2px solid var(--ah-line); color: var(--ah-ink-2); font-size: var(--ah-size-ui); }
.tk-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--ah-s4); }
.tk-panel { border: 1px solid var(--ah-line); background: var(--ah-surface); border-radius: var(--ah-r-lg); padding: 12px 14px; min-width: 0; font-size: 13px; }
.tk-panel h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ah-muted); font-weight: 600; }
.tk-panel h3 .src { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.tk-rows { list-style: none; margin: 0; padding: 0; }
.tk-rows li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--ah-line-soft); }
.tk-rows li:first-child { border-top: 0; padding-top: 2px; }
.tk-rows .dot { align-self: center; }
.tk-rows button.t { text-align: left; border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; font-size: 13px; }
.tk-rows button.t:hover { text-decoration: underline; }
.tk-rows small { grid-column: 2 / -1; color: var(--ah-ink-2); font-size: 12.5px; line-height: 1.45; }
.tk-rows .wt { grid-column: 2 / -1; font: 11.5px var(--ah-mono); color: var(--ah-muted); }
.tk-rows time, .tk-rows .st { color: var(--ah-muted); font-size: 12px; white-space: nowrap; }
.tk-git-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.tk-git-top code { font-weight: 500; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--ah-r-pill); background: var(--ah-control); color: var(--ah-ink-2); font-size: 12px; }
.pill.warn { background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.tk-goals { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ah-control-gap); }
.tk-goals > span { color: var(--ah-muted); font-size: var(--ah-size-meta); margin-right: 4px; }
.goal-pill { display: inline-flex; align-items: center; gap: 6px; height: var(--ah-control-row); padding: 0 12px; border: 1px solid var(--ah-line); border-radius: var(--ah-r-pill); background: var(--ah-surface); font-size: 13px; cursor: pointer; }
.goal-pill:hover { background: var(--ah-surface-hover); }
.tk-empty { color: var(--ah-muted); font-size: 12.5px; margin: 0; }

/* ========== C · Aloitus tässä ========== */
.at-start { border: 1px solid var(--ah-line); background: var(--ah-surface); border-radius: var(--ah-r-xl); padding: var(--ah-s6) var(--ah-s6) var(--ah-s5); }
.at-start .ah-start-goal { background: var(--ah-surface-2); }
.at-start .composer { margin: var(--ah-s5) 0 0; max-width: none; background: var(--ah-bg); }
.at-start .ah-start-goals { margin-bottom: 0; }
.at-rows { list-style: none; margin: 0; padding: 0; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); }
.at-rows li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: baseline; gap: 2px 10px; padding: 9px 14px; }
.at-rows li + li { border-top: 1px solid var(--ah-line-soft); }
.at-rows .dot { align-self: center; }
.at-rows button { text-align: left; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.at-rows button:hover { text-decoration: underline; }
.at-rows .st { color: var(--ah-muted); font-size: 12.5px; white-space: nowrap; }
.at-rows small { grid-column: 2 / -1; color: var(--ah-ink-2); font-size: 12.5px; }
.at-head-git { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- Puhelin (säiliökysely: sama sääntö kehyksessä ja 390 px:n ikkunassa) ---------- */
@container app (max-width: 700px) {
  .rail { display: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 52px; border-bottom: 1px solid var(--ah-line-soft); font-weight: 600; font-size: 15px; }
  .topbar .ib { width: 40px; height: 40px; --i-fg: var(--ah-ink); }
  .wsp-scroll { padding: 14px 14px 96px; }
  .ah-workspace-page-head { flex-wrap: wrap; }
  .ah-workspace-page-title h1 { font-size: 18px; }
  .icon-row { flex-basis: 100%; }
  .icon-row .divider { flex: 1; visibility: hidden; }
  .ib { width: 40px; height: 40px; }
  .ah-home-grid, .ah-start-goals, .tk-grid { grid-template-columns: minmax(0, 1fr); }
  .ah-start-goals { gap: var(--ah-s2); }
  .ah-start-goal { padding-block: var(--ah-s3); }

// Avoimet keskustelut tuotannon järjestyksessä (sinun vuorosi ensin).
const CONVS = [

const GIT = { branch: "main", dirty: 2, ahead: 1, behind: 0,
  files: [["M", "src/aurinko.py"], ["??", "notes/kesaaika.md"]],

const OTHER_WS = ["kotisivu", "muistiinpanot", "reseptikirja"];

/* ===== Kuvakkeet (tuotannon Icon.tsx:n polut) ===== */

const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

const firstSentence = (text) => text.split(/(?<=\.)\s/)[0];

/* ===== Tila ===== */
const S = {
  variant: 0, theme: "light", device: "desk", page: "authored",

/* ===== Yhteiset palat ===== */
function rail() {
  return `<nav class="rail" aria-label="Sivupalkki">

}

}
const gitLabel = () => `${GIT.branch} · ${GIT.dirty} muutosta${GIT.ahead ? ` ↑${GIT.ahead}` : ""}${GIT.behind ? ` ↓${GIT.behind}` : ""}`;

        <p class="ah-start-hint">Tavoite avaa uuden keskustelun oppaaseen. Tyhjän keskustelun saat +:sta.</p>
      </section>`
    : absentLine("Tällä työtilalla ei ole aloitussivua. Agentti kirjoittaa sen <code>.agents/start-page.md</code>:hen, ja sama esittely näkyy sitten täällä ja uuden keskustelun alussa.");
  return `<div class="ah-workspace-page">${wsHead()}${intro}
    <div class="ah-workspace-git">${gitChip()}<span class="ah-workspace-summary">${summaryText}</span></div>
    ${openSection()}${doneSection()}</div>`;
}
function pageTilannekuva() {
  const p = authored();
  const desc = p
    ? `<p class="tk-desc" data-testid="landing">${esc(firstSentence(p.body))}<button class="btn quiet inline" data-act="intro" aria-expanded="${S.introOpen}">${S.introOpen ? "Piilota esittely" : "Lue esittely"}</button></p>
       ${S.introOpen ? `<div class="tk-introbody md">${md(p.body)}</div>` : ""}`
    : "";
  const waiting = CONVS.filter((c) => c.state === "new");
  const running = CONVS.filter((c) => c.worker);
  const recent = CONVS.filter((c) => c.state === "idle" && !c.worker);
  const row = (c, extra) => `<li><span class="dot ${c.state === "working" ? "work" : c.state === "new" ? "on" : ""}" aria-hidden="true"></span>
      <button class="t" data-act="open" data-id="${c.id}">${esc(c.title)}</button><time>${c.age}</time>${extra}</li>`;
  return `<div class="ah-workspace-page">${wsHead({ below: desc })}
    ${p ? `<div class="tk-goals" aria-label="Aloita tavoitteesta"><span>Aloita:</span>${p.goals.map((g, i) => `<button class="goal-pill" data-act="goal" data-i="${i}" data-where="ws">${esc(g.title)}</button>`).join("")}</div>`
        : absentLine("Ei aloitussivua: kuvaus ja tavoitteet puuttuvat. Agentti kirjoittaa ne <code>.agents/start-page.md</code>:hen.")}
    <div class="tk-grid" data-testid="situation">
      <section class="tk-panel" aria-label="Sinun vuorosi ja käynnissä">
        <h3>Sinun vuorosi</h3>
        <ul class="tk-rows">${waiting.map((c) => row(c, `<small>${esc(c.recap)}</small>`)).join("") || '<li><p class="tk-empty">Mikään ei odota sinua.</p></li>'}</ul>
        <h3 style="margin-top:14px">Workerit <span class="src">omissa worktreeissään</span></h3>
        <ul class="tk-rows">${running.map((c) => row(c, `<span class="wt">${c.worker.branch} · ${c.worker.git}</span>`)).join("")}</ul>
      </section>
      <section class="tk-panel" aria-label="Git">
        <h3>Git <span class="src">${GIT.branch}</span></h3>
        <div class="tk-git-top">${gitChip(true)}<span class="pill warn">↑${GIT.ahead} julkaisematta</span></div>
        <ul class="tk-rows">${GIT.files.map(([s, f]) => `<li><code>${s}</code><span style="font:12px var(--ah-mono);overflow-wrap:anywhere">${f}</span><span></span></li>`).join("")}</ul>
        <h3 style="margin-top:12px">Viimeisimmät commitit</h3>
        <ul class="tk-rows">${GIT.commits.map(([h, m, t]) => `<li><code style="color:var(--ah-muted)">${h.slice(0, 7)}</code><span>${esc(m)}</span><time>${t}</time></li>`).join("")}</ul>
      </section>
    </div>
    <section aria-label="Viimeisimmät keskustelut"><h2 class="sec">Viimeisimmät keskustelut <span>${recent.length}</span></h2>
      <div class="tk-panel"><ul class="tk-rows">${recent.map((c) => row(c, `<small>${esc(c.recap)}</small>`)).join("")}</ul></div>
    </section>
    ${doneSection()}</div>`;
}
function pageAloitus() {
  const p = authored();
  const inner = S.guide !== null
    ? guide(S.guide, "Kaikki tavoitteet")
    : p
      ? `<h2 class="start-title">${esc(p.title)}</h2><div class="md">${md(p.body.split(/\n{2,}/)[0])}</div>
         <h3 class="ah-start-heading">Mitä haluat tehdä?</h3>${goalCards("here")}`
      : `<h2 class="start-title">Aloita uusi keskustelu</h2><p class="ah-start-hint" style="margin-top:8px">Luo aloitussivu kirjoittamalla kenttään <code>/open-habitat-start-page</code>, niin esittely ja tavoitteet näkyvät tässä.</p>`;
  const rows = CONVS.map((c) => `<li><span class="dot ${c.state === "working" ? "work" : c.state === "new" ? "on" : ""}" aria-hidden="true"></span>
      <button data-act="open" data-id="${c.id}">${esc(c.title)}</button><span class="st">${c.label} · ${c.age}</span>
      ${c.worker ? `<small class="wt-line">${icon("worktree")} ${c.worker.branch} · ${c.worker.git}</small>` : c.next ? `<small>${esc(c.next)}</small>` : ""}</li>`).join("");
  // Kenttä aloittaa uuden keskustelun, joten +-painike olisi toinen tie samaan.
  return `<div class="ah-workspace-page">${wsHead({ plus: false })}
    <section class="ah-start at-start" aria-label="Aloita keskustelu" data-testid="landing">${inner}
      ${composer("Kirjoita agentille – lähetys aloittaa uuden keskustelun", "field")}
    </section>
    <div class="at-head-git">${gitChip()}<span class="ah-workspace-summary">${summaryText}</span></div>
    <section aria-label="Avoimet keskustelut"><h2 class="sec">Avoimet <span>${CONVS.length}</span></h2><ul class="at-rows">${rows}</ul></section>
    ${doneSection()}</div>`;
}
const PAGES = [pageNyt, pageEsittely, pageTilannekuva, pageAloitus];

function gitLayer() {
  if (!S.gitOpen) return "";
  return `<div class="layer-scrim" data-act="git-close"></div>
  <div class="git-layer" role="dialog" aria-label="Git · ${WS.name}" style="left:max(16px, calc(50% - 300px)); top:150px">
    <h2>Git · ${WS.name}</h2>
    <p style="margin:0"><code>${GIT.branch}</code> · ${GIT.dirty} muutosta · ↑${GIT.ahead} julkaisematta</p>
    <h3>Muutokset</h3><ul class="git-list">${GIT.files.map(([s, f]) => `<li><code>${s}</code><span><code>${f}</code></span></li>`).join("")}</ul>
    <h3>Commitit</h3><ul class="git-list">${GIT.commits.map(([h, m, t]) => `<li><code>${h.slice(0, 7)}</code><span>${esc(m)}</span><time>${t}</time></li>`).join("")}</ul>
    <div class="git-close"><button class="btn" data-act="git-close">Sulje</button></div>
  </div>`;
}

function render() {
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle("phone-mode", S.device === "phone");
  document.querySelectorAll(".p-ctl [data-ctl]").forEach((b) => b.setAttribute("aria-pressed", String(S[{ theme: "theme", device: "device", page: "page" }[b.dataset.ctl]] === b.dataset.val)));
  const conv = S.view === "conversation";
  const content = conv ? conversationView() : `<div class="wsp-scroll">${PAGES[S.variant]()}</div>`;
  stage.innerHTML = `<div class="app" data-variant="${S.variant}">${rail()}
    <div class="main-wrap">${topbar(conv ? "Uusi keskustelu" : WS.name)}
      <main class="main" id="main">${content}</main>
      ${gitLayer()}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ""}
    </div></div>`;
  const focus = stage.querySelector("[data-focus]");
  if (focus) focus.focus({ preventScroll: false });
  const field = stage.querySelector("#field");
  if (field && S.focusField) { field.focus(); field.setSelectionRange(field.value.length, field.value.length); field.scrollTop = field.scrollHeight; S.focusField = false; }
  if (S.scrollTop) { const m = stage.querySelector("#main"); if (m) m.scrollTop = 0; S.scrollTop = false; }
}

let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ""; render(); }, 2600); }

const stage = document.getElementById("stage");
stage.addEventListener("click", (e) => {
  const el = e.target.closest("#stage [data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const i = Number(el.dataset.i);
  if (act === "toast") return toast(el.dataset.msg);
  if (act === "workspace") { reset(); return render(); }
  if (act === "new") { Object.assign(S, { view: "conversation", guide: null, sent: null }); return render(); }
  if (act === "open") { const c = CONVS.find((x) => x.id === el.dataset.id); return toast(`Avaisi keskustelun ”${c.title}” (ei osa vertailua)`); }
  if (act === "git") { S.gitOpen = true; return render(); }
  if (act === "git-close") { S.gitOpen = false; return render(); }
  if (act === "intro") { S.introOpen = !S.introOpen; return render(); }
  if (act === "create-start") { Object.assign(S, { view: "conversation", guide: null, draft: "/open-habitat-start-page ", focusField: true }); return render(); }
  if (act === "goal") {
    // C avaa oppaan työtilasivulla; muut siirtyvät uuteen keskusteluun oppaan kohdalle.
    S.guide = i;
    if (el.dataset.where === "ws") S.view = "conversation";
    S.scrollTop = true;
    return render();
  }
  if (act === "guide-back") { const prev = S.guide; S.guide = null; render(); stage.querySelector(`[data-act="goal"][data-i="${prev}"]`)?.focus(); return; }
  if (act === "aloita") { S.draft = goalDraft(START.goals[i], S.draft); S.guide = null; S.focusField = true; return render(); }
  if (act === "send") {
    if (!S.draft.trim()) return;
    Object.assign(S, { view: "conversation", sent: S.draft.trim(), draft: "", guide: null });
    return render();
  }
});
stage.addEventListener("input", (e) => {
  if (e.target.id !== "field") return;
  S.draft = e.target.value;
  const send = stage.querySelector('[data-act="send"]');
  if (send) send.disabled = !S.draft.trim();
});
stage.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.gitOpen) { S.gitOpen = false; render(); stage.querySelector('[data-act="git"]')?.focus(); }
});
document.querySelector(".p-ctl").addEventListener("click", (e) => {
  const b = e.target.closest(".p-ctl [data-ctl]");
  if (!b) return;
  S[b.dataset.ctl] = b.dataset.val;
  const url = new URL(location); url.searchParams.set(b.dataset.ctl, b.dataset.val); history.replaceState(null, "", url);
  render();
});

/* ===== Valitsimen johdotus (PICKER.md) ===== */
const variants = PAGES.map((_, i) => () => { S.variant = i; reset(); render(); });
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + "px"; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ""; requestAnimationFrame(() => variants[i]()); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set("v", i + 1); history.replaceState(null, "", url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});
const params = new URLSearchParams(location.search);
for (const k of ["theme", "device", "page"]) if (params.get(k)) S[k] = params.get(k);
if (innerWidth < 760) document.querySelector(".p-ctl").open = false;
if (params.get("capture")) document.body.classList.add("capture");
setActive((parseInt(params.get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
