  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  check: '<path d="m4 12 5 5L20 6"/>',
  cross: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17m10-10 1.4-1.4"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
};
const svg = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const DAYS = { 1: '2.11.2026', 7: '8.11.2026', 30: '1.12.2026' };
// One press makes a view public for the default expiry, min(30, max_days)
// (viewLinks.ts defaultExpiry), which on this site is 30 days.
const DEFAULT_UNTIL = DAYS[30];
// Fresh 256-bit tokens, shortened for reading: each publication in model 1
// gets the next one; model 2 keeps one per view for good.
const TOKENS = ['Kd8fP2…Zq', 'u7TxQ9…Lb', 'mB4wL1…Rc', 'p3HsV6…Ty', 'Wz2kN8…Ae', 'c9GdJ4…Mo', 'r5YbE7…Uh', 'h1QnX3…Df'];
const APP = 'https://habitat.example.fi';

const q = new URLSearchParams(location.search);
let theme = q.get('t') === 'dark' ? 'dark' : 'light';
let device = q.get('d') === 'phone' ? 'phone' : 'desktop';
let links = q.get('l') !== 'off';
let titles = q.get('n') === 'file' ? 'file' : 'good';
// The host model behind "one address" (result.md, the question for Jari):
// born = the public address is born when the view is made public and dies
// when it is made private again (option 1); stable = every view has one
// address from the start, and visibility decides who may open it (option 2).
let model = q.get('m') === 'stable' ? 'stable' : 'born';
let cur = 0;
let S;
const fresh = () => ({
  pub: { v1: { until: '28.11.2026', token: TOKENS[0] } },
  next: 1,            // next fresh token (model 1)
  stable: { v1: TOKENS[0], v2: 'Gq6tR1…Vn' },
  state: {},          // view id → idle | opening | open | failed
  panel: null,
  dialog: null,       // baseline only: the share dialog
  days: 7,
  copied: null,       // view id whose Kopioi linkki just copied
  menu: null,         // view id whose visibility menu is open (baseline, A)
  log: '',
});
const title = (v) => (titles === 'good' ? v.good : v.file);
const pubOf = (v) => (links ? S.pub[v.id] : undefined);
const short = (d) => d.replace(/\.20(\d\d)$/, '.$1').replace(/\.\d\d$/, '.');
// Addresses, as the host would give them. Labels are shortened hashes.
const LINKHOST = { v1: 'oh-view-q3rzt5…7m.example.fi', v2: 'oh-view-b6kwp2…4e.example.fi' };
const privateTab = (v) => `${APP}/view?id=${v.vid}`;
const linkURL = (v, token) => `https://${LINKHOST[v.id]}/${token}/`;
const stableURL = (v) => `${APP}/n/${S.stable[v.id]}`;
// What "Avaa omalle välilehdelle" opens. In the baseline and model 1 a
// private view opens the owner's app page and a public one its public link;
// in model 2 it is always the view's one address.
function tabURL(v) {
  const p = pubOf(v);
  if (cur === 0) return privateTab(v);
  if (model === 'stable') return stableURL(v);
  return p ? linkURL(v, p.token) : privateTab(v);
}
const copyURL = (v) => (model === 'stable' && cur > 0 ? stableURL(v) : linkURL(v, S.pub[v.id].token));
const code = (s) => `<code>${esc(s)}</code>`;

function makePublic(v) {
  const token = model === 'stable' ? S.stable[v.id] : TOKENS[S.next++ % TOKENS.length];
  S.pub[v.id] = { until: DEFAULT_UNTIL, token };
  S.log = `Näkymä on nyt julkinen ${short(DEFAULT_UNTIL)} asti. ` +
    (model === 'stable'
      ? `Osoite ${code(stableURL(v))} on sama kuin ennenkin, ja se aukeaa nyt kaikille, joilla se on.`
      : `Sille syntyi osoite ${code(linkURL(v, token))}; sama osoite aukeaa omalla välilehdellä ja kopioituu Kopioi linkki -painikkeesta.`);
}
function makePrivate(v) {
  const was = S.pub[v.id];
  delete S.pub[v.id];
  S.log = model === 'stable' && cur > 0
    ? `Näkymä on taas vain sinun. ${code(stableURL(v))} aukeaa nyt vain sinulle kirjautuneena. Jos teet näkymän uudelleen julkiseksi, sama osoite aukeaa taas kaikille, joilla se on tallessa.`
    : `Näkymä on taas vain sinun. ${code(linkURL(v, was.token))} lakkasi toimimasta. Jos teet näkymän uudelleen julkiseksi, se saa uuden osoitteen.`;
}
function setVis(v, pub) {
  S.menu = null;
  if (pub && !S.pub[v.id]) makePublic(v);
  else if (!pub && S.pub[v.id]) makePrivate(v);
}

// ------------------------------------------------------------------
// The card. Every riff keeps the title row, Avaa and Avaa omalle
// välilehdelle and the failure line from round 1's direction 3. They differ
// in what the visibility control is and where it sits; in all of them one
// choice makes the view public at once, with no dialog, and a public view
// gains Kopioi linkki among its buttons.
// ------------------------------------------------------------------
const openBtns = (v) => {
  const st = S.state[v.id] || 'idle';
  return `<button class="btn primary" data-open="${v.id}" ${st === 'opening' ? 'disabled' : ''}>Avaa</button>` +
    `<button class="btn" data-tab="${v.id}">Avaa omalle välilehdelle ${svg('external')}</button>`;
};
const copyBtn = (v) => (!pubOf(v) ? '' : S.copied === v.id
  ? `<button class="btn copied" data-copy="${v.id}">${svg('check')} Kopioitu</button>`
  : `<button class="btn" data-copy="${v.id}" title="Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta ${esc(short(pubOf(v).until))} asti.">${svg('copy')} Kopioi linkki</button>`);
const failLine = (v) => (S.state[v.id] === 'failed' ? `<div class="vo-status err" role="status">Näkymää ei voitu avata. Se on ehkä poistettu, tai yhteys katkesi.</div>` : '');
const head = (v, extra = '') => `<div class="vo-head"><span class="vo-mark" aria-hidden="true">&lt;/&gt;</span>` +
  `<div class="vo-titles"><strong class="vo-title">${esc(title(v))}</strong></div>${extra}</div>`;
const card = (v, extra, actions) => `<aside class="vo" role="note" aria-label="Näkymä: ${esc(title(v))}">${head(v, extra)}` +
  `<div class="vo-actions">${actions}</div>${failLine(v)}</aside>`;

// Lähtö: round 1's direction 3 as Jari chose it, with its link dialog.
function card0(v) {
  const p = pubOf(v);
  let vis = '';
  if (links) {
    const open = S.menu === v.id;
    const pill = p
      ? `<button class="vis-btn shared" data-vis="${v.id}" aria-haspopup="menu" aria-expanded="${open}">${svg('link')} Linkillä ${esc(short(p.until))} asti ${svg('chev', 'chev')}</button>`
      : `<button class="vis-btn" data-vis="${v.id}" aria-haspopup="menu" aria-expanded="${open}">${svg('lock')} Vain sinä ${svg('chev', 'chev')}</button>`;
    const menu = !open ? '' : p
      ? `<div class="menu-pop" role="menu">` +
        `<button role="menuitem" data-copy="${v.id}">${svg('copy')}<span>Kopioi linkki</span><small>Kuka tahansa linkin saanut voi avata näkymän ${esc(short(p.until))} asti.</small></button>` +
        `<button role="menuitem" data-share="${v.id}">${svg('settings')}<span>Linkin asetukset…</span><small>Jatka, vaihda sisältö tai anna uusi osoite.</small></button><hr>` +
        `<button role="menuitem" class="danger" data-revoke="${v.id}">${svg('trash')}<span>Lopeta jakaminen</span><small>Linkki lakkaa toimimasta. Näkymä jää sinulle.</small></button></div>`
      : `<div class="menu-pop" role="menu">` +
        `<button role="menuitemradio" aria-checked="true" data-close-menu>${svg('check', 'tick')}<span>Vain sinä</span><small>Näkymä näkyy vain sinulle Habitatissa.</small></button>` +
        `<button role="menuitemradio" aria-checked="false" data-share="${v.id}">${svg('link')}<span>Kuka tahansa linkillä…</span><small>Luo linkki, jolla näkymän voi avata kirjautumatta.</small></button></div>`;
    vis = `<div class="vis">${pill}${menu}</div>`;
  }
  return card(v, vis, openBtns(v));
}

// A · Valikko otsikkorivillä: the round-1 pill keeps its place, but its
// menu is only the two values. Choosing Julkinen makes the view public at
// once; the menu holds nothing else.
function cardA(v) {
  const p = pubOf(v);
  let vis = '';
  if (links) {
    const open = S.menu === v.id;
    const pill = p
      ? `<button class="vis-btn public" data-vis="${v.id}" aria-haspopup="menu" aria-expanded="${open}">${svg('globe')} Julkinen ${esc(short(p.until))} asti ${svg('chev', 'chev')}</button>`
      : `<button class="vis-btn" data-vis="${v.id}" aria-haspopup="menu" aria-expanded="${open}">${svg('lock')} Vain sinä ${svg('chev', 'chev')}</button>`;
    const menu = !open ? '' : `<div class="menu-pop" role="menu" aria-label="Kuka näkee">` +
      `<button class="opt" role="menuitemradio" aria-checked="${!p}" data-set-private="${v.id}">${svg('check', 'tick')}<span>Vain sinä</span><small>Näet näkymän vain sinä, Habitatiin kirjautuneena.</small></button>` +
      `<button class="opt" role="menuitemradio" aria-checked="${!!p}" data-set-public="${v.id}">${svg('check', 'tick')}<span>Julkinen</span><small>Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta ${esc(short(p ? p.until : DEFAULT_UNTIL))} asti.</small></button></div>`;
    vis = `<div class="vis">${pill}${menu}</div>`;
  }
  return card(v, vis, openBtns(v) + copyBtn(v));
}

// B · Kytkin otsikkorivillä: one switch, Julkinen, off by default. One
// press turns it on or off.
function cardB(v) {
  const p = pubOf(v);
  const sw = !links ? '' :
    `<button class="sw" role="switch" aria-checked="${!!p}" data-toggle="${v.id}" title="${p ? 'Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta.' : 'Vain sinä näet näkymän. Kytke päälle, niin kuka tahansa linkin saanut voi avata sen.'}">` +
    `Julkinen${p ? ` <span class="when">${esc(short(p.until))} asti</span>` : ''}<span class="track" aria-hidden="true"></span></button>`;
  return card(v, sw, openBtns(v) + copyBtn(v));
}

// C · Valitsin painikerivillä: both values are visible as one two-part
// control at the end of the buttons, so the choice reads without opening
// anything, and one press changes it.
function cardC(v) {
  const p = pubOf(v);
  const seg = !links ? '' :
    `<span class="sp"></span><span class="vseg" role="radiogroup" aria-label="Kuka näkee">` +
    `<button role="radio" aria-checked="${!p}" data-set-private="${v.id}" title="Näet näkymän vain sinä, Habitatiin kirjautuneena.">${svg('lock')} Vain sinä</button>` +
    `<button class="pub" role="radio" aria-checked="${!!p}" data-set-public="${v.id}" title="Kuka tahansa, jolla linkki on, voi avata näkymän kirjautumatta.">${svg('globe')} Julkinen${p ? ` <span class="when">${esc(short(p.until))} asti</span>` : ''}</button></span>`;
  return card(v, '', openBtns(v) + copyBtn(v) + seg);
}

const V = [

function mount(i) { cur = i; S = fresh(); render(); }
function setParam(k, val) { const u = new URL(location); u.searchParams.set(k, val); history.replaceState(null, '', u); }

let openTimer, copyTimer;
document.addEventListener('click', (e) => {
  const stageEl = document.getElementById('stage');
  if (!stageEl.contains(e.target)) return;
  const t = e.target.closest('[data-theme-set],[data-device-set],[data-links-set],[data-titles-set],[data-model-set],[data-reset],[data-open],[data-tab],[data-share],[data-vis],[data-close-menu],[data-set-public],[data-set-private],[data-toggle],[data-copy],[data-revoke],[data-create],[data-extend],[data-days],[data-dclose],[data-close],[data-overlay]');
  // A press outside the visibility menu closes it, as a menu does.
  if (S.menu && !(t && (t.dataset.vis || t.closest('.menu-pop')))) { S.menu = null; if (!t) return render(); }
  if (!t || t.disabled) return;
  const d = t.dataset;
  const view = (id) => VIEWS.find((x) => x.id === id);
  if (d.themeSet) { theme = d.themeSet; setParam('t', theme); return render(); }
  if (d.deviceSet) { device = d.deviceSet; setParam('d', device); return render(); }
  if (d.linksSet) { links = d.linksSet === 'on'; setParam('l', links ? 'on' : 'off'); S.dialog = null; S.menu = null; return render(); }
  if (d.titlesSet) { titles = d.titlesSet; setParam('n', titles); return render(); }
  if (d.modelSet) { model = d.modelSet; setParam('m', model); return mount(cur); }
  if (d.reset !== undefined) return mount(cur);
  if (d.open) {
    clearTimeout(openTimer);
    if (S.panel) S.state[S.panel] = 'idle';
    S.panel = d.open; S.state[d.open] = 'opening'; S.log = '';
    render();
    openTimer = setTimeout(() => { if (S.panel === d.open) { S.state[d.open] = 'open'; render(); } }, 450);
    return;
  }
  if (d.tab) {
    const v = view(d.tab);
    const p = pubOf(v);
    const who = cur === 0 || model === 'born'
      ? (p && cur > 0 ? 'kuka tahansa, jolla osoite on, kirjautumatta' : 'vain sinä, Habitatiin kirjautuneena')
      : (p ? 'kuka tahansa, jolla osoite on' : 'vain sinä kirjautuneena; muut saavat kirjautumissivun');
    S.log = `Uusi välilehti: ${code(tabURL(v))} · avaa: ${who}.` +
      (cur === 0 && p ? ` Jaettu linkki on eri osoite: ${code(linkURL(v, p.token))}.` : '') +
      (cur > 0 && p ? ' Sama osoite kuin Kopioi linkki antaa.' : '');
    return render();
  }
  if (d.close !== undefined) { S.state[S.panel] = 'idle'; S.panel = null; return render(); }
  if (d.vis) { S.menu = S.menu === d.vis ? null : d.vis; return render(); }
  if (d.closeMenu !== undefined) { S.menu = null; return render(); }
  if (d.setPublic) { setVis(view(d.setPublic), true); return render(); }
  if (d.setPrivate) { setVis(view(d.setPrivate), false); return render(); }
  if (d.toggle) { const v = view(d.toggle); setVis(v, !S.pub[v.id]); return render(); }
  if (d.share) { S.menu = null; S.dialog = d.share; S.copied = null; S.days = 7; return render(); }
  if (d.days) { S.days = Number(d.days); return render(); }
  if (d.create) { S.pub[d.create] = { until: DAYS[S.days], token: TOKENS[S.next++ % TOKENS.length] }; S.log = 'Linkki luotiin.'; return render(); }
  if (d.extend) { S.pub[d.extend].until = DAYS[S.days]; S.log = `Linkki on voimassa ${DAYS[S.days]} asti.`; return render(); }
  if (d.copy) {
    const v = view(d.copy);
    S.menu = null; S.copied = v.id;
    S.log = `Leikepöydälle: ${code(copyURL(v))}` + (cur > 0 ? ' · sama osoite, jonka Avaa omalle välilehdelle avaa.' : '');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { if (S.copied === v.id) { S.copied = null; render(); } }, 1600);
    return render();
  }
  if (d.revoke) { const v = view(d.revoke); makePrivate(v); S.dialog = null; S.menu = null; return render(); }
  if (d.dclose !== undefined || (d.overlay !== undefined && e.target === t)) { S.dialog = null; return render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (S.menu || S.dialog)) { S.menu = null; S.dialog = null; render(); }
});

// ---------- picker (PICKER.md reference wiring) ----------
const variants = V.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
