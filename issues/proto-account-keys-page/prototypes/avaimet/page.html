// One visit's runtime: what the page created, what was copied, what was acknowledged.
const R = { made: {}, creating: '', copied: '', seen: {}, open: {}, need: { ssh: true, age: true }, pickSsh: '' };
function resetRuntime() { R.made = {}; R.creating = ''; R.copied = ''; R.seen = {}; R.open = {}; R.need = { ssh: true, age: true }; R.pickSsh = ''; }

function keysOnAccount() {
  const ids = [...SCENARIOS[S.k]];
  if (R.made.ssh) ids.unshift('freshSsh');
  if (R.made.age) ids.push('freshAge');
  return ids.map(id => KEYS[id]);
}
const sshKeys = () => keysOnAccount().filter(k => k.kind === 'ssh');
const ageKey = () => keysOnAccount().find(k => k.kind === 'age');
// "Luo" exists only for the default path, and only while nothing is there: the daemon never overwrites.
const hasDefault = kind => keysOnAccount().some(k => k.kind === kind && (kind === 'age' || k.file === '~/.ssh/id_ed25519'));
const isUnseen = k => k.unseen && !R.seen[k.id];
const pub = k => (k.kind === 'ssh' ? `ssh-ed25519 ${k.blob} ${k.comment}` : k.recipient);
const groups = s => s.replace(/^age1/, '').match(/.{1,4}/g).join(' ');

const P = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  branch: '<circle cx="7" cy="6" r="2"/><path d="M7 8v10M7 12c0 3 3 4 7 4"/><circle cx="17" cy="16" r="2"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  terminal: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 10 3 2-3 2M12 15h5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  send: '<path d="M4 12 20 4l-6 16-3-7-7-1z"/>',
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const phone = () => S.w === '390';

// ---- Words every direction shares ----
const KIND = {
  ssh: { title: 'SSH-avain', mark: 'terminal', what: 'Kirjautuminen palvelimille ja omalle koneellesi.',
    give: 'Anna tämä rivi ylläpitäjälle, kun tarvitset pääsyn organisaation palvelimille. Rivi on avaimen julkinen osa, ja sen saa jakaa.',
    create: 'Luo SSH-avain', makes: 'Tekee tiedoston <code>~/.ssh/id_ed25519</code> (ed25519) komennolla <code>ssh-keygen</code>.' },
  age: { title: 'age-avain (SOPS)', mark: 'lock', what: 'Organisaation salattujen tiedostojen avaaminen.',
    give: 'Anna tämä ylläpitäjälle, kun hänen pitää lisätä tili salaisuuksien vastaanottajaksi. Sen jälkeen agenttisi voi avata ne salaisuudet, joihin sinulla on oikeus.',
    create: 'Luo age-avain', makes: 'Tekee tiedoston <code>~/.config/sops/age/keys.txt</code> komennolla <code>age-keygen</code>. SOPS löytää sen ilman lisäasetuksia.' },
};
function privateNote(k) {
  return `<p class="note">${ic('lock')} Yksityinen osa on tilillä tiedostossa <code>${esc(k.file)}</code>. Sitä ei näytetä eikä ladata, eikä se lähde tililtä.</p>`;
}
function usedLine(k) {
  if (!k.used.length) return '';
  const where = k.kind === 'ssh' ? `<code>~/.ssh/config</code> käyttää tätä: ${k.used.map(h => `<code>${esc(h)}</code>`).join(', ')}`
    : `Työtila ${k.used.map(h => `<code>${esc(h)}</code>`).join(', ')} mainitsee tämän tiedostossa <code>.sops.yaml</code>`;
  return `<div class="used">${where}. Päätelty tiedostoista; ei kerro, toimiiko pääsy.</div>`;
}
function adminCheck(k) {
  if (k.kind === 'ssh') return `<div class="admin"><h4>Ylläpitäjälle</h4>
    <p>Kun hän on saanut rivin, <code>ssh-keygen -lf</code> näyttää sille sormenjäljen <code class="fp">${esc(k.fp)}</code>. Sen pitää olla sama kuin tässä.</p>
    <p>Lue sormenjälki hänelle eri kanavaa pitkin kuin lähetit avaimen, esimerkiksi puhelimessa.</p></div>`;
  return `<div class="admin"><h4>Ylläpitäjälle</h4>
    <p>age-avaimella ei ole erillistä sormenjälkeä. Ylläpitäjä vertaa tiedostoon <code>.sops.yaml</code> lisäämäänsä riviä tähän, neljän merkin ryhmissä:</p>
    <p class="fp-groups">age1 ${esc(groups(k.recipient))}</p></div>`;
}
function copyBtn(k, label = 'Kopioi', cls = '') {
  const done = R.copied === k.id;
  return `<button type="button" class="btn ${done ? 'done' : cls}" data-act="copy" data-key="${k.id}" data-testid="copy-${k.id}">${ic(done ? 'check' : 'copy')}${done ? 'Kopioitu' : esc(label)}</button>`;
}
function afterCopy(k) {
  return R.copied === k.id ? `<span class="after appear" data-testid="copied-hint">Lähetä se ylläpitäjälle, ja kerro sormenjälki erikseen.</span>` : '';
}
function badge(k) {
  if (isUnseen(k)) return '<span class="pill new" data-testid="unseen-pill">Uusi, et ole nähnyt</span>';
  if (k.fresh) return '<span class="pill ok">Luotu juuri</span>';
  return '';
}
function unseenNote(k) {
  if (!isUnseen(k)) return '';
  return `<div class="unseen" data-testid="unseen-${k.id}">${ic('info')}<div>Tämä avain ilmestyi tilille ${esc(k.made)}, eikä sitä luotu tällä sivulla. Jos pyysit agenttia tekemään sen, kaikki on kunnossa. Jos et pyytänyt, älä anna sitä kenellekään ja kysy agentilta, mihin se tarvitsee sitä.</div>
    <div class="k-actions"><button type="button" class="btn" data-act="seen" data-key="${k.id}">${ic('check')}Tunnistan tämän</button></div></div>`;
}
function createBtn(kind, cls = '') {
  if (R.creating === kind) return `<span class="creating" data-testid="creating-${kind}"><span class="spin"></span>Luodaan…</span>`;
  return `<button type="button" class="btn ${cls}" data-act="create" data-kind="${kind}" data-testid="create-${kind}">${ic('plus')}${KIND[kind].create}</button>`;
}
function facts(k) {
  const rows = k.kind === 'ssh'
    ? [['Sormenjälki', `<span class="fp">${esc(k.fp)}</span>`], ['Kommentti', `<span class="mono">${esc(k.comment)}</span>`], ['Luotu', esc(k.made)]]
    : [['Luotu', esc(k.made)]];
  return `<dl class="k-facts">${rows.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>`;
}
function keyLine(k) {
  return k.kind === 'ssh' ? `<pre class="k-line" data-testid="line-${k.id}">ssh-ed25519 ${esc(k.blob)} <span class="cm">${esc(k.comment)}</span></pre>`
    : `<pre class="k-line" data-testid="line-${k.id}">${esc(k.recipient)}</pre>`;
}

// ---- 1 Kortit: one card per key, grouped by kind ----
function keyCard(k) {
  return `<div class="s-card" data-testid="card-${k.id}">
    <div class="k-head"><span class="kmark">${ic(KIND[k.kind].mark)}</span><div class="s-lbl"><strong>${KIND[k.kind].title}${badge(k)}</strong><span class="k-path">${esc(k.kind === 'ssh' ? k.file + '.pub' : k.file)}</span></div><div class="s-val">${copyBtn(k)}</div></div>
    ${unseenNote(k)}
    <div class="k-body">${keyLine(k)}${facts(k)}<div class="k-actions">${afterCopy(k)}</div>${usedLine(k)}${privateNote(k)}</div>
    ${adminCheck(k)}</div>`;
}
function emptyCard(kind) {
  return `<div class="s-card" data-testid="empty-${kind}">
    <div class="k-head"><span class="kmark">${ic(KIND[kind].mark)}</span><div class="s-lbl"><strong>${KIND[kind].title}<span class="pill none">Ei vielä</span></strong><span class="s-desc">${KIND[kind].what}</span></div></div>
    <div class="empty"><p class="note">${KIND[kind].makes} Yksityinen osa jää tilille, eikä sitä näytetä. Olemassa olevaa avainta ei koskaan korvata.</p><div class="k-actions">${createBtn(kind)}</div></div></div>`;
}
function sectionKortit() {
  const ssh = sshKeys(), age = ageKey();
  const sshBlock = (ssh.length ? ssh.map(keyCard).join('') : '') + (hasDefault('ssh') ? '' : emptyCard('ssh'));
  return `${intro()}
    <h3 class="s-h3">SSH</h3><p class="s-intro">${KIND.ssh.give}</p>${sshBlock}
    <h3 class="s-h3">age (SOPS)</h3><p class="s-intro">${KIND.age.give}</p>${age ? keyCard(age) : emptyCard('age')}`;
}

// ---- 2 Taulukko: every public key on the account in one list ----
function detail(k) {
  return `<div class="k-body">${keyLine(k)}<div class="note">${KIND[k.kind].give}</div>${usedLine(k)}${privateNote(k)}</div>${adminCheck(k)}`;
}
function sectionTaulukko() {
  const keys = keysOnAccount();
  const rows = keys.map(k => {
    const open = !!R.open[k.id];
    const name = `<div class="kname"><span class="kmark">${ic(KIND[k.kind].mark)}</span><div class="s-lbl"><strong>${k.kind === 'ssh' ? 'SSH' : 'age'}${badge(k)}</strong><span class="k-path">${esc(k.kind === 'ssh' ? k.file + '.pub' : k.file)}</span></div></div>`;
    const fp = k.kind === 'ssh' ? `<span class="fp" title="${esc(k.fp)}">${esc(k.fp.slice(0, 19))}…</span>` : `<span class="fp" title="${esc(k.recipient)}">${esc(k.recipient.slice(0, 12))}…${esc(k.recipient.slice(-4))}</span>`;
    return `<tr class="krow" data-act="toggle" data-key="${k.id}" aria-expanded="${open}" data-testid="row-${k.id}"><td>${name}</td><td>${fp}</td><td class="when">${esc(k.made)}</td><td class="act">${copyBtn(k)} ${ic('chev', 'chev')}</td></tr>
      ${isUnseen(k) ? `<tr class="kdetail"><td colspan="4">${unseenNote(k)}</td></tr>` : ''}
      ${R.copied === k.id ? `<tr class="kdetail"><td colspan="4"><div class="k-body" style="padding-top:0">${afterCopy(k)}</div></td></tr>` : ''}
      ${open ? `<tr class="kdetail appear"><td colspan="4">${detail(k)}</td></tr>` : ''}`;
  }).join('');
  const missing = ['ssh', 'age'].filter(kind => !hasDefault(kind));
  const empty = keys.length ? '' : `<tr class="kmissing"><td colspan="4">Tilillä ei ole vielä julkisia avaimia.</td></tr>`;
  const create = missing.map(kind => `<div class="t-create" data-testid="t-create-${kind}"><span class="kmark">${ic(KIND[kind].mark)}</span><div class="s-lbl"><strong>${KIND[kind].title} puuttuu</strong><span class="s-desc">${KIND[kind].makes} Olemassa olevaa avainta ei koskaan korvata.</span></div>${createBtn(kind)}</div>`).join('');
  // Phone: the same list as stacked rows; the table would not fit 390 px.
  const list = keys.map(k => {
    const open = !!R.open[k.id];
    return `<div class="kitem" data-testid="item-${k.id}"><div class="k-head" data-act="toggle" data-key="${k.id}" aria-expanded="${open}"><span class="kmark">${ic(KIND[k.kind].mark)}</span><div class="s-lbl"><strong>${k.kind === 'ssh' ? 'SSH' : 'age'}${badge(k)}</strong><span class="k-path">${esc(k.kind === 'ssh' ? k.file + '.pub' : k.file)}</span><span class="fp" style="font-size:11.5px;color:var(--ah-muted)">${esc(k.kind === 'ssh' ? k.fp.slice(0, 19) + '…' : k.recipient.slice(0, 12) + '…' + k.recipient.slice(-4))}</span></div><div class="s-val">${copyBtn(k)}</div></div>
      ${unseenNote(k)}${R.copied === k.id ? `<div class="k-body" style="padding-top:0">${afterCopy(k)}</div>` : ''}${open ? `<div class="kdetail-ph appear">${detail(k)}</div>` : ''}</div>`;
  }).join('<div style="border-top:1px solid var(--ah-line-soft)"></div>');
  return `${intro()}
    <div class="s-card"><table class="ktable" data-testid="ktable"><thead><tr><th>Avain</th><th>Sormenjälki</th><th>Luotu</th><th></th></tr></thead><tbody>${rows}${empty}</tbody></table>
    <div class="klist">${list || '<div class="empty"><p class="note">Tilillä ei ole vielä julkisia avaimia.</p></div>'}</div>${create}</div>
    ${keys.length ? '<p class="note" style="margin-top:10px">Avaa rivi nähdäksesi koko avaimen, mihin se on ja miten ylläpitäjä tarkistaa sen.</p>' : ''}`;
}

// ---- 3 Ohjattu: "add this account to your organisation", ending in one message ----
function chosenSsh() {
  const ssh = sshKeys();
  return ssh.find(k => k.id === R.pickSsh) || ssh.find(k => k.file === '~/.ssh/id_ed25519') || ssh[0];
}
function needRow(kind) {
  const k = kind === 'ssh' ? chosenSsh() : ageKey();
  if (!k) return `<div class="need" data-testid="need-${kind}"><span class="kmark">${ic(KIND[kind].mark)}</span><div class="s-lbl"><strong>${KIND[kind].title}</strong><span class="s-desc">Tilillä ei ole vielä tätä avainta.</span></div><div>${createBtn(kind, 'primary')}</div></div>`;
  const ssh = sshKeys();
  const pick = kind === 'ssh' && ssh.length > 1
    ? `<select data-act="pick" aria-label="Mikä SSH-avain">${ssh.map(s => `<option value="${s.id}"${s.id === k.id ? ' selected' : ''}>${esc(s.file)}.pub${isUnseen(s) ? ' (uusi)' : ''}</option>`).join('')}</select>`
    : `<span class="k-path">${esc(kind === 'ssh' ? k.file + '.pub' : k.file)}</span>`;
  const fp = kind === 'ssh' ? `<span class="fp">${esc(k.fp)}</span>` : `<span class="fp">${esc(k.recipient.slice(0, 16))}…${esc(k.recipient.slice(-6))}</span>`;
  return `<div class="need" data-testid="need-${kind}"><span class="step-n ok">${ic('check')}</span><div class="s-lbl"><strong>${KIND[kind].title}${badge(k)}</strong>${pick}${fp}</div><div></div></div>${unseenNote(k) ? `<div class="s-card">${unseenNote(k)}</div>` : ''}`;
}
function message() {
  const lines = [`<span class="t">Hei! Lisää Habitat-tilini ${esc(ACCOUNT.user)}@${esc(ACCOUNT.site)} uutena laitteena, esimerkiksi nimellä ${esc(ACCOUNT.user)}-habitat.</span>`];
  const s = R.need.ssh && chosenSsh(), a = R.need.age && ageKey();
  if (s) lines.push(`\n<span class="t">SSH-avain palvelimille:</span>\n${esc(pub(s))}\n<span class="t">Sormenjälki (ssh-keygen -lf):</span> ${esc(s.fp)}`);
  if (a) lines.push(`\n<span class="t">age-vastaanottaja .sops.yaml-tiedostoon:</span>\n${esc(a.recipient)}`);
  lines.push(`\n<span class="t">Kerron sormenjäljen vielä puhelimessa, niin voit tarkistaa, että sait oikean avaimen.</span>`);
  return lines.join('\n');
}
function sectionOhjattu() {
  const needSsh = R.need.ssh, needAge = R.need.age;
  const ready = (needSsh || needAge) && (!needSsh || chosenSsh()) && (!needAge || ageKey());
  const step1 = `<div class="step" data-testid="step-1"><div class="step-h"><span class="step-n${needSsh || needAge ? ' ok' : ''}">${needSsh || needAge ? ic('check') : '1'}</span><div class="s-lbl"><strong>Mitä ylläpitäjäsi tarvitsee?</strong><span class="s-desc">Kysy häneltä, jos et ole varma. Voit valita molemmat.</span></div></div>
    <div class="step-b">
      <label class="choice"><input type="checkbox" data-act="need" data-kind="ssh"${needSsh ? ' checked' : ''}><span class="s-lbl"><strong>Pääsy palvelimille</strong><span class="s-desc">Agenttisi kirjautuu organisaation palvelimille SSH:lla, esimerkiksi julkaisemaan.</span></span></label>
      <label class="choice"><input type="checkbox" data-act="need" data-kind="age"${needAge ? ' checked' : ''}><span class="s-lbl"><strong>Salaisuudet</strong><span class="s-desc">Agenttisi avaa organisaation SOPS-salattuja tiedostoja, kuten tunnuksia julkaisuun.</span></span></label>
    </div></div>`;
  const kinds = [needSsh && 'ssh', needAge && 'age'].filter(Boolean);
  const step2 = `<div class="step" data-testid="step-2"${kinds.length ? '' : ' aria-disabled="true"'}><div class="step-h"><span class="step-n${ready ? ' ok' : ''}">${ready ? ic('check') : '2'}</span><div class="s-lbl"><strong>Avaimet tälle tilille</strong><span class="s-desc">Puuttuva avain tehdään tilillä. Yksityinen osa jää tänne, eikä sitä näytetä.</span></div></div>
    ${kinds.length ? `<div class="step-b">${kinds.map(needRow).join('')}</div>` : ''}</div>`;
  const copied = R.copied === 'message';
  const step3 = `<div class="step" data-testid="step-3"${ready ? '' : ' aria-disabled="true"'}><div class="step-h"><span class="step-n${copied ? ' ok' : ''}">${copied ? ic('check') : '3'}</span><div class="s-lbl"><strong>Lähetä ylläpitäjälle</strong><span class="s-desc">Viestissä on vain julkisia osia. Kopioi se täältä, älä agentin vastauksesta.</span></div></div>
    ${ready ? `<div class="step-b"><pre class="msg" data-testid="message">${message()}</pre>
      <div class="k-actions"><button type="button" class="btn ${copied ? 'done' : 'primary'}" data-act="copy" data-key="message" data-testid="copy-message">${ic(copied ? 'check' : 'copy')}${copied ? 'Viesti kopioitu' : 'Kopioi viesti'}</button>${copied ? '<span class="after appear" data-testid="copied-hint">Liitä se sähköpostiin tai chattiin.</span>' : ''}</div>
      ${needSsh && chosenSsh() ? `<p class="note"><strong>Sormenjäljen tarkistus.</strong> Ylläpitäjä ajaa saamastaan rivistä <code>ssh-keygen -lf</code> ja vertaa tulosta lukuun <code class="fp">${esc(chosenSsh().fp)}</code>, jonka luet hänelle eri kanavaa pitkin.</p>` : ''}
      ${needAge && ageKey() ? `<p class="note"><strong>age-avain</strong> verrataan koko rivinä: <span class="fp-groups">age1 ${esc(groups(ageKey().recipient))}</span></p>` : ''}
      <p class="note">Pääsyn antaa ja poistaa ylläpitäjä. Tämä sivu ei tiedä, onko hän jo lisännyt avaimen.</p></div>` : ''}</div>`;
  const all = keysOnAccount();
  const list = all.length ? `<div class="all"><h3 class="s-h3">Kaikki tilin julkiset avaimet</h3><div class="s-card">${all.map(k => `<div class="s-row" data-testid="all-${k.id}"><div class="s-lbl"><strong>${KIND[k.kind].title}${badge(k)}</strong><span class="k-path">${esc(k.kind === 'ssh' ? k.file + '.pub · ' + k.fp : k.file)}</span></div><div class="s-val">${copyBtn(k)}</div></div>${unseenNote(k)}`).join('')}</div></div>` : '';
  return `<h2>Avaimet</h2><p class="s-intro">Liitä tämä tili organisaatiosi palvelimiin ja salaisuuksiin samalla tavalla kuin läppärisi: ylläpitäjä lisää tilin uutena laitteena. Sivu lukee avaimet suoraan tilin tiedostoista.</p>
    <div class="steps">${step1}${step2}${step3}</div>${list}`;
}

function intro() {
  return `<h2>Avaimet</h2><p class="s-intro">Tämän tilin julkiset avaimet. Organisaatiosi ylläpitäjä tarvitsee niitä, kun hän antaa agentillesi pääsyn palvelimille tai salaisuuksiin. <strong>Kopioi avain tältä sivulta, älä agentin vastauksesta:</strong> sivu lukee sen suoraan tilin tiedostosta.</p>`;
}

// ---- Settings ----
const SECTIONS = [['tili', 'Tili'], ['laitteet', 'Laitteet'], ['avaimet', 'Avaimet'], ['tekoaly', 'Tekoäly'], ['tilannekatsaus', 'Tilannekatsaus'], ['sanelu', 'Sanelu'], ['koodipalvelut', 'Koodipalvelut'], ['tiedot', 'Tiedot agenteille'], ['ulkoasu', 'Ulkoasu'], ['editori', 'Editori'], ['tila', 'Tallennustila'], ['kokeelliset', 'Kokeelliset ominaisuudet']];
function settingsNav() {
  return `<nav class="s-nav" aria-label="Asetusten osiot"><div class="s-h">Asetukset</div>${SECTIONS.map(([id, l]) =>
    `<div class="s-nav-i${id === 'avaimet' ? ' cur new' : ''}" data-testid="settings-${id}">${esc(l)}</div>`).join('')}</nav>`;
}
function viewSettings() {
  const body = { kortit: sectionKortit, taulukko: sectionTaulukko, ohjattu: sectionOhjattu }[V]();
  return `<div class="settings">${phone() ? '' : settingsNav()}<div class="s-main" data-testid="settings-main"><button class="btn quiet s-back">${ic('back')}Asetukset</button>${body}</div></div>`;
}
function rail() {
  return `<nav class="rail"><div class="rail-head">${ic('menu')} Open Habitat</div>
    <div class="rail-item">${ic('plus')}<span>Uusi työtila</span></div>
    <div class="rail-ws">${ic('branch')} infra</div>
    <div class="rail-item sub"><span>Julkaisu tuotantoon</span></div>
    <div class="rail-item sub"><span>Palvelinten avainten kierto</span></div>
    <div class="rail-ws">${ic('branch')} aurinkokello</div>
    <div class="rail-item sub"><span>Varjon pituuden laskenta</span></div>
    <div class="rail-fill"></div>
    <div class="rail-account"><span class="avatar">JM</span><span>${esc(ACCOUNT.name)}</span></div></nav>`;
}
function appHTML() {
  const ph = phone();
  const top = ph ? `<div class="topbar"><span class="burger">${ic('menu')}</span><h1>Asetukset</h1></div>` : '';
  return `<div class="app${ph ? ' phone ph' : ''}" data-variant="${V}">${ph ? '' : rail()}<main class="main">${top}<div class="scroll">${viewSettings()}</div></main></div>`;
}

// ---- Frame geometry ----
const HEIGHTS = { 1280: 800, 390: 844 };
const viewport = document.getElementById('viewport');
const sizer = document.getElementById('sizer');
const stage = document.getElementById('frame');
function frameSize() {
  if (S.w === 'oma') return { W: viewport.clientWidth, H: viewport.clientHeight };
  return { W: +S.w, H: HEIGHTS[S.w] };
}
function layoutFrame() {
  const { W, H } = frameSize();
  const bare = document.body.classList.contains('bare');
  const s = S.w === 'oma' || bare ? 1 : Math.min(1, (viewport.clientWidth - 24) / W, (viewport.clientHeight - 84) / H);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.transform = s < 1 ? `scale(${s})` : '';
  sizer.style.width = Math.round(W * s) + 'px'; sizer.style.height = Math.round(H * s) + 'px';
  stage.dataset.theme = S.t;
}
function readout() {
  const ssh = sshKeys().length, age = ageKey() ? 'on' : 'ei';
  const unseen = keysOnAccount().filter(isUnseen).length;
  document.getElementById('readout').innerHTML = `Tilillä: <b>SSH ${ssh} · age ${age}${unseen ? ` · näkemättä ${unseen}` : ''}</b> · Host nyt: <b>ei avainsivua; agentti tekee avaimet komennoilla</b>`;
}

// ---- Picker wiring (picker.js expects `stage` and `variants`) ----
const variants = VARIANTS.map(v => () => {
  if (V !== null && V !== v) resetRuntime();
  V = v; stage.dataset.variant = v; layoutFrame(); readout();
  return appHTML();
});
// A repaint keeps the settings page's scroll position.
function paint() {
  const sc = stage.querySelector('.scroll'), top = sc ? sc.scrollTop : 0;
  stage.innerHTML = appHTML(); readout();
  const sc2 = stage.querySelector('.scroll'); if (sc2) sc2.scrollTop = top;
}

let copyTimer;
function copy(id) {
  const text = id === 'message' ? stage.querySelector('[data-testid="message"]').innerText : pub(KEYS[id]);
  // file:// and headless browsers may refuse the clipboard; the state is what the prototype shows.
  try { navigator.clipboard?.writeText(text).catch(() => {}); } catch { /* ignored */ }
  R.copied = id; paint();
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { if (R.copied === id) { R.copied = ''; paint(); } }, 6000);
}
let createTimer;
function create(kind) {
  if (R.creating || hasDefault(kind)) return;
  R.creating = kind; paint();
  clearTimeout(createTimer);
  createTimer = setTimeout(() => { R.made[kind] = true; R.creating = ''; paint(); }, 700);
}

stage.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'copy') { e.stopPropagation(); copy(t.dataset.key); }
  else if (act === 'create') create(t.dataset.kind);
  else if (act === 'seen') { R.seen[t.dataset.key] = true; paint(); }
  else if (act === 'toggle') { if (e.target.closest('button')) return; R.open[t.dataset.key] = !R.open[t.dataset.key]; paint(); }
});
stage.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'need') { R.need[t.dataset.kind] = t.checked; R.copied = ''; paint(); }
  else if (t.dataset.act === 'pick') { R.pickSsh = t.value; R.copied = ''; paint(); }
});
