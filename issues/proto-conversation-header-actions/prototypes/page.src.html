const TITLE0 = 'Mökin varauskalenteri: päällekkäiset varaukset ja muistutusviesti';

const q = new URLSearchParams(location.search);
let theme = q.get('t') === 'dark' ? 'dark' : 'light';

// are drawn, and what the ⋯ menu holds.

const phone = () => device === 'phone';
// A quiet icon button as on main: the name only in the tooltip and the
// accessible name.
const iconBtn = (id, extra = '') => {
  const a = A[id];
  const pressed = a.panel ? ` aria-pressed="${!!S[id]}"` : '';
  const exp = id === 'details' ? ` aria-expanded="${S.details}"` : '';
  const busy = (id === 'retitle' && S.naming) || (id === 'recap' && S.recap === 'pending') ? ' disabled' : '';
  return `<button class="hb ${extra}" data-act="${id}" aria-label="${esc(a.menu || a.tip)}" data-tip="${esc(a.tip)}"${pressed}${exp}${busy}>${svg(a.icon)}</button>`;
};
// Icon and a short word (direction 1 and 2).
const wordBtn = (id, extra = '') => {
  const a = A[id];
  const pressed = a.panel ? ` aria-pressed="${!!S[id]}"` : '';
  const exp = id === 'details' ? ` aria-expanded="${S.details}"` : '';
  const busy = (id === 'retitle' && S.naming) || (id === 'recap' && S.recap === 'pending') ? ' disabled' : '';
  const tip = a.tip !== a.word && a.tip !== a.menu ? ` data-tip="${esc(a.tip)}"` : '';
  return `<button class="hb word ${extra}" data-act="${id}"${tip}${pressed}${exp}${busy}>${svg(a.icon)}<span class="w">${esc(a.word)}</span></button>`;
};
// Direction 1 on a phone: the word under the icon.
const capBtn = (id, extra = '') => {
  const a = A[id];

};
const moreBtn = (labelled) => `<button class="hb more" data-more aria-haspopup="menu" aria-expanded="${S.menu}" aria-label="Keskustelun toiminnot"${labelled ? '' : ` data-tip="Keskustelun toiminnot"`}>${svg('more')}</button>`;

// What the menu lists that the row does not show (main's headerMenu).
function hiddenOneoffs() {

}
function menuMain() {
  const items = [];

  items.push(`<button class="mi plain" data-act="rename"><span>Nimeä uudelleen</span></button>`);
  for (const id of hiddenOneoffs()) items.push(`<button class="mi plain" data-act="${id}"><span>${esc(A[id].menu)}</span></button>`);
  return items.join('');
}
// Direction 2: the menu is where the conversation's one-off actions live,
// each with its icon, its name and one line on what it does. On a phone the
// panels join it too, so the first row is the title and ⋯ only.
function menuExplained() {
  const it = (id, label, means, on) => `<button class="mi${on ? ' on' : ''}" data-act="${id}">${svg(A[id].icon)}<span>${esc(label)}</span><small>${esc(means)}</small></button>`;
  let h = '';

    h += it('terminal', S.terminal ? 'Sulje pääte' : 'Pääte', A.terminal.means, S.terminal);
    h += '<hr>';
  }
  h += it('recap', 'Tilannekatsaus', A.recap.means);
  h += it('retitle', 'Uusi otsikko', A.retitle.means);
  h += it('rename', 'Nimeä uudelleen', A.rename.means);
  h += it('archive', 'Arkistoi', A.archive.means);
  h += '<hr>';
  h += it('details', 'Tiedot', A.details.means);
  if (phone() || S.steps >= 1) h += `<button class="mi" data-act="workspace">${svg('folder')}<span>Työtila ${WS}</span><small>Avaa työtilan sivu: sen keskustelut ja tiedostot.</small></button>`;

}
function menuWithHelp() {

// The desktop row's shortening (HeaderShortening.tsx): the fewest steps
// that leave the title 40 % of the row or its whole text. A phone takes none.
function shorten() {
  const tl = document.querySelector('#stage .tl');
  if (!tl || phone()) return;
  const fits = () => {
    const title = tl.querySelector('h1');
    const box = tl.getBoundingClientRect();
    const right = Math.max(box.left, ...[...tl.children].map((c) => { const r = c.getBoundingClientRect(); return r.width ? r.right : box.left; }));
    if (right > box.right + 1) return false;
    const need = Math.min(title.scrollWidth, box.width * 0.4);
    return title.clientWidth >= need - 1;
  };
  let steps = 0;
  for (; steps < 6; steps++) {
    tl.dataset.s = Array.from({ length: steps }, (_, i) => i + 1).join(' ');
    tl.querySelector('.more-wrap').classList.toggle('hide', !(V[cur].moreAlways || steps >= 1));
    if (fits()) break;
  }
  if (steps !== S.steps) { S.steps = steps; render(); }
}
function mount(i) { cur = i; S = fresh(); render(); }
function setParam(k, val) { const u = new URL(location); u.searchParams.set(k, val); history.replaceState(null, '', u); }

const LOG = {
  workspace: `Avaisi työtilan ${WS} sivun.`,
  rename: 'Otsikko muuttuisi kentäksi, johon voi kirjoittaa oman nimen.',
  archive: 'Keskustelu arkistoitaisiin: se katoaisi sivupalkista ja löytyisi Arkistoiduista.',
};
let timer;
function act(id) {
  S.menu = false;
  if (id === 'editor' || id === 'terminal') { S[id] = !S[id]; S.log = ''; return render(); }
  if (id === 'details') { S.details = !S.details; return render(); }
  if (id === 'help') { S.coach = true; return render(); }
  if (id === 'recap') {
    S.recap = 'pending'; render();
    clearTimeout(timer); timer = setTimeout(() => { S.recap = 'shown'; render(); }, 700);
    return;
  }
  if (id === 'retitle') {
    S.naming = true; render();
    clearTimeout(timer); timer = setTimeout(() => { S.naming = false; S.title = long ? (S.title === TITLE0 ? TITLE1 : TITLE0) : (S.title === SHORT0 ? SHORT1 : SHORT0); S.log = 'Agentti antoi keskustelulle uuden otsikon.'; render(); }, 900);
    return;
  }
  S.log = LOG[id] || ''; render();
}
document.addEventListener('click', (e) => {
  const stageEl = document.getElementById('stage');
  if (!stageEl.contains(e.target)) return;
  const t = e.target.closest('[data-theme-set],[data-device-set],[data-width-set],[data-title-set],[data-first-set],[data-reset],[data-act],[data-more],[data-coach-ok]');
  // A press outside an open menu or the details closes it, as they do on main.
  const inside = e.target.closest('.menu-pop, .details, [data-more], [data-act="details"]');
  if ((S.menu || S.details) && !inside) { S.menu = false; S.details = false; if (!t) return render(); }
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.themeSet) { theme = d.themeSet; setParam('t', theme); return render(); }
  if (d.deviceSet) { device = d.deviceSet; setParam('d', device); S.menu = false; return render(); }
  if (d.widthSet) { width = d.widthSet; setParam('w', width); S.steps = 0; return render(); }
  if (d.titleSet) { long = d.titleSet === 'long'; setParam('n', long ? 'long' : 'short'); S.title = long ? TITLE0 : SHORT0; S.steps = 0; return render(); }
  if (d.firstSet) { first = d.firstSet === 'first'; setParam('f', first ? 'first' : 'later'); S.coach = first; return render(); }
  if (d.reset !== undefined) return mount(cur);
  if (d.more !== undefined) { S.menu = !S.menu; S.details = false; return render(); }
  if (d.coachOk !== undefined) { S.coach = false; S.log = 'Kortti ei enää avaudu itsestään.'; return render(); }
  if (d.act) return act(d.act);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (S.menu || S.details || S.coach)) { S.menu = false; S.details = false; S.coach = false; render(); }
});

// ---------- picker (PICKER.md reference wiring) ----------
const variants = V.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
