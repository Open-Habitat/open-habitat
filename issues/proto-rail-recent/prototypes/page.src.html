<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raide ja viimeisimmät keskustelut tilakoneena</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ah-bg);
  color: var(--ah-ink);
  font: 400 var(--ah-size-ui)/var(--ah-lh-ui) var(--ah-font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
kbd { font: 600 11px var(--ah-mono); }

/* ---------- page chrome around the simulation ---------- */
.pg { max-width: 1480px; margin: 0 auto; padding: 72px 24px 40px; }
.pg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; margin-bottom: 14px; }
.pg-head h1 { margin: 0; font-size: var(--ah-size-h1); font-weight: 600; letter-spacing: -.01em; }
.pg-axis { color: var(--ah-muted); font-size: var(--ah-size-meta); }
.pg-toggles { margin-left: auto; display: flex; gap: 8px; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--ah-r-md); background: var(--ah-control); }
.seg button { border: 0; background: transparent; color: var(--ah-ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ah-surface); color: var(--ah-ink); box-shadow: 0 0 0 1px var(--ah-line); font-weight: 600; }
.pg-lead { margin: 0 0 18px; max-width: 92ch; color: var(--ah-ink-2); font-size: var(--ah-size-body); line-height: 1.55; }
.pg-grid { display: grid; grid-template-columns: minmax(520px, 600px) minmax(0, 1fr); gap: 24px; align-items: start; }
.pg[data-device="phone"] .pg-grid { grid-template-columns: minmax(520px, 1fr) auto; }
.card { background: var(--ah-surface); border: 1px solid var(--ah-line); border-radius: var(--ah-r-xl); box-shadow: var(--ah-shadow-app); }
.graph-card { padding: 14px 14px 10px; position: sticky; top: 72px; }
.card h2 { margin: 0 0 2px; font-size: var(--ah-size-h2); font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--ah-muted); font-size: var(--ah-size-meta); }
svg.graph { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 2px 0; color: var(--ah-muted); font-size: 11.5px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ah-ink-2); vertical-align: middle; margin-right: 5px; }
.legend i.bad { border-top: 2px dashed var(--ah-err); }
.legend i.cost { border-top: 2px dashed var(--ah-turn); }
.legend i.hit { border-top: 3px solid var(--ah-accent); }
.notes { margin: 12px 2px 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ah-ink-2); }
.notes li b { color: var(--ah-ink); }
.notes li code { font: 11.5px var(--ah-mono); color: var(--ah-muted); }
.badge { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 700 11px var(--ah-font); color: #fff; background: var(--ah-err); }
.badge.cost { background: var(--ah-turn); color: #1b1300; }
.notes li.lit { background: var(--ah-accent-soft); border-radius: 6px; outline: 4px solid var(--ah-accent-soft); }

/* graph */
.g-node rect { fill: var(--ah-surface-2); stroke: var(--ah-line-strong); stroke-width: 1.2; }
.g-node .t { fill: var(--ah-ink); font: 600 12.5px var(--ah-font); }
.g-node .s { fill: var(--ah-muted); font: 400 10.5px var(--ah-font); }
.g-node.on rect { fill: var(--ah-accent-soft); stroke: var(--ah-accent); stroke-width: 2.5; }
.g-node.on .t { fill: var(--ah-accent-ink); }
.g-node.ghost rect { stroke-dasharray: 4 3; }
.g-edge path { fill: none; stroke: var(--ah-faint); stroke-width: 1.4; }
.g-edge.bad path { stroke: var(--ah-err); stroke-dasharray: 5 4; }
.g-edge.cost path { stroke: var(--ah-turn); stroke-dasharray: 5 4; }
.g-edge.hit path { stroke: var(--ah-accent); stroke-width: 3; stroke-dasharray: none; }
.g-edge text { font: 400 10.5px var(--ah-font); fill: var(--ah-ink-2); paint-order: stroke; stroke: var(--ah-surface); stroke-width: 4px; stroke-linejoin: round; }
.g-edge.hit text { fill: var(--ah-accent-ink); font-weight: 700; }
.g-edge .bd circle { fill: var(--ah-err); }
.g-edge.cost .bd circle { fill: var(--ah-turn); }
.g-edge .bd text { fill: #fff; stroke: none; font: 700 10px var(--ah-font); }
.g-edge.cost .bd text { fill: #1b1300; }
.g-arrow { fill: var(--ah-faint); }
.g-arrow.bad { fill: var(--ah-err); }
.g-arrow.cost { fill: var(--ah-turn); }
.g-arrow.hit { fill: var(--ah-accent); }

/* events */
.ev { padding: 12px 14px; margin-bottom: 14px; }
.ev-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.ev-group h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ah-muted); }
.ev-group .btns { display: flex; flex-wrap: wrap; gap: 5px; }
.evb { border: 1px solid var(--ah-control-line); background: var(--ah-surface); color: var(--ah-ink); border-radius: 6px; padding: 4px 9px; font-size: 12.5px; cursor: pointer; }
.evb:hover:not(:disabled) { background: var(--ah-surface-hover); }
.evb:disabled { opacity: .45; cursor: default; }
.evb.reset { border-style: dashed; color: var(--ah-muted); }
.ev-log { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--ah-line-soft); font-size: 12px; color: var(--ah-muted); min-height: 2.6em; }
.g-edge.good path { stroke: var(--ah-ok); stroke-dasharray: 2 3; }
.g-arrow.good { fill: var(--ah-ok); }
.legend i.good { border-top: 2px dotted var(--ah-ok); }
.badge.ok { background: var(--ah-ok); color: #fff; }
.pg-lead code, .notes li code { font: 11.5px var(--ah-mono); }
/* events: the target picker and the clock */
.ev-target { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--ah-ink-2); }
.ev-target select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--ah-control-line); background: var(--ah-surface); color: var(--ah-ink); }
.ev-clock { margin-left: auto; font: 600 12.5px var(--ah-mono); color: var(--ah-ink); }
.ev-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.evb.story { border-color: var(--ah-accent-line); color: var(--ah-accent-ink); }

/* ---------- the production-looking app ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 680px; overflow: hidden; border-radius: var(--ah-r-xl); border: 1px solid var(--ah-line); background: var(--ah-bg); box-shadow: var(--ah-shadow-app); color: var(--ah-ink); }
.rail { background: var(--ah-rail); border-right: 1px solid var(--ah-line); padding: 10px 8px 16px; overflow: auto; }
.rail-brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px; font-weight: 600; font-size: 13.5px; }
.rail-brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--ah-accent); display: inline-block; }
.rail-brand .x { margin-left: auto; display: none; border: 0; background: transparent; color: var(--ah-muted); font-size: 16px; cursor: pointer; }
.rail section + section { margin-top: 8px; }
.rail h2 { display: flex; align-items: center; gap: 8px; min-height: 26px; margin: 0; padding: 0 8px; color: var(--ah-muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.cnt { color: var(--ah-muted); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.cnt.att { min-width: 18px; padding: 0 6px; border-radius: var(--ah-r-pill); background: var(--ah-accent); color: var(--ah-on-accent); font-weight: 600; text-align: center; }
.rail ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.empty { margin: 0; padding: 2px 8px 4px; color: var(--ah-faint); font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font-size: 13px; cursor: pointer; }
.row:hover { background: var(--ah-hover); }
.row.cur { background: var(--ah-current); box-shadow: 0 0 0 1px var(--ah-current-line); color: var(--ah-ink); font-weight: 600; }
.row .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { flex: none; color: var(--ah-muted); font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
.row .wt { flex: none; color: var(--ah-faint); font: 600 10px var(--ah-mono); }
.row.kept .tt { font-style: italic; }
.ball { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ah-faint); }
.ball.work { background: var(--ah-accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ah-accent) 28%, transparent); animation: ah-pulse var(--ah-pulse); }
.ball.you { background: var(--ah-turn); }
.ball.done { background: var(--ah-ok); }
.ball.fail { border-radius: 1px; background: var(--ah-err); transform: scale(.9) rotate(45deg); }
.ball.rest { box-sizing: border-box; background: transparent; border: 1.5px solid var(--ah-ok); }
.wsi { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font: 600 8px/1 var(--ah-font); letter-spacing: -.02em; color: var(--h); background: color-mix(in srgb, var(--h) 15%, var(--ah-surface)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--h) 32%, transparent) inset; }
.grp + .grp { margin-top: 4px; }
.grp h3 { margin: 0; padding: 5px 8px 1px; color: var(--ah-ink-2); font: 600 12px var(--ah-mono); display: flex; gap: 6px; align-items: center; }
.rule { display: flex; align-items: center; gap: 8px; margin: 8px 8px 2px; color: var(--ah-muted); font-size: 10.5px; }
.rule::after { content: ""; flex: 1; height: 1px; background: var(--ah-line); }
.fold { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 24px; padding: 0 8px 0 12px; border: 0; border-radius: var(--ah-r-nav); background: transparent; color: var(--ah-muted); font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
.fold:hover { background: var(--ah-hover); color: var(--ah-ink-2); }
.fold .chev { display: inline-block; width: 8px; transition: transform .15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold.ws .lb { font-family: var(--ah-mono); }
.rail hr { border: 0; border-top: 1px solid var(--ah-line-soft); margin: 10px 8px 6px; }
.wsrow { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border-radius: var(--ah-r-nav); color: var(--ah-ink-2); font: 500 12.5px var(--ah-mono); cursor: pointer; }
.wsrow:hover { background: var(--ah-hover); }
.wsrow.cur { background: var(--ah-current); color: var(--ah-ink); }
.wsrow .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ah-bg); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--ah-line); background: var(--ah-surface); }
.topbar .menu { display: none; position: relative; border: 0; background: transparent; color: var(--ah-ink-2); font-size: 18px; padding: 0 4px; cursor: pointer; }
.topbar .menu .dot { position: absolute; top: -2px; right: -4px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--ah-accent); color: var(--ah-on-accent); font: 700 10px/15px var(--ah-font); }
.topbar h5 { margin: 0; font-size: var(--ah-size-title); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .wsn { color: var(--ah-muted); font: 12px var(--ah-mono); white-space: nowrap; }
.chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: var(--ah-r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--ah-control); color: var(--ah-ink-2); }
.chip.work { background: var(--ah-accent-soft); color: var(--ah-accent-ink); }
.chip.you { background: color-mix(in srgb, var(--ah-turn) 16%, transparent); color: var(--ah-ink); }
.chip.fail { background: var(--ah-err-soft); color: var(--ah-err); }
.stream { flex: 1; overflow: auto; padding: 18px var(--ah-column-pad-inline) 10px; }
.stream > * { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.msg-user p { margin: 0; max-width: 80%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--ah-accent-soft); color: var(--ah-ink); font-size: var(--ah-size-body); line-height: 1.5; }
.msg-agent { margin-bottom: 14px; font-size: var(--ah-size-body); line-height: var(--ah-lh-body); color: var(--ah-ink); }
.msg-agent p { margin: 0 0 6px; }
.working-line { display: flex; align-items: center; gap: 8px; color: var(--ah-accent-ink); font-size: 13px; margin-bottom: 10px; }
.card-note { border: 1px solid var(--ah-line); background: var(--ah-surface); border-radius: var(--ah-r-lg); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; color: var(--ah-ink-2); }
.card-note b { display: block; font-size: 11px; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.card-note.ask { border-color: color-mix(in srgb, var(--ah-turn) 45%, var(--ah-line)); background: color-mix(in srgb, var(--ah-turn) 8%, var(--ah-surface)); color: var(--ah-ink); }
.card-note.cut { border-color: var(--ah-err-line); background: var(--ah-err-soft); color: var(--ah-ink); }
.empty-view { margin: 80px auto 0; text-align: center; color: var(--ah-muted); max-width: 40ch; }
.wspage h6 { margin: 0 0 8px; font-size: 11px; color: var(--ah-muted); text-transform: uppercase; letter-spacing: .04em; }
.wspage ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--ah-line); border-radius: var(--ah-r-lg); background: var(--ah-surface); }
.wspage li + li { border-top: 1px solid var(--ah-line-soft); }
.wspage .row { min-height: 40px; padding: 0 12px; border-radius: 0; }
.wspage .row small { color: var(--ah-muted); font-size: 11.5px; font-weight: 400; }
.composer { padding: 0 var(--ah-column-pad-inline) var(--ah-composer-pad-block); }
.composer-box { max-width: calc(var(--ah-conversation-width) - 2 * var(--ah-column-pad-inline)); margin-inline: auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; min-height: 48px; border: 1px solid var(--ah-line-strong); border-radius: var(--ah-r-xl); background: var(--ah-surface); }
.composer-box span { flex: 1; color: var(--ah-faint); font-size: var(--ah-size-body); }
.composer-box button { border: 0; border-radius: var(--ah-r-md); padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; background: var(--ah-accent); color: var(--ah-on-accent); }
.composer-box button.stop { background: var(--ah-control); color: var(--ah-ink); }

/* phone form */
.phone-wrap { display: flex; justify-content: center; }
.app.phone { width: 390px; height: 780px; grid-template-columns: 1fr; border-radius: 34px; border-width: 8px; border-color: #0b0d0f; position: relative; }
.app.phone .rail { position: absolute; inset: 0 auto 0 0; width: 84%; z-index: 3; transform: translateX(-102%); transition: transform var(--ah-appear); box-shadow: var(--ah-shadow-dialog); padding-top: 18px; }
.app.phone.rail-open .rail { transform: none; }
.app.phone .rail-brand .x { display: inline-block; }
.app.phone .row, .app.phone .wsrow { min-height: 40px; }
.app.phone .topbar { padding: 10px 12px; }
.app.phone .topbar .menu { display: inline-block; }
.app.phone .topbar .wsn { display: none; }
.app.phone .stream { padding-inline: 14px; }
.app.phone .composer { padding-inline: 10px; }
@media (max-width: 1100px) {
  .pg-grid, .pg[data-device="phone"] .pg-grid { grid-template-columns: 1fr; }
  .graph-card { position: static; }
}
@media (max-width: 700px) {
  .pg { padding: 64px 10px 30px; }
  .ev-grid { grid-template-columns: 1fr; }
  .app.phone { width: 100%; max-width: 390px; }
}

/* ---------- picker (PICKER.md, verbatim) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }

</style>
</head>

<script>
'use strict';
// ------------------------------------------------------------------
// The world: conversations and the host facts the rail reads.
// st: work (turn running), ask (question), done (turn ended), cut (a turn
//     the daemon restart cut off, no final reply).
// unread: a reply that settled while the tab did not show it (tab memory:
//     conversationStore attention, lost on reload).
// pi: the conversation's Pi process is alive. rest: why it is not (the
//     snapshot's rest.cause: idle, restart).
// changed: minutes on the story clock of the session file's last write
//     (snapshot changed_at). wt: a Taskfleet worker conversation (a user
//     unit, survives a daemon restart). term: run from a terminal, never
//     opened in a browser.
// ------------------------------------------------------------------
const WS = {
  'open-habitat': { g: 'oh', h: 'var(--ah-glyph-1)' },
  fleetrepo: { g: 'hb', h: 'var(--ah-glyph-3)' },
  deutschpad: { g: 'd', h: 'var(--ah-glyph-5)' },
  workspace: { g: 'ws', h: 'var(--ah-glyph-6)' },
};
const WS_ORDER = Object.keys(WS).sort((a, b) => a.localeCompare(b, 'fi'));
const DAY = 1440;
const BASE = [
  { id: 'a', title: 'Raiteen viimeisimmät', ws: 'open-habitat', st: 'work', pi: true, changed: 0, vis: { desktop: 0 },
    you: 'Piirrä raide tilakoneena ja ehdota, miten viimeisimmät keskustelut näkyvät.', agent: 'Luen railNow.ts:n ja Navigation.tsx:n säännöt.' },
  { id: 'b', title: 'Julkaisun muistiinpanot', ws: 'open-habitat', st: 'done', unread: true, pi: true, changed: -4, vis: { desktop: -30 },
    you: 'Kokoa julkaisumuistiinpanot TODO.md:n tarinasta.', agent: 'Muistiinpanot ovat tiedostossa docs/release-notes.md. Kolme kohtaa jäi auki.' },
  { id: 'c', title: 'Birch-päivitys', ws: 'fleetrepo', st: 'ask', pi: true, changed: -2, vis: { desktop: -50, phone: -300 },
    you: 'Päivitä Birch uusimpaan julkaisuun.', agent: 'Lataus ja allekirjoituksen tarkistus menivät läpi.', q: 'Saanko käynnistää palvelun uudelleen nyt? Kaksi istuntoa on auki.' },
  { id: 'd', title: 'Verbien taivutus', ws: 'deutschpad', st: 'work', pi: true, changed: -1, vis: { desktop: -3 },
    you: 'Tee harjoitus vahvoista verbeistä, imperfekti ja perfekti.', agent: 'Kokoan 20 verbin harjoituksen ja tarkistan taivutukset.' },
  { id: 'i', title: 'rail-interrupted-turn-hidden', ws: 'open-habitat', wt: true, st: 'work', pi: true, changed: -6, vis: {},

function anchor(n, tx, ty) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;

      else if (side === 'right') { const y1 = cy - 12, y2 = cy + 12, x = a.x + a.w; d = `M${x},${y1} C${x + r},${y1 - 12} ${x + r},${y2 + 12} ${x + 3},${y2}`; lx = x + r * 0.8 + 4; ly = cy + 4; ex = x + 3; ey = y2; ang = 180; }
      else { const y1 = cy - 12, y2 = cy + 12, x = a.x; d = `M${x},${y1} C${x - r},${y1 - 12} ${x - r},${y2 + 12} ${x - 3},${y2}`; lx = x - r * 0.8 - 4; ly = cy + 4; ex = x - 3; ey = y2; ang = 0; }

function idleStops() {

    case 'start': startTurn(t); break;
    case 'send': t = here(); W.target = t.id; startTurn(t); break;
    case 'finish': t.st = 'done'; t.changed = W.now; t.unread = W.open !== t.id; if (t.wt) t.pi = false; break;
    case 'stop': t = here(); W.target = t.id; kind = 'finish'; t.st = 'done'; t.changed = W.now; break;

  const t = target();
  const node = t ? v.nodeOf(t) : null;
  const phone = device === 'phone';
  const litBadge = hit && hit.badge;
  const app = `<div class="app${phone ? ' phone' : ''}${W.railOpen ? ' rail-open' : ''}" data-theme="${theme}"><aside class="rail" aria-label="Työtilat ja keskustelut">${railHTML()}</aside><section class="conv">${convHTML()}</section></div>`;
  const opts = W.convs.filter((c) => !c.archived || c.id === W.target).map((c) => `<option value="${c.id}" ${c.id === W.target ? 'selected' : ''}>${esc(c.title)} · ${esc(c.ws)}${c.archived ? ' (arkistoitu)' : ''}</option>`).join('');
  const seg = (name, key, list) => `<div class="seg" role="group" aria-label="${name}">${list.map(([val, lab, on]) => `<button data-${key}="${val}" aria-pressed="${on}">${lab}</button>`).join('')}</div>`;
  document.getElementById('stage').innerHTML =
    `<main class="pg" data-device="${device}">` +
    `<div class="pg-head"><h1>${esc(v.name)}</h1><span class="pg-axis">${esc(v.axis)}</span>` +
    `<div class="pg-toggles">${seg('Teema', 'theme-set', [['light', 'Vaalea', theme === 'light'], ['dark', 'Tumma', theme === 'dark']])}` +
    seg('Laite', 'device-set', [['desktop', 'Työpöytä', !phone], ['phone', 'Puhelin', phone]]) +
    seg('Työtilojen kuvakkeet', 'icons-set', [['on', 'Kuvakkeet', icons], ['off', 'Ei kuvakkeita', !icons]]) + `</div></div>` +
    `<p class="pg-lead">${v.lead}</p>` +
    `<div class="pg-grid"><section class="card graph-card"><h2>Tilakone: yksi keskustelu</h2><p class="sub">Korostettu laatikko on kohdekeskustelun tila. Katkoviivainen laatikko ei näy raiteessa. Paksu viiva on viimeisin siirtymä.</p>` +
    graphSVG(v.graph, node, hit) +
    `<div class="legend"><span><i></i>siirtymä</span><span><i class="hit"></i>viimeisin</span><span><i class="bad"></i>aukko</span><span><i class="cost"></i>hinta</span><span><i class="good"></i>pysyy</span></div>` +
    `<ul class="notes">${v.notes.map(([b, k, tt, d]) => `<li class="${litBadge === b ? 'lit' : ''}"><span class="badge ${k}">${esc(b)}</span><span><b>${tt}</b> ${d}</span></li>`).join('')}</ul></section>` +
    `<section><div class="card ev"><div class="ev-target"><label>Kohde <select data-target>${opts}</select></label><span class="ev-clock">${esc(clockText(W.now))}</span></div><div class="ev-grid">` +
    EVENTS.map(([g, list]) => `<div class="ev-group"><h3>${g}</h3><div class="btns">${list.map(([e, l]) => `<button type="button" class="evb${e === 'resetAll' ? ' reset' : e === 'jari' ? ' story' : ''}" data-ev="${e}" ${enabled(e) ? '' : 'disabled'}>${l}</button>`).join('')}</div></div>`).join('') +
    `</div><div class="ev-log" role="status">${logLine}</div></div>` +
    (phone ? `<div class="phone-wrap">${app}</div>` : app) +
    `<p class="sub" style="margin-top:10px;color:var(--ah-muted);font-size:12px">Raiteen rivit ja työtilat avautuvat klikkaamalla (puhelimessa ☰). Kohde seuraa avaamaasi keskustelua; vaihda se valikosta, kun haluat tapahtuman muualle. Lähetä ja Pysäytä toimivat avoimessa keskustelussa.</p></section></div></main>`;
}

function mount(i) {
  cur = i; v = V[i]; W = fresh(); hit = null; logLine = START;
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-ev],[data-act],[data-open],[data-ws],[data-fold],[data-theme-set],[data-device-set],[data-icons-set]');
  if (!t || t.disabled || !document.getElementById('stage').contains(t)) return;
  if (t.dataset.themeSet) { theme = t.dataset.themeSet; setParam('t', theme); return render(); }
  if (t.dataset.deviceSet) { device = t.dataset.deviceSet; setParam('d', device); W.railOpen = false; return render(); }
  if (t.dataset.iconsSet) { icons = t.dataset.iconsSet === 'on'; setParam('i', icons ? 'on' : 'off'); return render(); }
  if (t.dataset.ev) return fire(t.dataset.ev);
  if (t.dataset.open) return fire('open', t.dataset.open);
  if (t.dataset.ws) return fire('openWs', t.dataset.ws);
  if (t.dataset.fold) return fire('fold', t.dataset.fold);
  if (t.dataset.act === 'rail') { W.railOpen = !W.railOpen; return render(); }
});
document.addEventListener('change', (e) => {
  if (!e.target.matches('[data-target]')) return;
  W.target = e.target.value; hit = null; render();
});

// ---------- picker (PICKER.md reference wiring) ----------
const variants = V.map((_, i) => () => i);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  stage.innerHTML = '';
  requestAnimationFrame(() => mount(variants[i]()));
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
// For screenshots: ?play=send,finish plays events after mount.
window.__play = (list) => { for (const x of list) { const [e, a] = x.split(':'); fire(e, a); } };
</script>
</body>
