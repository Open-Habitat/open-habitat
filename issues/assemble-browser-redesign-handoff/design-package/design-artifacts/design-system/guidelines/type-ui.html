<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}

.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}

.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div style="display:flex;flex-direction:column;gap:12px">

<div style="display:flex;align-items:baseline;gap:14px"><span style="font:400 14.5px/1.6 var(--ah-font);flex:1">Katson ensin, miten workspace-lista muodostetaan.</span><span class="k">400 · 14.5/1.6 · leipä, max 70ch</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:500 13.5px var(--ah-font);flex:1">Luettu 15 tiedostoa</span><span class="k">500 · 13.5px · työkalurivi</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:500 11px var(--ah-font);letter-spacing:.07em;text-transform:uppercase;color:var(--ah-muted);flex:1">Pi · 14.02</span><span class="k">500 · 11px · .07em · tunniste</span></div>
</div></body></html>
