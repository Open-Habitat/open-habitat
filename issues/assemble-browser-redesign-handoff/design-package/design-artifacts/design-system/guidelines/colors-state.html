<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ah-bg);font-family:var(--ah-font);color:var(--ah-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{flex:1;min-width:88px;border:1px solid var(--ah-line);border-radius:var(--ah-r-lg);overflow:hidden;background:var(--ah-surface)}
.sw i{display:block;height:44px}
.sw b{display:block;font:500 12px var(--ah-font);padding:6px 8px 0}
.sw code{display:block;font:400 11px var(--ah-mono);color:var(--ah-muted);padding:0 8px 7px}
.k{font:400 11.5px var(--ah-mono);color:var(--ah-muted)}
</style></head><body><div class="row">
<div class="sw"><i style="background:#2f7a55"></i><b>Onnistui</b><code>#2f7a55</code></div><div class="sw"><i style="background:#eef7f1"></i><b>Onnistui soft</b><code>#eef7f1</code></div><div class="sw"><i style="background:#a3412b"></i><b>Virhe</b><code>#a3412b</code></div><div class="sw"><i style="background:#fdf1ee"></i><b>Virhe soft</b><code>#fdf1ee</code></div>
</div>
<p style="font:400 12.5px var(--ah-font);color:var(--ah-muted);margin:10px 0 0">Punainen on varattu virheelle. Keskeytys on neutraali harmaa, ei punainen.</p>
</body></html>
